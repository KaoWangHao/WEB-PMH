<style>
/* Kế hoạch mua sắm (KHMS) — chức năng chạy thử, thư mục khms/ (chỉ có trên bản /dev). */
.field select { border: 0; outline: 0; font-size: 16px; font-weight: 500; padding: 0; background: transparent; width: 100%; color: var(--ink); cursor: pointer; }
.field.kh-proj { flex: 2 1 320px; }
.kh-upload { min-height: 40px; font-size: 15px; padding: 0 16px; }
.kh-upload svg.ic { width: 19px; height: 19px; }
.kh-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.kh-info svg.ic { width: 18px; height: 18px; color: var(--navy-600); }
.kh-info span { min-width: 0; overflow-wrap: anywhere; }
.kh-info .link-btn { margin-left: auto; }
.link-btn.danger { color: var(--danger); }
.link-btn.bad { color: var(--danger); }
.link-btn.warn { color: #B26A00; }
.link-btn.code { font-family: var(--num); }
.kh-note { margin: 10px 0 0; font-size: 13px; }
.ms-badge {
  display: inline-block; white-space: nowrap; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  color: color-mix(in srgb, var(--c) 78%, #000); background: color-mix(in srgb, var(--c) 13%, #fff); border: 1px solid color-mix(in srgb, var(--c) 30%, #fff);
}
.kh-scroll { max-height: min(72vh, 720px); }
table.grid.kh-table { font-size: 13.5px; }
.kh-table th, .kh-table td { padding: 7px 8px; }
.table-scroll table.kh-table thead th { position: static; box-shadow: none; }
.kh-table thead { position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 var(--line); }
.kh-table thead th { text-align: center; border-left: 1px solid var(--line-soft); line-height: 1.25; }
.kh-table thead th.num { text-align: right; }
.kh-table th.kh-g { font-size: 12.5px; }
.kh-table th.kh-g-invite { background: #EEF4FF; }
.kh-table th.kh-g-select { background: #FFF2E9; }
.kh-table th.kh-g-contract { background: #EDF7EE; }
.kh-table th.kh-g-start { background: #F3EFFB; }
.kh-table td { border-left: 1px solid #F3F5F9; }
.kh-table td.kh-name { min-width: 220px; max-width: 340px; }
.kh-table td.kh-d { white-space: nowrap; font-family: var(--num); text-align: center; }
.kh-table td.kh-act { font-weight: 700; color: var(--navy-900); }
.kh-src { display: block; font-size: 11px; font-family: var(--font); font-weight: 500; color: #5B8C1F; }
.kh-table td.kh-base { color: var(--ink-2); background: #FAFBFD; }
.kh-table td.kh-chgd, .kh-imp .kh-chgd { color: #C2410C; font-weight: 700; }
.kh-rev0x { display: block; font-size: 11px; color: var(--muted); }
.kh-th-rev { display: block; font-size: 10.5px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); }
.kh-table td.kh-link { min-width: 170px; max-width: 240px; }
.kh-table td.kh-link .status-badge { font-size: 12px; padding: 2px 9px 2px 7px; margin-top: 3px; }
.kh-sugg-t { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
.kh-sugg-a { display: flex; gap: 4px; margin-top: 4px; }
.kh-pnote { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kh-tag { display: inline-block; font-size: 11px; font-weight: 700; color: #8A5A00; background: #FFF4DB; border-radius: 6px; padding: 1px 6px; }
.kh-table tr.inactive td, .kh-imp tr.inactive td { opacity: .55; }
.kh-save-all { min-height: 40px; font-size: 15px; padding: 0 16px; gap: 8px; }
.kh-save-all svg.ic { width: 18px; height: 18px; }
.kh-edit-bar { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: #FFF6EF; border: 1px solid #F8CBA8; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.kh-edit-bar svg.ic { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 2px; }
.kh-editing { box-shadow: 0 0 0 2px #F8CBA8; }
.kh-in { width: 98px; border: 1px solid #C9CDD6; border-radius: 7px; padding: 5px 7px; font: 500 13px var(--num); background: #fff; color: var(--ink); }
.kh-in:focus, .kh-sel:focus { outline: 0; border-color: var(--navy-600); box-shadow: var(--ring); }
.kh-in.dirty, .kh-sel.dirty { border-color: var(--accent); background: #FFF3E8; }
.kh-in.invalid { border-color: var(--danger); background: #FDECEA; }
.kh-note-in { display: block; width: 100%; margin-top: 5px; font-family: var(--font); font-weight: 400; }
.kh-sel { width: 210px; max-width: 210px; border: 1px solid #C9CDD6; border-radius: 7px; padding: 5px 6px; font-size: 12.5px; background: #fff; }
.link-btn.kh-open { font-weight: 800; color: var(--navy-900); }
.link-btn.kh-open:hover { color: var(--navy-600); }
.mini-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: #fff; border-radius: 8px;
  height: 28px; padding: 0 9px; font-size: 12.5px; font-weight: 700; color: var(--navy-800); white-space: nowrap;
}
.mini-btn svg.ic { width: 14px; height: 14px; }
.mini-btn:hover { background: #F1F5FF; border-color: #B9C7E6; }
.mini-btn.ok { background: #EEF7E6; border-color: #C5E1AE; color: #3E6B12; }
.mini-btn.ok:hover { background: #E2F1D5; }
.check.kh-inact { font-size: 13.5px; font-weight: 500; }
.kh-ms td { vertical-align: top; }
.kh-ms .kh-date { width: 130px; border: 1px solid #C9CDD6; border-radius: 8px; padding: 7px 9px; font-size: 15px; font-family: var(--num); }
.kh-ms .kh-date:focus { outline: 0; border-color: var(--navy-600); box-shadow: var(--ring); }
.kh-ms .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kh-imp td, .kh-imp th { padding: 6px 8px; font-size: 13px; }
.kh-imp td.kh-acts { font-size: 12px; color: var(--ink-2); max-width: 200px; }
.kh-chg { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 6px; padding: 1px 7px; }
.kh-chg.new { background: #E6F4EA; color: #1E7B34; }
.kh-chg.upd { background: #FFF1E6; color: #B4500C; }
.kh-chg-l { display: block; font-size: 11.5px; color: var(--muted); max-width: 200px; }
.kh-warn { color: #B4500C; font-weight: 600; }
.meta-grid .meta-wide { grid-column: 1 / -1; }
/* Tải KHMS nhiều dự án (file tổng hợp, mỗi sheet 1 dự án) */
.kh-bimp td { vertical-align: middle; }
.kh-bimp select { min-width: 170px; max-width: 240px; padding: 5px 8px; font-size: 13px; border: 1px solid #C9CDD6; border-radius: 8px; background: #fff; }
.kh-bwarn { font-size: 11.5px; margin-top: 3px; }
.kh-bnew { font-size: 11.5px; margin-top: 3px; color: #1E7B34; font-weight: 600; }
.kh-bopen { font-size: 12px; margin-top: 2px; }
.kh-over-box { margin-top: 10px; border-color: #F5B48A; background: #FFF4EC; color: #8A3A08; }
.kh-sheet { display: block; font-size: 11px; color: var(--muted); }
/* Dashboard báo cáo KHMS */
.field.khd-projects { flex: 3 1 420px; align-items: center; padding-right: 8px; }
.field.khd-projects > .secondary-btn { flex: none; white-space: nowrap; }
.field.khd-year { flex: 0 1 200px; }
.khd-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; max-height: 92px; overflow: auto; }
.khd-chip { display: inline-flex; align-items: center; gap: 4px; background: #EEF2FB; border: 1px solid #D5DEEF; color: var(--navy-800, #23325F); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; }
.khd-chip button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; border-radius: 50%; }
.khd-chip button:hover { color: #C0392B; background: #FBE3E0; }
.khd-picker { margin-top: 12px; border: 1px solid var(--line-soft); border-radius: 14px; padding: 12px; background: #FAFCFF; }
.khd-picker-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.khd-picker-bar input { flex: 1 1 220px; min-width: 0; border: 1px solid #C9CDD6; border-radius: 10px; padding: 8px 12px; font-size: 14.5px; }
.khd-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; max-height: 320px; overflow: auto; }
.khd-opt { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 10px; background: #fff; cursor: pointer; font-size: 14px; }
.khd-opt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.khd-opt small { color: var(--muted); white-space: nowrap; }
.khd-opt.on { border-color: var(--navy-600); background: #F1F5FF; }
.charts .khd-wide { grid-column: 1 / -1; }
.khd-bar { display: inline-block; vertical-align: middle; width: 90px; height: 8px; border-radius: 6px; background: #E6EBF3; overflow: hidden; margin-right: 6px; }
.khd-bar span { display: block; height: 100%; background: linear-gradient(90deg, #7CB342, #2E8B3E); border-radius: 6px; }
.khd-sum tfoot td { font-weight: 700; background: #F4F7FC; border-top: 2px solid #D5DEEF; }
.khd-list-bar { display: flex; justify-content: flex-start; margin-bottom: 10px; overflow-x: auto; }
@media (max-width: 700px) {
  .field.khd-projects { flex-wrap: wrap; }
  .khd-opts { grid-template-columns: 1fr; }
}
</style>
