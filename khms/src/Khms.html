<script>
/*
 * Kế hoạch mua sắm (KHMS), thư mục khms/ (xem khms/README.md).
 * Workflow deploy chép khms/src/* vào src/ trước khi đẩy lên Apps Script (bản chính và /dev).
 * Gắn vào App.html qua window.APP: thêm menu, trang `khms`, action, xử lý sự kiện, dữ liệu bootstrap (packages, planUploads).
 */
(function (A) {
  'use strict';
  if (!A) return;
  var S = A.S, EXT = A.EXT;
  var ic = A.ic, esc = A.esc, call = A.call, handleErr = A.handleErr, toast = A.toast, render = A.render, derive = A.derive;
  var setLoading = A.setLoading, busy = A.busy, fmtDate = A.fmtDate, fmtNum = A.fmtNum, diffDays = A.diffDays, norm = A.norm;
  var parseDmy = A.parseDmy, statusOf = A.statusOf, statusBadge = A.statusBadge, userName = A.userName, card = A.card;
  var projectLabel = A.projectLabel, projectCell = A.projectCell, projectSort = A.projectSort, projectCodesOf = A.projectCodesOf;
  var openModal = A.openModal, closeModal = A.closeModal, modalHead = A.modalHead, modalError = A.modalError;
  var keepModalScroll = A.keepModalScroll, syncSection = A.syncSection, loadExcelJs = A.loadExcelJs, downloadBlob = A.downloadBlob;
  var qTimer = null;

  S.packages = []; S.planUploads = [];
  S.khms = { project: '', state: '', q: '' }; S.khEdit = null;

  var ICON_ADD = {
    box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'
  };
  Object.keys(ICON_ADD).forEach(function (k) { A.ICONS[k] = ICON_ADD[k]; });

  /* =====================================================================
   * Kế hoạch mua sắm (KHMS): gói thầu theo dự án. Ngày kế hoạch lấy từ file Excel KHMS (đọc ở trình duyệt);
   * ngày chọn thầu thực tế = ngày duyệt của hồ sơ gắn với gói; mời thầu / ký HĐ / khởi công thực tế do chuyên viên cập nhật.
   * ===================================================================== */
  var MILESTONES = [
    { key: 'invite', label: 'Mời thầu', head: 'Ngày mời thầu' },
    { key: 'select', label: 'Chọn thầu', head: 'Ngày chọn thầu' },
    { key: 'contract', label: 'Ký hợp đồng', head: 'Ngày ký kết hợp đồng' },
    { key: 'start', label: 'Khởi công', head: 'Ngày bắt đầu thi công' }
  ];
  var KHMS_SOON_DAYS = 14;
  var MS_COLORS = { done: '#7CB342', lateDone: '#E9A23B', late: '#DD5A4C', soon: '#F16314', todo: '#4A90D9', none: '#9AA0AE' };
  var KH_STATES = [
    ['', 'Tất cả'], ['late', 'Trễ hạn chọn thầu'], ['soon', 'Sắp đến hạn chọn thầu (≤ ' + KHMS_SOON_DAYS + ' ngày)'],
    ['todo', 'Chưa đến hạn chọn thầu'], ['done', 'Đã chọn thầu'], ['wait-contract', 'Đã chọn thầu – chưa ký HĐ'],
    ['contract', 'Đã ký hợp đồng'], ['nolink', 'Chưa gắn hồ sơ']
  ];

  function khKey(s) { return norm(s).replace(/[^a-z0-9]+/g, ' ').trim(); }
  function fmtShort(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : ''; }
  function fmtMoney(v) { return v == null ? '' : Number(v).toLocaleString('vi-VN'); }
  function fmtBil(v) { return (Math.round(v / 1e7) / 100).toLocaleString('vi-VN') + ' tỷ'; }

  /** Tình trạng 1 mốc: hoàn thành (đúng/trễ hạn), trễ hạn, sắp đến hạn, chưa đến hạn, chưa có kế hoạch. */
  function msState(plan, actual) {
    if (actual) {
      var late = plan ? diffDays(plan, actual) : 0;
      return late > 0 ? { code: 'lateDone', days: late } : { code: 'done', days: 0 };
    }
    if (!plan) return { code: 'none', days: 0 };
    var left = diffDays(S.today, plan);
    if (left < 0) return { code: 'late', days: -left };
    return { code: left <= KHMS_SOON_DAYS ? 'soon' : 'todo', days: left };
  }
  function msText(st) {
    return st.code === 'done' ? 'Hoàn thành' : st.code === 'lateDone' ? 'Hoàn thành, trễ ' + st.days + ' ngày'
      : st.code === 'late' ? 'Trễ ' + st.days + ' ngày' : st.code === 'soon' ? 'Còn ' + st.days + ' ngày'
      : st.code === 'todo' ? 'Chưa đến hạn' : '';
  }
  function msBadge(st) {
    if (st.code === 'none') return '<span class="muted">—</span>';
    return '<span class="ms-badge" style="--c:' + MS_COLORS[st.code] + '">' + esc(msText(st)) + '</span>';
  }

  function khmsDerive() {
    S.subMap = {};
    S.subs.forEach(function (s) { S.subMap[s.id] = s; });
    S.pkgBySub = {};
    S.packages.forEach(function (p) {
      var sub = p.submissionId ? S.subMap[p.submissionId] || null : null;
      p._sub = sub;
      if (sub) S.pkgBySub[sub.id] = p;
      var approved = sub && sub.status === S.cfg.approvedStatus && sub.approvedAt;
      // Ngày chọn thầu theo hồ sơ chỉ đồng bộ khi chuyên viên đã xác nhận đúng ngày duyệt hiện tại (selectConfirmed);
      // hồ sơ mới được duyệt → gói "chờ xác nhận" (cửa sổ Hoàn thành chọn thầu).
      var confirmed = approved && p.selectConfirmed === sub.approvedAt;
      p._pending = !!approved && !confirmed;
      p._actual = { invite: p.inviteActual, select: confirmed ? sub.approvedAt : p.selectActual, contract: p.contractActual, start: p.startActual };
      p._selectSrc = confirmed ? 'sub' : p.selectActual ? 'manual' : '';
      p._ms = {};
      MILESTONES.forEach(function (m) { p._ms[m.key] = msState(p[m.key + 'Plan'], p._actual[m.key]); });
      p._key = khKey(p.name);
    });
    S.planLast = {};
    (S.planUploads || []).forEach(function (u) {
      var cur = S.planLast[u.project];
      if (!cur || u.date >= cur.date) S.planLast[u.project] = u;
    });
    S.khSugg = khmsSuggestions();
    // Hồ sơ đã duyệt chờ xác nhận chọn thầu (tính 1 lần mỗi lần dữ liệu đổi; bảng gói thầu và menu dùng lại).
    S.khPendAll = khPendingList('');
    S.khPendByPkg = {};
    S.khPendAll.forEach(function (x) { if (x.p) S.khPendByPkg[x.p.id] = x; });
  }

  /**
   * Gợi ý hồ sơ cho gói chưa gắn: hồ sơ Trình duyệt cùng dự án (số đầu tên), chưa gắn gói khác, tên chứa tên hạng mục
   * (không dấu) hoặc chứa ≥ 80% các từ của tên hạng mục. Ưu tiên hồ sơ đã duyệt; gói có 2 hồ sơ ngang điểm thì không gợi ý.
   * Mỗi hồ sơ chỉ gợi ý cho 1 gói (gói có tên dài hơn, cụ thể hơn được ưu tiên).
   */
  function khmsSuggestions() {
    var byProject = {};
    S.subs.forEach(function (s) {
      if (S.pkgBySub[s.id] || s._type === 'BC' || S.khSkip[s.id]) return;
      s._projects.forEach(function (c) { (byProject[c] = byProject[c] || []).push(s); });
    });
    var cands = [];
    S.packages.forEach(function (p) {
      if (p.submissionId || !p.active || !p._key) return;
      var words = p._key.split(' ').filter(function (w) { return w.length > 1; });
      var list = [];
      (byProject[p.project] || []).forEach(function (s) {
        if (p.skipSubs && p.skipSubs.indexOf(s.id) >= 0) return; // đã xác nhận "không thuộc gói này"
        var t = ' ' + khKey(s.title) + ' ';
        var score = 0;
        if (t.indexOf(' ' + p._key + ' ') >= 0) score = 2;
        else if (words.length >= 2) {
          var hit = words.filter(function (w) { return t.indexOf(' ' + w + ' ') >= 0; }).length / words.length;
          if (hit >= 0.8) score = hit;
        }
        if (!score) return;
        if (s.status === S.cfg.approvedStatus) score += 0.5;
        list.push({ p: p, s: s, score: score + p._key.length / 10000 });
      });
      list.sort(function (a, b) { return b.score - a.score; });
      if (list.length && !(list[1] && list[1].score === list[0].score)) cands.push(list[0]);
    });
    cands.sort(function (a, b) { return b.score - a.score; });
    var out = {}, taken = {};
    cands.forEach(function (c) {
      if (taken[c.s.id]) return;
      taken[c.s.id] = true;
      out[c.p.id] = c.s;
    });
    return out;
  }

  /** extra: { code, name } — dự án chưa có trong danh mục, sẽ tạo mới khi tải KHMS nhiều dự án. */
  function khmsProjectSelect(id, sel, mode, attrs, extra) {
    var have = {};
    S.packages.forEach(function (p) { if (p.active) have[p.project] = (have[p.project] || 0) + 1; });
    var list = (S.projects || []).slice();
    Object.keys(have).forEach(function (c) { if (!S.projMap[c]) list.push({ code: c, name: '', active: true }); });
    var opt = function (p) {
      return '<option value="' + esc(p.code) + '"' + (p.code === sel ? ' selected' : '') + '>' + esc(projectLabel(p.code)) +
        (have[p.code] ? ' · ' + have[p.code] + ' gói' : '') + '</option>';
    };
    var withPlan = list.filter(function (p) { return have[p.code]; });
    var others = list.filter(function (p) { return !have[p.code] && (p.active || p.code === sel); });
    return '<select id="' + id + '" data-change="' + (mode === 'import' ? 'kh-imp-project' : mode === 'batch' ? 'kh-bimp-project' : 'kh-project') + '"' + (attrs || '') + '>' +
      (mode !== 'filter' && mode ? '<option value="">— Chọn dự án —</option>' : '<option value="">Tất cả dự án có KHMS (' + withPlan.length + ')</option>') +
      (extra ? '<option value="' + esc(extra.code) + '"' + (extra.code === sel ? ' selected' : '') + '>' + esc(extra.code + '_' + extra.name) + ' (tạo mới)</option>' : '') +
      (withPlan.length ? '<optgroup label="Đã có KHMS">' + withPlan.map(opt).join('') + '</optgroup>' : '') +
      (others.length ? '<optgroup label="Chưa có KHMS">' + others.map(opt).join('') + '</optgroup>' : '') + '</select>';
  }

  function khmsMatchState(p, st) {
    var sel = p._ms.select.code;
    switch (st) {
      case 'late': case 'soon': case 'todo': return sel === st;
      case 'done': return sel === 'done' || sel === 'lateDone';
      case 'wait-contract': return (sel === 'done' || sel === 'lateDone') && !p._actual.contract;
      case 'contract': return !!p._actual.contract;
      case 'nolink': return !p.submissionId;
      default: return true;
    }
  }
  function khmsRows() {
    var k = S.khms, q = norm(k.q).trim();
    return S.packages.filter(function (p) {
      if (k.project && p.project !== k.project) return false;
      if (!p.active) return false;
      if (!khmsMatchState(p, k.state)) return false;
      if (q && norm(p.stt + ' ' + p.name + ' ' + p.project + ' ' + (p._sub ? p._sub.id + ' ' + p._sub.title : '')).indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return projectSort(a.project, b.project) || (b.active - a.active) || a.order - b.order; });
  }
  function khmsStats(list) {
    var st = { n: list.length, value: 0, done: 0, late: 0, soon: 0, contract: 0, waitContract: 0, nolink: 0 };
    list.forEach(function (p) {
      st.value += p.value || 0;
      var sel = p._ms.select.code;
      if (sel === 'done' || sel === 'lateDone') { st.done++; if (!p._actual.contract) st.waitContract++; }
      if (sel === 'late') st.late++;
      if (sel === 'soon') st.soon++;
      if (p._actual.contract) st.contract++;
      if (!p.submissionId) st.nolink++;
    });
    return st;
  }

  function viewKhms() {
    var k = S.khms;
    var scope = S.packages.filter(function (p) { return p.active && (!k.project || p.project === k.project); });
    return khmsParamsCard() + khmsPendingBar(k.project) + khmsOverviewCard(scope) + (k.project ? '' : khmsProjectsCard()) + khmsDetailCard();
  }

  /* =====================================================================
   * Hoàn thành chọn thầu – chờ xác nhận (theo người dùng: "khi có 1 hồ sơ mới được duyệt là link qua KHMS … có chỗ thông báo là có
   * bnhieu gói thầu được hoàn thành chọn thầu, rồi ấn vô đó sẽ hiện ra cửa sổ thông báo trước là hồ sơ đã duyệt đó tương ứng với gói thầu
   * nào trong KHMS để chuyên viên kiểm tra trước khi đồng ý xác nhận cho đồng bộ qua, hoặc có cần điều chỉnh lại không").
   * Gói chờ xác nhận: đã gắn hồ sơ vừa được duyệt (p._pending), hoặc chưa gắn nhưng web gợi ý 1 hồ sơ đã duyệt cùng dự án theo tên.
   * ===================================================================== */
  S.khSkip = {};
  /** Dự án có KHMS → ngày tải KHMS đầu tiên (ISO): hồ sơ duyệt từ ngày này mới được coi là "mới được duyệt" khi chưa tìm thấy gói. */
  function khFirstUpload() {
    var out = {};
    (S.planUploads || []).forEach(function (u) { if (u.date && (!out[u.project] || u.date < out[u.project])) out[u.project] = u.date; });
    S.packages.forEach(function (p) { if (p.active && !out[p.project]) out[p.project] = '0000-00-00'; });
    return out;
  }
  function khApproved(s) { return s && s.status === S.cfg.approvedStatus && !!s.approvedAt; }
  /**
   * Hồ sơ đã duyệt chờ xác nhận chọn thầu, mỗi hồ sơ 1 dòng { s, p, kind, project }:
   *  - 'linked': đã gắn gói, vừa được duyệt (p._pending);  - 'sugg': chưa gắn, web gợi ý gói theo tên;
   *  - 'none': hồ sơ Trình duyệt đã duyệt (từ ngày tải KHMS đầu tiên) của dự án có KHMS nhưng chưa tìm thấy gói → chuyên viên tự chọn.
   * Hồ sơ đã "Bỏ qua" (S.khSkip) không tính, trừ khi withSkipped.
   */
  function khPendingList(project, withSkipped) {
    var out = [], seen = {};
    var push = function (s, p, kind, proj) {
      if (seen[s.id] || (S.khSkip[s.id] && !withSkipped) || (project && proj !== project)) return;
      seen[s.id] = true;
      out.push({ s: s, p: p, kind: S.khSkip[s.id] ? 'skipped' : kind, project: proj });
    };
    S.packages.forEach(function (p) {
      if (!p.active) return;
      if (p._pending) push(p._sub, p, 'linked', p.project);
      else if (!p.submissionId && khApproved(S.khSugg[p.id])) push(S.khSugg[p.id], p, 'sugg', p.project);
    });
    var first = khFirstUpload();
    S.subs.forEach(function (s) {
      if (!khApproved(s) || s._type === 'BC' || S.pkgBySub[s.id] || seen[s.id]) return;
      var proj = s._projects.filter(function (c) { return first[c] && s.approvedAt >= first[c]; })[0];
      if (proj) push(s, null, 'none', proj);
    });
    var rank = { linked: 0, sugg: 1, none: 2, skipped: 3 };
    return out.sort(function (a, b) {
      return projectSort(a.project, b.project) || (rank[a.kind] - rank[b.kind]) || ((a.p ? a.p.order : 1e9) - (b.p ? b.p.order : 1e9)) || (a.s.id < b.s.id ? -1 : 1);
    });
  }
  function khPendingOf(p) { return (S.khPendByPkg && S.khPendByPkg[p.id]) || null; }
  function khmsPendingBar(project) {
    var list = (S.khPendAll || []).filter(function (x) { return !project || x.project === project; });
    if (!list.length) {
      // Không còn hồ sơ chờ: vẫn cho mở lại các hồ sơ đã bỏ qua để khôi phục / chọn gói.
      var nSkip = Object.keys(S.khSkip).length ? khPendingList(project, true).length : 0;
      return nSkip ? '<div class="kh-pend-mini"><button class="link-btn" data-act="kh-pend-skipped-open">' + ic('history') + nSkip +
        ' hồ sơ đã duyệt đã chọn "Bỏ qua" (không đồng bộ vào KHMS) — Xem / khôi phục</button></div>' : '';
    }
    var none = list.filter(function (x) { return x.kind === 'none'; }).length;
    var projects = list.map(function (x) { return x.project; }).filter(function (c, i, a) { return a.indexOf(c) === i; });
    return '<button class="kh-pend-bar" data-act="kh-pend-open">' + ic('bell') +
      '<span><b>' + fmtNum(list.length) + ' hồ sơ phê duyệt đã được duyệt</b>' + (project ? '' : ' ở ' + projects.length + ' dự án') +
      ' — gói thầu đã hoàn thành chọn thầu, chờ bạn kiểm tra và xác nhận để đồng bộ ngày chọn thầu' +
      (none ? ' (trong đó <b>' + none + '</b> hồ sơ chưa tìm thấy gói thầu tương ứng)' : '') + '.</span>' +
      '<span class="kh-pend-go">Xem &amp; xác nhận ' + ic('chevRight') + '</span></button>';
  }
  /** Mở cửa sổ: theo dự án đang xem (hoặc dự án của gói được bấm); không chọn dự án → mọi dự án. */
  function openKhPending(focusId, withSkipped) {
    var fp = focusId && S.packages.filter(function (x) { return x.id === focusId; })[0];
    var project = fp ? fp.project : S.khms.project;
    var list = khPendingList(project, withSkipped);
    var nSkip = khPendingList(project, true).length - khPendingList(project).length;
    if (!list.length && !nSkip) { toast('Không có hồ sơ nào chờ xác nhận.'); return; }
    S.khPend = { project: project, focus: focusId || '', showSkipped: !!withSkipped, nSkip: nSkip, rows: list.map(function (x) {
      var target = x.kind === 'skipped' ? '__skip' : x.p ? x.p.id : '';
      return { sub: x.s, from: x.p ? x.p.id : '', kind: x.kind, project: x.project, target: target,
               on: x.kind !== 'skipped' && !!target && (!focusId || (x.p && x.p.id === focusId)) };
    }) };
    renderKhPending();
  }
  var KH_PEND_KIND = { linked: 'đã gắn với gói', sugg: 'gợi ý theo tên', none: 'chưa tìm thấy gói tương ứng — hãy chọn', skipped: 'đã bỏ qua' };
  function renderKhPending() {
    var st = S.khPend;
    var body = st.rows.map(function (r, i) {
      var pk = r.target && r.target.charAt(0) !== '_' ? S.packages.filter(function (x) { return x.id === r.target; })[0] : null;
      var projs = r.sub._projects.filter(function (c) { return S.packages.some(function (x) { return x.active && x.project === c; }); });
      if (projs.indexOf(r.project) < 0) projs.unshift(r.project);
      var opts = S.packages.filter(function (x) { return x.active && projs.indexOf(x.project) >= 0; })
        .sort(function (a, b) { return projectSort(a.project, b.project) || a.order - b.order; });
      var sel = '<select data-change="kh-pend-target" data-i="' + i + '" aria-label="Gói thầu tương ứng">' +
        '<option value=""' + (!r.target ? ' selected' : '') + '>— Chọn gói thầu —</option>' +
        opts.map(function (x) {
          var other = x.submissionId && x.submissionId !== r.sub.id ? ' (đang gắn ' + x.submissionId + ')' : '';
          return '<option value="' + esc(x.id) + '"' + (x.id === r.target ? ' selected' : '') + '>' + esc((projs.length > 1 ? x.project + ' · ' : '') + (x.stt ? x.stt + '. ' : '') + x.name + other) + '</option>';
        }).join('') +
        '<option value="__skip"' + (r.target === '__skip' ? ' selected' : '') + '>⊘ Bỏ qua – không đồng bộ vào KHMS</option>' +
        (r.kind === 'skipped' ? '<option value="__unskip"' + (r.target === '__unskip' ? ' selected' : '') + '>↺ Khôi phục (chờ xác nhận lại)</option>' : '') + '</select>';
      var note = r.target === '__skip' && r.kind !== 'skipped' ? '<small class="kh-pend-chg">Hồ sơ sẽ không đồng bộ vào KHMS (không hỏi lại)</small>'

  function saveKhPending(btn) {
    var items = [];
    S.khPend.rows.forEach(function (r) {
      if (!r.on || !r.target) return;
      if (r.target === '__skip') { if (r.kind !== 'skipped') items.push({ ignore: r.sub.id }); }
      else if (r.target === '__unskip') items.push({ unignore: r.sub.id });
      else items.push({ id: r.target, submissionId: r.sub.id });
    });
    if (!items.length) { modalError('Chưa tích dòng nào.'); return; }
    var dup = items.filter(function (x, i) { return x.submissionId && items.some(function (y, j) { return j < i && y.submissionId && y.id === x.id; }); })[0];
    if (dup) { modalError('Có 2 hồ sơ cùng chọn 1 gói thầu — mỗi gói chỉ gắn 1 hồ sơ, hãy chọn lại.'); return; }

  /**
   * Cột kế hoạch của bảng gói thầu: 1 cột khi chỉ có 1 bản kế hoạch; 2 cột "KH Rev00" (gốc) + "KH Rev01" (hiện hành) khi file KHMS
   * có cả 2 bản hoặc kế hoạch đã đổi qua các lần tải. Nhãn Rev lấy theo dữ liệu (khác nhau giữa các dự án → "KH gốc" / "KH hiện hành").

  function khPlanCols(rows) {
    var two = rows.some(function (p) {
      return (p.rev0 && p.rev && p.rev0 !== p.rev) ||
        MILESTONES.some(function (m) { var a = p[m.key + 'Plan0']; return a && a !== p[m.key + 'Plan']; });
    });
    var only = function (arr) {
      var u = arr.filter(function (v, i) { return v && arr.indexOf(v) === i; });
      return u.length === 1 && arr.every(Boolean) ? u[0] : '';
    };
    var cur = only(rows.map(function (p) { return p.rev; })), base = only(rows.map(function (p) { return p.rev0; }));
    if (!two) return { two: false, cur: cur ? 'Kế hoạch ' + cur : 'Kế hoạch' };
    if (!base || !cur || base === cur) return { two: true, base: 'KH gốc', cur: 'KH hiện hành' };
    return { two: true, base: 'KH ' + base, cur: 'KH ' + cur };
  }
  function khPlanCell(p, m, pc) {

  /* ---------- Cập nhật cả bảng (nút "Cập nhật bảng"): ô nhập ngay trong bảng, lưu 1 lần ---------- */
  /** Giá trị gốc của ô sửa được, dạng hiển thị trong ô nhập. */
  function khEditOrig(p, f) {
    if (f === 'note' || f === 'submissionId') return p[f] || '';
    return p[f] ? fmtDate(p[f]) : '';
  }
  function khEditVal(p, f) {
    var d = S.khEdit.d[p.id];
    return d && d[f] !== undefined ? d[f] : khEditOrig(p, f);
  }
  function khEditCls(p, f) {
    var bad = S.khEdit.bad[p.id + '|' + f];
    return (khEditVal(p, f) !== khEditOrig(p, f) ? ' dirty' : '') + (bad ? ' invalid' : '');
  }
  function khEditInput(p, f) {
    return '<input type="text" class="kh-in' + khEditCls(p, f) + '" id="khe-' + esc(p.id) + '-' + f + '" data-input="kh-cell" data-id="' + esc(p.id) + '" data-f="' + f + '"' +
      ' inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/yyyy" value="' + esc(khEditVal(p, f)) + '">';
  }
  function khEditSelect(p) {
    var cur = khEditVal(p, 'submissionId'), sugg = S.khSugg[p.id];
    var opt = function (s, pre) {
      return '<option value="' + esc(s.id) + '"' + (s.id === cur ? ' selected' : '') + '>' + esc((pre || '') + s.id + ' · ' + statusOf(s.status).short + ' · ' + s.title) + '</option>';
    };
    var list = S.subs.filter(function (s) {
      return s._projects.indexOf(p.project) >= 0 && (!S.pkgBySub[s.id] || S.pkgBySub[s.id] === p) && (!sugg || s.id !== sugg.id);
    }).sort(function (a, b) { return a.id < b.id ? 1 : -1; });
    var curSub = cur && S.subMap[cur];
    var extra = curSub && list.indexOf(curSub) < 0 && (!sugg || curSub !== sugg) ? opt(curSub) : '';
    return '<select class="kh-sel' + khEditCls(p, 'submissionId') + '" id="khe-' + esc(p.id) + '-submissionId" data-change="kh-cell" data-id="' + esc(p.id) + '" data-f="submissionId">' +
      '<option value="">— Chưa gắn hồ sơ —</option>' + extra + (sugg ? opt(sugg, 'Gợi ý: ') : '') + list.map(function (s) { return opt(s); }).join('') + '</select>';
  }
  /** Gom thay đổi đang nhập: items gửi server, bad = ô ngày sai. */
  function khEditCollect() {
    var items = [], bad = {};
    Object.keys(S.khEdit.d).forEach(function (id) {
      var p = S.packages.filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      var d = S.khEdit.d[id], it = { id: id }, n = 0;
      Object.keys(d).forEach(function (f) {
        var raw = d[f];
        if (raw === khEditOrig(p, f)) return;
        if (f === 'note') { if (raw.trim() !== (p.note || '')) { it.note = raw.trim(); n++; } return; }
        if (f === 'submissionId') { it.submissionId = raw; n++; return; }
        var iso = parseDmy(raw), isPlan = /Plan0?$/.test(f);
        if (iso === null || (!isPlan && iso > S.today)) { bad[id + '|' + f] = iso === null ? 'sai' : 'sau hôm nay'; return; }
        if (iso !== (p[f] || '')) {
          it[f] = iso; n++;
          // Bảng 1 cột kế hoạch (gốc = hiện hành): sửa thì sửa cả kế hoạch gốc, để không tách thành 2 cột.
          var f0 = f + '0';
          if (/Plan$/.test(f) && !S.khEdit.two && p[f0] && p[f0] === p[f] && d[f0] === undefined) it[f0] = iso;
        }
      });
      if (n) items.push(it);
    });
    return { items: items, bad: bad };
  }
  function khEditCountText() {
    var c = khEditCollect();
    return 'Lưu thay đổi (' + c.items.length + ' gói)';
  }
  function khEditSave(btn) {
    var c = khEditCollect();
    S.khEdit.bad = c.bad;
