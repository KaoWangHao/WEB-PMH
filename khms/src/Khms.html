<script>
/*
 * Kế hoạch mua sắm (KHMS) — CHỨC NĂNG CHẠY THỬ, thư mục khms/ (xem khms/README.md).
 * Chỉ được đưa lên bản thử /dev (workflow deploy chép khms/src/* vào src/ khi chạy thử); bản chính không có file này.
 * Gắn vào App.html qua window.APP: thêm menu, trang `khms`, action, xử lý sự kiện, dữ liệu bootstrap (packages, planUploads).
 */
(function (A) {
  'use strict';
  if (!A) return;
  var S = A.S, EXT = A.EXT;
  var ic = A.ic, esc = A.esc, call = A.call, handleErr = A.handleErr, toast = A.toast, render = A.render, derive = A.derive;
  var setLoading = A.setLoading, busy = A.busy, fmtDate = A.fmtDate, fmtNum = A.fmtNum, diffDays = A.diffDays, norm = A.norm;
  var parseDmy = A.parseDmy, statusOf = A.statusOf, statusBadge = A.statusBadge, userName = A.userName, card = A.card;
  var projectLabel = A.projectLabel, projectCell = A.projectCell, projectSort = A.projectSort, projectCodesOf = A.projectCodesOf;
  var openModal = A.openModal, closeModal = A.closeModal, modalHead = A.modalHead, modalError = A.modalError;
  var keepModalScroll = A.keepModalScroll, syncSection = A.syncSection, loadExcelJs = A.loadExcelJs, downloadBlob = A.downloadBlob;
  var qTimer = null;

  S.packages = []; S.planUploads = [];
  S.khms = { project: '', state: '', q: '', inactive: false }; S.khEdit = null;

  var ICON_ADD = {
    box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
  };
  Object.keys(ICON_ADD).forEach(function (k) { A.ICONS[k] = ICON_ADD[k]; });

  /* =====================================================================
   * Kế hoạch mua sắm (KHMS): gói thầu theo dự án. Ngày kế hoạch lấy từ file Excel KHMS (đọc ở trình duyệt);
   * ngày chọn thầu thực tế = ngày duyệt của hồ sơ gắn với gói; mời thầu / ký HĐ / khởi công thực tế do chuyên viên cập nhật.
   * ===================================================================== */
  var MILESTONES = [
    { key: 'invite', label: 'Mời thầu', head: 'Ngày mời thầu' },
    { key: 'select', label: 'Chọn thầu', head: 'Ngày chọn thầu' },
    { key: 'contract', label: 'Ký hợp đồng', head: 'Ngày ký kết hợp đồng' },
    { key: 'start', label: 'Khởi công', head: 'Ngày bắt đầu thi công' }
  ];
  var KHMS_SOON_DAYS = 14;
  var MS_COLORS = { done: '#7CB342', lateDone: '#E9A23B', late: '#DD5A4C', soon: '#F16314', todo: '#4A90D9', none: '#9AA0AE' };
  var KH_STATES = [
    ['', 'Tất cả'], ['late', 'Trễ hạn chọn thầu'], ['soon', 'Sắp đến hạn chọn thầu (≤ ' + KHMS_SOON_DAYS + ' ngày)'],
    ['todo', 'Chưa đến hạn chọn thầu'], ['done', 'Đã chọn thầu'], ['wait-contract', 'Đã chọn thầu – chưa ký HĐ'],
    ['contract', 'Đã ký hợp đồng'], ['nolink', 'Chưa gắn hồ sơ']
  ];

  function khKey(s) { return norm(s).replace(/[^a-z0-9]+/g, ' ').trim(); }
  function fmtShort(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : ''; }
  function fmtMoney(v) { return v == null ? '' : Number(v).toLocaleString('vi-VN'); }
  function fmtBil(v) { return (Math.round(v / 1e7) / 100).toLocaleString('vi-VN') + ' tỷ'; }

  /** Tình trạng 1 mốc: hoàn thành (đúng/trễ hạn), trễ hạn, sắp đến hạn, chưa đến hạn, chưa có kế hoạch. */
  function msState(plan, actual) {
    if (actual) {
      var late = plan ? diffDays(plan, actual) : 0;
      return late > 0 ? { code: 'lateDone', days: late } : { code: 'done', days: 0 };
    }
    if (!plan) return { code: 'none', days: 0 };
    var left = diffDays(S.today, plan);
    if (left < 0) return { code: 'late', days: -left };
    return { code: left <= KHMS_SOON_DAYS ? 'soon' : 'todo', days: left };
  }
  function msText(st) {
    return st.code === 'done' ? 'Hoàn thành' : st.code === 'lateDone' ? 'Hoàn thành, trễ ' + st.days + ' ngày'
      : st.code === 'late' ? 'Trễ ' + st.days + ' ngày' : st.code === 'soon' ? 'Còn ' + st.days + ' ngày'
      : st.code === 'todo' ? 'Chưa đến hạn' : '';
  }
  function msBadge(st) {
    if (st.code === 'none') return '<span class="muted">—</span>';
    return '<span class="ms-badge" style="--c:' + MS_COLORS[st.code] + '">' + esc(msText(st)) + '</span>';
  }

  function khmsDerive() {
    S.subMap = {};
    S.subs.forEach(function (s) { S.subMap[s.id] = s; });
    S.pkgBySub = {};
    S.packages.forEach(function (p) {
      var sub = p.submissionId ? S.subMap[p.submissionId] || null : null;
      p._sub = sub;
      if (sub) S.pkgBySub[sub.id] = p;
      var approved = sub && sub.status === S.cfg.approvedStatus && sub.approvedAt;
      p._actual = { invite: p.inviteActual, select: approved ? sub.approvedAt : p.selectActual, contract: p.contractActual, start: p.startActual };
      p._selectSrc = approved ? 'sub' : p.selectActual ? 'manual' : '';
      p._ms = {};
      MILESTONES.forEach(function (m) { p._ms[m.key] = msState(p[m.key + 'Plan'], p._actual[m.key]); });
      p._key = khKey(p.name);
    });
    S.planLast = {};
    (S.planUploads || []).forEach(function (u) {
      var cur = S.planLast[u.project];
      if (!cur || u.date >= cur.date) S.planLast[u.project] = u;
    });
    S.khSugg = khmsSuggestions();
  }

  /**
   * Gợi ý hồ sơ cho gói chưa gắn: hồ sơ Trình duyệt cùng dự án (số đầu tên), chưa gắn gói khác, tên chứa tên hạng mục
   * (không dấu) hoặc chứa ≥ 80% các từ của tên hạng mục. Ưu tiên hồ sơ đã duyệt; gói có 2 hồ sơ ngang điểm thì không gợi ý.
   * Mỗi hồ sơ chỉ gợi ý cho 1 gói (gói có tên dài hơn, cụ thể hơn được ưu tiên).
   */
  function khmsSuggestions() {
    var byProject = {};
    S.subs.forEach(function (s) {
      if (S.pkgBySub[s.id] || s._type === 'BC') return;
      s._projects.forEach(function (c) { (byProject[c] = byProject[c] || []).push(s); });
    });
    var cands = [];
    S.packages.forEach(function (p) {
      if (p.submissionId || !p.active || !p._key) return;
      var words = p._key.split(' ').filter(function (w) { return w.length > 1; });
      var list = [];
      (byProject[p.project] || []).forEach(function (s) {
        var t = ' ' + khKey(s.title) + ' ';
        var score = 0;
        if (t.indexOf(' ' + p._key + ' ') >= 0) score = 2;
        else if (words.length >= 2) {
          var hit = words.filter(function (w) { return t.indexOf(' ' + w + ' ') >= 0; }).length / words.length;
          if (hit >= 0.8) score = hit;
        }
        if (!score) return;
        if (s.status === S.cfg.approvedStatus) score += 0.5;
        list.push({ p: p, s: s, score: score + p._key.length / 10000 });
      });
      list.sort(function (a, b) { return b.score - a.score; });
      if (list.length && !(list[1] && list[1].score === list[0].score)) cands.push(list[0]);
    });
    cands.sort(function (a, b) { return b.score - a.score; });
    var out = {}, taken = {};
    cands.forEach(function (c) {
      if (taken[c.s.id]) return;
      taken[c.s.id] = true;
      out[c.p.id] = c.s;
    });
    return out;
  }

  /** extra: { code, name } — dự án chưa có trong danh mục, sẽ tạo mới khi tải KHMS nhiều dự án. */
  function khmsProjectSelect(id, sel, mode, attrs, extra) {
    var have = {};
    S.packages.forEach(function (p) { if (p.active) have[p.project] = (have[p.project] || 0) + 1; });
    var list = (S.projects || []).slice();
    Object.keys(have).forEach(function (c) { if (!S.projMap[c]) list.push({ code: c, name: '', active: true }); });
    var opt = function (p) {
      return '<option value="' + esc(p.code) + '"' + (p.code === sel ? ' selected' : '') + '>' + esc(projectLabel(p.code)) +
        (have[p.code] ? ' · ' + have[p.code] + ' gói' : '') + '</option>';
    };
    var withPlan = list.filter(function (p) { return have[p.code]; });
    var others = list.filter(function (p) { return !have[p.code] && (p.active || p.code === sel); });
    return '<select id="' + id + '" data-change="' + (mode === 'import' ? 'kh-imp-project' : mode === 'batch' ? 'kh-bimp-project' : 'kh-project') + '"' + (attrs || '') + '>' +
      (mode !== 'filter' && mode ? '<option value="">— Chọn dự án —</option>' : '<option value="">Tất cả dự án có KHMS (' + withPlan.length + ')</option>') +
      (extra ? '<option value="' + esc(extra.code) + '"' + (extra.code === sel ? ' selected' : '') + '>' + esc(extra.code + '_' + extra.name) + ' (tạo mới)</option>' : '') +
      (withPlan.length ? '<optgroup label="Đã có KHMS">' + withPlan.map(opt).join('') + '</optgroup>' : '') +
      (others.length ? '<optgroup label="Chưa có KHMS">' + others.map(opt).join('') + '</optgroup>' : '') + '</select>';
  }

  function khmsMatchState(p, st) {
    var sel = p._ms.select.code;
    switch (st) {
      case 'late': case 'soon': case 'todo': return sel === st;
      case 'done': return sel === 'done' || sel === 'lateDone';
      case 'wait-contract': return (sel === 'done' || sel === 'lateDone') && !p._actual.contract;
      case 'contract': return !!p._actual.contract;
      case 'nolink': return !p.submissionId;
      default: return true;
    }
  }
  function khmsRows() {
    var k = S.khms, q = norm(k.q).trim();
    return S.packages.filter(function (p) {
      if (k.project && p.project !== k.project) return false;
      if (!k.inactive && !p.active) return false;
      if (!khmsMatchState(p, k.state)) return false;
      if (q && norm(p.stt + ' ' + p.name + ' ' + p.project + ' ' + (p._sub ? p._sub.id + ' ' + p._sub.title : '')).indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return projectSort(a.project, b.project) || (b.active - a.active) || a.order - b.order; });
  }
  function khmsStats(list) {
    var st = { n: list.length, value: 0, done: 0, late: 0, soon: 0, contract: 0, waitContract: 0, nolink: 0 };
    list.forEach(function (p) {
      st.value += p.value || 0;
      var sel = p._ms.select.code;
      if (sel === 'done' || sel === 'lateDone') { st.done++; if (!p._actual.contract) st.waitContract++; }
      if (sel === 'late') st.late++;
      if (sel === 'soon') st.soon++;
      if (p._actual.contract) st.contract++;
      if (!p.submissionId) st.nolink++;
    });
    return st;
  }

  function viewKhms() {
    var k = S.khms;
    var scope = S.packages.filter(function (p) { return p.active && (!k.project || p.project === k.project); });
    return khmsParamsCard() + khmsOverviewCard(scope) + (k.project ? '' : khmsProjectsCard()) + khmsDetailCard();
  }

  function khmsParamsCard() {
    var k = S.khms;
    var last = k.project ? S.planLast[k.project] : null;
    var info = k.project ? '<div class="kh-info">' + (last
      ? ic('report') + '<span>KHMS cập nhật <b>' + fmtDate(last.date) + '</b>' + (last.rev ? ' · <b>' + esc(last.rev) + '</b>' : '') +
        ' · ' + esc(userName(last.actor)) + (last.fileName ? ' · <span class="muted">' + esc(last.fileName) + '</span>' : '') + '</span>' +
        (S.me.isManager ? '<button class="link-btn danger" data-act="kh-delete-plan" data-code="' + esc(k.project) + '">Xóa KHMS dự án này</button>' : '')
      : ic('report') + '<span>Dự án này chưa có KHMS — bấm <b>Tải KHMS (Excel)</b> để tải lên.</span>') + '</div>' : '';
    var body = '<div class="params">' +
      '<div class="field kh-proj"><div class="fbody"><label for="kh-project">Dự án</label>' + khmsProjectSelect('kh-project', k.project) + '</div></div>' +
      '<div class="field"><div class="fbody"><label for="kh-state">Tình trạng</label><select id="kh-state" data-change="kh-state">' +
        KH_STATES.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === k.state ? ' selected' : '') + '>' + esc(s[1]) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="field"><div class="fbody"><label for="kh-q">Gói thầu / hồ sơ</label>' +
        '<input type="text" id="kh-q" data-input="kh-q" placeholder="Nhập để tìm…" value="' + esc(k.q) + '"></div></div></div>' + info;
    var tools = (S.khExportAll ? '<button class="secondary-btn" data-act="kh-export-all" title="1 file Excel: sheet Tổng hợp + mỗi dự án 1 sheet">' +
        ic('download') + 'Xuất tất cả dự án</button>' : '') +
      '<button class="secondary-btn" data-act="kh-export">' + ic('download') + 'Xuất Excel</button>' +
      '<button class="primary-btn kh-upload" data-act="kh-upload">' + ic('upload') + 'Tải KHMS (Excel)</button>';
    return card('khms-params', 'Kế hoạch mua sắm', body, { tools: tools, collapsible: true });
  }

  function khmsOverviewCard(scope) {
    var st = khmsStats(scope), k = S.khms;
    var tile = function (state, color, label, n, note) {
      return '<button class="rep-kpi' + (k.state === state && (state || !k.q) ? ' on' : '') + '" style="--c:' + color + '" data-act="kh-state" data-state="' + state + '">' +
        '<span class="rk-l">' + esc(label) + '</span><b>' + fmtNum(n) + '</b><span class="rk-n">' + esc(note) + '</span></button>';
    };
    var pct = function (n) { return st.n ? Math.round(n * 100 / st.n) + '% số gói' : '—'; };
    var body = '<div class="rep-kpis">' +
      tile('', '#1E2B59', 'Gói thầu', st.n, st.value ? 'Tổng giá trị ' + fmtBil(st.value) : 'đang theo dõi') +
      tile('done', MS_COLORS.done, 'Đã chọn thầu', st.done, pct(st.done)) +
      tile('late', MS_COLORS.late, 'Trễ chọn thầu', st.late, 'quá ngày kế hoạch') +
      tile('soon', MS_COLORS.soon, 'Sắp đến hạn', st.soon, 'chọn thầu trong ' + KHMS_SOON_DAYS + ' ngày tới') +
      tile('contract', '#2B4396', 'Đã ký hợp đồng', st.contract, st.waitContract ? st.waitContract + ' gói chờ ký' : pct(st.contract)) +
      '</div><p class="muted kh-note">Ngày chọn thầu thực tế = ngày duyệt của hồ sơ gắn với gói thầu. Bấm ô để lọc danh sách.</p>';
    return card('khms-overview', 'Tổng quan' + (k.project ? ' <span class="ov-period">' + esc(projectLabel(k.project)) + '</span>' : ''), body, { collapsible: true });
  }

  function khmsProjectsCard() {
    var by = {};
    S.packages.forEach(function (p) { if (p.active) (by[p.project] = by[p.project] || []).push(p); });
    var codes = Object.keys(by).sort(projectSort);
    if (!codes.length) return '';
    var num = function (code, state, n, cls) {
      return n ? '<button class="link-btn' + (cls ? ' ' + cls : '') + '" data-act="kh-pick-project" data-code="' + esc(code) + '" data-state="' + state + '">' + fmtNum(n) + '</button>'
        : '<span class="muted">0</span>';
    };
    var rows = codes.map(function (c) {
      var st = khmsStats(by[c]), last = S.planLast[c];
      return '<tr><td><button class="link-btn" data-act="kh-pick-project" data-code="' + esc(c) + '" data-state="">' + projectCell(c) + '</button></td>' +
        '<td class="nowrap">' + (last ? fmtDate(last.date) + (last.rev ? ' <span class="proj-code">' + esc(last.rev) + '</span>' : '') : '—') + '</td>' +
        '<td class="num">' + num(c, '', st.n) + '</td><td class="num">' + (st.value ? fmtBil(st.value) : '—') + '</td>' +
        '<td class="num">' + num(c, 'done', st.done) + '</td><td class="num">' + num(c, 'late', st.late, 'bad') + '</td>' +
        '<td class="num">' + num(c, 'soon', st.soon, 'warn') + '</td><td class="num">' + num(c, 'contract', st.contract) + '</td>' +
        '<td class="num">' + num(c, 'nolink', st.nolink) + '</td></tr>';
    }).join('');
    return card('khms-projects', 'Theo dự án', '<div class="table-wrap"><table class="grid kh-sum"><thead><tr><th>Dự án</th><th>KHMS cập nhật</th>' +
      '<th class="num">Gói thầu</th><th class="num">Giá trị</th><th class="num">Đã chọn thầu</th><th class="num">Trễ chọn thầu</th>' +
      '<th class="num">Sắp đến hạn</th><th class="num">Đã ký HĐ</th><th class="num">Chưa gắn hồ sơ</th></tr></thead><tbody>' + rows + '</tbody></table></div>',
      { collapsible: true });
  }

  /**
   * Cột kế hoạch của bảng gói thầu: 1 cột khi chỉ có 1 bản kế hoạch; 2 cột "KH Rev00" (gốc) + "KH Rev01" (hiện hành) khi file KHMS
   * có cả 2 bản hoặc kế hoạch đã đổi qua các lần tải. Nhãn Rev lấy theo dữ liệu (khác nhau giữa các dự án → "KH gốc" / "KH hiện hành").
   */
  function khPlanCols(rows) {
    var two = rows.some(function (p) {
      return (p.rev0 && p.rev && p.rev0 !== p.rev) ||
        MILESTONES.some(function (m) { var a = p[m.key + 'Plan0']; return a && a !== p[m.key + 'Plan']; });
    });
    var only = function (arr) {
      var u = arr.filter(function (v, i) { return v && arr.indexOf(v) === i; });
      return u.length === 1 && arr.every(Boolean) ? u[0] : '';
    };
    var cur = only(rows.map(function (p) { return p.rev; })), base = only(rows.map(function (p) { return p.rev0; }));
    if (!two) return { two: false, cur: cur ? 'Kế hoạch ' + cur : 'Kế hoạch' };
    if (!base || !cur || base === cur) return { two: true, base: 'KH gốc', cur: 'KH hiện hành' };
    return { two: true, base: 'KH ' + base, cur: 'KH ' + cur };
  }
  function khPlanCell(p, m, pc) {
    var plan = p[m + 'Plan'], plan0 = p[m + 'Plan0'];
    var d = function (iso) { return iso ? fmtShort(iso) : '<span class="muted">—</span>'; };
    if (!pc.two) return '<td class="kh-d">' + d(plan) + '</td>';
    var moved = plan0 && plan && plan0 !== plan;
    return '<td class="kh-d kh-base">' + d(plan0) + '</td>' +
      '<td class="kh-d' + (moved ? ' kh-chgd' : '') + '"' +
      (moved ? ' title="Đổi so với kế hoạch gốc: ' + (diffDays(plan0, plan) > 0 ? '+' : '') + diffDays(plan0, plan) + ' ngày"' : '') + '>' + d(plan) + '</td>';
  }
  function khActualCell(p, m) {
    var a = p._actual[m];
    var fromSub = m === 'select' && p._selectSrc === 'sub';
    if (S.khEdit && !fromSub) return '<td class="kh-d kh-act">' + khEditInput(p, m + 'Actual') + '</td>';
    return '<td class="kh-d kh-act">' + (a ? fmtShort(a) : '<span class="muted">—</span>') +
      (fromSub ? '<small class="kh-src" title="Ngày duyệt hồ sơ ' + esc(p._sub.id) + '">theo HS</small>' : '') + '</td>';
  }

  /* ---------- Cập nhật cả bảng (nút "Cập nhật bảng"): ô nhập ngay trong bảng, lưu 1 lần ---------- */
  /** Giá trị gốc của ô sửa được, dạng hiển thị trong ô nhập. */
  function khEditOrig(p, f) {
    if (f === 'note' || f === 'submissionId') return p[f] || '';
    return p[f] ? fmtDate(p[f]) : '';
  }
  function khEditVal(p, f) {
    var d = S.khEdit.d[p.id];
    return d && d[f] !== undefined ? d[f] : khEditOrig(p, f);
  }
  function khEditCls(p, f) {
    var bad = S.khEdit.bad[p.id + '|' + f];
    return (khEditVal(p, f) !== khEditOrig(p, f) ? ' dirty' : '') + (bad ? ' invalid' : '');
  }
  function khEditInput(p, f) {
    return '<input type="text" class="kh-in' + khEditCls(p, f) + '" id="khe-' + esc(p.id) + '-' + f + '" data-input="kh-cell" data-id="' + esc(p.id) + '" data-f="' + f + '"' +
      ' inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/yyyy" value="' + esc(khEditVal(p, f)) + '">';
  }
  function khEditSelect(p) {
    var cur = khEditVal(p, 'submissionId'), sugg = S.khSugg[p.id];
    var opt = function (s, pre) {
      return '<option value="' + esc(s.id) + '"' + (s.id === cur ? ' selected' : '') + '>' + esc((pre || '') + s.id + ' · ' + statusOf(s.status).short + ' · ' + s.title) + '</option>';
    };
    var list = S.subs.filter(function (s) {
      return s._projects.indexOf(p.project) >= 0 && (!S.pkgBySub[s.id] || S.pkgBySub[s.id] === p) && (!sugg || s.id !== sugg.id);
    }).sort(function (a, b) { return a.id < b.id ? 1 : -1; });
    var curSub = cur && S.subMap[cur];
    var extra = curSub && list.indexOf(curSub) < 0 && (!sugg || curSub !== sugg) ? opt(curSub) : '';
    return '<select class="kh-sel' + khEditCls(p, 'submissionId') + '" id="khe-' + esc(p.id) + '-submissionId" data-change="kh-cell" data-id="' + esc(p.id) + '" data-f="submissionId">' +
      '<option value="">— Chưa gắn hồ sơ —</option>' + extra + (sugg ? opt(sugg, 'Gợi ý: ') : '') + list.map(function (s) { return opt(s); }).join('') + '</select>';
  }
  /** Gom thay đổi đang nhập: items gửi server, bad = ô ngày sai. */
  function khEditCollect() {
    var items = [], bad = {};
    Object.keys(S.khEdit.d).forEach(function (id) {
      var p = S.packages.filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      var d = S.khEdit.d[id], it = { id: id }, n = 0;
      Object.keys(d).forEach(function (f) {
        var raw = d[f];
        if (raw === khEditOrig(p, f)) return;
        if (f === 'note') { if (raw.trim() !== (p.note || '')) { it.note = raw.trim(); n++; } return; }
        if (f === 'submissionId') { it.submissionId = raw; n++; return; }
        var iso = parseDmy(raw);
        if (iso === null || iso > S.today) { bad[id + '|' + f] = iso === null ? 'sai' : 'sau hôm nay'; return; }
        if (iso !== (p[f] || '')) { it[f] = iso; n++; }
      });
      if (n) items.push(it);
    });
    return { items: items, bad: bad };
  }
  function khEditCountText() {
    var c = khEditCollect();
    return 'Lưu thay đổi (' + c.items.length + ' gói)';
  }
  function khEditSave(btn) {
    var c = khEditCollect();
    S.khEdit.bad = c.bad;
    var nBad = Object.keys(c.bad).length;
    if (nBad) { render(); toast(nBad + ' ô ngày không hợp lệ hoặc sau hôm nay (tô đỏ). Nhập dạng dd/mm/yyyy.', 'err'); return; }
    if (!c.items.length) { S.khEdit = null; render(); toast('Không có thay đổi nào.'); return; }
    busy(btn, true);
    call('updatePackages', { items: c.items }).then(function (r) {
      S.khEdit = null;

  }

  /** Lưu giá trị ô đang nhập vào bản nháp (không vẽ lại bảng), cập nhật màu ô và số gói trên nút Lưu. */

  /* ---------- Đọc file Excel KHMS ---------- */
  var KH_GROUPS = [
    { key: 'invite', test: /moi thau/ },
    { key: 'select', test: /chon thau|lua chon nha thau/, not: /hinh thuc|phuong thuc/ }, // bỏ "Hình thức chọn thầu"
    { key: 'contract', test: /hop dong|ky ket/, not: /gia tri/ },
    { key: 'start', test: /thi cong|khoi cong/, not: /\bmau\b|thoi gian/ } // bỏ "Ngày bắt đầu thi công mẫu"
  ];
  /** Ô tiêu đề cột tên gói: "Hạng mục", "Tên vật tư/ gói thầu", "Tên gói thầu", "Nội dung". */
  function khNameHead(t) {
    return t.length <= 40 && /hang muc|goi thau|ten vat tu|noi dung/.test(t) && !/gia tri|hinh thuc|ngay|ty trong|trach nhiem|tinh trang|^goi thau \w+ \w+ \w+/.test(t);
  }
  /** Ô "Thực tế" ghi chữ thay cho ngày: đã xong (HT, Hoàn thành, Done, HĐNT…) / không thực hiện (Không làm, CĐT cấp…). */
  var KH_DONE_RE = /^(ht|hoan thanh|done|xong|hdnt|da (ky|xong|hoan thanh))\b/;
  var KH_NA_RE = /^(khong (lam|dung|thi cong|thuc hien|mua)|ngung|cdt cap|bao gom)\b/;
  function xlValue(v) {
    if (v && typeof v === 'object' && !(v instanceof Date)) {
      if (v.richText) return v.richText.map(function (t) { return t.text; }).join('');
      if ('result' in v) return xlValue(v.result);
      if (v.text != null) return String(v.text);
      return null;
    }
    return v;
  }
  function xlText(v) {
    v = xlValue(v);
    return v == null || v instanceof Date ? '' : String(v).trim();
  }
  var XL_TEXT_DATE = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/;
  /** Ngày dạng chữ "a/b/yyyy": 'dmy' / 'mdy' nếu chỉ hiểu được 1 cách (một số > 12), '' nếu cả hai đều được. */
  function xlDateOrder(s) {
    var m = String(s).trim().match(XL_TEXT_DATE);
    if (!m) return '';
    var a = +m[1], b = +m[2];
    return a > 12 && b <= 12 ? 'dmy' : b > 12 && a <= 12 ? 'mdy' : '';
  }
  /**
   * Ô ngày Excel → ISO: kiểu Date (ExcelJS đọc theo UTC), số serial, hoặc chữ "15-1-26", "15/01/2026".
   * mdy: ngày dạng chữ mơ hồ (vd 05/06/2026) hiểu là tháng/ngày — file ghi "(mm/dd/yy)" hoặc đa số ngày chữ trong sheet là tháng/ngày.
   */
  function xlDate(v, mdy) {
    v = xlValue(v);
    var d = null;
    if (v instanceof Date) d = v;
    else if (typeof v === 'number' && v > 20000 && v < 80000) d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    else if (typeof v === 'string') {
      var m = v.trim().match(XL_TEXT_DATE);
      if (m) {
        var ord = xlDateOrder(v) || (mdy ? 'mdy' : 'dmy');
        var dd = ord === 'mdy' ? m[2] : m[1], mo = ord === 'mdy' ? m[1] : m[2];
        var iso = parseDmy(dd + '/' + mo + '/' + (m[3].length === 2 ? '20' + m[3] : m[3])) || '';
        return iso && iso >= '1990' && iso < '2101' ? iso : '';
      }
      m = v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return parseDmy(m[3] + '/' + m[2] + '/' + m[1]) || '';
      return '';
    }
    if (!d || isNaN(d.getTime())) return '';
    // ExcelJS đổi số serial sang Date theo UTC; ô có cả giờ → lấy phần ngày (cho phép sai số làm tròn 1 phút).
    d = new Date(Math.floor((d.getTime() + 60000) / 86400000) * 86400000);
    var y = d.getUTCFullYear();
    return y < 1990 || y > 2100 ? '' : d.toISOString().slice(0, 10);
  }
  function xlMoney(v) {
    v = xlValue(v);
    if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v) : null;
    var s = String(v == null ? '' : v).replace(/\s|đ|vnd/gi, '');
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g, ''));
    if (/^\d+([.,]\d+)?$/.test(s)) return Math.round(Number(s.replace(',', '.')));
    return null;
  }

  /**
   * Tìm bảng KHMS trong 1 sheet: dòng tiêu đề có cột tên gói, nhóm cột ngày, dòng dưới có "Kế hoạch (Rev..)" / "Thực tế".
   * Chỉ lấy các trường có trên web: tên gói, giá trị, ngày kế hoạch (gốc Rev00 + bản mới nhất) và thực tế của 4 mốc.
   */
  function parseKhmsSheet(ws) {
    var maxR = Math.min(ws.rowCount, 40), maxC = Math.min(ws.columnCount, 150);
    var cell = function (r, c) { return ws.getCell(r, c); };
    var isSlave = function (cl) { return cl.isMerged && cl.master && cl.master.address !== cl.address; };
    var hr = 0, nameCol = 0, altCol = 0, r, c, t;
    for (r = 1; r <= maxR && !hr; r++) {
      for (c = 1; c <= maxC; c++) {
        t = khKey(xlText(cell(r, c).value));
        if (t && khNameHead(t)) { hr = r; break; }
      }
    }
    if (!hr) return null;
    // Có cả "Hạng mục" và "Tên vật tư/ gói thầu" → tên gói lấy cột "Tên vật tư/ gói thầu" (cột "Hạng mục" chỉ là nhóm vật tư).
    var names = [];
    for (c = 1; c <= maxC; c++) {
      t = khKey(xlText(cell(hr, c).value));
      if (t && !isSlave(cell(hr, c)) && khNameHead(t)) names.push({ col: c, pri: /ten (vat tu|goi thau)|^goi thau/.test(t) ? 2 : 1 });
    }
    names.sort(function (a, b) { return (b.pri - a.pri) || (a.col - b.col); });
    nameCol = names[0].col; altCol = names[1] ? names[1].col : 0;
    var firstName = Math.min(nameCol, altCol || nameCol);
    var sttCol = 0, valueCol = 0, starts = [], heads = [];
    for (c = 1; c <= maxC; c++) {
      var cl = cell(hr, c);
      if (isSlave(cl)) continue;
      t = khKey(xlText(cl.value));
      if (!t) continue;
      heads.push(c);
      if (!sttCol && c < firstName && /^(s )?tt$|^stt$|^so tt$/.test(t)) sttCol = c;
      else if (!valueCol && c > firstName && /gia tri|gia goi thau|du toan/.test(t)) valueCol = c;
      else if (c > firstName) {
        KH_GROUPS.forEach(function (g) {
          if (g.test.test(t) && !(g.not && g.not.test(t))) starts.push({ key: g.key, col: c, ngay: /^ngay\b/.test(t) });
        });
      }
    }
    // Mỗi mốc lấy 1 nhóm cột: ưu tiên tiêu đề bắt đầu bằng "Ngày …", rồi nhóm đứng trước.
    var seen = {};
    starts = starts.sort(function (a, b) { return (b.ngay - a.ngay) || (a.col - b.col); })
      .filter(function (s) { if (seen[s.key]) return false; seen[s.key] = true; return true; });
    if (!starts.length) return null;
    // Nhóm cột kéo dài tới trước ô tiêu đề kế tiếp (vd "Ngày mời thầu" W–X, "Ngày BCH gửi SSG" Y–Z là nhóm khác).
    var nextHead = function (cc) { for (var i = 0; i < heads.length; i++) if (heads[i] > cc) return heads[i]; return 0; };
    var revOf = function (s) { var m = s.match(/re[vc]\s*0*(\d+)/); return m ? +m[1] : -1; }; // "Rec01" = gõ nhầm Rev01
    var groups = {}, subRow = 0;
    starts.sort(function (a, b) { return a.col - b.col; });
    starts.forEach(function (s) {
      var nh = nextHead(s.col);
      var end = Math.min(nh ? nh - 1 : s.col + 7, s.col + 9, maxC);
      var plans = [], actual = 0;
      for (var cc = s.col; cc <= end; cc++) {
        for (var rr = hr + 1; rr <= hr + 2; rr++) {
          var cl = cell(rr, cc);
          if (isSlave(cl) && cl.master.row <= hr) continue;
          var t = khKey(xlText(cl.value));
          if (/cham tre|so voi|tinh trang/.test(t)) break; // "Chậm trễ so với Thực tế chọn thầu" không phải cột Thực tế
          if (/ke hoach|^kh\b/.test(t)) { plans.push({ col: cc, rev: revOf(t) }); subRow = Math.max(subRow, rr); break; }
          if (!actual && /thuc te|^tt$/.test(t)) { actual = cc; subRow = Math.max(subRow, rr); break; }
        }
      }
      if (!plans.length) plans.push({ col: s.col, rev: -1 });
      // Nhiều cột kế hoạch (Rev00, Rev01, "Kế hoạch 03/09/2026", "Kế hoạch tuần 11"…): cột Rev00 là kế hoạch gốc;
      // kế hoạch hiện hành của từng gói = cột kế hoạch có ngày nằm bên phải nhất (bản cập nhật sau cùng của gói đó).
      var base = plans.length > 1 ? plans.filter(function (p) { return p.rev === 0; })[0] : null;
      groups[s.key] = { plans: plans, plan: plans[plans.length - 1].col, plan0: base ? base.col : 0, actual: actual,
                        rev: Math.max.apply(null, plans.map(function (p) { return p.rev; })) };
    });
    var start = Math.max(hr, subRow) + 1;
    var used = {};
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      g.plans.forEach(function (p) { used[p.col] = 1; });
      used[g.actual] = 1;
    });
    // Ngày dạng chữ: tháng/ngày hay ngày/tháng — theo đa số ngày chữ không mơ hồ trong sheet, không rõ thì theo ghi chú "(mm/dd/yy)" ở đầu sheet.
    var ord = { dmy: 0, mdy: 0 }, hint = false;
    for (r = 1; r < hr; r++) for (c = 1; c <= Math.min(maxC, 40); c++) if (/mm\W?dd/i.test(xlText(cell(r, c).value))) hint = true;
    for (r = start; r <= ws.rowCount; r++) {
      Object.keys(used).forEach(function (cc) {
        if (!+cc) return;
        var v = xlValue(cell(r, +cc).value);
        if (typeof v === 'string') { var o = xlDateOrder(v); if (o) ord[o]++; }
      });
    }
    var mdy = ord.mdy > ord.dmy || (ord.mdy === ord.dmy && hint);
    // Cột tình trạng (có thể không có tiêu đề, vd cột ẩn ghi "Đã ký HĐ" / "Đang ký HĐ" / "Đang chọn thầu").
    var progCol = 0, progMax = 0;
    for (c = firstName + 1; c <= maxC; c++) {
      if (used[c]) continue;
      var hits = 0;
      for (r = start; r <= Math.min(ws.rowCount, start + 400); r++) if (/^(da|dang) (ky|chon)\b/.test(khKey(xlText(cell(r, c).value)))) hits++;
      if (hits > progMax) { progMax = hits; progCol = c; }
    }
    var rows = [], headKey = khKey(xlText(cell(hr, nameCol).value)), maxUsed = -1, newer = false, hasBase = false;
    for (r = start; r <= ws.rowCount; r++) {
      var name = xlText(cell(r, nameCol).value).replace(/\s+/g, ' ');
      if (!name && altCol) name = xlText(cell(r, altCol).value).replace(/\s+/g, ' ');
      var nk = khKey(name);
      // Bỏ dòng tiêu đề lặp lại, "Tổng cộng" và dòng đánh số cột (1, 2, 7, 8…).
      if (!nk || nk === headKey || /^tong cong\b|^(tong|cong)$/.test(nk) || /^\d+$/.test(nk)) continue;
      var stt = sttCol ? xlText(cell(r, sttCol).value) : '';
      // fileStt: STT trong file — chỉ dùng để nhận dòng nhóm; STT của gói do web tự đánh 1, 2, 3… (khAutoStt).
      var item = { row: r, sheet: ws.name, fileStt: stt, name: name, value: valueCol ? xlMoney(cell(r, valueCol).value) : null,
                   plan: {}, plan0: {}, actual: {}, done: {}, hidden: !!ws.getRow(r).hidden, progress: 0, progressText: '',
                   na: /\((khong su dung|khong dung|khong thuc hien|huy)\)/.test(norm(name)) ? 'Không sử dụng' : '' }; // vd "Cẩu thùng (Không sử dụng)"
      if (progCol) {
        item.progressText = xlText(cell(r, progCol).value);
        var pk = khKey(item.progressText);
        item.progress = /^da ky\b/.test(pk) ? 2 : /^(dang ky|da chon)\b/.test(pk) ? 1 : 0; // 2: đã ký HĐ, 1: đã chọn thầu
      }
      var any = false;
      MILESTONES.forEach(function (m) {
        var g = groups[m.key];
        if (!g) return;
        var cur = '', from = null;
        for (var i = g.plans.length - 1; i >= 0 && !cur; i--) { cur = xlDate(cell(r, g.plans[i].col).value, mdy); if (cur) from = g.plans[i]; }
        item.plan[m.key] = cur;
        item.plan0[m.key] = g.plan0 ? xlDate(cell(r, g.plan0).value, mdy) : '';
        if (from) {
          maxUsed = Math.max(maxUsed, from.rev);
          if (g.plan0 && from.col !== g.plan0) { hasBase = true; if (from.rev < 0) newer = true; }
        }
        if (g.actual) {
          var av = cell(r, g.actual).value;
          item.actual[m.key] = xlDate(av, mdy);
          var at = item.actual[m.key] ? '' : khKey(xlText(av));
          if (KH_DONE_RE.test(at)) item.done[m.key] = true;
          else if (KH_NA_RE.test(at) && !item.na) item.na = xlText(av);
        } else item.actual[m.key] = '';
        if (item.plan[m.key] || item.actual[m.key] || item.done[m.key]) any = true;
      });
      // Dòng nhóm (vd "I. PHẦN MÓNG": STT chữ La Mã/chữ cái, hoặc tên VIẾT HOA, không có ngày) không phải gói thầu.
      if (!any && (!/^\d+([.,]\d+)*$/.test(stt) || (name === name.toUpperCase() && /[A-ZĐ]/.test(name)))) continue;
      // Mốc sau đã xong / có ngày thực tế → các mốc trước cũng đã xong (vd đã ký HĐ thì đã mời thầu, chọn thầu).
      var later = false;
      ['contract', 'select', 'invite'].forEach(function (k) {
        if (later && !item.actual[k]) item.done[k] = true;
        if (item.actual[k] || item.done[k]) later = true;
      });
      rows.push(item);
    }
    if (!rows.length) return null;
    // File chỉ có 1 bản kế hoạch (cột Rev01… trống) → không có kế hoạch gốc riêng.
    if (!hasBase) rows.forEach(function (it) { it.plan0 = {}; });
    // Nhãn bản kế hoạch: Rev lớn nhất đã dùng; bản cập nhật không ghi Rev (vd "Kế hoạch 03/09/2026") → không ghi nhãn ("KH hiện hành").
    var rev = newer && maxUsed <= 0 ? -2 : maxUsed;
    if (rev === -1) {
      // Không có "Kế hoạch RevNN" ở tiêu đề cột → lấy Rev ở tiêu đề sheet, vd "KẾ HOẠCH MUA SẮM … (REV01)".
      for (r = 1; r < hr && rev < 0; r++) {
        for (c = 1; c <= Math.min(maxC, 40); c++) {
          var rv = revOf(khKey(xlText(cell(r, c).value)));
          if (rv >= 0) { rev = rv; break; }
        }
      }
    }
    return { name: ws.name, visible: !ws.state || ws.state === 'visible', headerRow: hr, groups: groups, mdy: mdy,
             rev: rev >= 0 ? 'Rev' + ('0' + rev).slice(-2) : '', rev0: hasBase ? 'Rev00' : '', rows: rows };
  }

  function khmsUpload() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
        toast('Chỉ đọc được file Excel .xlsx. File .xls cũ: mở bằng Excel rồi "Save As" thành .xlsx.', 'err');
        return;
      }
      setLoading(1);
      toast('Đang đọc file ' + file.name + '…');
      Promise.all([loadExcelJs(), file.arrayBuffer()]).then(function (res) {
        var wb = new res[0].Workbook();
        return wb.xlsx.load(res[1]).then(function () { return wb; });
      }).then(function (wb) {
        var sheets = [];
        wb.worksheets.forEach(function (ws) {
          var p = null;
          try { p = parseKhmsSheet(ws); } catch (e) { p = null; }
          if (p) sheets.push(p);
        });
        if (!sheets.length) {
          throw new Error('Không tìm thấy bảng KHMS trong file: cần dòng tiêu đề có cột "Hạng mục" và các nhóm cột ' +
            '"Ngày mời thầu / Ngày chọn thầu / Ngày ký kết hợp đồng" (dưới mỗi nhóm có cột Kế hoạch, Thực tế).');
        }
        // File tổng hợp: các sheet đặt tên "STT_Tên dự án" của ≥ 2 dự án → tải nhiều dự án một lần.
        var codes = {};
        sheets.forEach(function (s) { var c = projectCodesOf(s.name)[0]; if (c) codes[c] = 1; });
        if (Object.keys(codes).length >= 2) {
          S.khImport = khBatchInit(file.name, sheets.filter(function (s) { return projectCodesOf(s.name)[0]; }));
          // Sheet không phải KHMS 1 dự án (vd "DuAn" — danh sách dự án, "Bim Hạ Long" — không có số dự án): bỏ qua.
          S.khImport.ignored = wb.worksheets.map(function (ws) { return ws.name; })
            .filter(function (n) { return !sheets.some(function (s) { return s.name === n && projectCodesOf(n)[0]; }); });
          openKhmsBatch(); return;
        }
        var guess = projectCodesOf(file.name).filter(function (c) { return S.projMap[c]; })[0] || S.khms.project || '';
        // Nhiều sheet có bảng KHMS: ưu tiên sheet đang hiện, rồi bản có số "(n)" lớn nhất — theo người dùng, file KHMSGT
        // dùng "KHMSGT (2)" (bản mới) thay cho "KHMSGT" — rồi sheet nhiều gói nhất.
        var copyNo = function (s) { var m = s.name.match(/\((\d+)\)\s*$/); return m ? +m[1] : 0; };
        var better = function (a, b) {
          return (a.visible - b.visible) || (copyNo(a) - copyNo(b)) || (a.rows.length - b.rows.length);
        };
        var best = 0;
        sheets.forEach(function (s, i) { if (better(s, sheets[best]) > 0) best = i; });
        S.khImport = { fileName: file.name, sheets: sheets, sheet: best, project: guess, skip: {}, useProgress: true };
        sheets[best].rows.forEach(function (r, i) { if (r.na) S.khImport.skip[i] = true; });
        openKhmsImport();
      }).catch(function (err) {
        toast((err && err.message) || 'Không đọc được file Excel.', 'err');
      }).then(function () { setLoading(-1); });
    });
    input.click();
  }

  /**
   * Ngày thực tế sẽ gửi lên: theo cột Thực tế trong file; nếu bật "mốc đã xong theo file": ô Thực tế ghi "HT" / "Hoàn thành" /
   * "HĐNT"…, gói "Đã ký HĐ" (mời thầu, chọn thầu, ký HĐ đã xong), "Đang ký HĐ" (mời thầu, chọn thầu đã xong) — ô còn trống lấy
   * ngày kế hoạch (không sau hôm nay). inferred: các mốc được suy ra.
   */
  function khImpActual(st, r) {
    var a = {}, inferred = [];
    MILESTONES.forEach(function (m) { a[m.key] = r.actual[m.key] || ''; });
    if (st.useProgress) {
      var done = {};
      if (r.progress) (r.progress >= 2 ? ['invite', 'select', 'contract'] : ['invite', 'select']).forEach(function (k) { done[k] = 1; });
      MILESTONES.forEach(function (m) { if (r.done && r.done[m.key]) done[m.key] = 1; });
      MILESTONES.forEach(function (m) {
        var k = m.key, d = r.plan[k] > S.today ? S.today : r.plan[k];
        if (done[k] && !a[k] && d) { a[k] = d; inferred.push(k); }
      });
    }
    return { actual: a, inferred: inferred };
  }
  /** STT web tự đánh (theo người dùng: không dùng STT trong file): 1, 2, 3… theo thứ tự các gói được tích; gói bỏ tích → ''. */
  function khAutoStt(rows, skip) {
    var n = 0;
    return rows.map(function (r, i) { return skip[i] ? '' : String(++n); });
  }
  /** Ghép dòng file với gói đã có (giống importPlan_ ở server): cùng tên không dấu, ưu tiên cùng STT. */
  function khmsMatch(rows, existing) {
    var used = {};
    return rows.map(function (r) {
      var key = khKey(r.name);
      var same = existing.filter(function (p) { return !used[p.id] && khKey(p.name) === key; });
      var hit = same.filter(function (p) { return p.stt === r.stt; })[0] || same[0] || null;
      if (hit) used[hit.id] = true;
      return hit;
    });
  }
  /** So các dòng file (bỏ dòng không tích) với KHMS đang có của dự án: Mới / Cập nhật (kê trường đổi) / Không đổi / Không còn trong file. */
  /** overwrite (Ghi đè): như server mergePlan_ — kế hoạch gốc / thực tế theo file, gói trên web không có trong file sẽ bị xóa. */
  function khmsDiff(st, rows, skip, project, overwrite) {
    var existing = project ? S.packages.filter(function (p) { return p.project === project; }) : [];
    var auto = khAutoStt(rows, skip);
    var picked = rows.map(function (r, i) { return { name: r.name, stt: auto[i] }; }).filter(function (r, i) { return !skip[i]; });
    var hits = khmsMatch(picked, existing), j = 0, matched = {};
    var out = { add: 0, upd: 0, same: 0, n: picked.length, info: [], removed: [], auto: auto };
    rows.forEach(function (r, i) {
      if (skip[i]) { out.info.push(null); return; }
      var p = hits[j++];
      if (!p) { out.add++; out.info.push({ kind: 'new' }); return; }
      matched[p.id] = true;
      var ch = [], eff = khImpActual(st, r);
      if (p.stt !== auto[i]) ch.push('STT');
      if ((p.value == null ? null : p.value) !== r.value) ch.push('giá trị');
      MILESTONES.forEach(function (m) {
        var k = m.key, lb = m.label.toLowerCase();
        if ((p[k + 'Plan'] || '') !== (r.plan[k] || '')) ch.push('KH ' + lb);
        if (overwrite) {
          if ((p[k + 'Plan0'] || '') !== (r.plan0[k] || r.plan[k] || '')) ch.push('KH gốc ' + lb);
          if ((p[k + 'Actual'] || '') !== (eff.actual[k] || '')) ch.push('TT ' + lb);
          return;
        }
        if (r.plan0[k] && (p[k + 'Plan0'] || '') !== r.plan0[k]) ch.push('KH Rev00 ' + lb);
        if (eff.actual[k] && !p[k + 'Actual'] && !(k === 'select' && p._selectSrc === 'sub')) ch.push('TT ' + lb);
      });
      if (!p.active) ch.push('dùng lại');
      if (ch.length) out.upd++; else out.same++;
      out.info.push({ kind: ch.length ? 'upd' : 'same', changes: ch });
    });
    out.removed = existing.filter(function (p) { return (overwrite || p.active) && !matched[p.id]; });
    out.overwrite = !!overwrite;
    return out;
  }
  /** Đếm mốc "đã xong" theo file trong các dòng được tích (cho ô tích "ghi nhận ngày thực tế = ngày kế hoạch"). */
  function khProgCount(rows, skip, acc) {
    acc = acc || { done: 0, sel: 0, ht: 0 };
    rows.forEach(function (r, i) {
      if (skip[i]) return;
      if (r.progress === 2) acc.done++; else if (r.progress === 1) acc.sel++;
      if (MILESTONES.some(function (m) { return r.done && r.done[m.key] && !r.actual[m.key]; })) acc.ht++;
    });
    return acc;
  }
  function khProgOption(st, prog) {
    if (!prog.done && !prog.sel && !prog.ht) return '';
    var parts = [];
    if (prog.ht) parts.push('<b>' + prog.ht + '</b> gói có cột Thực tế ghi "HT" / "Hoàn thành" / "HĐNT"… thay cho ngày');
    if (prog.done) parts.push('<b>' + prog.done + '</b> gói "Đã ký HĐ" (đã mời thầu, chọn thầu, ký HĐ)');
    if (prog.sel) parts.push('<b>' + prog.sel + '</b> gói "Đang ký HĐ" (đã mời thầu, chọn thầu)');
    return '<label class="check sync-date-opt"><input type="checkbox" data-change="kh-imp-progress"' + (st.useProgress ? ' checked' : '') + '><span>' +
      'Mốc đã xong theo file: ' + parts.join('; ') + ' → ghi nhận <b>ngày thực tế = ngày kế hoạch</b> (không sau hôm nay; mốc sau đã xong thì các mốc trước cũng xong; ' +
      'chỉ điền ô còn trống, dấu *). Bỏ tích nếu không muốn.</span></label>';
  }
  /** Bảng các gói đọc được (xem trước): tích / bỏ từng gói. u: số thứ tự nhóm sheet khi tải nhiều dự án. */
  function khImpTable(st, rows, skip, diff, o) {
    var uAttr = o.u != null ? ' data-u="' + o.u + '"' : '';
    var body = rows.map(function (r, i) {
      var inf = diff.info[i];
      var tag = !inf ? '<span class="muted">Bỏ qua</span>' : inf.kind === 'new' ? '<span class="kh-chg new">Mới</span>'
        : inf.kind === 'upd' ? '<span class="kh-chg upd">Cập nhật</span><small class="kh-chg-l">' + esc(inf.changes.join(', ')) + '</small>'
        : '<span class="muted">Không đổi</span>';
      var eff = khImpActual(st, r);
      var acts = MILESTONES.filter(function (m) { return eff.actual[m.key]; }).map(function (m) {
        return m.label + ' ' + fmtShort(eff.actual[m.key]) + (eff.inferred.indexOf(m.key) >= 0 ? '*' : '');
      });
      var tags = (r.hidden ? ' <span class="kh-tag">dòng ẩn</span>' : '') + (r.na ? ' <span class="kh-tag">' + esc(r.na) + '</span>' : '') +
        (o.multiSheet ? '<small class="kh-sheet">' + esc(r.sheet) + '</small>' : '');
      return '<tr' + (skip[i] ? ' class="inactive"' : '') + '><td class="center"><input type="checkbox" data-change="kh-imp-row"' + uAttr + ' data-i="' + i + '"' + (skip[i] ? '' : ' checked') + '></td>' +
        '<td class="center code">' + (diff.auto[i] ? esc(diff.auto[i]) : '<span class="muted">—</span>') + '</td><td class="title-cell">' + esc(r.name) + tags + '</td>' +
        '<td class="num nowrap">' + (r.value != null ? fmtMoney(r.value) : '—') + '</td>' +
        MILESTONES.map(function (m) {
          var a = r.plan0[m.key], b = r.plan[m.key];
          return '<td class="nowrap">' + (o.rev0 ? '<small class="kh-rev0x">' + (fmtShort(a) || '—') + '</small>' : '') +
            '<span' + (o.rev0 && a && a !== b ? ' class="kh-chgd"' : '') + '>' + (fmtShort(b) || '—') + '</span></td>';
        }).join('') +
        '<td class="kh-acts">' + (r.progressText ? '<b>' + esc(r.progressText) + '</b><br>' : '') +
          (acts.length ? esc(acts.join(' · ')) : '<span class="muted">—</span>') + '</td><td>' + tag + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table class="grid kh-imp"><thead><tr>' +
      '<th class="center"><input type="checkbox" data-change="kh-imp-all"' + uAttr + (diff.n === rows.length ? ' checked' : '') + ' aria-label="Chọn tất cả"></th>' +
      '<th title="Web tự đánh số 1, 2, 3… theo thứ tự các gói được tích (không dùng STT trong file)">STT</th><th>Hạng mục</th><th class="num">Giá trị</th>' +
      MILESTONES.map(function (m) { return '<th>KH ' + esc(m.label.toLowerCase()) + (o.rev0 ? '<small class="kh-th-rev">Rev00 / ' + esc(o.rev || 'mới') + '</small>' : '') + '</th>'; }).join('') +
      '<th>Tình trạng / thực tế trong file</th><th>Thay đổi</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function khRemovedSection(removed, overwrite) {
    if (overwrite) {
      return removed.length ? syncSection('Gói trên web không có trong file (ghi đè: sẽ XÓA)', removed.length,
        '<ul class="sync-list">' + removed.map(function (p) { return '<li>' + esc((p.stt ? p.stt + '. ' : '') + p.name) + (p.submissionId ? ' <span class="muted">(' + esc(p.submissionId) + ')</span>' : '') + '</li>'; }).join('') + '</ul>',
        false, 'Ghi đè: các gói này bị xóa khỏi KHMS của dự án (kể cả ngày thực tế và hồ sơ đã gắn).') : '';
    }
    return removed.length ? syncSection('Gói không có trong file (sẽ đánh dấu "Không còn trong KHMS mới")', removed.length,
      '<ul class="sync-list">' + removed.map(function (p) { return '<li>' + esc((p.stt ? p.stt + '. ' : '') + p.name) + (p.submissionId ? ' <span class="muted">(' + esc(p.submissionId) + ')</span>' : '') + '</li>'; }).join('') + '</ul>',
      false, 'Gói vẫn được giữ cùng ngày thực tế và hồ sơ đã gắn, chỉ ẩn khỏi danh sách; tải lại file có gói này thì dùng lại.') : '';
  }

  /** Ô tích gói trong bảng xem trước → { rows, skip } của KHMS đang xem (1 dự án, hoặc nhóm sheet data-u khi tải nhiều dự án). */
  function khImpTarget(el) {
    var st = S.khImport;
    if (st.batch) return st.units[+el.dataset.u];
    return { rows: st.sheets[st.sheet].rows, skip: st.skip };
  }
  function openKhmsImport() {
    var st = S.khImport;
    if (st.batch) { openKhmsBatch(); return; }
    var sh = st.sheets[st.sheet];
    var diff = khmsDiff(st, sh.rows, st.skip, st.project);
    var gnames = MILESTONES.filter(function (m) { return sh.groups[m.key]; }).map(function (m) {
      var g = sh.groups[m.key];
      var rv = g.rev >= 0 ? 'Rev' + ('0' + g.rev).slice(-2) : '';
      return m.label + ' (Kế hoạch' + (g.plan0 ? ' Rev00 + ' + (rv && g.rev > 0 ? rv : 'bản mới') : rv ? ' ' + rv : '') + (g.actual ? ', Thực tế' : '') + ')';
    });
    var missing = MILESTONES.filter(function (m) { return !sh.groups[m.key]; }).map(function (m) { return m.head; });
    var sheetSel = st.sheets.length > 1 ? '<div class="form-row"><label for="m-ksheet">Sheet</label><select id="m-ksheet" data-change="kh-imp-sheet">' +
      st.sheets.map(function (s, i) { return '<option value="' + i + '"' + (i === st.sheet ? ' selected' : '') + '>' + esc(s.name) + (s.visible ? '' : ' – sheet ẩn') + ' (' + s.rows.length + ' gói)</option>'; }).join('') + '</select></div>' : '';
    var first = st.project && !S.packages.some(function (p) { return p.project === st.project; });
    openModal(modalHead('Tải KHMS: ' + esc(st.fileName)) + '<div class="modal-body"><div id="m-err"></div>' +
      '<div class="form-row"><label for="m-kproject">Dự án của KHMS</label>' + khmsProjectSelect('m-kproject', st.project, 'import') +
      '<div class="help">Tự chọn theo số đầu tên file (vd "231_KHMS….xlsx"); kiểm tra lại trước khi tải lên.</div></div>' + sheetSel +
      '<div class="info-box">Sheet <b>' + esc(sh.name) + '</b> · dòng tiêu đề ' + sh.headerRow + (sh.rev ? ' · kế hoạch <b>' + esc(sh.rev) + '</b>' : '') +
        ' · đọc được: ' + esc(gnames.join('; ')) + (missing.length ? '<br><span class="kh-warn">Không thấy nhóm cột: ' + esc(missing.join(', ')) + '</span>' : '') + '</div>' +
      '<div class="meta-grid" style="margin-top:12px"><div><small>Gói thầu trong file</small>' + sh.rows.length + '</div>' +
        '<div><small>Thêm mới</small>' + diff.add + '</div><div><small>Cập nhật</small>' + diff.upd + '</div><div><small>Không đổi</small>' + diff.same + '</div>' +
        '<div><small>Không còn trong file</small>' + diff.removed.length + '</div></div>' +
      syncSection('Gói thầu đọc được', sh.rows.length, khImpTable(st, sh.rows, st.skip, diff, { rev0: sh.rev0, rev: sh.rev }), true) +
      khRemovedSection(diff.removed) + khProgOption(st, khProgCount(sh.rows, st.skip)) +
      '<div class="info-box" style="margin-top:14px">' + (first
        ? 'Lần tải đầu của dự án: ngày kế hoạch được lưu làm <b>kế hoạch gốc</b> để so sánh khi có bản KHMS mới.'
        : 'Tải lại: cập nhật <b>kế hoạch hiện hành</b> theo file, giữ kế hoạch gốc, ngày thực tế và hồ sơ đã gắn trên web.') +
        ' Ngày thực tế trong file chỉ điền vào ô còn trống trên web; ngày chọn thầu thực tế lấy theo ngày duyệt hồ sơ khi đã gắn hồ sơ.</div></div>' +
      '<div class="modal-foot"><button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" id="m-kimp-btn" style="min-height:42px;font-size:16px" data-act="kh-submit-import">' + ic('check') + 'Tải lên ' + diff.n + ' gói thầu</button></div>', true);
  }

  /** Dòng gửi lên server của 1 KHMS (bỏ dòng không tích). */
  function khImpPayloadRows(st, rows, skip) {
    return rows.filter(function (r, i) { return !skip[i]; }).map(function (r, i) {
      return { stt: String(i + 1), name: r.name, value: r.value, plan: r.plan, plan0: r.plan0, actual: khImpActual(st, r).actual };
    });
  }
  function submitKhmsImport(btn) {
    var st = S.khImport, sh = st.sheets[st.sheet];
    if (!st.project) { modalError('Vui lòng chọn dự án của KHMS.'); return; }
    var rows = khImpPayloadRows(st, sh.rows, st.skip);
    if (!rows.length) { modalError('Chưa chọn gói thầu nào.'); return; }
    busy(btn, true);
    call('importPlan', { projectCode: st.project, fileName: st.fileName, rev: sh.rev, rev0: sh.rev0, rows: rows }).then(function (r) {
      closeModal();
      S.packages = r.packages; S.planUploads = r.uploads;
      S.khms.project = st.project; S.khms.state = ''; S.khImport = null;
      derive(); render();
      toast('Đã tải KHMS dự án ' + st.project + ': ' + r.added + ' gói mới, ' + r.updated + ' cập nhật, ' + r.unchanged + ' không đổi' +
        (r.removed ? ', ' + r.removed + ' không còn trong KHMS mới' : '') + '.');
    }).catch(function (err) { busy(btn, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
  }

  /* ---------- Tải nhiều dự án một lần: file tổng hợp, mỗi sheet "STT_Tên dự án" là KHMS của 1 dự án ---------- */
  /**
   * Gom sheet theo dự án (số đầu tên sheet; "76_La Pura" + "76.1_La Pura MEP" → dự án 76). Mặc định bỏ tích gói "Không làm" / "CĐT cấp"…;
   * dòng ẩn vẫn tích (theo người dùng: "cập nhật cả data trong các dòng ẩn" — file thường ẩn các gói đã xong).
   */
  function khBatchInit(fileName, sheets) {
    var units = [], byCode = {};
    sheets.forEach(function (sh, si) {
      var code = projectCodesOf(sh.name)[0] || '';
      var u = code ? byCode[code] : null;
      if (!u) {
        u = { code: code, project: code && S.projMap[code] ? code : '', sheets: [], rows: [], skip: {}, on: false, overwrite: false };
        units.push(u);
        if (code) byCode[code] = u;
      }
      u.sheets.push(si);
      sh.rows.forEach(function (r) {
        if (r.na) u.skip[u.rows.length] = true;
        u.rows.push(r);
      });
    });
    units.forEach(function (u) {
      var shs = u.sheets.map(function (si) { return sheets[si]; });
      var revs = shs.map(function (s) { return s.rev; });
      u.rev = revs.every(function (v) { return v === revs[0]; }) ? revs[0] : '';
      u.rev0 = shs.some(function (s) { return s.rev0; }) ? 'Rev00' : '';
      // Sheet chỉ có kế hoạch Rev00 gộp với sheet có Rev00 + bản mới (vd 76_La Pura + 76.1_La Pura MEP): kế hoạch gốc = chính kế hoạch Rev00.
      if (u.rev0) shs.forEach(function (s) {
        if (!s.rev0 && s.rev === 'Rev00') s.rows.forEach(function (r) { MILESTONES.forEach(function (m) { r.plan0[m.key] = r.plan[m.key] || ''; }); });
      });
      u.name = shs.map(function (s) { return s.name; }).join(' + ');
      // STT trên tên sheet chưa có dự án trên web → tạo dự án mới theo tên sheet (Trưởng phòng / admin), vd "172.1_Tuyên Sơn_MEP" +
      // "172.2_Tuyên Sơn_Psinh Landscape" → 172_Tuyên Sơn (phần tên chung của các sheet).
      if (!u.project && /^\d+$/.test(u.code)) {
        u.createName = khSheetProjectName(shs.map(function (s) { return s.name; }));
        if (u.createName && S.me.isManager) u.project = u.code;
      }
      u.on = !!u.project && shs.some(function (s) { return s.visible; });
    });
    return { batch: true, fileName: fileName, sheets: sheets, units: units, useProgress: true, open: -1 };
  }
  /** Tên dự án theo tên sheet: bỏ "STT_" / "STT.n_" đầu, lấy phần chung của các sheet cùng dự án. */
  function khSheetProjectName(names) {
    var parts = names.map(function (n) { return n.replace(/^\d+(?:\.\d+)*\s*[_.\-\s]\s*/, '').trim(); }).filter(Boolean);
    if (!parts.length) return '';
    var common = parts.reduce(function (a, b) { var i = 0; while (i < a.length && a.charAt(i) === b.charAt(i)) i++; return a.slice(0, i); });
    common = common.replace(/[\s_\-.,(]+$/, '').trim();
    return (common.length >= 3 ? common : parts[0]).replace(/_/g, ' ').replace(/\s+/g, ' ').slice(0, 150);
  }
  function openKhmsBatch() {
    var st = S.khImport;
    var tot = { units: 0, n: 0, add: 0, upd: 0, same: 0, removed: 0, over: [] }, prog = { done: 0, sel: 0, ht: 0 }, used = {};
    var lines = st.units.map(function (u, ui) {
      u.has = !!u.project && S.packages.some(function (p) { return p.project === u.project; });
      if (!u.has || !S.me.isManager) u.overwrite = false;
      var diff = khmsDiff(st, u.rows, u.skip, u.project, u.overwrite);
      u._diff = diff;
      if (u.on) {
        if (u.overwrite) tot.over.push(u.project);
        tot.units++; tot.n += diff.n; tot.add += diff.add; tot.upd += diff.upd; tot.same += diff.same; tot.removed += diff.removed.length;
        khProgCount(u.rows, u.skip, prog);
        if (u.project) used[u.project] = (used[u.project] || 0) + 1;
      }
      var hidden = u.sheets.every(function (si) { return !st.sheets[si].visible; });
      var warn = !u.project ? (u.code ? 'Dự án ' + u.code + ' chưa có trong danh mục' +
        (u.createName && !S.me.isManager ? ' — Trưởng phòng / admin tải file để tự tạo' : '') : 'Chưa xác định dự án') : '';
      var isNew = u.createName && u.project === u.code && !S.projMap[u.code];
      return { u: u, ui: ui, diff: diff, warn: warn, hidden: hidden, isNew: isNew };
    });
    var dup = Object.keys(used).filter(function (c) { return used[c] > 1; });
    var missingCodes = lines.filter(function (l) { return l.warn && l.u.code; }).map(function (l) { return l.u.code; });
    var newCodes = lines.filter(function (l) { return l.isNew && l.u.on; }).map(function (l) { return l.u.code + '_' + l.u.createName; });
    var body = lines.map(function (l) {
      var u = l.u, d = l.diff, open = st.open === l.ui;
      return '<tr' + (u.on ? '' : ' class="inactive"') + '><td class="center"><input type="checkbox" data-change="kh-bimp-on" data-u="' + l.ui + '"' + (u.on ? ' checked' : '') + '></td>' +
        '<td class="title-cell">' + esc(u.name) + (l.hidden ? ' <span class="kh-tag">sheet ẩn</span>' : '') +
          '<br><button class="link-btn kh-bopen" data-act="kh-bimp-open" data-u="' + l.ui + '">' + (open ? 'Ẩn danh sách gói ▴' : 'Xem gói ▾') + '</button></td>' +
        '<td>' + khmsProjectSelect('m-kbp-' + l.ui, u.project, 'batch', ' data-u="' + l.ui + '" aria-label="Dự án của ' + esc(u.name) + '"',
          u.createName && S.me.isManager && !S.projMap[u.code] ? { code: u.code, name: u.createName } : null) +
          (l.isNew ? '<div class="kh-bnew">Dự án mới: tạo ' + esc(u.code + '_' + u.createName) + ' trong danh mục</div>' : '') +
          (l.warn ? '<div class="kh-warn kh-bwarn">' + esc(l.warn) + '</div>' : '') + (u.on && dup.indexOf(u.project) >= 0 ? '<div class="kh-warn kh-bwarn">Trùng dự án với nhóm sheet khác</div>' : '') + '</td>' +
        '<td class="center nowrap">' + (u.rev0 ? 'Rev00 + ' + esc(u.rev || 'mới') : esc(u.rev || '—')) + '</td>' +
        '<td class="num">' + d.n + (d.n !== u.rows.length ? '<small class="muted"> / ' + u.rows.length + '</small>' : '') + '</td>' +
        '<td class="num">' + (d.add || '<span class="muted">0</span>') + '</td><td class="num">' + (d.upd || '<span class="muted">0</span>') + '</td>' +
        '<td class="num">' + (d.same || '<span class="muted">0</span>') + '</td><td class="num' + (u.overwrite && d.removed.length ? ' kh-warn' : '') + '">' +
          (d.removed.length ? d.removed.length + (u.overwrite ? ' xóa' : '') : '<span class="muted">0</span>') + '</td>' +
        '<td class="center">' + (u.has && S.me.isManager ? '<input type="checkbox" data-change="kh-bimp-over" data-u="' + l.ui + '"' + (u.overwrite ? ' checked' : '') +
          ' aria-label="Ghi đè KHMS dự án ' + esc(u.project) + '">' : '<span class="muted">—</span>') + '</td></tr>';
    }).join('');
    var cur = st.open >= 0 ? st.units[st.open] : null;
    var detail = cur ? syncSection('Gói thầu: ' + esc(cur.name) + (cur.project ? ' → dự án ' + esc(projectLabel(cur.project)) : ''), cur.rows.length,
      khImpTable(st, cur.rows, cur.skip, cur._diff, { u: st.open, rev0: cur.rev0, rev: cur.rev, multiSheet: cur.sheets.length > 1 }), true) +
      khRemovedSection(cur._diff.removed, cur.overwrite) : '';
    var allOn = st.units.every(function (u) { return u.on || !u.project; });
    openModal(modalHead('Tải KHMS nhiều dự án: ' + esc(st.fileName)) + '<div class="modal-body"><div id="m-err"></div>' +
      '<div class="info-box">File có <b>' + st.sheets.length + '</b> sheet KHMS' +
        (st.ignored && st.ignored.length ? ' (bỏ qua: ' + esc(st.ignored.join(', ')) + ')' : '') + '. Mỗi sheet <b>"STT_Tên dự án"</b> là KHMS của dự án có số đầu tên sheet; ' +
        'các sheet cùng dự án (vd "76_La Pura" + "76.1_La Pura MEP") được gộp thành KHMS của dự án đó. Chỉ lấy các trường có trên web: tên gói, giá trị gói thầu, ' +
        'ngày kế hoạch (Rev00 + bản mới nhất) và ngày thực tế của mời thầu / chọn thầu / ký hợp đồng / bắt đầu thi công.</div>' +
      '<div class="meta-grid" style="margin-top:12px"><div><small>Dự án được chọn</small>' + tot.units + ' / ' + st.units.length + '</div>' +
        '<div><small>Gói thầu tải lên</small>' + tot.n + '</div><div><small>Thêm mới</small>' + tot.add + '</div><div><small>Cập nhật</small>' + tot.upd + '</div>' +
        '<div><small>Không đổi</small>' + tot.same + '</div><div><small>Không còn trong file</small>' + tot.removed + '</div></div>' +
      syncSection('Dự án trong file', st.units.length, '<div class="table-wrap"><table class="grid kh-imp kh-bimp"><thead><tr>' +
        '<th class="center"><input type="checkbox" data-change="kh-bimp-all"' + (allOn ? ' checked' : '') + ' aria-label="Chọn tất cả"></th>' +
        '<th>Sheet</th><th>Dự án trên web</th><th class="center">Kế hoạch</th><th class="num">Gói thầu</th><th class="num">Mới</th><th class="num">Cập nhật</th>' +
        '<th class="num">Không đổi</th><th class="num" title="Gói đang có trên web mà không còn trong file">Không còn</th>' +
        '<th class="center" title="Dự án đã có KHMS trên web: thay toàn bộ bằng dữ liệu trong file (kế hoạch gốc, kế hoạch, ngày thực tế, giá trị); gói không có trong file bị xóa. Trưởng phòng / admin.">Ghi đè</th></tr></thead><tbody>' + body + '</tbody></table></div>', true,
        (newCodes.length ? 'STT chưa có dự án trên web → <b>tự tạo dự án mới</b> theo tên sheet: ' + esc(newCodes.join(', ')) + ' (đổi ở cột "Dự án trên web" nếu muốn). ' : '') +
        (missingCodes.length ? 'Dự án chưa có trong danh mục (' + esc(missingCodes.join(', ')) + '): admin thêm ở Quản trị → Dự án rồi tải lại file, ' +
          'hoặc chọn dự án ở cột "Dự án trên web". ' : '') + 'Bấm "Xem gói" để xem / bỏ tích từng gói.') +
      detail + khProgOption(st, prog) +
      '<div class="info-box" style="margin-top:14px">Dự án tải lần đầu: ngày kế hoạch được lưu làm <b>kế hoạch gốc</b>. Dự án đã có KHMS: cập nhật <b>kế hoạch hiện hành</b>, ' +
        'giữ kế hoạch gốc, ngày thực tế và hồ sơ đã gắn trên web. Ngày thực tế trong file chỉ điền vào ô còn trống; ngày chọn thầu thực tế lấy theo ngày duyệt hồ sơ khi đã gắn hồ sơ. ' +
        'Tích <b>Ghi đè</b> (Trưởng phòng / admin) để thay toàn bộ KHMS đang có của dự án bằng dữ liệu trong file: kế hoạch gốc, kế hoạch, ngày thực tế, giá trị theo file; ' +
        'gói cùng tên giữ hồ sơ đã gắn và ghi chú; gói không có trong file bị xóa.</div>' +
      (tot.over.length ? '<div class="info-box kh-over-box">Ghi đè KHMS dự án: <b>' + esc(tot.over.join(', ')) + '</b> — dữ liệu đang có trên web của ' +
        (tot.over.length > 1 ? 'các dự án này' : 'dự án này') + ' sẽ được thay bằng dữ liệu trong file.</div>' : '') + '</div>' +
      '<div class="modal-foot"><button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" id="m-kimp-btn" style="min-height:42px;font-size:16px" data-act="kh-submit-batch">' + ic('check') +
        'Tải lên ' + tot.units + ' dự án (' + tot.n + ' gói thầu)</button></div>', 'xl');
  }
  function submitKhmsBatch(btn) {
    var st = S.khImport;
    var units = st.units.filter(function (u) { return u.on; });
    if (!units.length) { modalError('Chưa chọn dự án nào.'); return; }
    var seen = {}, plans = [];
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      if (!u.project) { modalError('Chọn dự án trên web cho sheet "' + u.name + '" (hoặc bỏ tích).'); return; }
      if (seen[u.project]) { modalError('Dự án ' + u.project + ' được chọn cho 2 nhóm sheet: "' + seen[u.project] + '" và "' + u.name + '".'); return; }
      seen[u.project] = u.name;
      var rows = khImpPayloadRows(st, u.rows, u.skip);
      if (!rows.length) { modalError('Sheet "' + u.name + '": chưa chọn gói thầu nào (hoặc bỏ tích dự án).'); return; }
      plans.push({ unit: u, data: { projectCode: u.project, rev: u.rev, rev0: u.rev0, rows: rows, overwrite: !!u.overwrite,
                                    createName: u.createName && u.project === u.code && !S.projMap[u.code] ? u.createName : '' } });
    }
    // Gửi nhiều lần (mỗi lần ≤ ~600 gói) để không vượt giới hạn dữ liệu của 1 lần gọi; mỗi lần ghi trọn vẹn các dự án trong lần đó.
    var chunks = [], curChunk = [], n = 0;
    plans.forEach(function (p) {
      if (curChunk.length && n + p.data.rows.length > 600) { chunks.push(curChunk); curChunk = []; n = 0; }
      curChunk.push(p); n += p.data.rows.length;
    });
    if (curChunk.length) chunks.push(curChunk);
    var sum = { projects: 0, added: 0, updated: 0, unchanged: 0, removed: 0, created: [] }, last = null, k = 0;
    var label = btn.lastChild, text0 = label ? label.textContent : '';
    busy(btn, true);
    var step = function () {
      if (k >= chunks.length) return Promise.resolve();
      var ch = chunks[k];
      if (label) label.textContent = 'Đang tải ' + (k + 1) + '/' + chunks.length + '…';
      return call('importPlans', { fileName: st.fileName, plans: ch.map(function (p) { return p.data; }) }).then(function (r) {
        last = r; k++;
        if (r.projects) { S.projects = r.projects; derive(); }
        (r.created || []).forEach(function (x) { sum.created.push(x.code + '_' + x.name); });
        ch.forEach(function (p) { p.unit.on = false; p.unit.doneUpload = true; });
        r.results.forEach(function (x) { sum.projects++; sum.added += x.added; sum.updated += x.updated; sum.unchanged += x.unchanged; sum.removed += x.removed; });
        return step();
      });
    };
    var report = function () {
      return 'Đã tải KHMS ' + sum.projects + ' dự án: ' + sum.added + ' gói mới, ' + sum.updated + ' cập nhật, ' + sum.unchanged + ' không đổi' +
        (sum.removed ? ', ' + sum.removed + ' không còn trong KHMS mới / xóa do ghi đè' : '') +
        (sum.created.length ? '; tạo dự án mới: ' + sum.created.join(', ') : '') + '.';
    };
    step().then(function () {
      closeModal();
      S.packages = last.packages; S.planUploads = last.uploads;
      S.khms.project = ''; S.khms.state = ''; S.khImport = null;
      derive(); render(); toast(report());
    }).catch(function (err) {
      if (last) { S.packages = last.packages; S.planUploads = last.uploads; derive(); render(); }
      if (err.code === 'AUTH') { handleErr(err); return; }
      if (last) { openKhmsBatch(); modalError(report().replace(/\.$/, '') + ' (đã lưu). Phần còn lại chưa lưu: ' + err.message); }
      else { busy(btn, false); if (label) label.textContent = text0; modalError(err.message); }
    });
  }

  /** 1 sheet danh sách gói thầu (bố cục như bảng trên web: 2 tầng tiêu đề, kế hoạch gốc / hiện hành, thực tế, tình trạng, hồ sơ). */
  function khExportSheet(wb, name, title, rows, withProject) {
    var ws = wb.addWorksheet(name, { views: [{ state: 'frozen', xSplit: withProject ? 3 : 2, ySplit: 4 }] });
    var pc = khPlanCols(rows);
    var head1 = ['STT', 'Hạng mục'].concat(withProject ? ['Dự án'] : [], ['Giá trị gói thầu']), lead = head1.length;
    var head2 = head1.map(function () { return ''; }), spans = [];
    MILESTONES.forEach(function (m) {
      var sub = (pc.two ? [pc.base, pc.cur] : [pc.cur]).concat(['Thực tế'], m.key === 'start' ? [] : ['Tình trạng']);
      spans.push(sub.length);
      sub.forEach(function (t, i) { head1.push(i ? '' : m.head); head2.push(t); });
    });
    head1.push('Hồ sơ phê duyệt', 'Tình trạng hồ sơ', 'Tên hồ sơ', 'Ghi chú');
    head2.push('', '', '', '');
    ws.addRow([title]);
    ws.addRow(['Xuất ngày ' + fmtDate(S.today) + ' bởi ' + S.me.displayName + ' · ' + rows.length + ' gói thầu']);
    ws.addRow(head1); ws.addRow(head2);
    var col = lead + 1;
    spans.forEach(function (w) { ws.mergeCells(3, col, 3, col + w - 1); col += w; });
    for (var c = 1; c <= head1.length; c++) if (!head2[c - 1]) ws.mergeCells(3, c, 4, c);
    var xd = function (iso) { return iso ? new Date(iso + 'T00:00:00Z') : null; };
    rows.forEach(function (p) {
      var line = [p.stt, p.name].concat(withProject ? [projectLabel(p.project)] : [], [p.value]);
      MILESTONES.forEach(function (m) {
        if (pc.two) line.push(xd(p[m.key + 'Plan0']));
        line.push(xd(p[m.key + 'Plan']), xd(p._actual[m.key]));
        if (m.key !== 'start') line.push(p._ms[m.key].code === 'none' ? '' : msText(p._ms[m.key]));
      });
      line.push(p._sub ? p._sub.id : p.submissionId, p._sub ? statusOf(p._sub.status).label : '', p._sub ? p._sub.title : '',
        (p.active ? '' : '[Không còn trong KHMS mới] ') + p.note);
      var row = ws.addRow(line);
      row.eachCell(function (cl) { if (cl.value instanceof Date) cl.numFmt = 'dd/mm/yyyy'; });
      row.getCell(lead).numFmt = '#,##0';
    });
    ws.getRow(1).font = { bold: true, size: 14, color: { argb: 'FF1E2B59' } };
    [3, 4].forEach(function (r) { khHeadStyle(ws.getRow(r), head1.length); });
    var widths = [7, 42].concat(withProject ? [26] : [], [18]);
    head2.slice(lead, head2.length - 4).forEach(function (t) { widths.push(t === 'Tình trạng' ? 18 : 12); });
    widths.push(14, 18, 50, 30);
    widths.forEach(function (w, i) { ws.getColumn(i + 1).width = w; });
    if (rows.length) ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4 + rows.length, column: head1.length } };
    return ws;
  }
  function khHeadStyle(row, n) {
    var bd = { style: 'thin', color: { argb: 'FFB0B8CC' } };
    for (var c = 1; c <= n; c++) {
      var cl = row.getCell(c);
      cl.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cl.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E2B59' } };
      cl.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cl.border = { top: bd, bottom: bd, left: bd, right: bd };
    }
  }
  function khDownload(wb, fileName, msg) {
    return wb.xlsx.writeBuffer().then(function (buf) {
      downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName);
      toast(msg);
    });
  }

  /** Tên sheet Excel: ≤ 31 ký tự, không có : \ / ? * [ ], không trùng. */
  function khSheetName(s, used) {
    var base = String(s).replace(/[:\\\/?*\[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 31) || 'Sheet', name = base, i = 2;
    while (used[name.toLowerCase()]) { var suf = ' (' + i++ + ')'; name = base.slice(0, 31 - suf.length) + suf; }
    used[name.toLowerCase()] = true;
    return name;
  }
  /**
   * Xuất KHMS tất cả dự án (theo người dùng: tài khoản haocq, thuync, thoaiht — KHMS_EXPORT_ALL_USERS_ ở Procurement.gs):

  function khmsExportAll(btn) {
    var by = {};
    S.packages.forEach(function (p) { if (p.active) (by[p.project] = by[p.project] || []).push(p); });
    var codes = Object.keys(by).sort(projectSort);
    if (!codes.length) { toast('Chưa có KHMS nào để xuất.', 'err'); return; }
    busy(btn, true); setLoading(1);

      var wb = new ExcelJS.Workbook(), used = {};
      var sum = wb.addWorksheet(khSheetName('Tổng hợp', used), { views: [{ state: 'frozen', ySplit: 3 }] });
      var total = codes.reduce(function (n, c) { return n + by[c].length; }, 0);
      sum.addRow(['KẾ HOẠCH MUA SẮM – TẤT CẢ DỰ ÁN']);
      sum.addRow(['Xuất ngày ' + fmtDate(S.today) + ' bởi ' + S.me.displayName + ' · ' + codes.length + ' dự án · ' + total + ' gói thầu']);
      var head = ['Dự án', 'Sheet', 'KHMS cập nhật', 'Rev', 'Gói thầu', 'Giá trị gói thầu', 'Đã chọn thầu', 'Trễ chọn thầu', 'Sắp đến hạn chọn thầu',
                  'Đã ký HĐ', 'Đã chọn thầu – chưa ký HĐ', 'Chưa gắn hồ sơ'];
      sum.addRow(head);
      khHeadStyle(sum.getRow(3), head.length);
      codes.forEach(function (c) {
        var rows = by[c].slice().sort(function (a, b) { return a.order - b.order; });
        var name = khSheetName(projectLabel(c), used);
        khExportSheet(wb, name, 'KẾ HOẠCH MUA SẮM – DỰ ÁN ' + projectLabel(c).toUpperCase(), rows, false);
        var st = khmsStats(rows), last = S.planLast[c];
        var r = sum.addRow([projectLabel(c), name, last && last.date ? new Date(last.date + 'T00:00:00Z') : null, last ? last.rev : '',
          st.n, st.value, st.done, st.late, st.soon, st.contract, st.waitContract, st.nolink]);
        r.getCell(2).value = { text: name, hyperlink: "#'" + name.replace(/'/g, "''") + "'!A1" };
        r.getCell(2).font = { color: { argb: 'FF2563EB' }, underline: true };
        r.getCell(3).numFmt = 'dd/mm/yyyy';
        r.getCell(6).numFmt = '#,##0';
      });
      var tot = sum.addRow(['Tổng cộng', '', null, '', { formula: 'SUM(E4:E' + (3 + codes.length) + ')' }, { formula: 'SUM(F4:F' + (3 + codes.length) + ')' }]
        .concat(['G', 'H', 'I', 'J', 'K', 'L'].map(function (L) { return { formula: 'SUM(' + L + '4:' + L + (3 + codes.length) + ')' }; })));
      tot.font = { bold: true }; tot.getCell(6).numFmt = '#,##0';
      sum.getRow(1).font = { bold: true, size: 14, color: { argb: 'FF1E2B59' } };
      [40, 30, 14, 9, 10, 20, 13, 13, 13, 11, 16, 13].forEach(function (w, i) { sum.getColumn(i + 1).width = w; });
      sum.autoFilter = { from: { row: 3, column: 1 }, to: { row: 3 + codes.length, column: head.length } };
      return khDownload(wb, 'KHMS-tat-ca-du-an-' + S.today + '.xlsx', 'Đã xuất KHMS ' + codes.length + ' dự án (mỗi dự án 1 sheet).');
    }).catch(function (err) {
      toast((err && err.message) || 'Không tạo được file Excel.', 'err');
    }).then(function () { busy(btn, false); setLoading(-1); });

    'kh-imp-all': function (el) {
      var t = khImpTarget(el);
      t.rows.forEach(function (r, i) { t.skip[i] = !el.checked; });
      keepModalScroll(openKhmsImport);
    },
    'kh-bimp-on': function (el) {
      S.khImport.units[+el.dataset.u].on = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-bimp-all': function (el) {
      S.khImport.units.forEach(function (u) { if (u.project) u.on = el.checked; });
      keepModalScroll(openKhmsImport);
    },
    'kh-bimp-over': function (el) {
      S.khImport.units[+el.dataset.u].overwrite = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-bimp-project': function (el) {
      var u = S.khImport.units[+el.dataset.u];
      u.project = el.value; u.on = !!el.value; keepModalScroll(openKhmsImport);
    }
  };
  Object.keys(CHANGE_ADD).forEach(function (k) { EXT.change[k] = CHANGE_ADD[k]; });

  var INPUT_ADD = {
    'date-mask': function (el, e) {
      if (e.inputType && e.inputType.indexOf('insert') === 0 && /^\d{2}$|^\d{2}\/\d{2}$/.test(el.value)) el.value += '/';
      if (/[\/\-.]{2}/.test(el.value)) el.value = el.value.replace(/([\/\-.])[\/\-.]+/g, '$1');
    },
    'kh-cell': function (el, e) {
      if (el.dataset.f !== 'note' && e.inputType && e.inputType.indexOf('insert') === 0 && /^\d{2}$|^\d{2}\/\d{2}$/.test(el.value)) el.value += '/';
      if (el.dataset.f !== 'note' && /[\/\-.]{2}/.test(el.value)) el.value = el.value.replace(/([\/\-.])[\/\-.]+/g, '$1');
      khEditStore(el);
    },
    'kh-q': function (el) {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { S.khms.q = el.value; S.scrollReset = { 'scroll-khms': true }; render(); }, 250);
    }
  };
  Object.keys(INPUT_ADD).forEach(function (k) { EXT.input[k] = INPUT_ADD[k]; });
})(window.APP);
</script>
