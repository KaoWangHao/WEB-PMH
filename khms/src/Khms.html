    el.classList.toggle('chg', el.value.replace(/\s+/g, ' ').trim() !== khInfoOf(c)[f]);
  }
  function saveKhInfo(btn) {
    var items = khInfChanged();
    if (!items.length) { modalError('Chưa có thay đổi nào.'); return; }
    busy(btn, true);
    call('updateProjectInfo', { items: items }).then(function (r) {
      khSetAssign(r.assign); closeModal(); S.khInf = null; render();
      toast('Đã lưu Giám đốc dự án / BOM cho ' + items.length + ' dự án.');
    }).catch(function (err) { busy(btn, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
  }

  /* =====================================================================
   * Trang "Thông tin dự án" (theo người dùng: "chức năng Thông tin dự án, trong đó có các thông tin mã số dự án, tên dự án, chuyên viên
   * phụ trách, GDDA và BOM phụ trách. Data hiện có lấy theo data trong KHMS và cho phép chuyên viên có thể tự cập nhật thêm dự án khi cần").
   * Mặc định: dự án có KHMS hoặc đã khai báo người phụ trách; tích "Tất cả dự án trong danh mục" để xem hết. Lưu: action saveKhmsProject.
   * ===================================================================== */
  S.khPi = { q: '', scope: '' }; // scope: '' tất cả dự án · 'khms' có KHMS · 'none' chưa có KHMS
  S.khAsgMeta = {};
  /** Mọi dự án trong danh mục (đang dùng, hoặc đã có KHMS / người phụ trách) + dự án có KHMS / khai báo mà danh mục chưa có; lọc theo phạm vi. */
  function khPiCodes(scope) {
    var by = khdByProject();
    var codes = (S.projects || []).filter(function (p) { return p.active || by[p.code] || khOwners(p.code).length || S.khInfo[p.code]; })
      .map(function (p) { return p.code; }).concat(Object.keys(by), Object.keys(S.khAssign), Object.keys(S.khInfo));
    scope = scope === undefined ? S.khPi.scope : scope;
    return codes.filter(function (c, i, a) { return a.indexOf(c) === i && (!scope || (scope === 'khms') === !!by[c]); }).sort(projectSort);
  }
  function khPiName(code) { var p = S.projMap[code]; return p ? p.name : ''; }
  function viewKhmsInfo() {
    var st = S.khPi, by = khdByProject(), q = norm(st.q).trim();
    var codes = khPiCodes();
    var rows = codes.filter(function (c) {
      var i = khInfoOf(c);
      return !q || norm(c + ' ' + khPiName(c) + ' ' + khOwnersText(c) + ' ' + i.director + ' ' + i.bom).indexOf(q) >= 0;
    });
    var miss = function (fn) { return codes.filter(fn).length; };
    var noOwner = miss(function (c) { return !khOwners(c).length; }), noDir = miss(function (c) { return !khInfoOf(c).director; }),
      noBom = miss(function (c) { return !khInfoOf(c).bom; });
    var params = '<div class="params kh-pi-params">' +
      '<div class="field"><div class="fbody"><label for="kh-pi-q">Tìm dự án / người phụ trách</label>' +
        '<input type="search" id="kh-pi-q" data-input="kh-pi-q" placeholder="Mã số, tên dự án, chuyên viên, GĐDA, BOM…" value="' + esc(st.q) + '"></div></div>' +
      '<div class="field"><div class="fbody"><label for="kh-pi-all">Phạm vi</label><select id="kh-pi-all" data-change="kh-pi-all">' +
        [['', 'Tất cả dự án'], ['khms', 'Dự án có KHMS'], ['none', 'Dự án chưa có KHMS']].map(function (o) {
          return '<option value="' + o[0] + '"' + (st.scope === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select></div></div></div>' +
      '<p class="muted kh-note"><b>' + fmtNum(codes.length) + '</b> dự án · chưa có chuyên viên phụ trách: <b>' + noOwner + '</b> · chưa có Giám đốc dự án: <b>' + noDir +
        '</b> · chưa có BOM: <b>' + noBom + '</b>. Bấm <b>Sửa</b> để cập nhật từng dự án, <b>Phân công chuyên viên</b> / <b>Khai báo GĐDA / BOM</b> để cập nhật nhiều dự án một lần; ' +
        '<b>Thêm dự án</b> khi dự án chưa có trên web.</p>';
    var tools = '<button class="secondary-btn" data-act="kh-asg-open">' + ic('user') + 'Phân công chuyên viên</button>' +
      '<button class="secondary-btn" data-act="kh-inf-open">' + ic('edit') + 'Khai báo GĐDA / BOM</button>' +
      '<button class="primary-btn" data-act="kh-pi-new">' + ic('plus') + 'Thêm dự án</button>';
    var body = rows.map(function (c) {
      var i = khInfoOf(c), meta = S.khAsgMeta[c], n = by[c] ? by[c].length : 0;
      var cell = function (v) { return v ? esc(v) : '<span class="muted">—</span>'; };
      return '<tr><td class="nowrap"><span class="proj-code">' + esc(c) + '</span></td>' +
        '<td class="title-cell">' + (khPiName(c) ? esc(khPiName(c)) : '<span class="muted">chưa có trong danh mục</span>') + '</td>' +
        '<td>' + (khOwners(c).length ? esc(khOwnersText(c)) : '<span class="muted">Chưa phân công</span>') + '</td>' +
        '<td>' + cell(i.director) + '</td><td>' + cell(i.bom) + '</td>' +
        '<td class="num">' + (n ? '<button class="link-btn" data-act="kh-dash-go" data-code="' + esc(c) + '" title="Xem KHMS chi tiết">' + fmtNum(n) + '</button>' : '<span class="muted">—</span>') + '</td>' +
        '<td class="nowrap"><button class="mini-btn" data-act="kh-pi-edit" data-code="' + esc(c) + '"' +
          (meta && meta.updatedAt ? ' title="Cập nhật ' + fmtDate(meta.updatedAt) + (meta.updatedBy ? ' bởi ' + esc(userName(meta.updatedBy)) : '') + '"' : '') + '>' + ic('edit') + 'Sửa</button></td></tr>';
    }).join('');
    var table = '<div class="table-wrap table-scroll" id="scroll-khpi"><table class="grid kh-pi-table"><thead><tr><th>Mã số</th><th>Tên dự án</th><th>Chuyên viên phụ trách</th>' +
      '<th>Giám đốc dự án</th><th>BOM phụ trách</th><th class="num">Gói KHMS</th><th></th></tr></thead><tbody>' +
      (body || '<tr><td colspan="7" class="empty">Không có dự án phù hợp.</td></tr>') + '</tbody></table></div>' +
      '<div class="pager"><span>Hiển thị <b>' + fmtNum(rows.length) + '</b> / ' + fmtNum(codes.length) + ' dự án</span></div>';
    return card('khms-info-params', 'Thông tin dự án', params, { tools: tools, collapsible: true }) +
      card('khms-info-list', 'Danh sách dự án', table);
  }

  /** Hộp thêm / sửa 1 dự án: mã số, tên, chuyên viên phụ trách, GĐ dự án, BOM. */
  function openKhProject(code) {
    var isNew = !code, mgr = S.me.isManager, info = code ? khInfoOf(code) : { director: '', bom: '' };
    var own = code ? khOwners(code) : (mgr ? [] : [S.me.username]);
    var names = {};
    Object.keys(S.khInfo).forEach(function (c) { KH_INFO_FIELDS.forEach(function (f) { var v = S.khInfo[c][f[0]]; if (v) names[v] = 1; }); });
    var users = khAssignUsers().map(function (u) {
      var on = own.indexOf(u.username) >= 0;
      return '<label class="check kh-pi-user"><input type="checkbox" name="m-pi-owner" value="' + esc(u.username) + '"' + (on ? ' checked' : '') + '>' +
        '<span>' + esc(u.displayName) + (u.initials ? ' <small class="muted">' + esc(u.initials) + '</small>' : '') + '</span></label>';
    }).join('');
    openModal(modalHead(isNew ? 'Thêm dự án' : 'Thông tin dự án ' + code) + '<div class="modal-body"><div id="m-err"></div>' +
      '<div class="kh-pi-form"><div class="form-row"><label for="m-pi-code">Mã số dự án</label>' +
        (isNew ? '<input type="text" id="m-pi-code" maxlength="20" autocomplete="off" placeholder="vd 296 hoặc 260.1">' +
          '<div class="help">Số STT của dự án (mã phụ dạng 260.1) — giống phần đầu tên thư mục / sheet "STT_TÊN DỰ ÁN".</div>'
          : '<input type="text" id="m-pi-code" value="' + esc(code) + '" disabled>') + '</div>' +
      '<div class="form-row"><label for="m-pi-name">Tên dự án</label><input type="text" id="m-pi-name" maxlength="150" value="' + esc(khPiName(code)) + '"' +
        (isNew || mgr ? '' : ' disabled') + ' placeholder="vd The Emerald Boulevard">' + (isNew || mgr ? '' : '<div class="help">Đổi tên dự án: Trưởng phòng / quản trị viên.</div>') + '</div></div>' +
      '<div class="form-row"><label>Chuyên viên phụ trách</label><div class="kh-pi-users">' + users + '</div>' +
        '</div>' +
      '<datalist id="kh-pi-names">' + Object.keys(names).sort().map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>' +
      '<div class="kh-pi-form even"><div class="form-row"><label for="m-pi-director">Giám đốc dự án</label><input type="text" id="m-pi-director" maxlength="150" list="kh-pi-names" value="' + esc(info.director) + '" placeholder="Nhập giám đốc dự án"></div>' +
      '<div class="form-row"><label for="m-pi-bom">BOM phụ trách</label><input type="text" id="m-pi-bom" maxlength="150" list="kh-pi-names" value="' + esc(info.bom) + '" placeholder="Nhập BOM phụ trách"></div></div></div>' +
      '<div class="modal-foot"><button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" style="min-height:42px;font-size:16px" data-act="kh-pi-save" data-code="' + esc(code || '') + '">' + ic('check') + (isNew ? 'Thêm dự án' : 'Lưu') + '</button></div>', true);
    var first = document.getElementById(isNew ? 'm-pi-code' : 'm-pi-director');
    if (first) first.focus();
  }
  function saveKhProject(btn) {
    var code = btn.dataset.code, isNew = !code;
    var val = function (id) { var el = document.getElementById(id); return el ? el.value.replace(/\s+/g, ' ').trim() : ''; };
    var payload = { isNew: isNew, code: isNew ? val('m-pi-code') : code, director: val('m-pi-director'), bom: val('m-pi-bom'),
      owners: Array.prototype.map.call(document.querySelectorAll('input[name="m-pi-owner"]:checked'), function (el) { return el.value; }) };
    if (isNew || S.me.isManager) payload.name = val('m-pi-name');
    if (!payload.code) { modalError('Vui lòng nhập mã số dự án.'); return; }
    if (isNew && !payload.name) { modalError('Vui lòng nhập tên dự án.'); return; }
    busy(btn, true);
    call('saveKhmsProject', payload).then(function (r) {
      S.projects = r.projects || S.projects; khSetAssign(r.assign); closeModal(); derive();
      var saved = r.projects && r.projects.filter(function (p) { return p.code === normalizeCodeClient(payload.code); })[0];
      if (saved && khPiCodes().indexOf(saved.code) < 0) S.khPi.scope = ''; // dự án mới chưa có KHMS → về phạm vi "Tất cả dự án"
      render();
      toast(isNew ? 'Đã thêm dự án ' + (saved ? saved.code + '_' + saved.name : payload.code) + '.' : 'Đã lưu thông tin dự án ' + code + '.');
    }).catch(function (err) { busy(btn, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
  }
  /** Mã dự án như server (normalizeProjectCode_): bỏ số 0 đầu, chữ viết hoa — chỉ để tìm lại dự án vừa thêm. */
  function normalizeCodeClient(c) {
    c = String(c || '').trim();
    var m = c.match(/^0*(\d{1,6})(?:\.(\d{1,3}))?$/);
    return m ? m[1] + (m[2] ? '.' + m[2] : '') : norm(c).toUpperCase().replace(/\s+/g, '');
  }

  /* =====================================================================
   * Dashboard báo cáo KHMS (theo người dùng: "dashboard báo cáo về tình trạng chọn thầu tổng thể nhiều dự án hoặc từng dự án,
   * có thể lựa chọn các dự án nào để tổng hợp số liệu"). Tính ở client từ S.packages (gói còn trong KHMS).
   * ===================================================================== */
  var KHD_STATES = [
    ['done', 'Đã chọn – đúng hạn'], ['lateDone', 'Đã chọn – trễ hạn'], ['late', 'Trễ hạn (chưa chọn)'],
    ['soon', 'Sắp đến hạn (≤ ' + KHMS_SOON_DAYS + ' ngày)'], ['todo', 'Chưa đến hạn'], ['none', 'Chưa có kế hoạch']
  ];
  var KHD_LISTS = [['late', 'Trễ chọn thầu'], ['soon', 'Sắp đến hạn chọn thầu'], ['wait', 'Đã chọn thầu – chưa ký HĐ'], ['all', 'Tất cả gói']];
  S.khDash = { sel: [], pick: false, pq: '', year: S.today ? +S.today.slice(0, 4) : new Date().getFullYear(), list: 'late' };
  try { S.khDash.sel = JSON.parse(A.store.get('hs_khdash_sel') || '[]') || []; } catch (e) { S.khDash.sel = []; }
  // Lọc theo người phụ trách ('' = tất cả, '__none' = chưa có): chuyên viên (username), GĐ dự án / BOM (tên không dấu).
  S.khDash.owner = A.store.get('hs_khdash_owner') || '';
  S.khDash.director = A.store.get('hs_khdash_director') || '';
  S.khDash.bom = A.store.get('hs_khdash_bom') || '';
  S.khDash.by = A.store.get('hs_khdash_by') || 'owner'; // thẻ "Tổng hợp theo người phụ trách" đang xem theo vai trò nào

  /** Dự án có KHMS → { code: [gói còn trong KHMS] }. */
  function khdByProject() {
    var by = {};
    S.packages.forEach(function (p) { if (p.active) (by[p.project] = by[p.project] || []).push(p); });
    return by;
  }
  /** Dự án đang tổng hợp: các dự án được chọn (còn KHMS); chưa chọn dự án nào = tất cả. */
  function khdCodes(by) {
    var all = Object.keys(by).sort(projectSort);
    var sel = S.khDash.sel.filter(function (c) { return by[c]; });
    var codes = sel.length ? all.filter(function (c) { return sel.indexOf(c) >= 0; }) : all, roles = false;
    ['owner', 'director', 'bom'].forEach(function (role) {
      var v = S.khDash[role];
      if (!v) return;
      roles = true;
      codes = codes.filter(function (c) { var ks = khRoleKeys(c, role); return v === '__none' ? !ks.length : ks.indexOf(v) >= 0; });
    });
    return { all: all, codes: codes, picked: sel.length > 0, roles: roles };
  }
  function khdSaveSel() { A.store.set('hs_khdash_sel', JSON.stringify(S.khDash.sel)); }
  function khdStats(list) {
    var st = khmsStats(list);
    st.ms = {}; st.valDone = 0;
    KHD_STATES.forEach(function (s) { st.ms[s[0]] = 0; });
    list.forEach(function (p) {
      var c = p._ms.select.code;
      st.ms[c]++;
      if (c === 'done' || c === 'lateDone') st.valDone += p.value || 0;
    });
    st.onTime = st.ms.done + st.ms.lateDone ? Math.round(st.ms.done * 100 / (st.ms.done + st.ms.lateDone)) : null;
    return st;
  }
  function pctOf(n, d) { return d ? Math.round(n * 100 / d) : 0; }

  function viewKhmsDash() {
    var by = khdByProject(), sc = khdCodes(by);
    var list = [];
    sc.codes.forEach(function (c) { list = list.concat(by[c]); });
    if (sc.all.length && !sc.codes.length) {
      return khdParamsCard(by, sc) + card('khd-overview', 'Tổng quan', '<div class="empty">Không có dự án nào khớp lựa chọn (dự án / chuyên viên / GĐ dự án / BOM).</div>');
    }
    if (!sc.all.length) {
      return card('khd-params', 'Dashboard báo cáo KHMS', '<div class="empty">Chưa có KHMS nào. Vào <b>KHMS chi tiết dự án</b> → <b>Tải KHMS (Excel)</b> để tải kế hoạch mua sắm.</div>');
    }
    return khdParamsCard(by, sc) + khdOverviewCard(list, sc) + khdChartsCard(by, sc, list) + khdPeopleCard(by, sc) + khdProjectsCard(by, sc) + khdListCard(list, sc);
  }

  function khdParamsCard(by, sc) {
    var d = S.khDash;
    var chips = sc.picked
      ? sc.codes.map(function (c) { return '<span class="khd-chip">' + esc(projectLabel(c)) + '<button data-act="kh-dash-unsel" data-code="' + esc(c) + '" aria-label="Bỏ ' + esc(c) + '">×</button></span>'; }).join('')
      : '<span class="muted">Tất cả dự án có KHMS (' + sc.all.length + ')</span>';
    var years = {};
    S.packages.forEach(function (p) { ['selectPlan', 'selectPlan0'].forEach(function (k) { if (p[k]) years[p[k].slice(0, 4)] = 1; }); if (p._actual && p._actual.select) years[p._actual.select.slice(0, 4)] = 1; });
    years[String(d.year)] = 1;
    var yearSel = '<div class="field khd-year"><div class="fbody"><label for="khd-year">Năm (biểu đồ tháng)</label><select id="khd-year" data-change="kh-dash-year">' +
      Object.keys(years).sort().map(function (y) { return '<option value="' + y + '"' + (+y === d.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select></div></div>';
    var picker = '';
    if (d.pick) {
      var q = norm(d.pq).trim();
      var opts = sc.all.filter(function (c) { return !q || norm(projectLabel(c)).indexOf(q) >= 0; }).map(function (c) {
        var on = S.khDash.sel.indexOf(c) >= 0;
        return '<label class="khd-opt' + (on ? ' on' : '') + '"><input type="checkbox" data-change="kh-dash-sel" data-code="' + esc(c) + '"' + (on ? ' checked' : '') + '>' +
          '<span>' + esc(projectLabel(c)) + '</span><small>' + by[c].length + ' gói</small></label>';
      }).join('');
      picker = '<div class="khd-picker"><div class="khd-picker-bar"><input type="search" id="khd-pq" data-input="kh-dash-q" placeholder="Tìm dự án…" value="' + esc(d.pq) + '">' +
        '<button class="secondary-btn" data-act="kh-dash-all">Chọn tất cả' + (q ? ' (đang lọc)' : '') + '</button><button class="secondary-btn" data-act="kh-dash-none">Bỏ chọn</button>' +
        '<button class="primary-btn" data-act="kh-dash-pick">Xong</button></div>' +
        '<div class="khd-opts">' + (opts || '<span class="muted">Không có dự án phù hợp.</span>') + '</div>' +
        '<p class="muted kh-note">Không chọn dự án nào = tổng hợp tất cả dự án có KHMS.</p></div>';
    }
    var body = '<div class="params khd-params"><div class="field khd-projects"><div class="fbody"><label>Dự án tổng hợp</label><div class="khd-chips">' + chips + '</div></div>' +
      '<button class="secondary-btn" data-act="kh-dash-pick">' + ic('box') + (d.pick ? 'Đóng' : 'Chọn dự án') + (sc.picked ? ' (' + sc.codes.length + '/' + sc.all.length + ')' : '') + '</button></div>' +
      yearSel + khdRoleSelect(sc, 'owner') + khdRoleSelect(sc, 'director') + khdRoleSelect(sc, 'bom') + '</div>' + picker;
    var tools = '<button class="secondary-btn" data-act="kh-asg-open">' + ic('user') + 'Phân công chuyên viên</button>' +
      '<button class="secondary-btn" data-act="nav" data-view="khms">' + ic('clipboard') + 'KHMS chi tiết</button>';
    return card('khd-params', 'Dashboard báo cáo KHMS', body, { tools: tools, collapsible: true });
  }

  /* ---------- Thống kê theo người phụ trách: chuyên viên phụ trách / Giám đốc dự án / BOM phụ trách ---------- */
  /** Tên trong ô GĐ dự án / BOM (chữ tự do, có thể nhiều người "A, B" / "A / B") → [{ key (không dấu), name }]. */
  function khSplitPeople(s) {
    return String(s || '').split(/\s*(?:[,;\/+&]|\bvà\b)\s*/i).map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean)
      .map(function (x) { return { key: norm(x), name: x }; });
  }
  var KHD_ROLES = [
    { key: 'owner', label: 'Chuyên viên phụ trách', head: 'Chuyên viên', all: 'Tất cả chuyên viên', none: 'Chưa phân công' },
    { key: 'director', label: 'Giám đốc dự án', head: 'Giám đốc dự án', all: 'Tất cả GĐ dự án', none: 'Chưa nhập GĐ dự án' },
    { key: 'bom', label: 'BOM phụ trách', head: 'BOM phụ trách', all: 'Tất cả BOM', none: 'Chưa nhập BOM' }
  ];
  function khdRole(key) { return KHD_ROLES.filter(function (r) { return r.key === key; })[0] || KHD_ROLES[0]; }
  /** Khóa người phụ trách của 1 dự án theo vai trò (chuyên viên: username; GĐ dự án / BOM: tên không dấu). */
  function khRoleKeys(code, role) {
    if (role === 'owner') return khOwners(code);
    return khSplitPeople(khInfoOf(code)[role]).map(function (p) { return p.key; });
  }
  /** Tên hiển thị: chuyên viên → họ tên; GĐ dự án / BOM → cách viết gặp nhiều nhất. */
  function khRoleName(role, key) {
    if (key === '__none') return khdRole(role).none;
    if (role === 'owner') return userName(key);
    var n = (S.khPeople && S.khPeople[role] && S.khPeople[role][key]) || {};
    var best = '', bn = 0;
    Object.keys(n).forEach(function (v) { if (n[v] > bn) { best = v; bn = n[v]; } });
    return best || key;
  }
  function khBuildPeople() {
    S.khPeople = { director: {}, bom: {} };
    Object.keys(S.khInfo).forEach(function (c) {
      ['director', 'bom'].forEach(function (role) {
        khSplitPeople(S.khInfo[c][role]).forEach(function (p) {
          var m = S.khPeople[role][p.key] || (S.khPeople[role][p.key] = {});
          m[p.name] = (m[p.name] || 0) + 1;
        });
      });
    });
  }
  /** Gom dự án theo người phụ trách (dự án nhiều người được tính cho từng người; không có → '__none'). */
  function khdGroups(by, codes, role) {
    var groups = {}, order = [];
    codes.forEach(function (c) {
      var ks = khRoleKeys(c, role);
      (ks.length ? ks : ['__none']).forEach(function (k) {
        if (!groups[k]) { groups[k] = { key: k, codes: [], list: [] }; order.push(k); }
        groups[k].codes.push(c); groups[k].list = groups[k].list.concat(by[c]);
      });
    });
    order.sort(function (a, b) { return (a === '__none') - (b === '__none') || groups[b].list.length - groups[a].list.length || (a < b ? -1 : 1); });
    return order.map(function (k) { var g = groups[k]; g.name = khRoleName(role, k); g.st = khdStats(g.list); return g; });
  }
  function khdRoleSelect(sc, role) {
    var r = khdRole(role), cnt = {}, none = 0, cur = S.khDash[role] || '';
    sc.all.forEach(function (c) { var ks = khRoleKeys(c, role); if (!ks.length) none++; ks.forEach(function (k) { cnt[k] = (cnt[k] || 0) + 1; }); });
    var keys = Object.keys(cnt).sort(function (a, b) { return String(khRoleName(role, a)).localeCompare(String(khRoleName(role, b)), 'vi'); });
    return '<div class="field khd-owner"><div class="fbody"><label for="khd-' + role + '">' + esc(r.label) + '</label>' +
      '<select id="khd-' + role + '" data-change="kh-dash-role" data-role="' + role + '"><option value="">' + esc(r.all) + '</option>' +
      keys.map(function (k) { return '<option value="' + esc(k) + '"' + (cur === k ? ' selected' : '') + '>' + esc(khRoleName(role, k)) + ' (' + cnt[k] + ' dự án)</option>'; }).join('') +
      (cur && cur !== '__none' && !cnt[cur] ? '<option value="' + esc(cur) + '" selected>' + esc(khRoleName(role, cur)) + ' (0 dự án)</option>' : '') +
      '<option value="__none"' + (cur === '__none' ? ' selected' : '') + '>' + esc(r.none) + ' (' + none + ' dự án)</option></select></div></div>';
  }
  /** Thẻ "Tổng hợp theo người phụ trách": chọn Chuyên viên / GĐ dự án / BOM; biểu đồ tình trạng chọn thầu + bảng; bấm tên để lọc. */
  function khdPeopleCard(by, sc) {
    var role = S.khDash.by || 'owner', r = khdRole(role);
    var gs = khdGroups(by, sc.codes, role);
    if (!gs.length) return '';
    var seg = '<div class="seg" role="group" aria-label="Thống kê theo">' + KHD_ROLES.map(function (x) {
      return '<button class="' + (x.key === role ? 'on' : '') + '" data-act="kh-dash-by" data-role="' + x.key + '">' + esc(x.label) + '</button>';
    }).join('') + '</div>';
    var chart = '';
    // Biểu đồ: bỏ nhóm "chưa có" (vẫn có trong bảng) để không lấn át các người phụ trách.
    var cg = gs.filter(function (g) { return g.key !== '__none'; });
    if (typeof Chart !== 'undefined' && cg.length) {
      var ds = KHD_STATES.map(function (s) {
        return { label: s[1], backgroundColor: MS_COLORS[s[0]], stack: 's', data: cg.map(function (g) { return g.st.ms[s[0]]; }) };
      });
      var h = Math.max(220, cg.length * 30 + 90);
      chart = A.chartBox('khd-ch-people', 'Tình trạng chọn thầu theo ' + r.label.toLowerCase() + ' (số gói)', h);
      S.pendingCharts.push({ id: 'khd-ch-people', config: A.barConfig(cg.map(function (g) { return g.name; }), ds, { horizontal: true, stacked: true, legend: true, unit: ' gói' }) });
    }
    var cur = S.khDash[role] || '';
    var rows = gs.map(function (g) {
      var st = g.st, pct = pctOf(st.done, st.n);
      var name = g.key === '__none' ? '<span class="muted">' + esc(g.name) + '</span>' : esc(g.name);
      return '<tr' + (cur && cur === g.key ? ' class="khd-row-on"' : '') + '><td><button class="link-btn" data-act="kh-dash-role" data-role="' + role + '" data-key="' + esc(g.key) + '">' + name + '</button>' +
        '<small class="khd-own-proj" title="' + esc(g.codes.map(function (c) { return projectLabel(c); }).join(', ')) + '">' +
          esc(g.codes.slice(0, 6).map(function (c) { return projectLabel(c); }).join(', ')) + (g.codes.length > 6 ? ' … +' + (g.codes.length - 6) + ' dự án' : '') + '</small></td>' +
        '<td class="num">' + g.codes.length + '</td><td class="num">' + fmtNum(st.n) + '</td><td class="num nowrap">' + (st.value ? fmtBil(st.value) : '—') + '</td>' +
        '<td class="num">' + fmtNum(st.done) + '</td><td><div class="khd-bar"><span style="width:' + pct + '%"></span></div><small>' + pct + '%</small></td>' +
        '<td class="num">' + (st.onTime == null ? '<span class="muted">—</span>' : st.onTime + '%') + '</td>' +
        '<td class="num' + (st.late ? ' bad' : '') + '">' + fmtNum(st.late) + '</td><td class="num">' + fmtNum(st.soon) + '</td>' +
        '<td class="num">' + fmtNum(st.contract) + '</td><td class="num">' + fmtNum(st.waitContract) + '</td></tr>';
    }).join('');
    var note = role === 'owner'
      ? 'Dự án nhiều chuyên viên được tính cho từng người. Phân công ở nút <b>Phân công chuyên viên</b>.'
      : 'Theo thông tin chuyên viên khai báo ở <b>Thông tin dự án</b> (KHMS chi tiết). Ô có nhiều tên ("A, B" / "A / B") được tính cho từng người; tên so không dấu, không phân biệt hoa/thường.';
    var tools = '<button class="secondary-btn" data-act="kh-dash-xlsx">' + ic('download') + 'Xuất báo cáo (Excel)</button>';
    return card('khd-people', 'Tổng hợp theo người phụ trách', '<div class="khd-list-bar">' + seg + '</div>' +
      (chart ? '<div class="charts khd-people-chart">' + chart + '</div>' : '') +
      '<div class="table-wrap"><table class="grid kh-sum khd-sum"><thead><tr><th>' + esc(r.head) + '</th>' +
      '<th class="num">Dự án</th><th class="num">Gói thầu</th><th class="num">Giá trị</th><th class="num">Đã chọn thầu</th><th>Tiến độ chọn thầu</th>' +
      '<th class="num">Đúng hạn</th><th class="num">Trễ chọn thầu</th><th class="num">Sắp đến hạn</th><th class="num">Đã ký HĐ</th><th class="num">Chờ ký HĐ</th></tr></thead><tbody>' +
      rows + '</tbody></table></div><p class="muted kh-note">' + note + ' Bấm tên để lọc dashboard.</p>', { tools: tools, collapsible: true });
  }
  /** Xuất báo cáo dashboard (theo bộ lọc đang chọn): Tổng hợp theo chuyên viên / GĐ dự án / BOM + danh sách dự án. */
  function khdExportXlsx(btn) {
    var by = khdByProject(), sc = khdCodes(by);
    if (!sc.codes.length) { toast('Không có dự án để xuất.', 'err'); return; }
    busy(btn, true); setLoading(1);
    loadExcelJs().then(function (ExcelJS) {
      var wb = new ExcelJS.Workbook();
      var head = ['Gói thầu', 'Giá trị gói thầu', 'Đã chọn thầu', '% đã chọn thầu', 'Chọn thầu đúng hạn (%)', 'Trễ chọn thầu', 'Sắp đến hạn chọn thầu', 'Đã ký HĐ', 'Đã chọn thầu – chờ ký HĐ'];
      var nums = function (st) { return [st.n, st.value, st.done, st.n ? st.done / st.n : null, st.onTime == null ? null : st.onTime / 100, st.late, st.soon, st.contract, st.waitContract]; };
      var fmt = function (row, from) { row.getCell(from + 1).numFmt = '#,##0'; row.getCell(from + 3).numFmt = '0%'; row.getCell(from + 4).numFmt = '0%'; };
      var filt = khdFilterText(sc);
      KHD_ROLES.forEach(function (r) {
        var ws = wb.addWorksheet('Theo ' + (r.key === 'owner' ? 'chuyên viên' : r.key === 'director' ? 'GĐ dự án' : 'BOM'), { views: [{ state: 'frozen', ySplit: 3 }] });
        ws.addRow(['KHMS – TỔNG HỢP THEO ' + r.label.toUpperCase()]);
        ws.addRow(['Xuất ngày ' + fmtDate(S.today) + ' bởi ' + S.me.displayName + ' · ' + filt]);
        var h = [r.head, 'Số dự án', 'Dự án'].concat(head);
        ws.addRow(h); khHeadStyle(ws.getRow(3), h.length);
        khdGroups(by, sc.codes, r.key).forEach(function (g) {
          fmt(ws.addRow([g.name, g.codes.length, g.codes.map(function (c) { return projectLabel(c); }).join(', ')].concat(nums(g.st))), 3);
        });
        ws.getRow(1).font = { bold: true, size: 14, color: { argb: 'FF1E2B59' } };
        [28, 10, 60, 10, 18, 12, 12, 14, 12, 14, 10, 16].forEach(function (w, i) { ws.getColumn(i + 1).width = w; });
        ws.getColumn(3).alignment = { wrapText: true, vertical: 'top' };
      });
      var wp = wb.addWorksheet('Theo dự án', { views: [{ state: 'frozen', ySplit: 3 }] });
      wp.addRow(['KHMS – TỔNG HỢP THEO DỰ ÁN']);
      wp.addRow(['Xuất ngày ' + fmtDate(S.today) + ' bởi ' + S.me.displayName + ' · ' + filt]);
      var hp = ['Dự án', 'Chuyên viên phụ trách', 'Giám đốc dự án', 'BOM phụ trách'].concat(head);
      wp.addRow(hp); khHeadStyle(wp.getRow(3), hp.length);
      sc.codes.forEach(function (c) {
        fmt(wp.addRow([projectLabel(c), khOwnersText(c), khInfoOf(c).director, khInfoOf(c).bom].concat(nums(khdStats(by[c])))), 4);
      });
      wp.getRow(1).font = { bold: true, size: 14, color: { argb: 'FF1E2B59' } };
      [40, 26, 24, 24, 10, 18, 12, 12, 14, 12, 14, 10, 16].forEach(function (w, i) { wp.getColumn(i + 1).width = w; });
      return khDownload(wb, 'Bao-cao-KHMS-theo-nguoi-phu-trach-' + S.today + '.xlsx', 'Đã xuất báo cáo KHMS theo người phụ trách.');
    }).catch(function (err) {
      toast((err && err.message) || 'Không tạo được file Excel.', 'err');
    }).then(function () { busy(btn, false); setLoading(-1); });
  }
  /** Mô tả bộ lọc đang chọn (tiêu đề tổng quan, file xuất). */
  function khdFilterText(sc) {
    var parts = [(sc.picked ? sc.codes.length + ' dự án được chọn' : sc.codes.length + ' dự án')];
    KHD_ROLES.forEach(function (r) { var v = S.khDash[r.key]; if (v) parts.push(r.label + ': ' + khRoleName(r.key, v)); });
    return parts.join(' · ');
  }

  function khdOverviewCard(list, sc) {
    var st = khdStats(list), d = S.khDash;
    var tile = function (key, color, label, n, note) {
      return '<button class="rep-kpi' + (key && d.list === key ? ' on' : '') + '" style="--c:' + color + '"' + (key ? ' data-act="kh-dash-list" data-list="' + key + '"' : ' data-act="kh-dash-list" data-list="all"') + '>' +
        '<span class="rk-l">' + esc(label) + '</span><b>' + n + '</b><span class="rk-n">' + esc(note) + '</span></button>';
    };
    var body = '<div class="rep-kpis">' +
      tile('', '#1E2B59', 'Gói thầu', fmtNum(st.n), sc.codes.length + ' dự án' + (st.value ? ' · ' + fmtBil(st.value) : '')) +
      tile('', MS_COLORS.done, 'Đã chọn thầu', fmtNum(st.done), pctOf(st.done, st.n) + '% số gói' + (st.value ? ' · ' + pctOf(st.valDone, st.value) + '% giá trị' : '')) +
      tile('', '#2B9E8F', 'Chọn thầu đúng hạn', st.onTime == null ? '—' : st.onTime + '%', st.ms.done + ' đúng hạn · ' + st.ms.lateDone + ' trễ') +
      tile('late', MS_COLORS.late, 'Trễ chọn thầu', fmtNum(st.late), 'chưa chọn, quá ngày kế hoạch') +
      tile('soon', MS_COLORS.soon, 'Sắp đến hạn', fmtNum(st.soon), 'chọn thầu trong ' + KHMS_SOON_DAYS + ' ngày tới') +
      tile('wait', '#2B4396', 'Đã ký hợp đồng', fmtNum(st.contract), st.waitContract + ' gói đã chọn thầu chờ ký') +
      '</div><p class="muted kh-note">Ngày chọn thầu thực tế = ngày duyệt hồ sơ gắn với gói (hoặc ngày nhập / từ file). Bấm ô để xem danh sách gói bên dưới.</p>';
    var scope = sc.picked || sc.roles ? khdFilterText(sc) : 'Tất cả dự án';
    return card('khd-overview', 'Tổng quan <span class="ov-period">' + esc(scope) + '</span>', body, { collapsible: true });
  }

  function khdDoughnut(labels, data, colors) {
    var total = data.reduce(function (a, b) { return a + b; }, 0);
    return {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderColor: '#fff', borderWidth: 2 }] },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { position: 'right', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, color: '#44506A',
            generateLabels: function (ch) {
              return ch.data.labels.map(function (l, i) {
                return { text: l + ': ' + fmtNum(data[i]) + ' (' + pctOf(data[i], total) + '%)', fillStyle: colors[i], strokeStyle: colors[i], pointStyle: 'circle', index: i, hidden: !ch.getDataVisibility(i) };
              });
            } } },
          tooltip: { backgroundColor: 'rgba(16, 26, 51, .92)', padding: 10, cornerRadius: 10,
            callbacks: { label: function (ctx) { return ' ' + ctx.label + ': ' + fmtNum(ctx.raw) + ' gói (' + pctOf(ctx.raw, total) + '%)'; } } }
        }
      }
    };
  }

  function khdChartsCard(by, sc, list) {
    if (typeof Chart === 'undefined') {
      return card('khd-charts', 'Biểu đồ', '<div class="empty">Không tải được thư viện biểu đồ (kiểm tra kết nối mạng).</div>', { collapsible: true });
    }
    var st = khdStats(list), boxes = [], d = S.khDash;
    var keys = KHD_STATES.map(function (s) { return s[0]; }), names = KHD_STATES.map(function (s) { return s[1]; });
    var colors = keys.map(function (k) { return MS_COLORS[k]; });
    // 1. Tình trạng chọn thầu
    if (st.n) {
      boxes.push(A.chartBox('khd-ch-state', 'Tình trạng chọn thầu (' + fmtNum(st.n) + ' gói)', 300));
      S.pendingCharts.push({ id: 'khd-ch-state', config: khdDoughnut(names, keys.map(function (k) { return st.ms[k]; }), colors) });
    } else boxes.push(A.emptyBox('Tình trạng chọn thầu', 'Không có gói thầu.'));
    // 2. Theo mốc: mời thầu / chọn thầu / ký HĐ / khởi công
    var msDs = keys.map(function (k, i) {
      return { label: names[i], backgroundColor: colors[i], stack: 's', data: MILESTONES.map(function (m) { return list.filter(function (p) { return p._ms[m.key].code === k; }).length; }) };
    });
    boxes.push(A.chartBox('khd-ch-ms', 'Tiến độ theo mốc', 300));
    S.pendingCharts.push({ id: 'khd-ch-ms', config: A.barConfig(MILESTONES.map(function (m) { return m.label; }), msDs, { horizontal: true, stacked: true, legend: true, unit: ' gói' }) });
    // 3. Chọn thầu theo tháng trong năm: số gói kế hoạch / thực tế + lũy kế
    var y = String(d.year), plan = [], act = [], cp = [], ca = [], sp = 0, sa = 0;
    for (var mth = 1; mth <= 12; mth++) {
      var key = y + '-' + ('0' + mth).slice(-2);
      var np = list.filter(function (p) { return p.selectPlan && p.selectPlan.slice(0, 7) === key; }).length;
      var na = list.filter(function (p) { return p._actual.select && p._actual.select.slice(0, 7) === key; }).length;
      plan.push(np); act.push(na); sp += np; sa += na;
      cp.push(sp); ca.push(key <= S.today.slice(0, 7) ? sa : null);
    }
    var mcfg = A.barConfig(['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'], [
      { label: 'Kế hoạch chọn thầu', data: plan, backgroundColor: '#9DB4E0', order: 2 },
      { label: 'Thực tế chọn thầu', data: act, backgroundColor: MS_COLORS.done, order: 2 }
    ], { legend: true, unit: ' gói' });
    // Lũy kế trong năm vẽ theo trục phải (để cột theo tháng không bị nhỏ).
    mcfg.data.datasets.push({ type: 'line', label: 'Lũy kế kế hoạch (trục phải)', data: cp, yAxisID: 'y1', borderColor: '#2B4396', backgroundColor: '#2B4396', borderDash: [6, 4], pointRadius: 2, tension: .25, order: 1 },
      { type: 'line', label: 'Lũy kế thực tế (trục phải)', data: ca, yAxisID: 'y1', borderColor: '#2E8B3E', backgroundColor: '#2E8B3E', pointRadius: 2, tension: .25, order: 1, spanGaps: false });
    mcfg.options.scales.y1 = { position: 'right', beginAtZero: true, grid: { display: false }, border: { display: false }, ticks: { precision: 0, color: '#76829B' } };
    boxes.push('<div class="khd-wide">' + A.chartBox('khd-ch-month', 'Chọn thầu theo tháng – năm ' + y + ' (kế hoạch hiện hành / thực tế)', 300) + '</div>');
    S.pendingCharts.push({ id: 'khd-ch-month', config: mcfg });
    // 4. Theo dự án (xếp chồng theo tình trạng chọn thầu)
    if (sc.codes.length > 1) {
      var codes = sc.codes.slice().sort(function (a, b) { return by[b].length - by[a].length; });
      var pds = keys.map(function (k, i) {
        return { label: names[i], backgroundColor: colors[i], stack: 's', data: codes.map(function (c) { return by[c].filter(function (p) { return p._ms.select.code === k; }).length; }) };
      });
      var h = Math.max(300, codes.length * 26 + 80);
      // Nhiều dự án: khung cuộn (biểu đồ giữ chiều cao đủ đọc từng dòng).
      boxes.push('<div class="khd-wide' + (h > 480 ? ' khd-tall' : '') + '">' + A.chartBox('khd-ch-proj', 'Tình trạng chọn thầu theo dự án (' + codes.length + ' dự án, số gói)', h) + '</div>');
      S.pendingCharts.push({ id: 'khd-ch-proj', config: A.barConfig(codes.map(function (c) { return projectLabel(c); }), pds, { horizontal: true, stacked: true, legend: true, unit: ' gói' }) });
    }
    return card('khd-charts', 'Biểu đồ', '<div class="charts khd-charts">' + boxes.join('') + '</div>', { collapsible: true });
  }

  function khdProjectsCard(by, sc) {
    var go = function (c, state, n, cls) {
      return n ? '<button class="link-btn' + (cls ? ' ' + cls : '') + '" data-act="kh-dash-go" data-code="' + esc(c) + '" data-state="' + state + '">' + fmtNum(n) + '</button>' : '<span class="muted">0</span>';
    };
    var tot = [];
    var rows = sc.codes.map(function (c) {
      var st = khdStats(by[c]), pct = pctOf(st.done, st.n), last = S.planLast[c];
      tot = tot.concat(by[c]);
      return '<tr><td><button class="link-btn" data-act="kh-dash-go" data-code="' + esc(c) + '" data-state="">' + projectCell(c) + '</button></td>' +
        '<td>' + khOwnersCell(c) + '</td><td>' + khInfoCell(c, 'director') + '</td><td>' + khInfoCell(c, 'bom') + '</td>' +

        '<td class="num">' + go(c, 'done', st.done) + '</td>' +

        '<td class="num">' + (st.onTime == null ? '<span class="muted">—</span>' : st.onTime + '%') + '</td>' +
        '<td class="num">' + go(c, 'late', st.late, 'bad') + '</td><td class="num">' + go(c, 'soon', st.soon, 'warn') + '</td>' +
        '<td class="num">' + go(c, 'contract', st.contract) + '</td><td class="num">' + go(c, 'wait-contract', st.waitContract) + '</td></tr>';
    }).join('');
    var t = khdStats(tot), tp = pctOf(t.done, t.n);

      '<td class="num">' + fmtNum(t.done) + '</td><td><div class="khd-bar"><span style="width:' + tp + '%"></span></div><small>' + tp + '%</small></td>' +
      '<td class="num">' + (t.onTime == null ? '—' : t.onTime + '%') + '</td><td class="num">' + fmtNum(t.late) + '</td><td class="num">' + fmtNum(t.soon) + '</td>' +
      '<td class="num">' + fmtNum(t.contract) + '</td><td class="num">' + fmtNum(t.waitContract) + '</td></tr></tfoot>' : '';
    return card('khd-projects', 'Tổng hợp theo dự án', '<div class="table-wrap"><table class="grid kh-sum khd-sum"><thead><tr><th>Dự án</th><th>Chuyên viên</th><th>GĐ dự án</th><th>BOM</th><th>KHMS cập nhật</th>' +
      '<th class="num">Gói thầu</th><th class="num">Giá trị</th><th class="num">Đã chọn thầu</th><th>Tiến độ chọn thầu</th><th class="num" title="Đã chọn thầu đúng hạn / tổng đã chọn">Đúng hạn</th>' +
      '<th class="num">Trễ chọn thầu</th><th class="num">Sắp đến hạn</th><th class="num">Đã ký HĐ</th><th class="num">Chờ ký HĐ</th></tr></thead><tbody>' + rows + '</tbody>' + foot + '</table></div>' +
      '<p class="muted kh-note">Bấm tên dự án / số để mở KHMS chi tiết của dự án (đã lọc theo tình trạng).</p>', { collapsible: true });
  }

  function khdListCard(list, sc) {
    var d = S.khDash, mode = d.list;
    var rows = list.filter(function (p) {
      var c = p._ms.select.code;
      if (mode === 'late') return c === 'late';
      if (mode === 'soon') return c === 'soon';
      if (mode === 'wait') return (c === 'done' || c === 'lateDone') && !p._actual.contract;
      return true;
    });
    rows.sort(function (a, b) {
      if (mode === 'late') return b._ms.select.days - a._ms.select.days;
      if (mode === 'soon') return a._ms.select.days - b._ms.select.days;
      return projectSort(a.project, b.project) || a.order - b.order;
    });
    var seg = '<div class="seg" role="group" aria-label="Danh sách">' + KHD_LISTS.map(function (l) {
      return '<button class="' + (mode === l[0] ? 'on' : '') + '" data-act="kh-dash-list" data-list="' + l[0] + '">' + l[1] + '</button>';
    }).join('') + '</div>';
    var body = rows.length ? '<div class="table-scroll" id="scroll-khd"><table class="grid"><thead><tr><th>Dự án</th><th>Gói thầu</th><th class="num">Giá trị</th>' +
      '<th>KH chọn thầu</th><th>Thực tế</th><th>Tình trạng chọn thầu</th><th>Ký HĐ</th><th>Hồ sơ</th></tr></thead><tbody>' +
      rows.map(function (p) {
        return '<tr><td>' + projectCell(p.project) + '</td><td class="title-cell"><button class="link-btn" data-act="kh-edit" data-id="' + esc(p.id) + '">' + esc(p.name) + '</button></td>' +
          '<td class="num nowrap">' + (p.value != null ? fmtMoney(p.value) : '—') + '</td><td class="nowrap">' + (p.selectPlan ? fmtDate(p.selectPlan) : '—') + '</td>' +
          '<td class="nowrap">' + (p._actual.select ? fmtDate(p._actual.select) : '—') + '</td><td>' + msBadge(p._ms.select) + '</td><td>' + msBadge(p._ms.contract) + '</td>' +
          '<td class="nowrap">' + (p._sub ? statusBadge(p._sub.status) + ' <span class="code">' + esc(p._sub.id) + '</span>' : '<span class="muted">Chưa gắn</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">Không có gói thầu.</div>';
    return card('khd-list', 'Danh sách gói thầu', '<div class="khd-list-bar">' + seg + '</div>' + body +
      '<div class="range-bar">' + fmtNum(rows.length) + ' gói thầu · ' + (sc.picked ? sc.codes.length + ' dự án được chọn' : 'tất cả dự án') + '</div>', { collapsible: true });
  }

  /* ---------- Gắn vào ứng dụng ---------- */
  EXT.data.push(function (d) { S.packages = d.packages || []; S.planUploads = d.planUploads || []; S.khExportAll = !!d.khmsExportAll; khSetAssign(d.khmsAssign);
    S.khSkip = {}; (d.khmsSkip || []).forEach(function (id) { S.khSkip[id] = true; }); });
  EXT.derive.push(khmsDerive);
  // Menu 2 cấp: Kế hoạch mua sắm → KHMS chi tiết dự án / Dashboard báo cáo KHMS.
  EXT.nav.push(function () {
    var pend = (S.khPendAll || []).length; // hồ sơ đã duyệt chờ xác nhận chọn thầu
    return { group: 'khms', icon: 'box', label: 'Kế hoạch mua sắm', count: pend, children: [
      { view: 'khms', icon: 'clipboard', label: 'KHMS chi tiết dự án', count: pend },
      { view: 'khms-dash', icon: 'chart', label: 'Dashboard báo cáo KHMS' }
    ] };
  });
  // "Thông tin dự án" ngang cấp với "Kế hoạch mua sắm" (theo người dùng: "để phần thông tin dự án ra cùng level với phần Kế hoạch mua sắm").
  EXT.nav.push(function () { return { view: 'khms-info', icon: 'briefcase', label: 'Thông tin dự án' }; });
  EXT.views.khms = viewKhms;
  EXT.views['khms-dash'] = viewKhmsDash;
  EXT.views['khms-info'] = viewKhmsInfo;
  EXT.subInfo.push(subPackageInfo);
  EXT.busy.push(function () { return !!S.khEdit; }); // không tự làm mới 3 phút khi đang sửa bảng
  EXT.help.push('<li><b>Kế hoạch mua sắm</b>: bấm <b>Tải KHMS (Excel)</b> và chọn file KHMS của dự án (cột STT, Hạng mục, Giá trị gói thầu, các nhóm Ngày mời thầu / chọn thầu / ký kết hợp đồng / bắt đầu thi công) — web đọc ngày kế hoạch. ' +
        'Mỗi gói thầu gắn với 1 hồ sơ phê duyệt (web gợi ý theo tên hồ sơ cùng dự án, bấm <b>Xác nhận</b>). Khi hồ sơ được duyệt, KHMS hiện thanh <b>"N gói thầu đã hoàn thành chọn thầu"</b>: ' +
        'bấm để xem hồ sơ đã duyệt ứng với gói thầu nào, đổi gói nếu chưa đúng (hồ sơ chưa tìm thấy gói thì tự chọn gói; không muốn đồng bộ thì chọn <b>Bỏ qua</b>) rồi <b>Xác nhận</b> — ' +
        'ngày duyệt mới được ghi là <b>ngày chọn thầu thực tế</b>. Hồ sơ đã bỏ qua xem / khôi phục ở dòng "… đã chọn Bỏ qua". ' +
        'Ngày <b>kế hoạch</b> và ngày mời thầu, ký hợp đồng, khởi công <b>thực tế</b>: bấm <b>Cập nhật bảng</b> để nhập cho cả bảng rồi <b>Lưu thay đổi</b> (hoặc bấm tên gói để sửa 1 gói). Tải lại KHMS (Rev mới): cập nhật kế hoạch, giữ kế hoạch gốc, ngày thực tế và hồ sơ đã gắn. ' +
        'File tổng hợp nhiều sheet đặt tên <b>"STT_Tên dự án"</b> (vd KHMS cả phòng) → web tải <b>nhiều dự án một lần</b>, mỗi sheet vào dự án theo số đầu tên sheet. ' +
        '<b>Thông tin dự án</b> (mục riêng trên menu): mọi dự án (cả dự án chưa có KHMS) với mã số, tên, chuyên viên phụ trách, Giám đốc dự án, BOM — bấm <b>Sửa</b> để cập nhật 1 dự án, ' +
        '<b>Phân công chuyên viên</b> / <b>Khai báo GĐDA / BOM</b> để cập nhật nhiều dự án, <b>Thêm dự án</b> khi dự án chưa có trên web. ' +
        '<b>Dashboard báo cáo KHMS</b>: bấm <b>Chọn dự án</b> để tổng hợp 1, vài hoặc tất cả dự án — tình trạng chọn thầu, tiến độ theo mốc, chọn thầu theo tháng, bảng theo dự án, danh sách gói trễ / sắp đến hạn.</li>');

  var ACTIONS_ADD = {
    'kh-upload': function () { khmsUpload(); },
    'kh-export': function (el) { khmsExport(el); },
    'kh-export-all': function (el) { khmsExportAll(el); },
    'kh-asg-open': function (el) { openKhAssign(el.dataset.code || ''); },
    'kh-inf-open': function (el) { openKhInfo(el.dataset.code || ''); },
    'kh-inf-save': function (el) { saveKhInfo(el); },
    'kh-pi-new': function () { openKhProject(''); },
    'kh-pend-open': function (el) { openKhPending(el.dataset.id || ''); },
    'kh-pend-skipped-open': function () { openKhPending('', true); },
    'kh-pend-save': function (el) { saveKhPending(el); },
    'kh-pi-edit': function (el) { openKhProject(el.dataset.code); },
    'kh-pi-save': function (el) { saveKhProject(el); },
    'kh-pi-page': function () { S.view = 'khms-info'; render(); window.scrollTo(0, 0); },
    'kh-asg-save': function (el) { saveKhAssign(el); },
    'kh-dash-role': function (el) {
      var role = el.dataset.role, v = el.dataset.key === S.khDash[role] ? '' : el.dataset.key;
      S.khDash[role] = v; A.store.set('hs_khdash_' + role, v); render();
    },
    'kh-dash-by': function (el) { S.khDash.by = el.dataset.role; A.store.set('hs_khdash_by', el.dataset.role); render(); },
    'kh-dash-xlsx': function (el) { khdExportXlsx(el); },
    'kh-dash-pick': function () { S.khDash.pick = !S.khDash.pick; render(); },
    'kh-dash-all': function () {
      var by = khdByProject(), q = norm(S.khDash.pq).trim();
      Object.keys(by).forEach(function (c) { if ((!q || norm(projectLabel(c)).indexOf(q) >= 0) && S.khDash.sel.indexOf(c) < 0) S.khDash.sel.push(c); });
      khdSaveSel(); render();
    },
    'kh-dash-none': function () { S.khDash.sel = []; khdSaveSel(); render(); },
    'kh-dash-unsel': function (el) { S.khDash.sel = S.khDash.sel.filter(function (c) { return c !== el.dataset.code; }); khdSaveSel(); render(); },
    'kh-dash-list': function (el) { S.khDash.list = el.dataset.list; S.scrollReset = { 'scroll-khd': true }; render(); },
    'kh-dash-go': function (el) {
      S.view = 'khms'; S.khms.project = el.dataset.code; S.khms.state = el.dataset.state || ''; S.khms.q = '';
      S.scrollReset = { 'scroll-khms': true }; render(); window.scrollTo(0, 0);
    },
    'kh-state': function (el) { S.khms.state = el.dataset.state; S.scrollReset = { 'scroll-khms': true }; render(); },
    'kh-pick-project': function (el) {
      S.khms.project = el.dataset.code; S.khms.state = el.dataset.state || '';
      S.scrollReset = { 'scroll-khms': true }; render(); window.scrollTo(0, 0);
    },
    'kh-edit': function (el) { openPackage(el.dataset.id); },
    'kh-save': function (el) {
      var payload = { id: el.dataset.id, note: document.getElementById('m-knote').value, submissionId: document.getElementById('m-ksub').value };
      var pk = S.packages.filter(function (x) { return x.id === el.dataset.id; })[0] || {};
      for (var j = 0; j < MILESTONES.length; j++) {
        var mk = MILESTONES[j].key, pin = document.getElementById('m-kp-' + mk), pin0 = document.getElementById('m-kp0-' + mk);
        var piso = pin ? parseDmy(pin.value) : undefined, piso0 = pin0 ? parseDmy(pin0.value) : undefined;
        if (piso === null || piso0 === null) { modalError('Ngày ' + MILESTONES[j].label.toLowerCase() + ' kế hoạch không hợp lệ. Nhập dạng dd/mm/yyyy.'); (piso === null ? pin : pin0).focus(); return; }
        if (pin && piso !== (pk[mk + 'Plan'] || '')) {
          payload[mk + 'Plan'] = piso;
          // Chỉ 1 ngày kế hoạch (gốc = hiện hành): sửa cả kế hoạch gốc.
          if (!pin0 && pk[mk + 'Plan0'] && pk[mk + 'Plan0'] === pk[mk + 'Plan']) payload[mk + 'Plan0'] = piso;
        }
        if (pin0 && piso0 !== (pk[mk + 'Plan0'] || '')) payload[mk + 'Plan0'] = piso0;
      }
      for (var i = 0; i < MILESTONES.length; i++) {
        var m = MILESTONES[i], inp = document.getElementById('m-ka-' + m.key);
        if (!inp) continue;
        var iso = parseDmy(inp.value);
        if (iso === null) { modalError('Ngày ' + m.label.toLowerCase() + ' thực tế không hợp lệ. Nhập dạng dd/mm/yyyy.'); inp.focus(); return; }
        if (iso > S.today) { modalError('Ngày ' + m.label.toLowerCase() + ' thực tế không được sau hôm nay.'); inp.focus(); return; }
        payload[m.key + 'Actual'] = iso;
      }
      busy(el, true);
      call('updatePackage', payload).then(function (r) { closeModal(); applyPackages(r.packages); toast('Đã cập nhật gói thầu.'); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'kh-edit-start': function () { S.khEdit = { d: {}, bad: {} }; render(); },
    'kh-edit-cancel': function () {
      var n = khEditCollect().items.length;
      if (n && !el_confirmed('kh-edit-cancel')) { toast('Còn ' + n + ' gói đã sửa chưa lưu — bấm Hủy lần nữa để bỏ các thay đổi.', 'err'); return; }
      S.khEdit = null; render();
    },
    'kh-edit-save': function (el) { khEditSave(el); },
    'kh-fill-sugg': function () {
      (S.lastKhRows || []).forEach(function (p) {
        var s = S.khSugg[p.id];
        if (s && !khEditVal(p, 'submissionId')) (S.khEdit.d[p.id] = S.khEdit.d[p.id] || {}).submissionId = s.id;
      });
      render();
    },
    'kh-confirm': function (el) { linkSuggestions([{ id: el.dataset.id, submissionId: el.dataset.sub }], el); },
    'kh-confirm-all': function (el) {
      linkSuggestions((S.lastKhRows || []).filter(function (p) { return S.khSugg[p.id]; })
        .map(function (p) { return { id: p.id, submissionId: S.khSugg[p.id].id }; }), el);
    },
    'kh-delete-plan': function (el) {
      if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Bấm lần nữa để xóa toàn bộ KHMS dự án ' + el.dataset.code; return; }
      busy(el, true);
      call('deletePlan', { projectCode: el.dataset.code }).then(function (r) {
        S.packages = r.packages; S.planUploads = r.uploads; S.khms.project = ''; S.khms.state = '';
        derive(); render(); toast('Đã xóa KHMS dự án ' + el.dataset.code + '.');
      }).catch(function (err) { busy(el, false); handleErr(err); });
    },
    'kh-submit-import': function (el) { submitKhmsImport(el); },
    'kh-submit-batch': function (el) { submitKhmsBatch(el); },
    'kh-bimp-open': function (el) {
      var u = +el.dataset.u;
      S.khImport.open = S.khImport.open === u ? -1 : u; keepModalScroll(openKhmsImport);
    }
  };
  Object.keys(ACTIONS_ADD).forEach(function (k) { A.ACTIONS[k] = ACTIONS_ADD[k]; });

  var CHANGE_ADD = {
    'kh-cell': function (el) {
      khEditStore(el);
    },
    'kh-project': function (el) {
      S.khms.project = el.value; S.scrollReset = { 'scroll-khms': true }; render();
    },
    'kh-state': function (el) {
      S.khms.state = el.value; S.scrollReset = { 'scroll-khms': true }; render();
    },
    'kh-dash-sel': function (el) {
      var c = el.dataset.code, sel = S.khDash.sel.filter(function (x) { return x !== c; });
      if (el.checked) sel.push(c);
      S.khDash.sel = sel; khdSaveSel(); render();
    },
    'kh-dash-year': function (el) { S.khDash.year = +el.value; render(); },
    'kh-dash-role': function (el) { S.khDash[el.dataset.role] = el.value; A.store.set('hs_khdash_' + el.dataset.role, el.value); render(); },
    'kh-asg': function (el) {
      var d = S.khAsg.d, c = el.dataset.code, u = el.dataset.user;
      d[c] = (d[c] || []).filter(function (x) { return x !== u; });
      if (el.checked) d[c].push(u);
      keepModalScroll(renderKhAssign);
    },
    'kh-asg-all': function (el) { S.khAsg.all = el.checked; keepModalScroll(renderKhAssign); },
    'kh-inf-all': function (el) { S.khInf.all = el.checked; keepModalScroll(renderKhInfo); },
    'kh-pi-all': function (el) { S.khPi.scope = el.value; render(); },
    'kh-pend-on': function (el) { S.khPend.rows[+el.dataset.i].on = el.checked; keepModalScroll(renderKhPending); },
    'kh-pend-all': function (el) { S.khPend.rows.forEach(function (r) { r.on = el.checked && !!r.target && r.kind !== 'skipped'; }); keepModalScroll(renderKhPending); },
    'kh-pend-target': function (el) { var r = S.khPend.rows[+el.dataset.i]; r.target = el.value; r.on = !!el.value; keepModalScroll(renderKhPending); },
    'kh-pend-skipped': function (el) { openKhPending(S.khPend.focus, el.checked); },
    'kh-imp-project': function (el) {
      S.khImport.project = el.value; keepModalScroll(openKhmsImport);
    },
    'kh-imp-sheet': function (el) {
      S.khImport.sheet = +el.value; S.khImport.skip = {};
      S.khImport.sheets[S.khImport.sheet].rows.forEach(function (r, i) { if (r.na) S.khImport.skip[i] = true; });
      openKhmsImport();
    },
    'kh-imp-progress': function (el) {
      S.khImport.useProgress = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-imp-row': function (el) {
      khImpTarget(el).skip[el.dataset.i] = !el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-imp-all': function (el) {
      var t = khImpTarget(el);
      t.rows.forEach(function (r, i) { t.skip[i] = !el.checked; });
      keepModalScroll(openKhmsImport);
    },
    'kh-bimp-on': function (el) {
      S.khImport.units[+el.dataset.u].on = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-bimp-all': function (el) {
      S.khImport.units.forEach(function (u) { if (u.project) u.on = el.checked; });
      keepModalScroll(openKhmsImport);
    },
    'kh-imp-orphan': function (el) {
      S.khImport.orphans[+el.dataset.i].on = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-imp-asg': function (el) {
      S.khImport.assign.list[+el.dataset.i].on = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-bimp-over': function (el) {
      S.khImport.units[+el.dataset.u].overwrite = el.checked; keepModalScroll(openKhmsImport);
    },
    'kh-bimp-project': function (el) {
      var u = S.khImport.units[+el.dataset.u];
      u.project = el.value; u.on = !!el.value; keepModalScroll(openKhmsImport);
    }
  };
  Object.keys(CHANGE_ADD).forEach(function (k) { EXT.change[k] = CHANGE_ADD[k]; });

  var INPUT_ADD = {
    'date-mask': function (el, e) {
      if (e.inputType && e.inputType.indexOf('insert') === 0 && /^\d{2}$|^\d{2}\/\d{2}$/.test(el.value)) el.value += '/';
      if (/[\/\-.]{2}/.test(el.value)) el.value = el.value.replace(/([\/\-.])[\/\-.]+/g, '$1');
    },
    'kh-cell': function (el, e) {
      if (el.dataset.f !== 'note' && e.inputType && e.inputType.indexOf('insert') === 0 && /^\d{2}$|^\d{2}\/\d{2}$/.test(el.value)) el.value += '/';
      if (el.dataset.f !== 'note' && /[\/\-.]{2}/.test(el.value)) el.value = el.value.replace(/([\/\-.])[\/\-.]+/g, '$1');
      khEditStore(el);
    },
    'kh-dash-q': function (el) { S.khDash.pq = el.value; render(); },
    'kh-asg-q': function (el) { S.khAsg.q = el.value; keepModalScroll(renderKhAssign); },
    'kh-inf-q': function (el) { S.khInf.q = el.value; keepModalScroll(renderKhInfo); },
    'kh-pi-q': function (el) { S.khPi.q = el.value; render(); },
    'kh-inf': function (el) {
      var c = el.dataset.code;
      (S.khInf.d[c] = S.khInf.d[c] || {})[el.dataset.f] = el.value;
      khInfMark(el);
      var b = document.querySelector('#m-inf-btn span');
      if (b) b.textContent = khInfBtnText();
    },
    'kh-q': function (el) {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { S.khms.q = el.value; S.scrollReset = { 'scroll-khms': true }; render(); }, 250);
    }
  };
  Object.keys(INPUT_ADD).forEach(function (k) { EXT.input[k] = INPUT_ADD[k]; });
})(window.APP);
</script>
