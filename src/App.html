<script>
(function () {
  'use strict';

  /* =====================================================================
   * Icons (nét mảnh, kiểu ERP)
   * ===================================================================== */
  var ICONS = {
    user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/>',
    key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/>',
    check: '<path d="M4 12.5 9.5 18 20 6"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
    help: '<path d="M8.5 8.5a3.5 3.5 0 1 1 4.9 3.2c-.9.4-1.4 1.2-1.4 2.1V15"/><path d="M12 19.5h.01"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    chevDown: '<path d="m6 9 6 6 6-6"/>',
    chevRight: '<path d="m9 6 6 6-6 6"/>',
    chevLeft: '<path d="m15 6-6 6 6 6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
    folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>',
    clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
    chart: '<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',
    gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
    report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/>',
    minus: '<path d="M5 12h14"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
    shrink: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
    table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
  };
  function ic(name, cls) {
    return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  /* =====================================================================
   * Trạng thái ứng dụng
   * ===================================================================== */
  var S = {
    token: null, me: null, cfg: null, today: '',
    users: [], subs: [], hist: [],
    view: 'home', collapsed: window.innerWidth <= 1000, open: null,
    filters: {}, sorts: {}, groupBy: {}, cardState: {}, lastRows: {},
    adminUsers: null, charts: []
  };
  /**
   * Điểm gắn chức năng mở rộng (vd Kế hoạch mua sắm ở thư mục khms/, chỉ có trên bản chạy thử /dev): file mở rộng nạp sau App.html,
   * dùng window.APP (khai báo cuối file) để thêm menu, trang, action, xử lý sự kiện, dữ liệu. Không có file mở rộng thì các danh sách rỗng.
   */
  var EXT = { nav: [], views: {}, change: {}, input: {}, derive: [], data: [], subInfo: [], help: [], busy: [] };
  var root = document.getElementById('root');
  var modalRoot = document.getElementById('modal-root');

  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  };

  /* =====================================================================
   * Gọi backend
   * ===================================================================== */
  var pending = 0;
  function setLoading(delta) {
    pending = Math.max(0, pending + delta);
    document.getElementById('loading').hidden = pending === 0;
  }
  function call(action, payload) {
    setLoading(1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) {
          setLoading(-1);
          if (r && r.ok) return resolve(r.data);
          var err = new Error((r && r.error) || 'Đã xảy ra lỗi.');
          err.code = r && r.code;
          reject(err);
        })
        .withFailureHandler(function (e) {
          setLoading(-1);
          reject(new Error('Không kết nối được máy chủ. ' + ((e && e.message) || '')));
        })
        .api(action, S.token, payload || null);
    });
  }
  function handleErr(err) {
    if (err && err.code === 'AUTH') { clearSession(); renderLogin({ type: 'err', text: err.message }); return; }
    if (err && err.code === 'MUST_CHANGE_PASSWORD') { renderForceChange(); return; }
    toast((err && err.message) || 'Đã xảy ra lỗi.', 'err');
  }

  /* =====================================================================
   * Tiện ích
   * ===================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function dayNum(iso) {
    var p = iso.split('-');
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function numToIso(n) {
    var d = new Date(n * 86400000);
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }
  function diffDays(a, b) { return (a && b) ? dayNum(b) - dayNum(a) : 0; }
  function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
  function fmt1(n) { return (Math.round(n * 10) / 10).toLocaleString('vi-VN'); }
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  function statusOf(code) { return S.statusMap[code] || { code: code, label: code || '—', short: code || '—', color: '#9AA0AE' }; }
  function posLabel(code) {
    var p = (S.cfg.positions || []).filter(function (x) { return x.code === code; })[0];
    return p ? p.label : code;
  }
  function userName(u) { return S.userMap[u] ? S.userMap[u].displayName : u; }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts.length > 1 ? parts[parts.length - 2][0] : '') + parts[parts.length - 1][0]).toUpperCase();
  }
  function canEdit(sub) { return S.me.isManager || sub.owner === S.me.username; }
  function isManagerPos() { return (S.cfg.positions || []).some(function (p) { return p.code === S.me.position && p.manager; }); }
  function statusBadge(code) {
    var st = statusOf(code);
    return '<span class="status-badge"><span class="dot" style="background:' + st.color + '"></span>' + esc(st.label) + '</span>';
  }
  /** Loại hồ sơ theo tên: có cụm "xin ý kiến" (không dấu, bỏ ngoặc/gạch) → Báo cáo (BC), còn lại → Trình duyệt (TD). */
  function docTypeOf(title) {
    var t = ' ' + norm(title).replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
    var kws = S.cfg.reportKeywords || [];
    for (var i = 0; i < kws.length; i++) if (t.indexOf(' ' + kws[i] + ' ') >= 0) return 'BC';
    return 'TD';
  }
  /** Số dự án ở đầu tên hồ sơ: "231_TDTower…" → ['231'], "267&285_EBV…" → ['267','285'], "273. Vin…" → ['273']. */
  function projectCodesOf(title) {
    var t = String(title || '').trim();
    var m = t.match(/^(\d{1,6}(?:\s*[&+,]\s*\d{1,6})*)(?=[\s_.\-]|$)/);
    if (!m) {
      var up = t.toUpperCase();
      var codes = S.letterCodes || [];
      for (var i = 0; i < codes.length; i++) {
        if (up.indexOf(codes[i]) === 0 && /^([\s_.\-]|$)/.test(up.charAt(codes[i].length))) return [codes[i]];
      }
      return [];
    }
    var out = [];
    m[1].split(/\s*[&+,]\s*/).forEach(function (c) { c = String(parseInt(c, 10)); if (out.indexOf(c) < 0) out.push(c); });
    return out;
  }
  function matchProjects(s, list) {
    if (!list || !list.length) return true;
    if (!s._projects.length) return list.indexOf('-') >= 0;
    return s._projects.some(function (c) { return list.indexOf(c) >= 0; });
  }
  function projectSort(a, b) {
    if (a === '-' || b === '-') return a === b ? 0 : a === '-' ? 1 : -1;
    var na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
    if (na && nb) return Number(a) - Number(b);
    if (na !== nb) return na ? -1 : 1;
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function projectLabel(code) {
    if (code === '-') return 'Chưa gắn dự án';
    var p = S.projMap[code];
    return code + '_' + (p ? p.name : '(chưa có trong danh mục)');
  }
  function projectCell(code) {
    if (code === '-') return '<span class="muted">Chưa gắn dự án</span>';
    var p = S.projMap[code];
    return '<span class="proj-code">' + esc(code) + '</span>' + (p ? esc(p.name) : '<span class="muted">chưa có trong danh mục</span>');
  }
  function projectsCell(s) {
    return s._projects.length ? s._projects.map(projectCell).join('<br>') : '<span class="muted">—</span>';
  }
  function projectOptions() {
    var seen = {};
    S.subs.forEach(function (s) { (s._projects.length ? s._projects : ['-']).forEach(function (c) { seen[c] = 1; }); });
    return Object.keys(seen).sort(projectSort).map(function (c) { return { value: c, label: projectLabel(c) }; });
  }
  function typeOf(code) { return S.typeMap[code] || { code: code, label: code, color: '#9AA0AE' }; }
  function typeBadge(code) {
    var t = typeOf(code);
    return '<span class="type-badge type-' + esc(code) + '">' + esc(t.label) + '</span>';
  }
  function typeOptions() {
    return (S.cfg.docTypes || []).map(function (t) { return { value: t.code, label: t.label, color: t.color }; });
  }
  function randomPassword() {
    var chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var out = '';
    var arr = new Uint32Array(10);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    for (var i = 0; i < arr.length; i++) out += chars[arr[i] % chars.length];
    return out;
  }
  function toast(text, type) {
    var box = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (type === 'err' ? ' err' : '');
    el.setAttribute('role', 'status');
    el.textContent = text;
    box.appendChild(el);
    setTimeout(function () { el.remove(); }, type === 'err' ? 6000 : 3200);
  }

  /* =====================================================================
   * Dữ liệu dẫn xuất (số ngày ở tình trạng hiện tại, các đoạn thời gian)
   * ===================================================================== */
  function derive() {
    S.statusMap = {};
    S.cfg.statuses.forEach(function (s, i) { s.order = i; S.statusMap[s.code] = s; });
    S.userMap = {};
    S.users.forEach(function (u) { S.userMap[u.username] = u; });
    S.projMap = {};
    (S.projects || []).forEach(function (p) { S.projMap[p.code] = p; });
    // Mã chữ (vd "D&B"): khớp đầu tên hồ sơ, không phân biệt hoa/thường; mã dài khớp trước.
    S.letterCodes = (S.projects || []).map(function (p) { return p.code; })
      .filter(function (c) { return !/^\d+$/.test(c); }).sort(function (a, b) { return b.length - a.length; });
    S.typeMap = {};
    (S.cfg.docTypes || []).forEach(function (t, i) { t.order = i; S.typeMap[t.code] = t; });
    var bySub = {};
    S.hist.sort(function (a, b) { return a.seq - b.seq; });
    S.hist.forEach(function (h) { (bySub[h.submissionId] = bySub[h.submissionId] || []).push(h); });
    S.histBySub = bySub;
    S.subs.forEach(function (s) {
      s._type = docTypeOf(s.title);
      s._projects = projectCodesOf(s.title);
      var changes = (bySub[s.id] || []).filter(function (h) { return h.fromStatus !== h.toStatus; });
      var segs = [];
      for (var i = 0; i < changes.length; i++) {
        var start = changes[i].date;
        var end = i + 1 < changes.length ? changes[i + 1].date : S.today;
        segs.push({ status: changes[i].toStatus, start: start, end: end, days: Math.max(0, diffDays(start, end)) });
      }
      s._segs = segs;
      var last = changes[changes.length - 1];
      s._since = (last && last.toStatus === s.status) ? last.date : (s.updatedAt || s.createdAt);
      // Ngày đệ trình dùng cho báo cáo: ngày trình; hồ sơ chưa từng "Đang trình" (vd chuyển thẳng sang Đã duyệt/Trả lại,
      // hoặc tạo từ đồng bộ ở thư mục Đã duyệt) lấy ngày đầu tiên rời ổ Chuyên viên.
      var out = changes.filter(function (h) { return h.toStatus !== S.cfg.defaultStatus; })[0];
      s._subAt = s.submittedAt || (out ? out.date : '');
      s._days = Math.max(0, diffDays(s._since, S.today));
    });
    EXT.derive.forEach(function (fn) { fn(); });
  }

  function defaultFilter(view) {
    var f = { from: view === 'home' ? S.today.slice(0, 4) + '-01-01' : '', to: '', owners: [], statuses: [], types: [], projects: [], q: '', period: null };
    // Dashboard Trưởng phòng / Báo cáo tổng hợp: mặc định kỳ "Năm nay" (chọn Tuần/Tháng/Quý ở THAM SỐ).
    if (view === 'manager' || view === 'report') {
      var y = S.today.slice(0, 4);
      f.period = { g: 'year', k: y }; f.from = y + '-01-01'; f.to = y + '-12-31';
    }
    return f;
  }
  function getFilter(view) {
    if (!S.filters[view]) S.filters[view] = defaultFilter(view);
    return S.filters[view];
  }
  /** ignore: true (bỏ lọc tình trạng) hoặc { status: true, type: true }. */
  function applyFilter(rows, f, ignore) {
    var q = norm(f.q).trim();
    var ignoreStatus = ignore === true || !!(ignore && ignore.status);
    var ignoreType = !!(ignore && ignore.type);
    var ignoreProject = !!(ignore && ignore.project);
    var types = f.types || [];
    return rows.filter(function (s) {
      if (!ignoreType && types.length && types.indexOf(s._type) < 0) return false;
      if (!ignoreProject && !matchProjects(s, f.projects)) return false;
      if (f.from && s.createdAt < f.from) return false;
      if (f.to && s.createdAt > f.to) return false;
      if (f.owners.length && f.owners.indexOf(s.owner) < 0) return false;
      if (!ignoreStatus && f.statuses.length && f.statuses.indexOf(s.status) < 0) return false;
      if (q && norm(s.id + ' ' + s.title + ' ' + userName(s.owner) + ' ' + s.owner).indexOf(q) < 0) return false;
      return true;
    });
  }

  /* =====================================================================
   * Khung ứng dụng
   * ===================================================================== */
  /**
   * Thông báo (chuông) tính từ History; mỗi dòng History có seq = số dòng trong sheet (tăng dần).
   *  - 'incoming' (TP.MH / TP.C&C / GĐTM): hồ sơ mới chuyển sang "Đang trình <chức danh của tôi>".
   *  - 'mine': hồ sơ của tôi bị người khác đổi tình trạng (đồng bộ thư mục, Trưởng phòng cập nhật…) hoặc được tạo từ đồng bộ.
   * Thay đổi do chính mình làm thì không báo. Gộp theo hồ sơ; "mới" = seq > mốc đã xem (lưu ở server, chỉ tăng khi mở chuông).
   */
  function notifData(since) {
    var me = S.me, pos = isManagerPos() ? me.position : null;
    var byId = {};
    S.subs.forEach(function (s) { byId[s.id] = s; });
    var groups = {};
    S.hist.forEach(function (h) {
      if (h.actor === me.username || h.fromStatus === h.toStatus) return;
      var sub = byId[h.submissionId];
      if (!sub) return;
      var kind = pos && h.toStatus === pos ? 'incoming' : sub.owner === me.username ? 'mine' : null;
      if (!kind) return;
      var key = kind + '|' + sub.id;
      var g = groups[key] || (groups[key] = { key: key, kind: kind, sub: sub, last: h, firstNew: null, n: 0 });
      g.last = h;
      if (h.seq > since) { if (!g.firstNew) g.firstNew = h; g.n++; }
    });
    var list = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.last.seq - a.last.seq; });
    var fresh = list.filter(function (g) { return g.firstNew; });
    var ids = {};
    fresh.forEach(function (g) { ids[g.sub.id] = 1; });
    var monthAgo = numToIso(dayNum(S.today) - 30);
    return {
      fresh: fresh, count: Object.keys(ids).length,
      recent: list.filter(function (g) { return !g.firstNew && g.last.date >= monthAgo; }).slice(0, 100),
      maxSeq: S.hist.reduce(function (m, h) { return Math.max(m, h.seq); }, 0)
    };
  }
  function notifUnread() { return S.me && S.hist ? notifData(S.notifSeen || 0).count : 0; }
  function isSyncNote(note) {
    var fs = S.cfg.folderSync || {};
    return !!note && ((fs.note && note.indexOf(fs.note) >= 0) || (fs.createNote && note.indexOf(fs.createNote) >= 0));
  }
  /** "đồng bộ thư mục bởi X" / "cập nhật bởi X". */
  function notifHow(h) {
    return (isSyncNote(h.note) ? 'Đồng bộ thư mục' : 'Cập nhật') + ' bởi ' + userName(h.actor);
  }
  /** Bảng hồ sơ của tôi đổi tình trạng: tình trạng trước → hiện tại. */
  function notifMineTable(groups, isNew) {
    return '<div class="table-wrap"><table class="grid notif-tbl"><thead><tr><th>Hồ sơ</th><th>Trước</th><th></th><th>Hiện tại</th>' +
      '<th>Ngày</th><th>Thay đổi bởi</th><th></th></tr></thead><tbody>' + groups.map(function (g) {
        var s = g.sub, h = (isNew && g.firstNew) || g.last;
        return '<tr' + (isNew ? ' class="nt-new"' : '') + '><td class="title-cell">' + esc(s.title) + '<div class="code">' + esc(s.id) + ' · ' + typeBadge(s._type) +
          (isNew && g.n > 1 ? ' · ' + g.n + ' lần thay đổi' : '') + '</div></td>' +
          '<td>' + (h.fromStatus ? statusBadge(h.fromStatus) : '<span class="nd-tag">Tạo mới</span>') + '</td><td class="nt-arrow">→</td>' +
          '<td>' + statusBadge(s.status) + '</td><td class="nowrap">' + fmtDate(g.last.date) + '</td>' +
          '<td class="nt-who">' + esc(notifHow(g.last)) + '</td>' +

  /** Bảng hồ sơ mới đệ trình đến tôi (Trưởng phòng / GĐTM). */
  function notifIncomingTable(groups, isNew) {
    return '<div class="table-wrap"><table class="grid notif-tbl"><thead><tr><th>Hồ sơ</th><th>Chuyên viên</th><th>Trình đến ngày</th>' +
      '<th>Tình trạng hiện tại</th><th></th></tr></thead><tbody>' + groups.map(function (g) {

  /**
   * Cửa sổ thông báo (bấm chuông) — kiểu cửa sổ xem trước đồng bộ: ô tóm tắt + từng mục là bảng hồ sơ.
   * "Mới" = thay đổi sau lần mở chuông trước (S.notifView giữ mốc cũ trong lúc đang xem).
   */
  function openNotifModal() {
    var since = S.notifView != null ? S.notifView : (S.notifSeen || 0);
    var N = notifData(since);
    var isMgr = !!(isManagerPos() && S.me.position !== 'CV');
    var inc = N.fresh.filter(function (g) { return g.kind === 'incoming'; });
    var mine = N.fresh.filter(function (g) { return g.kind === 'mine'; });
    var recMine = N.recent.filter(function (g) { return g.kind === 'mine'; });
    var recInc = N.recent.filter(function (g) { return g.kind === 'incoming'; });
    var approved = mine.filter(function (g) { return g.sub.status === S.cfg.approvedStatus; }).length;
    var returned = mine.filter(function (g) { return g.sub.status === 'TRA_LAI'; }).length;
    var summary = '<div class="meta-grid">' +
      '<div><small>Hồ sơ có thay đổi mới</small>' + N.count + '</div>' +
      (!isMgr || mine.length ? '<div><small>Hồ sơ của bạn đổi tình trạng</small>' + mine.length + '</div>' : '') +
      (approved ? '<div><small>Trong đó: Đã duyệt</small>' + approved + '</div>' : '') +
      (returned ? '<div><small>Trong đó: Trả lại</small>' + returned + '</div>' : '') +
      (isMgr ? '<div><small>Mới đệ trình đến bạn</small>' + inc.length + '</div>' : '') +
      '<div><small>Đã xem gần đây (30 ngày)</small>' + N.recent.length + '</div></div>';
    var empty = function (t) { return '<div class="empty">' + t + '</div>'; };
    var body = summary +
      (isMgr ? syncSection('Hồ sơ mới đệ trình đến bạn (' + esc(posLabel(S.me.position)) + ')', inc.length,
        inc.length ? notifIncomingTable(inc, true) : empty('Không có hồ sơ mới đệ trình đến bạn.'), true) : '') +
      (isMgr && !mine.length ? '' : syncSection('Hồ sơ của bạn thay đổi tình trạng', mine.length,
        mine.length ? notifMineTable(mine, true) : empty('Không có hồ sơ nào của bạn thay đổi tình trạng mới.'), true,
        mine.length ? 'Do đồng bộ thư mục, Trưởng phòng cập nhật… (thay đổi do chính bạn làm thì không báo). Bấm Lịch sử để xem chi tiết từng lần thay đổi.' : '')) +
      (recMine.length || recInc.length ? syncSection('Đã xem gần đây (30 ngày)', recMine.length + recInc.length,
        (recMine.length ? notifMineTable(recMine, false) : '') + (recInc.length ? '<p class="muted sync-note">Đệ trình đến bạn:</p>' + notifIncomingTable(recInc, false) : ''), !N.count) : '');
    openModal(modalHead('Thông báo thay đổi') + '<div class="modal-body">' + body + '</div>' +
      '<div class="modal-foot"><span class="muted left">' + (N.count ? 'Đã đánh dấu đã xem — lần mở sau các hồ sơ này chuyển vào "Đã xem gần đây".' : 'Bạn đã xem hết thông báo.') + '</span>' +
      '<button class="secondary-btn" data-act="close-modal">Đóng</button></div>', 'xl');
  }
  /** Mở chuông: giữ mốc cũ để tô "mới" trong lúc đang mở, đồng thời lưu mốc đã xem lên server. */
  function openNotif() {
    var maxSeq = S.hist.reduce(function (m, h) { return Math.max(m, h.seq); }, 0);
    S.notifView = S.notifSeen || 0;
    if (maxSeq > (S.notifSeen || 0)) {
      S.notifSeen = maxSeq;
      call('markNotifSeen', { seq: maxSeq }).catch(function (err) { if (err && err.code === 'AUTH') handleErr(err); });
    }
  }

  function navItems() {
    var items = [
      { view: 'home', icon: 'gauge', label: 'Tổng quan của tôi' },
      { view: 'mine', icon: 'folder', label: 'Hồ sơ của tôi' },

  function renderView() {
    S.pendingCharts = [];
    if (S.view === 'manager' && !S.me.isManager) S.view = 'home';
    if (S.view === 'admin' && !S.me.isAdmin) S.view = 'home';
    if (S.view === 'report' && S.me.isManager) S.view = 'manager';
    switch (S.view) {
      case 'mine': return viewMine();
      case 'all': return viewAll();
      case 'manager': return viewManager();
      case 'report': return viewReport();
      case 'admin': return viewAdmin();
      default: return EXT.views[S.view] ? EXT.views[S.view]() : viewHome();
    }
  }

  function render() {
    if (!S.me) return;
    var active = document.activeElement;
    var focusId = active && active.id;
    var selStart = null, selEnd = null;
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
    var scrollY = window.scrollY;
    var inner = {};
    Array.prototype.forEach.call(root.querySelectorAll('.table-scroll[id]'), function (el) { inner[el.id] = el.scrollTop; });

    S.charts.forEach(function (c) { c.destroy(); });
    S.charts = [];
    root.innerHTML = renderShell();
    mountCharts();

    window.scrollTo(0, scrollY);
    var reset = S.scrollReset || {};
    Object.keys(inner).forEach(function (id) {
      var el = document.getElementById(id);
      if (el && !reset[id]) el.scrollTop = inner[id];
    });
    S.scrollReset = {};
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus();
        try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  /* =====================================================================
   * Thành phần dùng chung
   * ===================================================================== */
  function card(key, title, body, opts) {
    opts = opts || {};
    var st = S.cardState[key] || {};
    return '<section class="card' + (st.collapsed ? ' collapsed' : '') + (st.full ? ' fullscreen' : '') + '" id="card-' + key + '">' +
      '<div class="card-head">' +
        (opts.collapsible ? '<button class="collapse-btn" data-act="card-collapse" data-key="' + key + '" aria-label="Thu gọn/Mở rộng">' + ic(st.collapsed ? 'plus' : 'minus') + '</button>' : '') +

        '<button class="ghost-btn" data-act="card-full" data-key="' + key + '" title="' + (st.full ? 'Thu nhỏ' : 'Phóng to') + '" aria-label="Phóng to">' + ic(st.full ? 'shrink' : 'expand') + '</button>' +
      '</div><div class="card-body">' + body + '</div></section>';
  }

  /**
   * Ô ngày: nhập tay dd/mm/yyyy (tự chèn "/") hoặc chọn trên lịch tự vẽ. Không dùng lịch gốc của trình duyệt vì trong
   * iframe của Apps Script, showPicker() bị chặn (SecurityError) và <input type=date> hiển thị theo locale máy.
   * Bộ lọc lưu ISO yyyy-mm-dd.
   */
  function dateField(view, field, label) {
    var f = getFilter(view);
    var id = 'f-' + view + '-' + field;
    var dd = 'cal-' + view + '-' + field;
    var attrs = ' data-view="' + view + '" data-field="' + field + '"';
    return '<div class="field sm date-field anchor"><div class="fbody"><label for="' + id + '">' + label + '</label>' +
      '<input type="text" id="' + id + '" class="date-text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/yyyy"' +
        ' data-input="date-text" data-change="date-text"' + attrs + ' value="' + esc(f[field] ? fmtDate(f[field]) : '') + '"></div>' +
      '<button type="button" class="faddon" data-act="toggle-dd" data-dd="' + dd + '" aria-label="Chọn ' + label.toLowerCase() + ' trên lịch" aria-expanded="' + (S.open === dd) + '">' +
        ic('calendar') + '</button>' + (S.open === dd ? calendarPanel(view, field, dd) : '') + '</div>';
  }
  function calendarPanel(view, field, dd) {
    var f = getFilter(view);
    S.calMonth = S.calMonth || {};
    var month = S.calMonth[dd] || (f[field] || S.today).slice(0, 7);
    S.calMonth[dd] = month;
    var y = +month.slice(0, 4), m = +month.slice(5, 7);
    var first = dayNum(month + '-01');
    var startDow = (new Date(first * 86400000).getUTCDay() + 6) % 7; // thứ 2 = 0
    var daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var attrs = ' data-view="' + view + '" data-field="' + field + '"';
    var cells = '';
    for (var i = 0; i < startDow; i++) cells += '<span></span>';
    for (var d = 1; d <= daysIn; d++) {
      var iso = numToIso(first + d - 1);
      cells += '<button type="button" class="cal-day' + (iso === f[field] ? ' sel' : '') + (iso === S.today ? ' today' : '') + '"' +
        ' data-act="cal-pick" data-date="' + iso + '"' + attrs + '>' + d + '</button>';
    }
    return '<div class="cal-panel" role="dialog" aria-label="Chọn ngày">' +
      '<div class="cal-head"><button type="button" class="cal-nav" data-act="cal-nav" data-dd="' + dd + '" data-dir="-1" aria-label="Tháng trước">' + ic('chevLeft') + '</button>' +
      '<b>Tháng ' + ('0' + m).slice(-2) + '/' + y + '</b>' +
      '<button type="button" class="cal-nav" data-act="cal-nav" data-dd="' + dd + '" data-dir="1" aria-label="Tháng sau">' + ic('chevRight') + '</button></div>' +
      '<div class="cal-grid cal-dow"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot"><button type="button" data-act="cal-pick" data-date="' + S.today + '"' + attrs + '>Hôm nay</button>' +
      '<button type="button" data-act="cal-pick" data-date=""' + attrs + '>Xóa</button></div></div>';
  }
  /** "1/9/2026", "01-09-2026", "01.09.2026", "01092026" → "2026-09-01"; '' nếu rỗng; null nếu sai. */
  function parseDmy(v) {
    v = String(v || '').trim();
    if (!v) return '';
    var m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/) || v.match(/^(\d{2})(\d{2})(\d{4})$/);
    if (!m) return null;
    var d = +m[1], mo = +m[2], y = +m[3];
    var dt = new Date(Date.UTC(y, mo - 1, d));
    if (y < 1900 || dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
  }
  function setDateFilter(view, field, iso) {
    var f = getFilter(view);
    if (f[field] === iso) return;
    f[field] = iso;
    f.period = null; // tự nhập ngày → khoảng tùy chọn, bỏ chọn Tuần/Tháng/Quý/Năm
    if (f.from && f.to && f.from > f.to) toast('"Từ ngày" đang sau "Đến ngày" nên sẽ không có hồ sơ nào.', 'err');
    resetPage(view); render();
  }

  function multiField(view, field, label, options) {
    var f = getFilter(view);
    var dd = 'ms-' + view + '-' + field;
    var selected = f[field];
    var text = !selected.length ? 'Tất cả' : options.filter(function (o) { return selected.indexOf(o.value) >= 0; })
      .map(function (o) { return o.label; }).join(', ');
    var panel = S.open === dd ? '<div class="ms-panel">' +
      '<div class="ms-actions"><a data-act="ms-all" data-view="' + view + '" data-field="' + field + '">Chọn tất cả</a>' +
      '<a data-act="ms-none" data-view="' + view + '" data-field="' + field + '">Bỏ chọn (Tất cả)</a></div>' +
      options.map(function (o) {
        return '<label class="opt"><input type="checkbox" data-change="ms" data-view="' + view + '" data-field="' + field + '" value="' + esc(o.value) + '"' +
          (selected.indexOf(o.value) >= 0 ? ' checked' : '') + '>' + (o.color ? '<span class="dot" style="background:' + o.color + '"></span>' : '') + esc(o.label) + '</label>';
      }).join('') + '</div>' : '';
    return '<div class="field anchor">' +
      '<div class="fbody" data-act="toggle-dd" data-dd="' + dd + '" style="cursor:pointer"><span class="flabel">' + label + '</span><div class="fvalue">' + esc(text) + '</div></div>' +
      '<button class="faddon" data-act="toggle-dd" data-dd="' + dd + '" aria-label="Mở danh sách">' + ic('chevDown') + '</button>' + panel + '</div>';
  }

  function ownerOptions() {
    var seen = {};
    var list = [];
    S.users.forEach(function (u) {
      if ((u.position === 'CV' && !u.isAdmin) || S.subs.some(function (s) { return s.owner === u.username; })) {
        seen[u.username] = 1;
        list.push({ value: u.username, label: u.displayName + (u.active ? '' : ' (đã khóa)') });
      }
    });
    S.subs.forEach(function (s) {
      if (!seen[s.owner]) { seen[s.owner] = 1; list.push({ value: s.owner, label: s.owner }); }
    });
    return list.sort(function (a, b) { return a.label.localeCompare(b.label, 'vi'); });
  }
  function statusOptions() {
    return S.cfg.statuses.map(function (s) { return { value: s.code, label: s.label, color: s.color }; });
  }

  function paramsCard(view, opts) {
    opts = opts || {};
    var f = getFilter(view);
    var qId = 'f-' + view + '-q';
    var body = (opts.period ? periodBar(view) : '') + '<div class="params">' +
      dateField(view, 'from', 'Từ ngày') + dateField(view, 'to', 'Đến ngày') +
      (opts.owners ? multiField(view, 'owners', 'Chuyên viên', ownerOptions()) : '') +
      multiField(view, 'statuses', 'Tình trạng hồ sơ', statusOptions()) +
      multiField(view, 'types', 'Loại hồ sơ', typeOptions()) +
      multiField(view, 'projects', 'Dự án', projectOptions()) +
      '<div class="field"><div class="fbody"><label for="' + qId + '">Tên / mã hồ sơ</label>' +
        '<input type="text" id="' + qId + '" data-input="filter-q" data-view="' + view + '" placeholder="Nhập để tìm…" value="' + esc(f.q) + '"></div></div>' +
      '<button class="primary-btn" data-act="run-report">' + ic('report') + 'Chạy báo cáo</button>' +
      '</div>';
    var tools = (opts.tools || '') + '<button class="secondary-btn" data-act="reset-filter" data-view="' + view + '">Xóa lọc</button>';
    // Điện thoại: THAM SỐ mặc định thu gọn để không chiếm cả màn hình; tiêu đề cho biết số bộ lọc đang dùng.
    var key = view + '-params';
    if (!S.cardState[key] && window.innerWidth <= 640) S.cardState[key] = { collapsed: true };
    var def = defaultFilter(view);
    var active = ['owners', 'statuses', 'types', 'projects'].filter(function (k) { return f[k] && f[k].length; }).length +
      (f.q ? 1 : 0) + (f.from !== def.from || f.to !== def.to ? 1 : 0);
    var title = 'Tham số' + (active ? ' <span class="tab-count filter-count">' + active + ' bộ lọc</span>' : '');
    return card(key, title, body, { tools: tools, collapsible: true });

  function overviewCard(view, scope, opts) {
    opts = opts || {};
    var f = getFilter(view);
    var counts = {};
    scope.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
    var sel = f.statuses.length === 1 ? f.statuses[0] : null;
    var tiles = '<button class="tile' + (!f.statuses.length ? ' selected' : '') + '" data-act="tile" data-view="' + view + '" data-status="">' +
      '<div class="circle" style="background:#2B4396">' + fmtNum(scope.length) + '</div><div class="tlabel">Tổng hồ sơ</div></button>';
    tiles += S.cfg.statuses.map(function (st) {
      return '<button class="tile' + (sel === st.code ? ' selected' : '') + '" data-act="tile" data-view="' + view + '" data-status="' + st.code + '">' +
        '<div class="circle" style="background:' + st.color + '">' + fmtNum(counts[st.code] || 0) + '</div><div class="tlabel">' + esc(st.short) + '</div></button>';
    }).join('');
    if (opts.extraTile) tiles += opts.extraTile;

    var approved = scope.filter(function (s) { return s.status === S.cfg.approvedStatus && s.approvedAt; });
    var avgApprove = approved.length ? approved.reduce(function (a, s) { return a + diffDays(s.createdAt, s.approvedAt); }, 0) / approved.length : null;
    var submitting = scope.filter(function (s) { return S.cfg.submittingStatuses.indexOf(s.status) >= 0; });
    var longest = submitting.reduce(function (m, s) { return Math.max(m, s._days); }, 0);
    var kpis = '<div class="kpis">' +
      kpi(scope.length ? Math.round(approved.length * 100 / scope.length) + '%' : '—', 'Tỉ lệ đã duyệt') +
      kpi(avgApprove == null ? '—' : fmt1(avgApprove) + ' ngày', 'Thời gian TB từ tạo → duyệt') +
      kpi(fmtNum(submitting.length), 'Hồ sơ đang trình lãnh đạo') +
      kpi(submitting.length ? longest + ' ngày' : '—', 'Hồ sơ đang trình lâu nhất') + '</div>';
    var rangeText = (f.from ? fmtDate(f.from) : 'Từ đầu') + ' – ' + (f.to ? fmtDate(f.to) : fmtDate(S.today));
    var body = '<div class="tiles">' + tiles + '</div>' + kpis +
      '<div class="range-bar">Khoảng thời gian (theo ngày tạo): ' + rangeText + ' · ' + fmtNum(scope.length) + ' hồ sơ · Bấm vào ô để lọc</div>';
    return card(view + '-overview', 'Tổng quan', body, { collapsible: true });
  }
  function kpi(v, l) { return '<div class="kpi"><div class="kv">' + v + '</div><div class="kl">' + esc(l) + '</div></div>'; }

  /* ---------- Bảng chi tiết hồ sơ ---------- */
  var COLS = [
    { key: 'id', label: 'Mã HS', sort: function (s) { return s.id; } },
    { key: 'title', label: 'Tên hồ sơ', sort: function (s) { return norm(s.title); } },
    { key: '_type', label: 'Loại', sort: function (s) { return typeOf(s._type).order; } },
    { key: '_projects', label: 'Dự án', sort: function (s) { return s._projects.length ? ('000000' + s._projects[0]).slice(-6) : 'zzzzzz'; } },
    { key: 'owner', label: 'Chuyên viên', sort: function (s) { return norm(userName(s.owner)); }, ownerOnly: true },
    { key: 'status', label: 'Tình trạng', sort: function (s) { return statusOf(s.status).order; } },
    { key: 'createdAt', label: 'Ngày tạo', sort: function (s) { return s.createdAt; } },
    { key: 'submittedAt', label: 'Ngày trình', sort: function (s) { return s.submittedAt || ''; } },
    { key: 'updatedAt', label: 'Cập nhật', sort: function (s) { return s.updatedAt || ''; } },
    { key: '_days', label: 'Số ngày ở TT hiện tại', sort: function (s) { return s.status === S.cfg.approvedStatus ? -1 : s._days; }, num: true }
  ];
  function sortRows(view, rows) {
    var st = S.sorts[view] || (S.sorts[view] = { key: 'updatedAt', dir: 'desc' });
    var col = COLS.filter(function (c) { return c.key === st.key; })[0] || COLS.filter(function (c) { return c.key === 'updatedAt'; })[0];
    var dir = st.dir === 'asc' ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var x = col.sort(a), y = col.sort(b);
      if (x < y) return -dir;
      if (x > y) return dir;
      return a.id < b.id ? 1 : -1;
    });
  }
  function waitCell(s) {
    if (s.status === S.cfg.approvedStatus) return '<span class="muted">—</span>';
    var cls = s._days >= 14 ? ' bad' : s._days >= 7 ? ' warn' : '';
    return '<span class="wait' + cls + '">' + s._days + '</span>';
  }
  function rowActions(s) {
    return '<div class="row-actions"><button data-act="open-history" data-id="' + esc(s.id) + '" title="Xem lịch sử">' + ic('history') + 'Lịch sử</button>' +
      (canEdit(s) ? '<button data-act="open-update" data-id="' + esc(s.id) + '" title="Cập nhật tình trạng">' + ic('edit') + 'Cập nhật</button>' : '') + '</div>';
  }

  function detailCard(view, rows, opts) {
    opts = opts || {};
    var sorted = sortRows(view, rows);
    S.lastRows[view] = { rows: sorted, showOwner: !!opts.showOwner };
    var st = S.sorts[view];
    var cols = COLS.filter(function (c) { return opts.showOwner || !c.ownerOnly; });

    var head = cols.map(function (c) {
      var arrow = st.key === c.key ? '<span class="arrow">' + (st.dir === 'asc' ? '▲' : '▼') + '</span>' : '';
      return '<th class="sortable' + (c.num ? ' num' : '') + '" data-act="sort" data-view="' + view + '" data-key="' + c.key + '"' +
        ' aria-sort="' + (st.key === c.key ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' + c.label + arrow + '</th>';
    }).join('') + '<th></th>';

    var body = sorted.map(function (s) {
      return '<tr><td class="code">' + esc(s.id) + '</td><td class="title-cell">' + esc(s.title) + '</td><td>' + typeBadge(s._type) + '</td>' +
        '<td class="proj-cell">' + projectsCell(s) + '</td>' +
        (opts.showOwner ? '<td class="nowrap">' + esc(userName(s.owner)) + '</td>' : '') +
        '<td>' + statusBadge(s.status) + '</td>' +
        '<td class="nowrap">' + fmtDate(s.createdAt) + '</td><td class="nowrap">' + fmtDate(s.submittedAt) + '</td>' +
        '<td class="nowrap">' + fmtDate(s.updatedAt) + '</td><td class="num">' + waitCell(s) + '</td>' +
        '<td>' + rowActions(s) + '</td></tr>';
    }).join('');
    if (!sorted.length) body = '<tr><td colspan="' + (cols.length + 1) + '" class="empty">Không có hồ sơ nào phù hợp.</td></tr>';

    var tools = '<div class="table-tools"><span class="muted"><b>' + fmtNum(sorted.length) + '</b> hồ sơ</span><div class="grow"></div>' +
      (opts.create ? '<button class="primary-btn" style="min-height:40px;font-size:16px;padding:0 18px" data-act="open-create">' + ic('plus') + 'Tạo hồ sơ</button>' : '') +
      '<button class="secondary-btn" data-act="export-csv" data-view="' + view + '">' + ic('download') + 'Xuất CSV</button></div>';

    // Không phân trang: toàn bộ hồ sơ trong khung cuộn, tiêu đề cột cố định (vị trí cuộn được giữ khi render lại).
    var pager = '<div class="pager"><span>Tổng: <b>' + fmtNum(sorted.length) + '</b> hồ sơ' +
      (sorted.length > 10 ? ' · cuộn trong bảng để xem thêm' : '') + '</span></div>';

    return card(view + '-detail', opts.title || 'Thông tin chi tiết hồ sơ',
      tools + '<div class="table-wrap table-scroll" id="scroll-' + view + '" style="border-radius:8px 8px 0 0"><table class="grid"><thead><tr>' + head +
      '</tr></thead><tbody>' + body + '</tbody></table></div>' + pager);
  }

  /* ---------- Biểu đồ ---------- */
  function bucketKey(iso, mode) {
    if (mode === 'month') return iso.slice(0, 7) + '-01';
    if (mode === 'week') {
      var n = dayNum(iso);
      var dow = (new Date(n * 86400000).getUTCDay() + 6) % 7; // thứ 2 = 0
      return numToIso(n - dow);
    }
    return iso;
  }
  function bucketLabel(key, mode) {
    var p = key.split('-');
    if (mode === 'month') return p[1] + '/' + p[0];
    return p[2] + '/' + p[1];
  }
  function timeSeries(view, rows) {
    var f = getFilter(view);
    var minCreated = rows.reduce(function (m, s) { return !m || s.createdAt < m ? s.createdAt : m; }, '');
    var from = f.from || minCreated || S.today;
    var to = f.to || S.today;
    if (from > to) return { labels: [], data: [], mode: 'day' };
    var span = diffDays(from, to);
    var mode = S.groupBy[view] || (span <= 45 ? 'day' : span <= 200 ? 'week' : 'month');
    if (mode === 'day' && span > 400) mode = 'week';
    var keys = [];
    var k = bucketKey(from, mode);
    var end = bucketKey(to, mode);
    var guard = 0;
    while (k <= end && guard++ < 800) {
      keys.push(k);
      if (mode === 'month') {
        var y = +k.slice(0, 4), m = +k.slice(5, 7) + 1;
        if (m > 12) { m = 1; y++; }
        k = y + '-' + ('0' + m).slice(-2) + '-01';
      } else {
        k = numToIso(dayNum(k) + (mode === 'week' ? 7 : 1));
      }
    }
    var idx = {};
    keys.forEach(function (key, i) { idx[key] = i; });
    var data = keys.map(function () { return 0; });
    rows.forEach(function (s) { var i = idx[bucketKey(s.createdAt, mode)]; if (i != null) data[i]++; });
    return { labels: keys.map(function (key) { return bucketLabel(key, mode); }), data: data, mode: mode };
  }

  function chartBox(id, title, height, tools) {
    return '<div class="chart-box"><div class="chart-head"><h3>' + esc(title) + '</h3>' + (tools || '') + '</div>' +
      '<div class="chart-wrap" style="height:' + height + 'px"><canvas id="' + id + '" role="img" aria-label="' + esc(title) + '"></canvas></div></div>';
  }
  function emptyBox(title, text) {
    return '<div class="chart-box"><div class="chart-head"><h3>' + esc(title) + '</h3></div><div class="chart-empty">' + esc(text) + '</div></div>';
  }

  function chartsCard(view, rows, opts) {
    opts = opts || {};
    if (typeof Chart === 'undefined') {
      return card(view + '-charts', 'Biểu đồ', '<div class="empty">Không tải được thư viện biểu đồ (kiểm tra kết nối mạng).</div>', { collapsible: true });
    }
    var boxes = [];

    // 1. Số hồ sơ tạo mới theo thời gian
    var ts = timeSeries(view, rows);
    var seg = '<div class="seg" role="group" aria-label="Nhóm theo">' + [['day', 'Ngày'], ['week', 'Tuần'], ['month', 'Tháng']].map(function (m) {
      return '<button class="' + (ts.mode === m[0] ? 'on' : '') + '" data-act="group-by" data-view="' + view + '" data-mode="' + m[0] + '">' + m[1] + '</button>';
    }).join('') + '</div>';
    var id1 = 'ch-' + view + '-time';
    boxes.push(chartBox(id1, 'Số hồ sơ tạo mới theo ' + ({ day: 'ngày', week: 'tuần', month: 'tháng' })[ts.mode], 300, seg));
    S.pendingCharts.push({ id: id1, config: barConfig(ts.labels, [{ label: 'Hồ sơ tạo mới', data: ts.data, backgroundColor: '#2B4396' }], {}) });

    // 2. Hồ sơ theo chuyên viên (xếp chồng theo tình trạng)
    if (opts.byOwner) {
      var owners = {};
      rows.forEach(function (s) { owners[s.owner] = owners[s.owner] || 0; owners[s.owner]++; });
      var ownerList = Object.keys(owners).sort(function (a, b) { return owners[b] - owners[a]; });
      if (ownerList.length) {
        var id2 = 'ch-' + view + '-owner';
        var ds = S.cfg.statuses.map(function (st) {
          return {
            label: st.label, backgroundColor: st.color, stack: 's',
            data: ownerList.map(function (o) { return rows.filter(function (s) { return s.owner === o && s.status === st.code; }).length; })
          };
        }).filter(function (d) { return d.data.some(function (v) { return v > 0; }); });
        boxes.push(chartBox(id2, 'Hồ sơ theo chuyên viên', Math.max(300, ownerList.length * 38 + 90)));
        S.pendingCharts.push({ id: id2, config: barConfig(ownerList.map(userName), ds, { horizontal: true, stacked: true, legend: true }) });
      } else {
        boxes.push(emptyBox('Hồ sơ theo chuyên viên', 'Không có dữ liệu.'));
      }
    }

    // 3. Số ngày trung bình hồ sơ nằm ở mỗi tình trạng (chỉ ra nút thắt)
    var agg = {};
    rows.forEach(function (s) {
      s._segs.forEach(function (g) {
        if (g.status === S.cfg.approvedStatus) return;
        var a = agg[g.status] || (agg[g.status] = { sum: 0, n: 0 });
        a.sum += g.days; a.n++;
      });
    });
    var sts = S.cfg.statuses.filter(function (st) { return agg[st.code]; });
    if (sts.length) {
      var id3 = 'ch-' + view + '-dwell';
      boxes.push(chartBox(id3, 'Số ngày trung bình ở mỗi tình trạng', Math.max(300, sts.length * 44 + 60)));
      S.pendingCharts.push({
        id: id3,
        config: barConfig(sts.map(function (st) { return st.short; }), [{
          label: 'Số ngày TB',
          data: sts.map(function (st) { return Math.round(agg[st.code].sum / agg[st.code].n * 10) / 10; }),
          backgroundColor: sts.map(function (st) { return st.color; }),
          counts: sts.map(function (st) { return agg[st.code].n; })
        }], { horizontal: true, unit: ' ngày', decimals: true })
      });
    } else {
      boxes.push(emptyBox('Số ngày trung bình ở mỗi tình trạng', 'Chưa có dữ liệu chuyển tình trạng.'));
    }

    return card(view + '-charts', 'Biểu đồ', '<div class="charts">' + boxes.join('') + '</div>', { collapsible: true });
  }

  function barConfig(labels, datasets, o) {
    datasets.forEach(function (d) {
      d.borderRadius = o.stacked ? 3 : 6;
      d.borderSkipped = o.stacked ? false : 'start';
      d.borderColor = '#FFFFFF';
      d.borderWidth = o.stacked ? 1 : 0;
      d.maxBarThickness = 30;
    });
    var valueAxis = {
      beginAtZero: true, stacked: !!o.stacked,
      grid: { color: '#E9EEF6' }, border: { display: false },
      ticks: { precision: o.decimals ? undefined : 0, color: '#76829B' }
    };
    var catAxis = { stacked: !!o.stacked, grid: { display: false }, border: { color: '#DAE1EC' }, ticks: { color: '#44506A', autoSkip: true, maxRotation: 0 } };
    return {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        indexAxis: o.horizontal ? 'y' : 'x',
        interaction: { mode: o.stacked ? 'index' : 'nearest', intersect: !o.stacked, axis: o.horizontal ? 'y' : 'x' },
        plugins: {
          legend: { display: !!o.legend, position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, color: '#44506A' } },
          tooltip: {
            backgroundColor: 'rgba(16, 26, 51, .92)', padding: 10, cornerRadius: 10,
            filter: function (item) { return !o.stacked || item.raw > 0; },
            callbacks: {
              label: function (ctx) {
                var v = ctx.raw;
                var extra = ctx.dataset.counts ? ' (' + ctx.dataset.counts[ctx.dataIndex] + ' lượt)' : '';
                return ' ' + ctx.dataset.label + ': ' + (o.decimals ? fmt1(v) : fmtNum(v)) + (o.unit || ' hồ sơ') + extra;
              }
            }
          }
        },
        scales: o.horizontal ? { x: valueAxis, y: catAxis } : { x: catAxis, y: valueAxis }
      }
    };
  }

  function mountCharts() {
    if (typeof Chart === 'undefined') return;
    Chart.defaults.font.family = "'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif";
    Chart.defaults.font.size = 13;
    (S.pendingCharts || []).forEach(function (p) {
      var el = document.getElementById(p.id);
      if (el) S.charts.push(new Chart(el, p.config));
    });
  }

  /* =====================================================================
   * Các màn hình
   * ===================================================================== */
  function viewHome() {
    var f = getFilter('home');
    var mine = S.subs.filter(function (s) { return s.owner === S.me.username; });
    var scope = applyFilter(mine, f, true);
    var rows = applyFilter(mine, f);
    var extra = '';
    if (isManagerPos()) {
      var cnt = S.subs.filter(function (s) { return s.status === S.me.position; }).length;
      extra = '<button class="tile" data-act="nav" data-view="manager"><div class="circle" style="background:#1E2B59">' + fmtNum(cnt) +
        '</div><div class="tlabel">Đang trình tôi (' + esc(posLabel(S.me.position)) + ')</div></button>';
    }
    return paramsCard('home', { tools: syncButton() }) +
      overviewCard('home', scope, { extraTile: extra }) +
      chartsCard('home', rows, {}) +
      detailCard('home', rows, { title: 'Thông tin chi tiết hồ sơ của tôi', create: true }) +
      activityCard(mine);
  }

  function viewMine() {
    var f = getFilter('mine');
    var mine = S.subs.filter(function (s) { return s.owner === S.me.username; });
    return paramsCard('mine', { tools: syncButton() }) + detailCard('mine', applyFilter(mine, f), { title: 'Hồ sơ của tôi', create: true });
  }

  function viewAll() {
    var f = getFilter('all');
    return paramsCard('all', { owners: true }) +
      detailCard('all', applyFilter(S.subs, f), { title: 'Tất cả hồ sơ', showOwner: true, create: true });

  /**
   * Dashboard Trưởng phòng gọn: THAM SỐ + TỔNG QUAN (1 hàng ô nhỏ) + thanh tab cố định; mỗi lần chỉ hiện 1 phần.
   * Bấm số trong các bảng thống kê → lọc và chuyển sang tab "Danh sách hồ sơ".
   */
  function mgrTabs() {
    var tabs = [];
    if (isManagerPos()) {
      var cnt = S.subs.filter(function (s) { return s.status === S.me.position; }).length;
      tabs.push({ key: 'pending', label: 'Đang trình ' + posLabel(S.me.position), count: cnt });
    }
    tabs.push({ key: 'owners', label: 'Chuyên viên' }, { key: 'projects', label: 'Dự án' }, { key: 'types', label: 'Trình duyệt & Báo cáo' },
      { key: 'submit', label: 'Đệ trình theo thời gian' }, { key: 'charts', label: 'Biểu đồ' }, { key: 'list', label: 'Danh sách hồ sơ' });
    return tabs;
  }
  function viewManager() {
    var f = getFilter('manager');
    var scope = applyFilter(S.subs, f, true);
    var rows = applyFilter(S.subs, f);
    var D = repData('manager');
    var tabs = mgrTabs();
    if (!S.mgrTab) S.mgrTab = store.get('hs_mgr_tab') || tabs[0].key;
    if (!tabs.some(function (t) { return t.key === S.mgrTab; })) S.mgrTab = tabs[0].key;
    var tab = S.mgrTab;

    var syncBtn = syncButton();
    var bar = '<nav class="mgr-tabs" id="mgr-tabs" role="tablist">' + tabs.map(function (t) {
      var n = t.key === 'list' ? rows.length : t.count;
      return '<button role="tab" aria-selected="' + (t.key === tab) + '" class="' + (t.key === tab ? 'on' : '') + '" data-act="mgr-tab" data-tab="' + t.key + '">' +
        esc(t.label) + (n != null ? '<span class="tab-count">' + fmtNum(n) + '</span>' : '') + '</button>';
    }).join('') + '</nav>';

    var content;
    switch (tab) {
      case 'pending': content = pendingCard(); break;
      case 'projects': content = projectCard(applyFilter(S.subs, f, { status: true, type: true, project: true })); break;
      case 'types': content = typeCard(applyFilter(S.subs, f, { status: true, type: true })); break;
      case 'submit': content = submitReportCard(); break;
      case 'charts': content = chartsCard('manager', rows, { byOwner: true }); break;
      case 'list': content = detailCard('manager', rows, { title: 'Danh sách hồ sơ', showOwner: true }); break;
      default: content = matrixCard(scope);
    }
    return paramsCard('manager', { owners: true, period: true, tools: syncBtn }) + mgrOverview('manager', D) + repSection(D) + bar + content;
  }
  /** Nút "Đồng bộ thư mục" — mọi tài khoản (chuyên viên: chỉ hồ sơ của mình). */
  function syncButton() {
    return S.cfg.folderSync ? '<button class="secondary-btn" data-act="folder-sync" title="' + esc(syncTitle()) + '">' + ic('refresh') + 'Đồng bộ thư mục</button>' : '';
  }
  function syncTitle() {
    var last = S.folderSync;
    return (last ? 'Lần đồng bộ gần nhất: ' + last.at + ' bởi ' + userName(last.by) + ' (' + last.changed + ' hồ sơ đổi tình trạng' +
        (last.reassigned ? ', ' + last.reassigned + ' đổi chuyên viên' : '') + (last.created ? ', ' + last.created + ' tạo mới' : '') + '). '
                 : 'Chưa đồng bộ lần nào. ') +
      'Kết nối VPN, bấm nút rồi chọn thư mục ' + S.cfg.folderSync.rootName + ' trên ổ chia sẻ; web chỉ đọc tên file và cho xem trước trước khi cập nhật.' +
      (S.me.isManager ? '' : ' Bạn chỉ cập nhật được hồ sơ của mình.');
  }
  /** TỔNG QUAN gọn: 1 hàng ô số liệu chính của kỳ (bấm để xem hồ sơ); lọc tình trạng/loại ở THAM SỐ. */
  function mgrOverview(view, D) {
    return card(view + '-overview', 'Tổng quan <span class="ov-period">' + esc(D.label) + '</span>',
      repKpis(D) + '<div class="kfoot muted">Đệ trình tính theo ngày trình · bấm vào ô để xem danh sách hồ sơ</div>');
  }
  function jumpToTab(tab) {
    S.mgrTab = tab; store.set('hs_mgr_tab', tab);
    render();
    var t = document.getElementById('mgr-tabs');
    if (t) {
      var topbar = document.querySelector('.topbar');
      var y = t.getBoundingClientRect().top + window.scrollY - (topbar ? topbar.offsetHeight : 0) - 8;
      if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }

  function pendingCard() {
    var pos = S.me.position;
    var rows = S.subs.filter(function (s) { return s.status === pos; })
      .sort(function (a, b) { return b._days - a._days || (a.submittedAt < b.submittedAt ? -1 : 1); });
    var body = rows.length ? '<div class="table-wrap"><table class="grid"><thead><tr>' +
      '<th>Mã HS</th><th>Tên hồ sơ</th><th>Loại</th><th>Chuyên viên</th><th>Ngày trình</th><th>Chuyển đến tôi</th><th class="num">Số ngày chờ</th><th></th>' +
      '</tr></thead><tbody>' + rows.map(function (s) {
        return '<tr><td class="code">' + esc(s.id) + '</td><td class="title-cell">' + esc(s.title) + '</td><td>' + typeBadge(s._type) + '</td>' +
          '<td class="nowrap">' + esc(userName(s.owner)) + '</td><td class="nowrap">' + fmtDate(s.submittedAt) + '</td>' +
          '<td class="nowrap">' + fmtDate(s._since) + '</td><td class="num">' + waitCell(s) + '</td><td>' + rowActions(s) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty">' + ic('inbox') + '<div>Không có hồ sơ nào đang trình ' + esc(posLabel(pos)) + '.</div></div>';
    var tools = '<span class="status-badge" style="font-size:15px"><span class="dot" style="background:' + statusOf(pos).color + '"></span>' + rows.length + ' hồ sơ</span>' +
      (S.cfg.docTypes || []).map(function (t) {
        return '<span class="type-badge type-' + t.code + '" style="font-size:13.5px">' + esc(t.label) + ': ' +
          rows.filter(function (s) { return s._type === t.code; }).length + '</span>';
      }).join('');
    return card('manager-pending', 'Hồ sơ ' + esc(statusOf(pos).label), body, { collapsible: true, tools: tools });
  }

  /* =====================================================================
   * Đồng bộ tình trạng từ thư mục chia sẻ
   * ===================================================================== */
  /** Khóa so khớp tên: không phân biệt hoa/thường, khoảng trắng thừa (web tự gộp khi lưu tên), cách mã hóa dấu tiếng Việt (NFC). */
  function syncKey(s) {
    s = String(s || '');
    if (s.normalize) s = s.normalize('NFC');
    return s.replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function stripExt(name) { return name.replace(/\.(?=[a-z0-9]*[a-z])[a-z0-9]{2,5}$/i, ''); }
  function isJunkFile(name) {
    var n = name.toLowerCase();
    return n.indexOf('~$') === 0 || n.charAt(0) === '.' || n === 'thumbs.db' || n === 'desktop.ini';
  }

  function startFolderSync() {
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.setAttribute('webkitdirectory', '');
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var files = input.files;
      input.remove();
      if (!files || !files.length) { toast('Thư mục trống hoặc chưa chọn thư mục.', 'err'); return; }
      var plan;
      try { plan = buildSyncPlan(files); } catch (e) { toast(e.message, 'err'); return; }
      openSyncPreview(plan);
    });
    input.click();
  }

  /** Ngày sửa đổi của file trên server (giờ Việt Nam) → ISO yyyy-mm-dd; trình duyệt không có thì ''. */
  function fileDay(ms) {
    if (!ms) return '';
    try { return new Date(ms).toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' }); }
    catch (e) { return new Date(ms + 7 * 3600000).toISOString().slice(0, 10); }
  }
  /** Ngày sẽ ghi nhận cho hồ sơ: ngày của file, không sau hôm nay, không trước lần thay đổi gần nhất (server kiểm tra lại y hệt). */
  function syncEffDate(sub, iso) {
    if (!iso) return S.today;
    if (iso > S.today) iso = S.today;
    if (sub) {
      var last = sub.createdAt || '';
      (S.histBySub[sub.id] || []).forEach(function (h) { if (h.date > last) last = h.date; });
      if (iso < last) iso = last;
    }
    return iso;
  }
  function keepLatest(map, key, iso) { if (iso && (!map[key] || iso > map[key])) map[key] = iso; }

  /** Đọc danh sách file, áp quy tắc thư mục → tình trạng, so với hồ sơ trên web. */
  function buildSyncPlan(files) {
    var dirKey = syncKey;
    var rules = S.cfg.folderSync.rules.map(function (r) {
      return { segs: r.path.split('/').map(dirKey), status: r.status };
    }).sort(function (a, b) { return b.segs.length - a.segs.length; });

    /** Quy tắc dài nhất khớp với đường dẫn; end = vị trí ngay sau thư mục tình trạng. */
    function ruleFor(dirs) {
      for (var i = 0; i < rules.length; i++) {
        var segs = rules[i].segs;
        for (var k = 0; k + segs.length <= dirs.length; k++) {
          var ok = true;
          for (var j = 0; j < segs.length && ok; j++) ok = dirs[k + j] === segs[j];
          if (ok) return { status: rules[i].status, end: k + segs.length };
        }
      }
      return null;
    }

    var webByKey = {};
    S.subs.forEach(function (s) { var k = syncKey(s.title); (webByKey[k] = webByKey[k] || []).push(s); });
    /** Tên trên web = tên file bỏ đuôi (.xlsx, .pdf…) hoặc tên thư mục hồ sơ; nếu web có nhập kèm đuôi thì vẫn khớp. */
    function webKey(name, isFile) {
      var k = syncKey(isFile ? stripExt(name) : name);
      if (webByKey[k]) return k;
      k = syncKey(name);
      return webByKey[k] ? k : null;
    }

    // Ký hiệu chuyên viên ở cuối tên (vd "..._TP_CQH", "... (CQH)") → tài khoản có ký hiệu đó.
    var byInitials = {};
    S.users.forEach(function (u) { if (u.initials && u.active) byInitials[String(u.initials).toUpperCase()] = u.username; });
    var INI_RE = /(?:[\s_\-]+\(?|\()([A-Za-z]{2,6})\)?\s*$/;
    function trailingInitials(base) {
      var m = base.match(INI_RE);
      var code = m && m[1].toUpperCase();
      return code && byInitials[code] ? { code: code, owner: byInitials[code], rest: base.slice(0, m.index) } : null;
    }

    // Tạo mới: chỉ file có ký hiệu cuối tên nằm trong danh sách cho phép (CQH, LDS, HTT, NSK, DNQ).
    var createIni = (S.cfg.folderSync.createInitials || []).map(function (c) { return String(c).toUpperCase(); });
    var fresh = {}, freshOthers = 0, noAccount = 0;

    var items = {};
    var total = 0, ignored = 0, notOnWeb = 0;
    for (var i = 0; i < files.length; i++) {
      var parts = String(files[i].webkitRelativePath || files[i].name).split('/');
      var name = parts.pop();
      if (isJunkFile(name)) continue;
      var day = fileDay(files[i].lastModified);
      total++;
      var rule = ruleFor(parts.map(dirKey));
      if (!rule) { ignored++; continue; }
      // Ứng viên: các thư mục con bên trong thư mục tình trạng (hồ sơ dạng thư mục) và chính file đó.
      var found = false;
      for (var d = rule.end; d <= parts.length; d++) {
        var isFile = d === parts.length;
        var raw = isFile ? name : parts[d];
        var ini = trailingInitials(isFile ? stripExt(raw) : raw);
        var key = webKey(raw, isFile);
        // Tên trên web có thể không kèm ký hiệu cuối: thử lại với phần tên trước ký hiệu.
        if (!key && ini) key = webKey(ini.rest, false);
        if (!key) continue;
        found = true;
        var where = (isFile ? parts : parts.slice(0, d + 1)).join('/') + (isFile ? '/' + name : '/');
        var it = items[key] || (items[key] = { key: key, title: key, statuses: [], paths: [], owners: [], codes: [], dates: {} });
        if (it.statuses.indexOf(rule.status) < 0) it.statuses.push(rule.status);
        keepLatest(it.dates, rule.status, day);
        if (it.paths.indexOf(where) < 0) it.paths.push(where);
        if (ini && it.owners.indexOf(ini.owner) < 0) { it.owners.push(ini.owner); it.codes.push(ini.code); }
      }
      if (!found) {
        var base = stripExt(name).replace(/\s+/g, ' ').trim();
        var fini = trailingInitials(base);
        var rawIni = (base.match(INI_RE) || [])[1];
        rawIni = rawIni ? rawIni.toUpperCase() : '';
        if (fini && createIni.indexOf(fini.code) >= 0) {
          if (!S.me.isManager && fini.owner !== S.me.username) { freshOthers++; continue; }
          var fk = syncKey(base);
          var fi = fresh[fk] || (fresh[fk] = { title: base, owner: fini.owner, code: fini.code, statuses: [], paths: [], dates: {} });
          if (fi.statuses.indexOf(rule.status) < 0) fi.statuses.push(rule.status);
          keepLatest(fi.dates, rule.status, day);
          fi.paths.push(parts.join('/') + '/' + name);
        } else if (rawIni && createIni.indexOf(rawIni) >= 0) noAccount++;
        else notOnWeb++;
      }
    }
    if (total === ignored) {
      throw new Error('Không thấy file nào trong các thư mục tình trạng. Hãy chọn đúng thư mục ' + S.cfg.folderSync.rootName + '.');
    }

    var plan = { changes: [], conflicts: [], dupWeb: [], owners: [], ownerAmbiguous: 0, notMine: 0, keptApproved: 0, same: 0, total: total, ignored: ignored, notOnWeb: notOnWeb, notInFolder: 0,
                 fresh: Object.keys(fresh).map(function (k) { return fresh[k]; }), freshOthers: freshOthers, noAccount: noAccount };
    Object.keys(items).forEach(function (k) {
      var it = items[k];
      var web = webByKey[k];
      if (web.length > 1) { plan.dupWeb.push({ item: it, subs: web }); return; }
      var sub = web[0];
      // Chuyên viên chỉ cập nhật được hồ sơ của mình; hồ sơ của người khác bỏ qua.
      if (!canEdit(sub)) { plan.notMine++; return; }
      if (S.me.isManager) {
        if (it.owners.length > 1) plan.ownerAmbiguous++;
        else if (it.owners.length === 1 && it.owners[0] !== sub.owner) plan.owners.push({ item: it, sub: sub, owner: it.owners[0], code: it.codes[0] });
      }
      // Hồ sơ đã duyệt trên web luôn giữ "Đã duyệt", dù file đang nằm ở thư mục khác.
      if (sub.status === S.cfg.approvedStatus) {
        if (it.statuses.length === 1 && it.statuses[0] === sub.status) plan.same++; else plan.keptApproved++;
        return;
      }
      if (it.statuses.length > 1) { plan.conflicts.push({ item: it, sub: sub }); return; }
      if (it.statuses[0] === sub.status) plan.same++;
      else plan.changes.push({ item: it, sub: sub, status: it.statuses[0], date: it.dates[it.statuses[0]] || '' });
    });
    plan.notInFolder = S.subs.filter(function (s) { return canEdit(s) && !items[syncKey(s.title)]; }).length;
    var byTitle = function (a, b) { return a.item.title.localeCompare(b.item.title, 'vi'); };
    plan.changes.sort(byTitle); plan.conflicts.sort(byTitle); plan.dupWeb.sort(byTitle); plan.owners.sort(byTitle);
    plan.fresh.sort(function (a, b) { return a.title.localeCompare(b.title, 'vi'); });
    S.syncPlan = plan;
    return plan;
  }

  function syncStatusSelect(attr, idx, statuses, withSkip) {
    return '<select ' + attr + '="' + idx + '">' + (withSkip ? '<option value="">— Bỏ qua —</option>' : '') +
      statuses.map(function (c) { return '<option value="' + c + '">' + esc(statusOf(c).label) + '</option>'; }).join('') + '</select>';
  }
  function syncSection(title, count, inner, open, note) {
    return '<details class="sync-sec"' + (open ? ' open' : '') + '><summary>' + title + ' <span class="sync-count">' + count + '</span></summary>' +
      (note ? '<p class="muted sync-note">' + note + '</p>' : '') + inner + '</details>';
  }

  function openSyncPreview(plan) {
    var changes = plan.changes.length ? '<div class="table-wrap"><table class="grid"><thead><tr>' +
      '<th class="center"><input type="checkbox" checked data-change="sync-all" aria-label="Chọn tất cả"></th>' +
      '<th>Hồ sơ</th><th>Trên web</th><th></th><th>Theo thư mục</th><th>Ngày ghi nhận</th></tr></thead><tbody>' +
      plan.changes.map(function (c, i) {
        return '<tr><td class="center"><input type="checkbox" checked data-sync-change="' + i + '"></td>' +
          '<td class="title-cell">' + esc(c.sub.title) + '<div class="code">' + esc(c.sub.id) + ' · ' + esc(userName(c.sub.owner)) + '</div></td>' +
          '<td>' + statusBadge(c.sub.status) + '</td><td>→</td><td>' + statusBadge(c.status) + '</td>' + syncDateCell(c.sub, c.date) + '</tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">Không có hồ sơ nào cần đổi tình trạng.</div>';

    var freshTbl = plan.fresh.length ? '<div class="table-wrap"><table class="grid"><thead><tr>' +
      '<th class="center"><input type="checkbox" checked data-change="sync-all-new" aria-label="Chọn tất cả"></th>' +
      '<th>Tên hồ sơ (theo tên file)</th><th>Tình trạng</th><th>Chuyên viên</th><th>Ngày ghi nhận</th></tr></thead><tbody>' +
      plan.fresh.map(function (it, i) {
        return '<tr><td class="center"><input type="checkbox" checked data-sync-new="' + i + '"></td>' +
          '<td class="title-cell">' + esc(it.title) + '</td>' +
          '<td>' + (it.statuses.length > 1 ? syncStatusSelect('data-sync-nstatus', i, it.statuses, true) : statusBadge(it.statuses[0])) + '</td>' +
          '<td class="nowrap"><b>' + esc(userName(it.owner)) + '</b> <span class="proj-code">' + esc(it.code) + '</span></td>' +
          syncDateCell(null, it.statuses.length > 1 ? '' : it.dates[it.statuses[0]]) + '</tr>';
      }).join('') + '</tbody></table></div>' : '';

    var ownersTbl = plan.owners.length ? '<div class="table-wrap"><table class="grid"><thead><tr><th class="center">Đổi</th>' +
      '<th>Hồ sơ</th><th>Chuyên viên trên web</th><th></th><th>Theo ký hiệu cuối tên file</th></tr></thead><tbody>' +
      plan.owners.map(function (c, i) {
        return '<tr><td class="center"><input type="checkbox" data-sync-owner="' + i + '"></td>' +
          '<td class="title-cell">' + esc(c.sub.title) + '<div class="code">' + esc(c.sub.id) + '</div></td>' +
          '<td class="nowrap">' + esc(userName(c.sub.owner)) + '</td><td>→</td>' +
          '<td class="nowrap"><b>' + esc(userName(c.owner)) + '</b> <span class="proj-code">' + esc(c.code) + '</span></td></tr>';
      }).join('') + '</tbody></table></div>' : '';

    var conflicts = plan.conflicts.length ? '<div class="table-wrap"><table class="grid"><thead><tr><th>Hồ sơ</th><th>Trên web</th><th>Chọn tình trạng</th></tr></thead><tbody>' +
      plan.conflicts.map(function (c, i) {
        return '<tr><td class="title-cell">' + esc(c.sub.title) + '<div class="code">' + c.item.paths.map(esc).join('<br>') + '</div></td>' +
          '<td>' + statusBadge(c.sub.status) + '</td><td>' + syncStatusSelect('data-sync-conflict', i, c.item.statuses, true) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '';

    var dup = plan.dupWeb.length ? '<ul class="sync-list">' + plan.dupWeb.map(function (d) {
      return '<li><b>' + esc(d.item.title) + '</b> — ' + d.subs.map(function (s) { return esc(s.id); }).join(', ') + '</li>';
    }).join('') + '</ul>' : '';

    var summary = '<div class="meta-grid">' +
      '<div><small>File đã đọc</small>' + fmtNum(plan.total) + '</div>' +
      '<div><small>Đổi tình trạng</small>' + plan.changes.length + '</div>' +
      '<div><small>Không đổi</small>' + plan.same + '</div>' +
      (plan.keptApproved ? '<div><small>Đã duyệt – giữ nguyên</small>' + plan.keptApproved + '</div>' : '') +
      (S.me.isManager ? '<div><small>Lệch chuyên viên</small>' + plan.owners.length + '</div>' : '') +
      (plan.notMine ? '<div><small>Hồ sơ của người khác (bỏ qua)</small>' + plan.notMine + '</div>' : '') +
      '<div><small>Tạo mới (có ký hiệu)</small>' + plan.fresh.length + '</div>' +
      '<div><small>Chưa có trên web, không ký hiệu (bỏ qua)</small>' + fmtNum(plan.notOnWeb) + '</div>' +
      (plan.freshOthers ? '<div><small>Ký hiệu của người khác (bỏ qua)</small>' + plan.freshOthers + '</div>' : '') +
      (plan.noAccount ? '<div><small>Ký hiệu chưa gán tài khoản (bỏ qua)</small>' + plan.noAccount + '</div>' : '') +
      '<div><small>Thư mục khác (bỏ qua)</small>' + fmtNum(plan.ignored) + '</div></div>';

    openModal(modalHead('Xem trước đồng bộ') + '<div class="modal-body"><div id="m-err"></div>' + summary +
      syncSection('Đổi tình trạng', plan.changes.length, changes, true) +
      (plan.fresh.length ? syncSection('Tạo mới trên web (file có ký hiệu ' + esc((S.cfg.folderSync.createInitials || []).join(', ')) + ')', plan.fresh.length, freshTbl, true,
        'File chưa có trên web, tên kết thúc bằng ký hiệu chuyên viên → tạo hồ sơ mới gán cho chuyên viên đó, tình trạng theo thư mục. Bỏ tích file không muốn tạo.' +
        (plan.fresh.some(function (it) { return it.statuses.length > 1; }) ? ' File nằm ở nhiều thư mục: chọn tình trạng hoặc bỏ qua.' : '')) : '') +
      (plan.owners.length ? syncSection('Đổi chuyên viên phụ trách (theo ký hiệu cuối tên file)', plan.owners.length, ownersTbl, true,
        'Ký hiệu ở cuối tên file khác chuyên viên đang phụ trách trên web. Mặc định giữ nguyên — tích ô "Đổi" để chuyển hồ sơ sang chuyên viên theo ký hiệu.' +
        (plan.ownerAmbiguous ? ' (' + plan.ownerAmbiguous + ' hồ sơ có nhiều ký hiệu khác nhau ở các file cùng tên: bỏ qua.)' : '')) : '') +
      (plan.conflicts.length ? syncSection('Nằm ở nhiều thư mục', plan.conflicts.length, conflicts, true,
        'File cùng tên nằm ở nhiều thư mục tình trạng. Chọn tình trạng đúng hoặc bỏ qua.') : '') +
      (plan.dupWeb.length ? syncSection('Trùng tên trên web (bỏ qua)', plan.dupWeb.length, dup, false,
        'Có nhiều hồ sơ trên web cùng tên nên không biết cập nhật hồ sơ nào. Hãy đổi tên cho khác nhau.') : '') +
      '<div class="info-box" style="margin-top:14px">' + fmtNum(plan.notInFolder) + ' hồ sơ trên web không thấy trong thư mục: giữ nguyên. ' +
      'Hồ sơ đã duyệt luôn giữ "Đã duyệt" khi đồng bộ' + (plan.keptApproved ? ' (' + plan.keptApproved + ' hồ sơ có file ở thư mục khác)' : '') + '.</div>' +
      '<label class="check sync-date-opt"><input type="checkbox" id="m-sync-filedate" checked><span>Ghi nhận theo <b>ngày sửa đổi của file trên server</b> ' +
      '(cột "Ngày ghi nhận"; không sau hôm nay, không trước lần thay đổi gần nhất của hồ sơ, dấu * = đã điều chỉnh). Bỏ tích → ghi nhận ngày hôm nay (' + fmtDate(S.today) + ').</span></label></div>' +
      '<div class="modal-foot"><button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" style="min-height:42px;font-size:16px" data-act="submit-sync">' + ic('check') + 'Xác nhận cập nhật</button></div>', true);
  }

  /** Ô "Ngày ghi nhận" trong bảng xem trước: ngày sẽ ghi (theo file), ghi chú nếu khác ngày file. */
  function syncDateCell(sub, iso) {
    if (!iso) return '<td class="nowrap muted" title="Không đọc được ngày của file — ghi nhận ngày hôm nay">' + fmtDate(S.today) + '</td>';
    var eff = syncEffDate(sub, iso);
    return '<td class="nowrap"' + (eff !== iso ? ' title="Ngày của file: ' + fmtDate(iso) + ' — điều chỉnh để không sớm hơn lần thay đổi gần nhất / không sau hôm nay"' : '') + '>' +
      fmtDate(eff) + (eff !== iso ? ' <span class="muted">*</span>' : '') + '</td>';
  }

  function collectSync() {
    var plan = S.syncPlan;
    var fileDate = !!(modalRoot.querySelector('#m-sync-filedate') || {}).checked;
    var q = function (sel) { return Array.prototype.slice.call(modalRoot.querySelectorAll(sel)); };
    var changes = q('[data-sync-change]:checked').map(function (el) {
      var c = plan.changes[+el.dataset.syncChange];
      return { id: c.sub.id, from: c.sub.status, status: c.status, date: fileDate ? c.date : '' };
    });
    q('[data-sync-conflict]').forEach(function (el) {
      var c = plan.conflicts[+el.dataset.syncConflict];
      if (el.value && el.value !== c.sub.status) changes.push({ id: c.sub.id, from: c.sub.status, status: el.value, date: fileDate ? (c.item.dates[el.value] || '') : '' });
    });
    var owners = q('[data-sync-owner]:checked').map(function (el) {
      var c = plan.owners[+el.dataset.syncOwner];
      return { id: c.sub.id, from: c.sub.owner, owner: c.owner };
    });
    var creates = [];
    q('[data-sync-new]:checked').forEach(function (el) {
      var i = el.dataset.syncNew, it = plan.fresh[+i];
      var sel = modalRoot.querySelector('[data-sync-nstatus="' + i + '"]');
      var st = sel ? sel.value : it.statuses[0];
      if (st) creates.push({ title: it.title, owner: it.owner, status: st, date: fileDate ? (it.dates[st] || '') : '' });
    });
    return { changes: changes, owners: owners, creates: creates };
  }

  function matrixCard(scope) {
    var f = getFilter('manager');
    var owners = ownerOptions().map(function (o) { return o.value; });
    if (f.owners.length) owners = owners.filter(function (o) { return f.owners.indexOf(o) >= 0; });
    var sts = S.cfg.statuses;
    var totals = sts.map(function () { return 0; });
    var rowsHtml = owners.map(function (o) {
      var mine = scope.filter(function (s) { return s.owner === o; });
      var cells = sts.map(function (st, i) {
        var n = mine.filter(function (s) { return s.status === st.code; }).length;
        totals[i] += n;
        return n ? '<td class="cell" data-act="matrix-cell" data-owner="' + esc(o) + '" data-status="' + st.code + '" style="background:' + st.color + '22;font-weight:800" title="Lọc: ' + esc(userName(o)) + ' – ' + esc(st.label) + '">' + n + '</td>'
          : '<td class="cell zero">0</td>';
      }).join('');
      return '<tr><td class="nowrap"><b>' + esc(userName(o)) + '</b></td>' + cells + '<td class="num"><b>' + mine.length + '</b></td></tr>';
    }).join('');
    var grand = totals.reduce(function (a, b) { return a + b; }, 0);
    var body = owners.length ? '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Chuyên viên</th>' +
      sts.map(function (st) { return '<th class="center"><span class="dot" style="background:' + st.color + ';margin-right:6px"></span>' + esc(st.short) + '</th>'; }).join('') +
      '<th class="num">Tổng</th></tr></thead><tbody>' + rowsHtml + '</tbody><tfoot><tr><td>Tổng cộng</td>' +
      totals.map(function (t) { return '<td class="center">' + t + '</td>'; }).join('') + '<td class="num">' + grand + '</td></tr></tfoot></table></div>' +
      '<p class="muted" style="margin:10px 0 0">Bấm vào một ô để lọc bảng tổng hợp theo chuyên viên và tình trạng tương ứng.</p>'
      : '<div class="empty">Chưa có chuyên viên nào.</div>';
    return card('manager-matrix', 'Chuyên viên × Tình trạng', body, { collapsible: true });
  }

  /* ---------- Trình duyệt / Báo cáo ---------- */
  function typeCard(scope) {
    var f = getFilter('manager');
    var types = S.cfg.docTypes || [];
    var sts = S.cfg.statuses;
    var selT = f.types.length === 1 ? f.types[0] : null;
    var by = function (list, t) { return list.filter(function (s) { return s._type === t; }); };
    var pending = function (list) { return list.filter(function (s) { return S.cfg.submittingStatuses.indexOf(s.status) >= 0; }).length; };
    function link(n, attrs, strong) {
      return n ? '<td class="cell" data-act="type-filter"' + attrs + '>' + (strong ? '<b>' + fmtNum(n) + '</b>' : fmtNum(n)) + '</td>' : '<td class="cell zero">0</td>';
    }

    var tiles = '<button class="tile' + (!f.types.length ? ' selected' : '') + '" data-act="type-filter" data-type="">' +
      '<div class="circle" style="background:#1E2B59">' + fmtNum(scope.length) + '</div><div class="tlabel">Tổng hồ sơ</div></button>' +
      types.map(function (t) {
        var list = by(scope, t.code);
        var pct = scope.length ? Math.round(list.length * 100 / scope.length) : 0;
        return '<button class="tile' + (selT === t.code ? ' selected' : '') + '" data-act="type-filter" data-type="' + t.code + '">' +
          '<div class="circle" style="background:' + t.color + '">' + fmtNum(list.length) + '</div>' +
          '<div class="tlabel">' + esc(t.label) + '<small>' + pct + '% · ' + pending(list) + ' đang trình</small></div></button>';
      }).join('');

    var byStatus = '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Loại</th>' +
      sts.map(function (st) { return '<th class="center"><span class="dot" style="background:' + st.color + ';margin-right:6px"></span>' + esc(st.short) + '</th>'; }).join('') +
      '<th class="num">Tổng</th></tr></thead><tbody>' +
      types.map(function (t) {
        var list = by(scope, t.code);
        return '<tr><td class="nowrap">' + typeBadge(t.code) + '</td>' + sts.map(function (st) {
          return link(list.filter(function (s) { return s.status === st.code; }).length, ' data-type="' + t.code + '" data-status="' + st.code + '"');
        }).join('') + link(list.length, ' data-type="' + t.code + '"', true) + '</tr>';
      }).join('') + '</tbody><tfoot><tr><td>Tổng cộng</td>' + sts.map(function (st) {
        return link(scope.filter(function (s) { return s.status === st.code; }).length, ' data-type="" data-status="' + st.code + '"');
      }).join('') + link(scope.length, ' data-type=""', true) + '</tr></tfoot></table></div>';

    var owners = ownerOptions().map(function (o) { return o.value; });
    if (f.owners.length) owners = owners.filter(function (o) { return f.owners.indexOf(o) >= 0; });
    var byOwner = '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Chuyên viên</th>' +
      types.map(function (t) { return '<th class="center">' + typeBadge(t.code) + '</th><th class="center muted-th">Đang trình</th>'; }).join('') +
      '<th class="num">Tổng</th></tr></thead><tbody>' +
      owners.map(function (o) {
        var mine = scope.filter(function (s) { return s.owner === o; });
        return '<tr><td class="nowrap"><b>' + esc(userName(o)) + '</b></td>' + types.map(function (t) {
          var list = by(mine, t.code);
          return link(list.length, ' data-type="' + t.code + '" data-owner="' + esc(o) + '"', true) +
            '<td class="center muted">' + (pending(list) || '–') + '</td>';
        }).join('') + link(mine.length, ' data-type="" data-owner="' + esc(o) + '"', true) + '</tr>';
      }).join('') + '</tbody></table></div>';

    var body = '<div class="tiles type-tiles">' + tiles + '</div>' +
      '<div class="type-grid"><div><p class="sub-title">Theo tình trạng</p>' + byStatus + '</div>' +
      '<div><p class="sub-title">Theo chuyên viên</p>' + byOwner + '</div></div>' +
