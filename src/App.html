      '<div class="form-row"><label for="m-note">Ghi chú (không bắt buộc)</label><textarea id="m-note"></textarea></div>' +
      '<div class="info-box">Ngày tạo và ngày cập nhật được ghi nhận tự động: <b>' + fmtDate(S.today) + '</b></div></div>' +
      '<div class="modal-foot"><button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" style="min-height:42px;font-size:16px" data-act="submit-create">' + ic('check') + 'Tạo hồ sơ</button></div>');
  }

  function openUpdate(id) {
    var s = findSub(id);

    openModal(modalHead('Cập nhật hồ sơ') + '<div class="modal-body"><div id="m-err"></div>' + metaGrid(s) +
      '<div class="form-row"><label for="m-title">Tên hồ sơ</label><input type="text" id="m-title" maxlength="' + S.cfg.maxTitleLength + '" value="' + esc(s.title) + '"></div>' +
      '<div class="form-row"><label>Tình trạng</label>' + statusPicker(s.status) + '</div>' +
      '<div class="form-row"><label for="m-note">Ghi chú (không bắt buộc)</label><textarea id="m-note" placeholder="Ví dụ: lý do trả lại, nội dung cần bổ sung…"></textarea></div>' +
      '<div class="info-box">Ngày ghi nhận thay đổi: <b>' + fmtDate(S.today) + '</b> (tự động theo ngày hệ thống)</div></div>' +
      '<div class="modal-foot">' + (S.me.isAdmin ? '<button class="danger-btn left" data-act="delete-sub" data-id="' + esc(s.id) + '">Xóa hồ sơ</button>' : '') +
      '<button class="secondary-btn" data-act="open-history" data-id="' + esc(s.id) + '">' + ic('history') + 'Lịch sử</button>' +
      '<button class="secondary-btn" data-act="close-modal">Hủy</button>' +
      '<button class="primary-btn" style="min-height:42px;font-size:16px" data-act="submit-update" data-id="' + esc(s.id) + '">' + ic('check') + 'Lưu</button></div>', true);
  }

  function openHistory(id) {
    var s = findSub(id);
    if (!s) return;
    var hs = (S.histBySub[id] || []).slice().reverse();
    var list = hs.length ? '<ul class="timeline">' + hs.map(function (h) {
      return '<li><span class="tl-dot" style="background:' + statusOf(h.toStatus).color + '"></span><div class="tl-date">' + fmtDate(h.date) + '</div>' +
        '<div class="tl-text">' + historyText(h) + '</div>' + (h.note ? '<div class="tl-note">' + esc(h.note) + '</div>' : '') + '</li>';
    }).join('') + '</ul>' : '<div class="empty">Chưa có lịch sử.</div>';
    openModal(modalHead('Lịch sử hồ sơ') + '<div class="modal-body"><h3 style="margin:0 0 6px">' + esc(s.title) + '</h3>' +
      '<div style="margin-bottom:14px">' + statusBadge(s.status) + '</div>' + metaGrid(s) + list + '</div>' +
      '<div class="modal-foot">' + (canEdit(s) ? '<button class="primary-btn" style="min-height:42px;font-size:16px" data-act="open-update" data-id="' + esc(s.id) + '">' + ic('edit') + 'Cập nhật</button>' : '<span class="muted left">Bạn chỉ được xem hồ sơ này.</span>') +
      '<button class="secondary-btn" data-act="close-modal">Đóng</button></div>', true);
  }

      '<li>Hồ sơ có cụm <b>"xin ý kiến"</b> trong tên (ví dụ "(Trình xin ý kiến)") được tính là <b>Báo cáo</b>, còn lại là <b>Trình duyệt</b>; lọc theo ô "Loại hồ sơ".</li>' +
      '<li>Trưởng phòng dùng <b>Đồng bộ từ thư mục</b> (Dashboard Trưởng phòng) để cập nhật tình trạng theo thư mục hồ sơ trên ổ chia sẻ: ' +
      'tên hồ sơ trên web phải trùng tên file (không cần đuôi file, không phân biệt chữ hoa/thường); file không có trên web được bỏ qua.</li>' +

  }
  function loginLayout(inner, msg) {
    var cfg = S.cfg || {};

      '<h1>Hello!</h1><p class="welcome">Chào mừng bạn đến với<br><b>' + esc(cfg.appName || 'CENTRAL PROCUREMENT DEPARTMENT') + '</b></p>' + inner.replace('%MSG%',
        msg ? '<div class="login-msg ' + (msg.type === 'err' ? 'err' : 'info') + '" role="alert">' + esc(msg.text) + '</div>' : '') + '</div>';

    S.me = null;

    root.innerHTML = loginLayout(
      '<p class="hint">Hãy đăng nhập tài khoản của bạn.</p><form id="login-form" autocomplete="on">%MSG%' +
      '<div class="login-field">' + ic('user') + '<input id="lg-user" name="username" placeholder="Tài khoản" autocomplete="username" autocapitalize="off" value="' + esc(remembered) + '"></div>' +

      '<button type="button" class="eye" data-act="toggle-pass" data-target="lg-pass" aria-label="Hiện mật khẩu">' + ic('eye') + '</button></div>' +

      '<div class="login-actions"><button class="btn-login" type="submit" id="lg-btn">' + ic('check') + 'Đăng nhập</button></div>' +
      '<div class="login-divider"></div><div class="login-links"><a data-act="forgot">Quên mật khẩu</a><a data-act="helpdesk">Helpdesk</a></div></form>', msg);

      '<form id="force-form">%MSG%' +
      '<div class="login-field">' + ic('key') + '<input id="fc-old" type="password" placeholder="Mật khẩu tạm hiện tại" autocomplete="current-password"></div>' +
      '<div class="login-field">' + ic('key') + '<input id="fc-new" type="password" placeholder="Mật khẩu mới (≥ ' + ((S.cfg && S.cfg.minPasswordLength) || 6) + ' ký tự)" autocomplete="new-password"></div>' +

      '<div class="login-divider"></div><div class="login-links"><a data-act="logout">Đăng xuất</a><a data-act="helpdesk">Helpdesk</a></div></form>', msg);

  function clearSession() {
    S.token = null; S.me = null; S.adminUsers = null; S.filters = {};
    store.del('hs_token');
  }

  function loadAll(silent) {
    return call('bootstrap').then(function (d) {
      S.me = d.me; S.cfg = d.config; S.today = d.today;
      S.users = d.users; S.subs = d.submissions; S.hist = d.history; S.projects = d.projects || [];
      S.folderSync = d.folderSync || null;
      derive();
      render();
      if (!silent) document.title = S.cfg.appName;
    });
  }

  function doLogin() {
    var u = document.getElementById('lg-user').value.trim();
    var p = document.getElementById('lg-pass').value;
    var remember = document.getElementById('lg-remember').checked;
    if (!u || !p) { renderLogin({ type: 'err', text: 'Vui lòng nhập tài khoản và mật khẩu.' }); return; }
    var btn = document.getElementById('lg-btn');
    btn.disabled = true;
    call('login', { username: u, password: p }).then(function (r) {
      S.token = r.token; S.me = r.me;
      store.set('hs_token', r.token);
      if (remember) store.set('hs_remember', u); else store.del('hs_remember');
      S.view = r.me.isManager && r.me.position !== 'CV' ? 'manager' : 'home';
      if (r.me.mustChangePassword) renderForceChange();
      else return loadAll().then(function () { window.scrollTo(0, 0); });
    }).catch(function (err) {
      renderLogin({ type: 'err', text: err.message });
      var pf = document.getElementById('lg-pass');
      if (pf) pf.focus();
    });
  }

  function doForceChange() {
    var o = document.getElementById('fc-old').value;
    var n = document.getElementById('fc-new').value;
    var n2 = document.getElementById('fc-new2').value;
    if (n !== n2) { renderForceChange({ type: 'err', text: 'Mật khẩu nhập lại không khớp.' }); return; }
    document.getElementById('fc-btn').disabled = true;
    call('changePassword', { oldPassword: o, newPassword: n }).then(function () {
      toast('Đã đổi mật khẩu thành công.');
      return loadAll();
    }).catch(function (err) {
      if (err.code === 'AUTH') return handleErr(err);
      renderForceChange({ type: 'err', text: err.message });
    });
  }

  function logout() {
    var t = S.token;
    clearSession();
    renderLogin({ type: 'info', text: 'Bạn đã đăng xuất.' });
    if (t) {
      google.script.run.withFailureHandler(function () {}).api('logout', t, null);
    }
  }

  /* =====================================================================
   * Cập nhật dữ liệu sau thao tác
   * ===================================================================== */
  function patchData(r) {
    var s = r.submission;
    var i = S.subs.findIndex(function (x) { return x.id === s.id; });
    if (i >= 0) S.subs[i] = s; else S.subs.push(s);
    (r.history || []).forEach(function (h) { S.hist.push(h); });
    derive();
    render();
  }
  function upsertPublicUser(u) {
    var pub = { username: u.username, displayName: u.displayName, position: u.position, isAdmin: u.isAdmin, active: u.active };
    var i = S.users.findIndex(function (x) { return x.username === u.username; });
    if (i >= 0) S.users[i] = pub; else S.users.push(pub);
    var j = S.adminUsers.findIndex(function (x) { return x.username === u.username; });
    if (j >= 0) S.adminUsers[j] = u; else S.adminUsers.push(u);
    if (u.username === S.me.username) {
      S.me.displayName = u.displayName; S.me.position = u.position; S.me.isAdmin = u.isAdmin;
      S.me.isManager = u.isAdmin || S.cfg.positions.some(function (p) { return p.code === u.position && p.manager; });
    }
    derive();
    render();
  }
  function busy(btn, on) { if (btn) btn.disabled = on; }

  /* =====================================================================
   * Xử lý sự kiện (event delegation)
   * ===================================================================== */
  var ACTIONS = {
    'nav': function (el) {
      S.view = el.dataset.view; S.open = null;
      if (window.innerWidth <= 1000) S.collapsed = true;
      closeModal(); render(); window.scrollTo(0, 0);
    },
    'go-dashboard': function () { ACTIONS.nav({ dataset: { view: S.me.isManager ? 'manager' : 'home' } }); },
    'toggle-side': function () { S.collapsed = !S.collapsed; render(); setTimeout(function () { S.charts.forEach(function (c) { c.resize(); }); }, 250); },
    'toggle-dd': function (el) { S.open = S.open === el.dataset.dd ? null : el.dataset.dd; render(); },
    'reload': function () { loadAll(true).then(function () { toast('Đã cập nhật dữ liệu mới nhất.'); }).catch(handleErr); },
    'run-report': function () { S.open = null; loadAll(true).then(function () { toast('Đã chạy báo cáo với dữ liệu mới nhất.'); }).catch(handleErr); },
    'help': function () { openHelp(); },
    'logout': function () { closeModal(); logout(); },
    'change-password': function () { S.open = null; render(); openChangePassword(); },
    'cal-nav': function (el) {
      var k = S.calMonth[el.dataset.dd];
      var y = +k.slice(0, 4), m = +k.slice(5, 7) + Number(el.dataset.dir);
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      S.calMonth[el.dataset.dd] = y + '-' + ('0' + m).slice(-2);
      render();
    },
    'cal-pick': function (el) {
      S.open = null;
      var box = document.getElementById('f-' + el.dataset.view + '-' + el.dataset.field);
      if (box) box.closest('.field').classList.remove('invalid');
      if (getFilter(el.dataset.view)[el.dataset.field] === el.dataset.date) render();
      else setDateFilter(el.dataset.view, el.dataset.field, el.dataset.date);
    },
    'reset-filter': function (el) {
      S.filters[el.dataset.view] = defaultFilter(el.dataset.view);
      resetPage(el.dataset.view);
      S.open = null; render();
    },
    'ms-all': function (el) {
      var opts = el.dataset.field === 'owners' ? ownerOptions() : el.dataset.field === 'types' ? typeOptions() :
        el.dataset.field === 'projects' ? projectOptions() : statusOptions();
      getFilter(el.dataset.view)[el.dataset.field] = opts.map(function (o) { return o.value; });
      resetPage(el.dataset.view); render();
    },
    'ms-none': function (el) { getFilter(el.dataset.view)[el.dataset.field] = []; resetPage(el.dataset.view); render(); },
    'tile': function (el) {
      var f = getFilter(el.dataset.view);
      var code = el.dataset.status;
      f.statuses = !code || (f.statuses.length === 1 && f.statuses[0] === code) ? [] : [code];
      resetPage(el.dataset.view); render();
    },
    'proj-filter': function (el) {
      var f = getFilter('manager');
      f.projects = [el.dataset.project];
      f.types = el.dataset.type ? [el.dataset.type] : [];
      f.statuses = el.dataset.statuses ? el.dataset.statuses.split(',') : [];
      resetPage('manager'); render();
      var target = document.getElementById('card-manager-detail');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    'type-filter': function (el) {
      var f = getFilter('manager');
      var t = el.dataset.type;
      f.types = t ? [t] : [];
      if (el.dataset.status !== undefined) f.statuses = el.dataset.status ? [el.dataset.status] : [];
      if (el.dataset.owner !== undefined) f.owners = [el.dataset.owner];
      resetPage('manager'); render();
      if (el.tagName === 'TD') {
        var target = document.getElementById('card-manager-detail');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    },
    'matrix-cell': function (el) {
      var f = getFilter('manager');
      f.owners = [el.dataset.owner]; f.statuses = [el.dataset.status];
      resetPage('manager'); render();
      var target = document.getElementById('card-manager-detail');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    'sort': function (el) {
      var v = el.dataset.view, k = el.dataset.key;
      var st = S.sorts[v] || {};
      S.sorts[v] = { key: k, dir: st.key === k && st.dir === 'desc' ? 'asc' : (st.key === k ? 'desc' : (k === 'title' || k === 'owner' || k === 'status' ? 'asc' : 'desc')) };
      render();
    },
    'group-by': function (el) { S.groupBy[el.dataset.view] = el.dataset.mode; render(); },
    'sub-gran': function (el) { S.subGran = el.dataset.gran; S.subSel = null; render(); },
    'sub-dim': function (el) { S.subDim = el.dataset.dim; S.subSel = null; render(); },
    'sub-cell': function (el) {
      var r = el.dataset.row, p = el.dataset.period, dim = S.subDim || 'owner';
      S.subSel = S.subSel && S.subSel.dim === dim && S.subSel.row === r && S.subSel.period === p ? null : { dim: dim, row: r, period: p };
      render();
      var d = document.getElementById('sub-detail');
      if (d) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },
    'sub-close': function () { S.subSel = null; render(); },
    'card-collapse': function (el) { var st = S.cardState[el.dataset.key] = S.cardState[el.dataset.key] || {}; st.collapsed = !st.collapsed; render(); },
    'card-full': function (el) { var st = S.cardState[el.dataset.key] = S.cardState[el.dataset.key] || {}; st.full = !st.full; render(); },
    'export-csv': function (el) { exportCsv(el.dataset.view); },
    'open-create': function () { openCreate(); },
    'open-update': function (el) { S.open = null; openUpdate(el.dataset.id); },
    'open-history': function (el) { if (S.open) { S.open = null; render(); } openHistory(el.dataset.id); },
    'close-modal': function () { closeModal(); },
    'folder-sync': function () { startFolderSync(); },
    'submit-sync': function (el) {
      var changes = collectSync();
      if (!changes.length) { modalError('Không có thay đổi nào được chọn.'); return; }
      busy(el, true);
      call('folderSync', { changes: changes }).then(function (r) {
        closeModal();
        r.submissions.forEach(function (s) {
          var i = S.subs.findIndex(function (x) { return x.id === s.id; });
          if (i >= 0) S.subs[i] = s;
        });
        r.history.forEach(function (h) { S.hist.push(h); });
        S.folderSync = r.folderSync;
        derive(); render();
        var msg = 'Đồng bộ xong: ' + r.folderSync.changed + ' hồ sơ đổi tình trạng.';
        if (r.skipped.length) msg += ' Bỏ qua ' + r.skipped.length + ': ' + r.skipped.slice(0, 3).map(function (s) { return s.title + ' (' + s.reason + ')'; }).join('; ');
        toast(msg, r.skipped.length ? 'err' : '');
      }).catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'modal-bg': function (el, e) { if (e.target === el) closeModal(); },
    'submit-create': function (el) {
      var title = document.getElementById('m-title').value;
      if (!title.trim()) { modalError('Vui lòng nhập tên hồ sơ.'); return; }
      busy(el, true);
      call('createSub', { title: title, status: pickedStatus(), note: document.getElementById('m-note').value })
        .then(function (r) { closeModal(); toast('Đã tạo hồ sơ ' + r.submission.id + '.'); patchData(r); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'submit-update': function (el) {
      busy(el, true);
      call('updateSub', { id: el.dataset.id, status: pickedStatus(), title: document.getElementById('m-title').value, note: document.getElementById('m-note').value })
        .then(function (r) { closeModal(); toast('Đã cập nhật hồ sơ ' + r.submission.id + '.'); patchData(r); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'delete-sub': function (el) {
      if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Bấm lần nữa để xác nhận xóa'; return; }
      busy(el, true);
      call('deleteSub', { id: el.dataset.id })
        .then(function () { closeModal(); toast('Đã xóa hồ sơ.'); return loadAll(true); })
        .catch(function (err) { busy(el, false); modalError(err.message); });
    },
    'submit-password': function (el) {
      var o = document.getElementById('m-old').value, n = document.getElementById('m-new').value, n2 = document.getElementById('m-new2').value;
      if (n !== n2) { modalError('Mật khẩu nhập lại không khớp.'); return; }
      busy(el, true);
      call('changePassword', { oldPassword: o, newPassword: n })
        .then(function () { closeModal(); toast('Đã đổi mật khẩu thành công.'); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'new-user': function () { openUserForm(null); },
    'new-project': function () { openProjectForm(null); },
    'edit-project': function (el) { openProjectForm(el.dataset.code); },
    'import-projects': function () { openProjectImport(); },
    'submit-project': function (el) {
      var isNew = el.dataset.mode === 'new';
      busy(el, true);
      call('saveProject', { isNew: isNew, code: document.getElementById('m-pcode').value, name: document.getElementById('m-pname').value,
                            active: document.getElementById('m-pactive').checked })
        .then(function (r) { closeModal(); toast(isNew ? 'Đã thêm dự án.' : 'Đã lưu dự án.'); applyProjects(r.projects); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'submit-import': function (el) {
      busy(el, true);
      call('importProjects', { text: document.getElementById('m-plines').value })
        .then(function (r) {
          closeModal();
          toast('Đã nhập: ' + r.added + ' dự án mới, ' + r.updated + ' cập nhật, ' + r.unchanged + ' không đổi' +
            (r.invalid.length ? '; bỏ qua ' + r.invalid.length + ' dòng sai dạng (vd "' + r.invalid[0] + '")' : '') + '.', r.invalid.length ? 'err' : '');
          applyProjects(r.projects);
        })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'edit-user': function (el) { openUserForm(el.dataset.u); },
    'reset-user': function (el) { openResetPassword(el.dataset.u); },
    'gen-pw': function (el) { document.getElementById(el.dataset.target).value = randomPassword(); },
    'submit-user': function (el) {
      var isNew = el.dataset.mode === 'new';
      var payload = {
        username: document.getElementById('m-username').value,
        displayName: document.getElementById('m-name').value,
        position: document.getElementById('m-pos').value,
        isAdmin: document.getElementById('m-admin').checked
      };
      if (isNew) payload.password = document.getElementById('m-pw').value;
      else payload.active = document.getElementById('m-active').checked;
      busy(el, true);
      call(isNew ? 'createUser' : 'updateUser', payload)
        .then(function (u) { closeModal(); toast(isNew ? 'Đã tạo tài khoản ' + u.username + '.' : 'Đã lưu tài khoản ' + u.username + '.'); upsertPublicUser(u); })
        .catch(function (err) { busy(el, false); if (err.code === 'AUTH') handleErr(err); else modalError(err.message); });
    },
    'submit-reset': function (el) {
      busy(el, true);
      call('resetPassword', { username: el.dataset.u, password: document.getElementById('m-pw').value })
        .then(function (u) { closeModal(); toast('Đã đặt lại mật khẩu cho ' + u.username + '.'); upsertPublicUser(u); })
        .catch(function (err) { busy(el, false); modalError(err.message); });
    },
    'toggle-pass': function (el) {
      var input = document.getElementById(el.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    },
    'forgot': function () { renderLogin({ type: 'info', text: 'Vui lòng liên hệ quản trị viên để được đặt lại mật khẩu.' }); },
    'helpdesk': function () {
      var text = (S.cfg && S.cfg.helpdesk) || 'Vui lòng liên hệ quản trị viên hệ thống.';
      if (S.me && !S.me.mustChangePassword) { toast(text); return; }
      var form = document.getElementById('login-form') ? renderLogin : renderForceChange;
      form({ type: 'info', text: text });
    }
  };

  /** Bộ lọc đổi → đưa bảng chi tiết của view về đầu ở lần render kế tiếp. */
  function resetPage(view) { (S.scrollReset = S.scrollReset || {})['scroll-' + view] = true; }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && ACTIONS[el.dataset.act]) {
      if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
      ACTIONS[el.dataset.act](el, e);
      return;
    }
    if (S.open && !e.target.closest('.anchor')) { S.open = null; render(); }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    var kind = el.dataset && el.dataset.change;
    if (!kind) return;
    var view = el.dataset.view;
    if (kind === 'filter') {
      getFilter(view)[el.dataset.field] = el.value;
      resetPage(view); render();
    } else if (kind === 'date-text') {
      var iso = parseDmy(el.value);
      if (iso === null) {
        el.closest('.field').classList.add('invalid');
        toast('Ngày không hợp lệ. Nhập theo dạng dd/mm/yyyy, ví dụ 05/09/2026.', 'err');
        return;
      }
      setDateFilter(view, el.dataset.field, iso);
    } else if (kind === 'ms') {
      var arr = getFilter(view)[el.dataset.field];
      var i = arr.indexOf(el.value);
      if (el.checked && i < 0) arr.push(el.value);
      if (!el.checked && i >= 0) arr.splice(i, 1);
      resetPage(view); render();
    } else if (kind === 'sync-all') {
      Array.prototype.forEach.call(modalRoot.querySelectorAll('[data-sync-change]'), function (c) { c.checked = el.checked; });
    }
  });

  var qTimer = null;
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.input === 'date-text') {
      var fieldBox = el.closest('.field');
      fieldBox.classList.remove('invalid');
      // Tự chèn "/" khi gõ số: 05 → 05/, 05/09 → 05/09/
      if (e.inputType && e.inputType.indexOf('insert') === 0 && /^\d{2}$|^\d{2}\/\d{2}$/.test(el.value)) el.value += '/';
      if (/[\/\-.]{2}/.test(el.value)) el.value = el.value.replace(/([\/\-.])[\/\-.]+/g, '$1'); // người dùng gõ thêm "/" sau dấu tự chèn
      var iso = parseDmy(el.value);
      if (iso && /\d{4}$/.test(el.value)) setDateFilter(el.dataset.view, el.dataset.field, iso);
      else if (iso === '') setDateFilter(el.dataset.view, el.dataset.field, '');
    } else if (el.dataset && el.dataset.input === 'filter-q') {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { getFilter(el.dataset.view).q = el.value; resetPage(el.dataset.view); render(); }, 250);
    } else if (el.dataset && el.dataset.input === 'proj-q') {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { S.projQ = el.value; render(); }, 200);
    } else if (el.id === 'side-q') {
      S.sideQ = el.value;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (modalRoot.innerHTML) { closeModal(); return; }
      if (S.open) { S.open = null; render(); }
    }
    if (e.key === 'Enter' && e.target.id === 'side-q') {
      e.preventDefault();
      getFilter('all').q = e.target.value;
      resetPage('all');
      S.view = 'all';
      if (window.innerWidth <= 1000) S.collapsed = true;
      render();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'login-form') doLogin();
    if (e.target.id === 'force-form') doForceChange();
  });

  /* =====================================================================
   * Xuất CSV
   * ===================================================================== */
  function exportCsv(view) {
    var data = S.lastRows[view];
    if (!data || !data.rows.length) { toast('Không có dữ liệu để xuất.', 'err'); return; }
    var head = ['Mã HS', 'Tên hồ sơ', 'Loại', 'Dự án'];
    if (data.showOwner) head.push('Chuyên viên', 'Tài khoản');
    head.push('Tình trạng', 'Ngày tạo', 'Ngày trình', 'Ngày cập nhật', 'Ngày duyệt', 'Số ngày ở tình trạng hiện tại');
    var lines = [head];
    data.rows.forEach(function (s) {
      var r = [s.id, s.title, typeOf(s._type).label, s._projects.map(projectLabel).join('; ')];
      if (data.showOwner) r.push(userName(s.owner), s.owner);
      r.push(statusOf(s.status).label, fmtDate(s.createdAt), fmtDate(s.submittedAt), fmtDate(s.updatedAt), fmtDate(s.approvedAt),
        s.status === S.cfg.approvedStatus ? '' : s._days);
      lines.push(r);
    });
    var csv = '﻿' + lines.map(function (r) {
      return r.map(function (v) {
        v = String(v == null ? '' : v).replace(/^—$/, '');
        return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\r\n');
    var name = 'ho-so-' + view + '-' + S.today + '.csv';
    try {
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    } catch (err) {
      window.open('data:text/csv;charset=utf-8,' + encodeURIComponent(csv), '_blank');
    }
  }

  /* =====================================================================
   * Khởi động
   * ===================================================================== */
  function boot() {
    S.token = store.get('hs_token');
    call('publicConfig').then(function (cfg) {
      S.cfg = cfg;
      document.title = cfg.appName;
      if (!S.token) { renderLogin(); return; }
      return loadAll().catch(function (err) {
        if (err.code === 'AUTH') { clearSession(); renderLogin(); return; }
        if (err.code === 'MUST_CHANGE_PASSWORD') { renderForceChange(); return; }
        renderLogin({ type: 'err', text: err.message });
      });
    }).catch(function (err) {
      root.innerHTML = '<div class="boot">' + esc(err.message) + '</div>';
    });
  }

  // Tự làm mới dữ liệu mỗi 3 phút khi đang mở trang (bỏ qua khi đang mở hộp thoại).
  setInterval(function () {
    if (S.me && !S.me.mustChangePassword && document.visibilityState === 'visible' && !modalRoot.innerHTML && !S.open) {
      loadAll(true).catch(function (err) { if (err.code === 'AUTH') handleErr(err); });
    }
  }, 180000);

  boot();
})();
</script>
