      '<p class="muted" style="margin:10px 0 0">Hồ sơ có cụm <b>"xin ý kiến"</b> trong tên (ví dụ "(Trình xin ý kiến)") là <b>Báo cáo</b>, còn lại là <b>Trình duyệt</b>. ' +
      '"Đang trình" = đang ở TP.MH, GĐTM hoặc TP.C&amp;C. Bấm vào số để lọc bảng tổng hợp bên dưới.</p>';
    return card('manager-types', 'Trình duyệt &amp; Báo cáo', body, { collapsible: true });
  }

  /* ---------- Hồ sơ đệ trình theo chuyên viên × khoảng thời gian ---------- */
  var GRANS = [['week', 'Tuần'], ['month', 'Tháng'], ['quarter', 'Quý'], ['year', 'Năm']];
  function periodKey(iso, g) {
    if (g === 'week') return bucketKey(iso, 'week');
    if (g === 'month') return iso.slice(0, 7);
    if (g === 'quarter') return iso.slice(0, 4) + '-Q' + (Math.floor((+iso.slice(5, 7) - 1) / 3) + 1);
    return iso.slice(0, 4);
  }
  function nextPeriod(k, g) {
    if (g === 'week') return numToIso(dayNum(k) + 7);
    if (g === 'month') { var y = +k.slice(0, 4), m = +k.slice(5, 7) + 1; if (m > 12) { m = 1; y++; } return y + '-' + ('0' + m).slice(-2); }
    if (g === 'quarter') { var yq = +k.slice(0, 4), q = +k.slice(6) + 1; if (q > 4) { q = 1; yq++; } return yq + '-Q' + q; }
    return String(+k + 1);
  }
  function isoWeek(iso) {
    var n = dayNum(iso);
    var dow = (new Date(n * 86400000).getUTCDay() + 6) % 7;
    var thu = n - dow + 3;
    var y = new Date(thu * 86400000).getUTCFullYear();
    return { week: Math.floor((thu - dayNum(y + '-01-01')) / 7) + 1, year: y };
  }
  function periodLabel(k, g, long) {
    if (g === 'week') {
      var w = isoWeek(k);
      return (long ? 'Tuần ' : 'T') + w.week + (long ? '/' + w.year + ' (từ ' + fmtDate(k) + ')' : '<small>' + k.slice(8, 10) + '/' + k.slice(5, 7) + '</small>');
    }
    if (g === 'month') return (long ? 'Tháng ' : '') + k.slice(5, 7) + '/' + k.slice(0, 4);
    if (g === 'quarter') return (long ? 'Quý ' : '') + k.slice(6) + '/' + k.slice(0, 4);
    return (long ? 'Năm ' : '') + k;
  }

  function submitReportCard() {
    var f = getFilter('manager');
    var g = S.subGran || 'month';
    var dim = S.subDim || 'owner';
    var q = norm(f.q).trim();
    var rows = S.subs.filter(function (s) {
      if (!s._subAt) return false;
      if (f.from && s._subAt < f.from) return false;
      if (f.to && s._subAt > f.to) return false;
      if (f.owners.length && f.owners.indexOf(s.owner) < 0) return false;
      if (f.types && f.types.length && f.types.indexOf(s._type) < 0) return false;
      if (!matchProjects(s, f.projects)) return false;
      if (q && norm(s.id + ' ' + s.title + ' ' + userName(s.owner) + ' ' + s.owner).indexOf(q) < 0) return false;
      return true;
    });
    var keysOf = function (s) { return dim === 'owner' ? [s.owner] : (s._projects.length ? s._projects : ['-']); };
    var rowList;
    if (dim === 'owner') {
      rowList = ownerOptions().map(function (o) { return o.value; });
      if (f.owners.length) rowList = rowList.filter(function (o) { return f.owners.indexOf(o) >= 0; });
    } else {
      var seen = {};
      rows.forEach(function (s) { keysOf(s).forEach(function (k) { seen[k] = 1; }); });
      rowList = Object.keys(seen).sort(projectSort);
    }
    var rowLabel = function (k) { return dim === 'owner' ? esc(userName(k)) : projectCell(k); };

    var minSub = rows.reduce(function (m, s) { return !m || s._subAt < m ? s._subAt : m; }, '');
    var from = f.from || minSub || S.today, to = f.to || S.today;
    var periods = [];
    if (from <= to) {
      var k = periodKey(from, g), end = periodKey(to, g), guard = 0;
      while (k <= end && guard++ < 400) { periods.push(k); k = nextPeriod(k, g); }
    }
    var tooMany = periods.length > 60;

    var cell = {}, rowTot = {}, colTot = {};
    rows.forEach(function (s) {
      var p = periodKey(s._subAt, g);
      keysOf(s).forEach(function (r) {
        (cell[r + '|' + p] = cell[r + '|' + p] || []).push(s);
        (rowTot[r] = rowTot[r] || []).push(s);
      });
      (colTot[p] = colTot[p] || []).push(s);
    });
    var sel = S.subSel && S.subSel.dim === dim ? S.subSel : null;

    function sbar(list) {
      var c = {};
      list.forEach(function (s) { c[s.status] = (c[s.status] || 0) + 1; });
      return '<span class="sbar">' + S.cfg.statuses.filter(function (st) { return c[st.code]; }).map(function (st) {
        return '<i style="width:' + (c[st.code] * 100 / list.length) + '%;background:' + st.color + '"></i>';
      }).join('') + '</span>';
    }
    function tip(list) {
      var c = {};
      list.forEach(function (s) { c[s.status] = (c[s.status] || 0) + 1; });
      return S.cfg.statuses.filter(function (st) { return c[st.code]; }).map(function (st) { return st.short + ': ' + c[st.code]; }).join('\n');
    }
    function numCell(list, row, period, cls) {
      var on = sel && sel.row === row && sel.period === period;
      if (!list || !list.length) return '<td class="cell zero' + (cls ? ' ' + cls : '') + '">0</td>';
      return '<td class="cell' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" data-act="sub-cell" data-row="' + esc(row) + '" data-period="' + esc(period) + '" title="' + esc(tip(list)) + '">' +
        '<b>' + list.length + '</b>' + sbar(list) + '</td>';
    }

    var seg = '<div class="seg" role="group" aria-label="Khoảng thời gian">' + GRANS.map(function (m) {
      return '<button class="' + (g === m[0] ? 'on' : '') + '" data-act="sub-gran" data-gran="' + m[0] + '">' + m[1] + '</button>';
    }).join('') + '</div>';
    var segDim = '<div class="seg" role="group" aria-label="Xem theo">' + [['owner', 'Chuyên viên'], ['project', 'Dự án']].map(function (m) {
      return '<button class="' + (dim === m[0] ? 'on' : '') + '" data-act="sub-dim" data-dim="' + m[0] + '">' + m[1] + '</button>';
    }).join('') + '</div>';
    var dimName = dim === 'owner' ? 'Chuyên viên' : 'Dự án';

    var table;
    if (!rowList.length) table = '<div class="empty">' + (dim === 'owner' ? 'Chưa có chuyên viên nào.' : 'Không có hồ sơ đệ trình nào trong khoảng thời gian này.') + '</div>';
    else if (tooMany) table = '<div class="empty">Khoảng thời gian quá dài để xem theo ' + esc(GRANS.filter(function (m) { return m[0] === g; })[0][1].toLowerCase()) + ' (' + periods.length + ' cột). Hãy chọn Tháng/Quý/Năm hoặc thu hẹp "Từ ngày – Đến ngày" ở THAM SỐ.</div>';
    else {
      table = '<div class="table-wrap' + (dim === 'project' ? ' table-scroll' : '') + '"><table class="grid matrix subrep"><thead><tr><th class="sticky-col">' + dimName + '</th>' +
        periods.map(function (p) {
          return '<th class="center' + (colTot[p] ? ' clickable' : '') + '"' + (colTot[p] ? ' data-act="sub-cell" data-row="*" data-period="' + p + '"' : '') + '>' + periodLabel(p, g) + '</th>';
        }).join('') + '<th class="num">Tổng</th></tr></thead><tbody>' +
        rowList.map(function (r) {
          return '<tr><td class="nowrap sticky-col' + (rowTot[r] ? ' clickable' : '') + '"' + (rowTot[r] ? ' data-act="sub-cell" data-row="' + esc(r) + '" data-period="*"' : '') + '><b>' + rowLabel(r) + '</b></td>' +
            periods.map(function (p) { return numCell(cell[r + '|' + p], r, p); }).join('') +
            numCell(rowTot[r], r, '*', 'total') + '</tr>';
        }).join('') + '</tbody><tfoot><tr><td class="sticky-col">Tổng cộng</td>' +
        periods.map(function (p) { return numCell(colTot[p], '*', p); }).join('') +
        numCell(rows, '*', '*', 'total') + '</tr></tfoot></table></div>';
    }

    var legend = '<div class="sub-legend">' + S.cfg.statuses.map(function (st) {
      return '<span><span class="dot" style="background:' + st.color + '"></span>' + esc(st.short) + '</span>';
    }).join('') + '</div>';
    var rangeText = (f.from ? fmtDate(f.from) : 'Từ đầu') + ' – ' + (f.to ? fmtDate(f.to) : fmtDate(S.today));
    var body = '<div class="table-tools"><span class="muted">Theo <b>ngày trình</b> (lần đầu chuyển sang "Đang trình …", hoặc lần đầu rời ổ Chuyên viên): ' + rangeText +
      ' · <b>' + fmtNum(rows.length) + '</b> hồ sơ</span><div class="grow"></div>' + segDim + seg + '</div>' + table + legend +
      '<p class="muted" style="margin:8px 0 0">Mỗi ô: số hồ sơ đệ trình, thanh màu là tình trạng hiện tại. Bấm vào ô, tên ' + dimName.toLowerCase() + ' hoặc tiêu đề cột để xem chi tiết.' +
      (dim === 'project' ? ' Dự án lấy theo số đầu tên hồ sơ; hồ sơ ghi nhiều dự án (vd "267&amp;285_…") được tính cho từng dự án, dòng Tổng cộng chỉ đếm mỗi hồ sơ 1 lần.' : '') + '</p>' +
      submitDetail(rows, g, dim, keysOf);
    return card('manager-submit', 'Hồ sơ đệ trình theo ' + dimName.toLowerCase(), body, { collapsible: true });
  }

  function submitDetail(rows, g, dim, keysOf) {
    var sel = S.subSel;
    if (!sel || sel.dim !== dim) return '';
    var list = rows.filter(function (s) {
      return (sel.row === '*' || keysOf(s).indexOf(sel.row) >= 0) && (sel.period === '*' || periodKey(s._subAt, g) === sel.period);
    }).sort(function (a, b) {
      return statusOf(a.status).order - statusOf(b.status).order || (a._subAt < b._subAt ? -1 : a._subAt > b._subAt ? 1 : 0);
    });
    S.lastRows['manager-submit'] = { rows: list, showOwner: true };
    var who = sel.row === '*' ? (dim === 'owner' ? 'Tất cả chuyên viên' : 'Tất cả dự án') : (dim === 'owner' ? userName(sel.row) : projectLabel(sel.row));
    var when = sel.period === '*' ? 'Cả khoảng thời gian' : periodLabel(sel.period, g, true);
    var counts = {};
    list.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
    var chips = S.cfg.statuses.map(function (st) {
      return '<span class="status-badge sub-chip' + (counts[st.code] ? '' : ' none') + '"><span class="dot" style="background:' + st.color + '"></span>' +
        esc(st.short) + ' <b>' + (counts[st.code] || 0) + '</b></span>';
    }).join('');
    var bodyRows = '';
    var cur = null;
    list.forEach(function (s) {
      if (s.status !== cur) {
        cur = s.status;
        bodyRows += '<tr class="group-row"><td colspan="10">' + statusBadge(cur) + ' <span class="muted">' + counts[cur] + ' hồ sơ</span></td></tr>';
      }
      bodyRows += '<tr><td class="code">' + esc(s.id) + '</td><td class="title-cell">' + esc(s.title) + '</td><td>' + typeBadge(s._type) + '</td>' +
        '<td class="proj-cell">' + projectsCell(s) + '</td>' +
        '<td class="nowrap">' + esc(userName(s.owner)) + '</td><td class="nowrap">' + fmtDate(s._subAt) + '</td>' +
        '<td>' + statusBadge(s.status) + '</td><td class="nowrap">' + fmtDate(s.approvedAt) + '</td>' +
        '<td class="num">' + waitCell(s) + '</td><td>' + rowActions(s) + '</td></tr>';
    });
    if (!list.length) bodyRows = '<tr><td colspan="10" class="empty">Không có hồ sơ nào.</td></tr>';
    return '<div class="sub-detail" id="sub-detail"><div class="sub-detail-head"><h3 class="sub-title" style="margin:0">Chi tiết: ' + esc(who) + ' · ' + esc(when) +
      ' <span class="muted">(' + list.length + ' hồ sơ)</span></h3><div class="grow"></div>' +
      '<button class="secondary-btn" data-act="export-csv" data-view="manager-submit">' + ic('download') + 'Xuất CSV</button>' +
      '<button class="ghost-btn" data-act="sub-close" aria-label="Đóng chi tiết">' + ic('x') + '</button></div>' +
      '<div class="sub-chips">' + chips + '</div>' +
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Mã HS</th><th>Tên hồ sơ</th><th>Loại</th><th>Dự án</th><th>Chuyên viên</th><th>Ngày trình</th>' +
      '<th>Tình trạng hiện tại</th><th>Ngày duyệt</th><th class="num">Số ngày ở TT hiện tại</th><th></th></tr></thead><tbody>' +
      bodyRows + '</tbody></table></div></div>';
  }

  /* ---------- Hồ sơ theo dự án ---------- */
  function projectCard(scope) {
    var f = getFilter('manager');
    var types = S.cfg.docTypes || [];
    var groups = {};
    scope.forEach(function (s) {
      (s._projects.length ? s._projects : ['-']).forEach(function (k) { (groups[k] = groups[k] || []).push(s); });
    });
    var keys = Object.keys(groups).sort(function (a, b) {
      return (a === '-') - (b === '-') || groups[b].length - groups[a].length || projectSort(a, b);
    });
    var isSub = function (s) { return S.cfg.submittingStatuses.indexOf(s.status) >= 0; };
    function link(list, code, extra, strong) {
      var n = list.length;
      return n ? '<td class="cell" data-act="proj-filter" data-project="' + esc(code) + '"' + (extra || '') + '>' + (strong ? '<b>' + n + '</b>' : n) + '</td>' : '<td class="cell zero">0</td>';
    }
    var body;
    if (!keys.length) body = '<div class="empty">Không có hồ sơ nào phù hợp bộ lọc.</div>';
    else {
      body = '<div class="table-wrap table-scroll"><table class="grid matrix"><thead><tr><th>Dự án</th>' +
        types.map(function (t) { return '<th class="center">' + typeBadge(t.code) + '</th>'; }).join('') +
        '<th class="center">Đang trình</th><th class="center">Trả lại</th><th class="center">Đã duyệt</th><th class="num">Tổng</th></tr></thead><tbody>' +
        keys.map(function (k) {
          var list = groups[k];
          return '<tr><td class="proj-name">' + projectCell(k) + '</td>' +
            types.map(function (t) { return link(list.filter(function (s) { return s._type === t.code; }), k, ' data-type="' + t.code + '"'); }).join('') +
            link(list.filter(isSub), k, ' data-statuses="' + S.cfg.submittingStatuses.join(',') + '"') +
            link(list.filter(function (s) { return s.status === 'TRA_LAI'; }), k, ' data-statuses="TRA_LAI"') +
            link(list.filter(function (s) { return s.status === S.cfg.approvedStatus; }), k, ' data-statuses="' + S.cfg.approvedStatus + '"') +
            link(list, k, '', true) + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    var unassigned = (groups['-'] || []).length;
    body += '<p class="muted" style="margin:10px 0 0"><b>' + keys.filter(function (k) { return k !== '-'; }).length + '</b> dự án có hồ sơ' +
      (unassigned ? ' · <b>' + unassigned + '</b> hồ sơ chưa gắn dự án (tên không bắt đầu bằng số dự án)' : '') +
      '. Dự án lấy theo số/mã đầu tên hồ sơ, vd "231_TDTower_…" → 231_Truong Dinh, "D&amp;B_…" → Phòng D&amp;B. Bấm vào số để lọc bảng tổng hợp bên dưới.</p>';
    return card('manager-projects', 'Hồ sơ theo dự án', body, { collapsible: true });
  }

  /* =====================================================================
   * Báo cáo tổng hợp theo kỳ (Dashboard Trưởng phòng + trang "Báo cáo tổng hợp" của chuyên viên).
   * Kỳ Tuần/Tháng/Quý/Năm chọn ở THAM SỐ (đặt luôn Từ ngày–Đến ngày); các bộ lọc khác của THAM SỐ (chuyên viên, loại,
   * dự án, tên/mã) cũng áp dụng. "Đệ trình trong kỳ" tính theo s._subAt (ngày trình, xem derive).
   * Mỗi ô báo cáo chọn Biểu đồ hoặc Bảng; bấm số/cột/miếng → danh sách hồ sơ ngay dưới hàng ô đó.
   * ===================================================================== */
  var PERIOD_GRANS = [['week', 'Tuần'], ['month', 'Tháng'], ['quarter', 'Quý'], ['year', 'Năm']];
  function repModes() {
    if (!S.repModes) { try { S.repModes = JSON.parse(store.get('hs_rep_modes') || '{}') || {}; } catch (e) { S.repModes = {}; } }
    return S.repModes;
  }
  function repSelOf(view) { return (S.repSel || {})[view] || null; }
  function prevPeriod(k, g) {
    if (g === 'week') return numToIso(dayNum(k) - 7);
    if (g === 'month') { var y = +k.slice(0, 4), m = +k.slice(5, 7) - 1; if (m < 1) { m = 12; y--; } return y + '-' + ('0' + m).slice(-2); }
    if (g === 'quarter') { var yq = +k.slice(0, 4), q = +k.slice(6) - 1; if (q < 1) { q = 4; yq--; } return yq + '-Q' + q; }
    return String(+k - 1);
  }
  /** [ngày đầu, ngày cuối] (ISO) của kỳ. */
  function periodRange(k, g) {
    if (g === 'week') return [k, numToIso(dayNum(k) + 6)];
    if (g === 'year') return [k + '-01-01', k + '-12-31'];
    var qStart = function (q) { return q.slice(0, 4) + '-' + ('0' + ((+q.slice(6) - 1) * 3 + 1)).slice(-2) + '-01'; };
    var start = g === 'month' ? k + '-01' : qStart(k);
    var next = g === 'month' ? nextPeriod(k, g) + '-01' : qStart(nextPeriod(k, g));
    return [start, numToIso(dayNum(next) - 1)];
  }
  function periodName(k, g) {
    if (g === 'week') { var w = isoWeek(k); return 'Tuần ' + w.week + '/' + w.year; }
    if (g === 'month') return 'Tháng ' + k.slice(5, 7) + '/' + k.slice(0, 4);
    if (g === 'quarter') return 'Quý ' + k.slice(6) + '/' + k.slice(0, 4);
    return 'Năm ' + k;
  }
  function periodShort(k, g) {
    if (g === 'week') return 'T' + isoWeek(k).week + ' (' + k.slice(8, 10) + '/' + k.slice(5, 7) + ')';
    if (g === 'month') return 'T' + k.slice(5, 7) + '/' + k.slice(2, 4);
    if (g === 'quarter') return 'Q' + k.slice(6) + '/' + k.slice(0, 4);
    return k;
  }
  function inRange(d, r) { return !!d && d >= r[0] && d <= r[1]; }
  function isSubmitting(s) { return S.cfg.submittingStatuses.indexOf(s.status) >= 0; }

  /** Chọn kỳ: đặt Từ ngày–Đến ngày của THAM SỐ theo kỳ. */
  function setPeriod(view, g, k) {
    var f = getFilter(view);
    var r = periodRange(k, g);
    f.period = { g: g, k: k }; f.from = r[0]; f.to = r[1];
    (S.repSel = S.repSel || {})[view] = null;
    resetPage(view); render();
  }
  function periodBar(view) {
    var f = getFilter(view);
    var p = f.period;
    var seg = '<div class="seg" role="group" aria-label="Kỳ báo cáo">' + PERIOD_GRANS.map(function (m) {
      return '<button class="' + (p && p.g === m[0] ? 'on' : '') + '" data-act="per-gran" data-view="' + view + '" data-gran="' + m[0] + '">' + m[1] + '</button>';
    }).join('') + '</div>';
    var nav;
    if (p) {
      var r = periodRange(p.k, p.g), cur = periodKey(S.today, p.g);
      nav = '<div class="per-nav"><button class="ghost-btn" data-act="per-step" data-view="' + view + '" data-dir="-1" aria-label="Kỳ trước" title="Kỳ trước">' + ic('chevLeft') + '</button>' +
        '<span class="per-name"><b>' + esc(periodName(p.k, p.g)) + '</b> · ' + fmtDate(r[0]) + ' – ' + fmtDate(r[1]) + '</span>' +
        '<button class="ghost-btn" data-act="per-step" data-view="' + view + '" data-dir="1" aria-label="Kỳ sau" title="Kỳ sau"' + (p.k >= cur ? ' disabled' : '') + '>' + ic('chevRight') + '</button></div>' +
        (p.k !== cur ? '<button class="secondary-btn" data-act="per-now" data-view="' + view + '">Hiện tại</button>' : '');
    } else {
      nav = '<span class="per-name muted">Tùy chọn: ' + (f.from ? fmtDate(f.from) : 'Từ đầu') + ' – ' + (f.to ? fmtDate(f.to) : fmtDate(S.today)) + '</span>';
    }
    return '<div class="period-bar">' + seg + nav + '<div class="grow"></div>' +
      '<button class="secondary-btn" data-act="rep-export" data-view="' + view + '" title="File .xlsx: trang Dashboard (ô số liệu, biểu đồ, bảng dữ liệu) + danh sách hồ sơ">' +
        ic('download') + 'Xuất báo cáo (Excel)</button></div>';
  }

  function repData(view) {
    var f = getFilter(view);
    // Mọi bộ lọc của THAM SỐ trừ ngày và tình trạng (ngày → "trong kỳ" theo ngày trình; tình trạng → các ô tự chia).
    var base = applyFilter(S.subs, { from: '', to: '', owners: f.owners, statuses: [], types: f.types, projects: f.projects, q: f.q }, true);
    var range = [f.from || '', f.to || '9999-12-31'];
    var g = f.period ? f.period.g : 'month';
    var k = f.period ? f.period.k : periodKey(f.to && f.to < S.today ? f.to : S.today, 'month');
    var returned = {};
    S.hist.forEach(function (h) { if (h.toStatus === 'TRA_LAI' && h.fromStatus !== h.toStatus && inRange(h.date, range)) returned[h.submissionId] = 1; });
    return {
      view: view, f: f, base: base, range: range, g: g, k: k,
      label: f.period ? periodName(k, g) : (f.from ? fmtDate(f.from) : 'Từ đầu') + ' – ' + (f.to ? fmtDate(f.to) : fmtDate(S.today)),
      sub: base.filter(function (s) { return inRange(s._subAt, range); }),
      approved: base.filter(function (s) { return s.status === S.cfg.approvedStatus && inRange(s.approvedAt, range); }),
      returned: base.filter(function (s) { return returned[s.id]; }),
      pending: base.filter(isSubmitting)
    };
  }
  /** sub: '' | mã loại (TD/BC) | 'PENDING' (đang trình) | mã tình trạng. */
  function matchSub(s, sub) {
    if (!sub) return true;
    if (S.typeMap[sub]) return s._type === sub;
    if (sub === 'PENDING') return isSubmitting(s);
    return s.status === sub;
  }
  function repRows(sel, D) {
    var base;
    switch (sel.kind) {
      case 'kpi':
        base = sel.key === 'approved' ? D.approved : sel.key === 'returned' ? D.returned : sel.key === 'pending' ? D.pending :
          sel.key === 'tpmh' ? D.pending.filter(function (s) { return s.status === TPMH_STATUS; }) : D.sub;
        break;
      case 'owner': base = D.sub.filter(function (s) { return sel.key === '*' || s.owner === sel.key; }); break;
      case 'period':
        var r = periodRange(sel.key, D.g);
        base = D.base.filter(function (s) { return inRange(s._subAt, r); }); break;
      case 'pending': base = D.pending.filter(function (s) { return sel.key === '*' || s.status === sel.key; }); break;
      case 'project':
        base = D.sub.filter(function (s) { return sel.key === '*' || (s._projects.length ? s._projects.indexOf(sel.key) >= 0 : sel.key === '-'); }); break;
      default: base = D.sub;
    }
    return base.filter(function (s) { return matchSub(s, sel.sub); });
  }
  function repSelAttrs(D, card, kind, key, sub) {
    return ' data-act="rep-sel" data-view="' + D.view + '" data-card="' + card + '" data-kind="' + kind + '" data-key="' + esc(key) + '" data-sub="' + esc(sub || '') + '"';
  }
  function sameSel(x, card, kind, key, sub) { return !!x && x.card === card && x.kind === kind && x.key === key && (x.sub || '') === (sub || ''); }
  /** Ô số bấm được trong bảng báo cáo. */
  function repNum(D, list, card, kind, key, sub, o) {
    o = o || {};
    var n = list.length;
    if (!n) return '<td class="cell zero' + (o.cls ? ' ' + o.cls : '') + '">0</td>';
    return '<td class="cell' + (sameSel(repSelOf(D.view), card, kind, key, sub) ? ' on' : '') + (o.cls ? ' ' + o.cls : '') + '"' + repSelAttrs(D, card, kind, key, sub) + '>' +
      (o.strong ? '<b>' + fmtNum(n) + '</b>' : fmtNum(n)) + (o.bar ? statusBar(list) : '') + '</td>';
  }
  function statusBar(list) {
    var c = {};
    list.forEach(function (s) { c[s.status] = (c[s.status] || 0) + 1; });
    return '<span class="sbar">' + S.cfg.statuses.filter(function (st) { return c[st.code]; }).map(function (st) {
      return '<i style="width:' + (c[st.code] * 100 / list.length) + '%;background:' + st.color + '"></i>';
    }).join('') + '</span>';
  }
  function statusHead(sts) {
    return sts.map(function (st) { return '<th class="center"><span class="dot" style="background:' + st.color + ';margin-right:6px"></span>' + esc(st.short) + '</th>'; }).join('');
  }
  function typeHead() { return (S.cfg.docTypes || []).map(function (t) { return '<th class="center">' + typeBadge(t.code) + '</th>'; }).join(''); }
  /** Bấm vào biểu đồ → chọn theo vị trí cột/miếng. */
  function chartClick(D, cfg, pick) {
    cfg.options.onClick = function (evt, els) { if (els && els.length) { var sel = pick(els[0].index); if (sel) selectRep(D.view, sel); } };
    cfg.options.onHover = function (evt, els) { if (evt.native && evt.native.target) evt.native.target.style.cursor = els && els.length ? 'pointer' : 'default'; };
    return cfg;
  }
  function selectRep(view, sel) {
    var cur = repSelOf(view);
    (S.repSel = S.repSel || {})[view] = sameSel(cur, sel.card, sel.kind, sel.key, sel.sub) ? null : sel;
    render();
    var d = document.getElementById('rep-detail-' + view);
    if (d) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /** Khung 1 ô báo cáo: luôn có lựa chọn Biểu đồ / Bảng (ghi nhớ theo từng ô). */
  function repCard(D, key, title, note, chartFn, tableFn, defMode) {
    var mode = repModes()[key] || defMode || 'chart';
    var seg = '<div class="seg rep-mode" role="group" aria-label="Kiểu hiển thị">' +
      '<button class="' + (mode === 'chart' ? 'on' : '') + '" data-act="rep-mode" data-key="' + key + '" data-mode="chart" title="Xem dạng biểu đồ">' + ic('chart') + '<span class="lbl">Biểu đồ</span></button>' +
      '<button class="' + (mode === 'table' ? 'on' : '') + '" data-act="rep-mode" data-key="' + key + '" data-mode="table" title="Xem dạng bảng">' + ic('table') + '<span class="lbl">Bảng</span></button></div>';
    var body = '<p class="rep-note">' + note + '</p>';
    if (mode === 'chart' && typeof Chart !== 'undefined') body += chartFn();
    else body += (mode === 'chart' ? '<p class="muted">Không tải được thư viện biểu đồ, hiển thị dạng bảng.</p>' : '') + tableFn();
    return card('rep-' + D.view + '-' + key, title, body, { tools: seg });
  }
  function repEmpty(text) { return '<div class="chart-empty">' + esc(text) + '</div>'; }
  function repChart(D, key, height, cfg) {
    var id = 'ch-rep-' + D.view + '-' + key;
    S.pendingCharts.push({ id: id, config: cfg });
    return '<div class="chart-wrap" style="height:' + height + 'px"><canvas id="' + id + '" role="img"></canvas></div>';
  }
  function repOwners(D) {
    var owners = ownerOptions().map(function (o) { return o.value; });
    return D.f.owners.length ? owners.filter(function (o) { return D.f.owners.indexOf(o) >= 0; }) : owners;
  }

  /* ---------- Định nghĩa biểu đồ dùng chung cho Dashboard và file Excel ----------
   * Mỗi hàm trả về { cfg, h, pick } (cấu hình Chart.js, chiều cao, chọn chi tiết khi bấm) hoặc { empty: 'lý do' }.
   * exp = true: bản xuất Excel (đủ dự án, nhãn dài hơn). */
  function repChartHtml(D, key, spec) {
    if (spec.empty) return repEmpty(spec.empty);
    return repChart(D, key, spec.h, chartClick(D, spec.cfg, spec.pick)) + (spec.after || '');
  }
  function approverNames(code) {
    return S.users.filter(function (u) { return u.position === code && u.active; }).map(function (u) { return u.displayName; }).join(', ');
  }
  function repTrendData(D) {
    var n = D.g === 'year' ? 5 : 8;
    var periods = [D.k];
    for (var i = 1; i < n; i++) periods.unshift(prevPeriod(periods[0], D.g));
    var lists = periods.map(function (p) { var r = periodRange(p, D.g); return D.base.filter(function (s) { return inRange(s._subAt, r); }); });
    return { n: n, periods: periods, lists: lists };
  }
  function repResultData(D) {
    var sts = S.cfg.statuses.filter(function (st) { return st.code !== S.cfg.defaultStatus || D.sub.some(function (s) { return s.status === st.code; }); });
    return { sts: sts, counts: sts.map(function (st) { return D.sub.filter(function (s) { return s.status === st.code; }).length; }) };
  }
  function repProjectData(D) {
    var groups = {};
    D.sub.forEach(function (s) { (s._projects.length ? s._projects : ['-']).forEach(function (k) { (groups[k] = groups[k] || []).push(s); }); });
    var keys = Object.keys(groups).sort(function (a, b) { return (a === '-') - (b === '-') || groups[b].length - groups[a].length || projectSort(a, b); });
    return { groups: groups, keys: keys };
  }
  function typeDatasets(lists) {
    return (S.cfg.docTypes || []).map(function (t) {
      return { label: t.label, backgroundColor: t.color, stack: 's', data: lists.map(function (l) { return l.filter(function (s) { return s._type === t.code; }).length; }) };
    });
  }
  function ownerChartSpec(D) {
    var by = {};
    D.sub.forEach(function (s) { (by[s.owner] = by[s.owner] || []).push(s); });
    var list = repOwners(D).filter(function (o) { return by[o]; });
    if (!list.length) return { empty: 'Không có hồ sơ đệ trình trong kỳ này.' };
    var ds = S.cfg.statuses.map(function (st) {
      return { label: st.short, backgroundColor: st.color, stack: 's',
               data: list.map(function (o) { return by[o].filter(function (s) { return s.status === st.code; }).length; }) };
    }).filter(function (d) { return d.data.some(function (v) { return v > 0; }); });
    return { h: Math.max(200, list.length * 32 + 80), cfg: barConfig(list.map(userName), ds, { horizontal: true, stacked: true, legend: true }),
             pick: function (i) { return { card: 'owners', kind: 'owner', key: list[i], sub: '' }; } };
  }
  function trendChartSpec(D) {
    var T = repTrendData(D);
    return { h: 230, cfg: barConfig(T.periods.map(function (p) { return periodShort(p, D.g); }), typeDatasets(T.lists), { stacked: true, legend: true }),
             pick: function (i) { return { card: 'trend', kind: 'period', key: T.periods[i], sub: '' }; } };
  }
  function resultChartSpec(D) {
    var R = repResultData(D), sts = R.sts, counts = R.counts, total = D.sub.length;
    if (!total) return { empty: 'Không có hồ sơ đệ trình trong kỳ này.' };
    var cfg = {
      type: 'doughnut',
      data: { labels: sts.map(function (st) { return st.short; }), datasets: [{ data: counts, backgroundColor: sts.map(function (st) { return st.color; }), borderColor: '#fff', borderWidth: 3, borderRadius: 6, spacing: 1 }] },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: {
          legend: { position: 'right', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, color: '#44506A',
            filter: function (item, data) { return data.datasets[0].data[item.index] > 0; } } },
          tooltip: { backgroundColor: 'rgba(16, 26, 51, .92)', padding: 10, cornerRadius: 10,
            callbacks: { label: function (ctx) { return ' ' + ctx.label + ': ' + ctx.raw + ' hồ sơ (' + Math.round(ctx.raw * 100 / total) + '%)'; } } }
        }
      },
      plugins: [{ id: 'center', afterDraw: function (chart) {
        var a = chart.chartArea, c = chart.ctx;
        if (!a) return;
        c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
        var x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
        c.fillStyle = '#1E2B59'; c.font = '700 24px "Space Grotesk", sans-serif'; c.fillText(String(total), x, y - 7);
        c.fillStyle = '#76829B'; c.font = '600 12px "Be Vietnam Pro", sans-serif'; c.fillText('hồ sơ', x, y + 13);
        c.restore();
      } }]
    };
    return { h: 230, cfg: cfg, pick: function (i) { return counts[i] ? { card: 'result', kind: 'kpi', key: 'sub', sub: sts[i].code } : null; } };
  }
  function pendingChartSpec(D) {
    if (!D.pending.length) return { empty: 'Không có hồ sơ nào đang chờ duyệt.' };
    var codes = S.cfg.submittingStatuses;
    var lists = codes.map(function (c) { return D.pending.filter(function (s) { return s.status === c; }); });
    var labels = codes.map(function (c) { var n = approverNames(c); return n ? [statusOf(c).short, n] : statusOf(c).short; });
    return { h: Math.max(200, codes.length * 48 + 70), cfg: barConfig(labels, typeDatasets(lists), { horizontal: true, stacked: true, legend: true }),
             pick: function (i) { return { card: 'pending', kind: 'pending', key: codes[i], sub: '' }; } };
  }
  function projectChartSpec(D, exp) {
    var P = repProjectData(D), keys = P.keys;
    if (!keys.length) return { empty: 'Không có hồ sơ đệ trình trong kỳ này.' };
    var max = exp ? 15 : 8, cut = exp ? 40 : 20;
    var top = keys.slice(0, max);
    var labels = top.map(function (k) { var l = projectLabel(k); return l.length > cut ? l.slice(0, cut - 1) + '…' : l; });
    return { h: Math.max(200, top.length * 28 + 80), cfg: barConfig(labels, typeDatasets(top.map(function (k) { return P.groups[k]; })), { horizontal: true, stacked: true, legend: true }),
             pick: function (i) { return { card: 'projects', kind: 'project', key: top[i], sub: '' }; },
             after: keys.length > max ? '<p class="rep-note" style="margin:6px 0 0">' + max + ' dự án nhiều hồ sơ nhất / ' + keys.length + ' — chọn "Bảng" để xem tất cả.</p>' : '' };
  }

  /* ---------- 1. Hồ sơ đệ trình theo chuyên viên (hiện đầu tiên) ---------- */
  function repOwnerCard(D) {
    var owners = repOwners(D);
    var by = {};
    D.sub.forEach(function (s) { (by[s.owner] = by[s.owner] || []).push(s); });
    var types = S.cfg.docTypes || [];
    var sts = S.cfg.statuses;
    var chart = function () { return repChartHtml(D, 'owners', ownerChartSpec(D)); };
    var table = function () {
      if (!owners.length) return '<div class="empty">Chưa có chuyên viên nào.</div>';
      // Gọn: Đệ trình (thanh màu = tình trạng chi tiết) · loại · 3 nhóm kết quả chính.
      var groups = [['PENDING', 'Đang trình', '#4A90D9'], ['TRA_LAI', statusOf('TRA_LAI').short, statusOf('TRA_LAI').color],
                    [S.cfg.approvedStatus, statusOf(S.cfg.approvedStatus).short, statusOf(S.cfg.approvedStatus).color]];
      var row = function (key, list, label) {
        return '<tr><td class="nowrap sticky-col"><b>' + label + '</b></td>' +
          repNum(D, list, 'owners', 'owner', key, '', { strong: true, bar: true, cls: 'total' }) +
          types.map(function (t) { return repNum(D, list.filter(function (s) { return s._type === t.code; }), 'owners', 'owner', key, t.code); }).join('') +
          groups.map(function (g) { return repNum(D, list.filter(function (s) { return matchSub(s, g[0]); }), 'owners', 'owner', key, g[0]); }).join('') + '</tr>';
      };
      return '<div class="table-wrap"><table class="grid matrix subrep"><thead><tr><th class="sticky-col">Chuyên viên</th><th class="center">Đệ trình</th>' +
        typeHead() + groups.map(function (g) { return '<th class="center"><span class="dot" style="background:' + g[2] + ';margin-right:6px"></span>' + esc(g[1]) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        owners.map(function (o) { return row(o, by[o] || [], esc(userName(o))); }).join('') + '</tbody><tfoot>' +
        row('*', D.sub, 'Tổng cộng') + '</tfoot></table></div>';
    };
    return repCard(D, 'owners', 'Hồ sơ đệ trình theo chuyên viên',
      'Đệ trình trong kỳ theo loại và tình trạng hiện tại · bấm số/thanh để xem hồ sơ', chart, table, 'table');
  }

  /* ---------- 2. Đệ trình các kỳ gần nhất ---------- */
  function repTrendCard(D) {
    var T = repTrendData(D), n = T.n, periods = T.periods, lists = T.lists;
    var types = S.cfg.docTypes || [];
    var chart = function () { return repChartHtml(D, 'trend', trendChartSpec(D)); };
    var table = function () {
      return '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Kỳ</th>' + typeHead() +
        '<th class="center">Đang trình</th><th class="center">Đã duyệt</th><th class="num">Tổng</th></tr></thead><tbody>' +
        periods.map(function (p, i) { return { p: p, l: lists[i] }; }).reverse().map(function (x) {
          return '<tr' + (x.p === D.k ? ' class="cur"' : '') + '><td class="nowrap"><button class="link-btn" data-act="per-goto" data-view="' + D.view + '" data-gran="' + D.g +
            '" data-period="' + x.p + '" title="Xem báo cáo ' + esc(periodName(x.p, D.g)) + '">' + esc(periodShort(x.p, D.g)) + '</button></td>' +
            types.map(function (t) { return repNum(D, x.l.filter(function (s) { return s._type === t.code; }), 'trend', 'period', x.p, t.code); }).join('') +
            repNum(D, x.l.filter(isSubmitting), 'trend', 'period', x.p, 'PENDING') +
            repNum(D, x.l.filter(function (s) { return s.status === S.cfg.approvedStatus; }), 'trend', 'period', x.p, S.cfg.approvedStatus) +
            repNum(D, x.l, 'trend', 'period', x.p, '', { strong: true, cls: 'num' }) + '</tr>';
        }).join('') + '</tbody></table></div>';
    };
    var unit = ({ week: 'tuần', month: 'tháng', quarter: 'quý', year: 'năm' })[D.g];
    return repCard(D, 'trend', 'Đệ trình ' + n + ' ' + unit + ' gần nhất',
      'Theo loại hồ sơ · bấm cột để xem hồ sơ' + (D.f.period ? ', bấm tên kỳ (Bảng) để chuyển kỳ' : ''), chart, table);
  }

  /* ---------- 3. Kết quả hồ sơ đệ trình trong kỳ ---------- */
  function repResultCard(D) {
    var R = repResultData(D), sts = R.sts, counts = R.counts, total = D.sub.length;
    var chart = function () { return repChartHtml(D, 'result', resultChartSpec(D)); };
    var table = function () {
      var types = S.cfg.docTypes || [];
      return '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Tình trạng</th>' + typeHead() +
        '<th class="num">Số hồ sơ</th><th class="num">Tỉ lệ</th></tr></thead><tbody>' +
        sts.map(function (st, i) {
          var l = D.sub.filter(function (s) { return s.status === st.code; });
          return '<tr><td class="nowrap">' + statusBadge(st.code) + '</td>' +
            types.map(function (t) { return '<td class="center">' + (l.filter(function (s) { return s._type === t.code; }).length || '<span class="muted">0</span>') + '</td>'; }).join('') +
            repNum(D, l, 'result', 'kpi', 'sub', st.code, { strong: true, cls: 'num' }) +
            '<td class="num">' + (total ? Math.round(counts[i] * 100 / total) + '%' : '—') + '</td></tr>';
        }).join('') + '</tbody><tfoot><tr><td>Tổng cộng</td>' +
        types.map(function (t) { return '<td class="center">' + D.sub.filter(function (s) { return s._type === t.code; }).length + '</td>'; }).join('') +
        '<td class="num">' + total + '</td><td class="num">' + (total ? '100%' : '—') + '</td></tr></tfoot></table></div>';
    };
    return repCard(D, 'result', 'Kết quả đệ trình trong kỳ', 'Tình trạng hiện tại · bấm vào phần để xem hồ sơ', chart, table);
  }

  /* ---------- 4. Đang chờ ai duyệt (không phụ thuộc kỳ) ---------- */
  function repPendingCard(D) {
    var codes = S.cfg.submittingStatuses;
    var types = S.cfg.docTypes || [];
    var who = approverNames;
    var lists = codes.map(function (c) { return D.pending.filter(function (s) { return s.status === c; }); });
    var chart = function () { return repChartHtml(D, 'pending', pendingChartSpec(D)); };
    var table = function () {
      var row = function (key, l, label) {
        var longest = l.reduce(function (m, s) { return Math.max(m, s._days); }, 0);
        return '<tr><td>' + label + '</td>' +
          types.map(function (t) { return repNum(D, l.filter(function (s) { return s._type === t.code; }), 'pending', 'pending', key, t.code); }).join('') +
          repNum(D, l, 'pending', 'pending', key, '', { strong: true, cls: 'num' }) +
          '<td class="num">' + (l.length ? '<span class="wait' + (longest >= 14 ? ' bad' : longest >= 7 ? ' warn' : '') + '">' + longest + '</span>' : '—') + '</td></tr>';
      };
      return '<div class="table-wrap"><table class="grid matrix"><thead><tr><th>Đang chờ</th>' + typeHead() +
        '<th class="num">Tổng</th><th class="num" title="Số ngày chờ lâu nhất">Lâu nhất</th></tr></thead><tbody>' +
        codes.map(function (c, i) {
          var n = who(c);
          return row(c, lists[i], statusBadge(c) + (n ? '<small class="who">' + esc(n) + '</small>' : ''));
        }).join('') + '</tbody><tfoot>' + row('*', D.pending, 'Tổng cộng') + '</tfoot></table></div>';
    };
    return repCard(D, 'pending', 'Đang chờ ai duyệt', 'Hồ sơ đang trình hiện nay (mọi kỳ) · bấm để xem hồ sơ', chart, table);
  }

  /* ---------- 5. Hồ sơ đệ trình theo dự án ---------- */
  function repProjectCard(D) {
    var P = repProjectData(D), groups = P.groups, keys = P.keys;
    var types = S.cfg.docTypes || [];
    var chart = function () { return repChartHtml(D, 'projects', projectChartSpec(D)); };
    var table = function () {
      if (!keys.length) return '<div class="empty">Không có hồ sơ đệ trình trong kỳ này.</div>';
      return '<div class="table-wrap table-scroll" style="max-height:300px"><table class="grid matrix"><thead><tr><th>Dự án</th>' + typeHead() +
        '<th class="center">Đã duyệt</th><th class="num">Tổng</th></tr></thead><tbody>' +
        keys.map(function (k) {
          var l = groups[k];
          return '<tr><td class="proj-name">' + projectCell(k) + '</td>' +
            types.map(function (t) { return repNum(D, l.filter(function (s) { return s._type === t.code; }), 'projects', 'project', k, t.code); }).join('') +
            repNum(D, l.filter(function (s) { return s.status === S.cfg.approvedStatus; }), 'projects', 'project', k, S.cfg.approvedStatus) +
            repNum(D, l, 'projects', 'project', k, '', { strong: true, cls: 'num' }) + '</tr>';
        }).join('') + '</tbody></table></div>';
    };
    return repCard(D, 'projects', 'Đệ trình theo dự án', 'Theo số/mã đầu tên hồ sơ · bấm để xem hồ sơ', chart, table);
  }

  /** Bảng danh sách hồ sơ nhóm theo tình trạng (chi tiết báo cáo). */
  function groupedTable(list) {
    var counts = {};
    list.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
    var rows = '', cur = null;
    list.forEach(function (s) {
      if (s.status !== cur) {
        cur = s.status;
        rows += '<tr class="group-row"><td colspan="10">' + statusBadge(cur) + ' <span class="muted">' + counts[cur] + ' hồ sơ</span></td></tr>';
      }
      rows += '<tr><td class="code">' + esc(s.id) + '</td><td class="title-cell">' + esc(s.title) + '</td><td>' + typeBadge(s._type) + '</td>' +
        '<td class="proj-cell">' + projectsCell(s) + '</td>' +
        '<td class="nowrap">' + esc(userName(s.owner)) + '</td><td class="nowrap">' + fmtDate(s._subAt) + '</td>' +
        '<td>' + statusBadge(s.status) + '</td><td class="nowrap">' + fmtDate(s.approvedAt) + '</td>' +
        '<td class="num">' + waitCell(s) + '</td><td>' + rowActions(s) + '</td></tr>';
    });
    if (!list.length) rows = '<tr><td colspan="10" class="empty">Không có hồ sơ nào.</td></tr>';
    var chips = S.cfg.statuses.map(function (st) {
      return '<span class="status-badge sub-chip' + (counts[st.code] ? '' : ' none') + '"><span class="dot" style="background:' + st.color + '"></span>' +
        esc(st.short) + ' <b>' + (counts[st.code] || 0) + '</b></span>';
    }).join('');
    return '<div class="sub-chips">' + chips + '</div>' +
      '<div class="table-wrap table-scroll" style="max-height:480px"><table class="grid"><thead><tr><th>Mã HS</th><th>Tên hồ sơ</th><th>Loại</th><th>Dự án</th><th>Chuyên viên</th><th>Ngày trình</th>' +
      '<th>Tình trạng hiện tại</th><th>Ngày duyệt</th><th class="num">Số ngày ở TT hiện tại</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function repSelTitle(sel, D) {
    var subName = !sel.sub ? '' : S.typeMap[sel.sub] ? S.typeMap[sel.sub].label : sel.sub === 'PENDING' ? 'Đang trình' : statusOf(sel.sub).short;
    var kpiNames = { sub: 'Đệ trình trong kỳ', approved: 'Duyệt hoàn tất trong kỳ', returned: 'Trả lại trong kỳ', pending: 'Đang chờ duyệt', tpmh: 'Đang ở TP.MH' };
    if (sel.key === 'tpmh' && TPMH_TYPE_LABELS[sel.sub]) return TPMH_TYPE_LABELS[sel.sub] + ' (đang ở TP.MH, hiện nay)';
    var main;
    switch (sel.kind) {
      case 'owner': main = (sel.key === '*' ? 'Tất cả chuyên viên' : userName(sel.key)) + ' · đệ trình trong kỳ'; break;
      case 'period': main = 'Đệ trình ' + periodName(sel.key, D.g); break;
      case 'pending': main = sel.key === '*' ? 'Đang chờ duyệt' : statusOf(sel.key).label; break;
      case 'project': main = (sel.key === '-' ? 'Chưa gắn dự án' : projectLabel(sel.key)) + ' · đệ trình trong kỳ'; break;
      default: main = kpiNames[sel.key] || 'Hồ sơ';
    }
    return main + (subName ? ' · ' + subName : '') + (sel.kind === 'period' || sel.kind === 'pending' || sel.key === 'pending' ? '' : ' (' + D.label + ')');
  }
  function repDetail(D) {
    var sel = repSelOf(D.view);
    var list = repRows(sel, D).sort(function (a, b) {
      return statusOf(a.status).order - statusOf(b.status).order || (a._subAt < b._subAt ? -1 : a._subAt > b._subAt ? 1 : 0);
    });
    S.lastRows['rep-' + D.view] = { rows: list, showOwner: true };
    var tools = '<button class="secondary-btn" data-act="export-csv" data-view="rep-' + D.view + '">' + ic('download') + 'Xuất CSV</button>' +
      '<button class="ghost-btn" data-act="rep-close" data-view="' + D.view + '" aria-label="Đóng chi tiết">' + ic('x') + '</button>';
    return '<div class="rep-full" id="rep-detail-' + D.view + '">' + card('rep-' + D.view + '-detail', 'Chi tiết: ' + esc(repSelTitle(sel, D)) +
      ' <span class="tab-count filter-count">' + list.length + ' hồ sơ</span>', groupedTable(list), { tools: tools }) + '</div>';
  }

  /** Hàng ô số liệu của kỳ (đặt trong TỔNG QUAN). */
  /** Hồ sơ đang ở TP.MH (hiện nay, theo bộ lọc) — số liệu con của "Đang chờ duyệt". */
  var TPMH_STATUS = 'TP_MH';
  var TPMH_TYPE_LABELS = { TD: 'Trình duyệt TP.MH', BC: 'Đợi báo cáo TP.MH' };
  /**
   * Số liệu TỔNG QUAN (web + Excel): main = 4 ô tổng quát của kỳ; sub = số liệu con "Trong đó đang ở TP.MH"
   * chia theo loại (Trình duyệt TP.MH / Đợi báo cáo TP.MH), hiển thị nhỏ hơn, không ngang hàng ô tổng quát.
   */
  function repKpiData(D) {
    var avg = D.approved.length ? D.approved.reduce(function (a, s) { return a + diffDays(s.createdAt, s.approvedAt); }, 0) / D.approved.length : null;
    var longest = D.pending.reduce(function (m, s) { return Math.max(m, s._days); }, 0);
    var k = function (key, sub, color, label, n, note) { return { key: key, sub: sub, color: color, label: label, n: n, note: note }; };
    var tp = D.pending.filter(function (s) { return s.status === TPMH_STATUS; });
    return {
      main: [k('sub', '', '#1E2B59', 'Hồ sơ đệ trình', D.sub.length, 'trong kỳ'),
             k('approved', '', statusOf(S.cfg.approvedStatus).color, 'Duyệt hoàn tất', D.approved.length, avg == null ? 'trong kỳ' : 'TB ' + fmt1(avg) + ' ngày để duyệt'),
             k('returned', '', statusOf('TRA_LAI').color, 'Trả lại', D.returned.length, 'trong kỳ'),
             k('pending', '', '#E9A23B', 'Đang chờ duyệt', D.pending.length, D.pending.length ? 'lâu nhất ' + longest + ' ngày' : 'hiện nay')],
      sub: { title: 'Trong đó đang ở TP.MH', note: 'hiện nay', total: tp.length,
             items: (S.cfg.docTypes || []).map(function (t) {
               return k('tpmh', t.code, t.color, TPMH_TYPE_LABELS[t.code] || t.label, tp.filter(function (s) { return s._type === t.code; }).length, '');
             }) }
    };
  }
  function repKpis(D) {
    var sel = repSelOf(D.view);
    var K = repKpiData(D);
    var on = function (x) { return sameSel(sel, 'kpi', 'kpi', x.key, x.sub) ? ' on' : ''; };
    return '<div class="rep-kpis">' + K.main.map(function (x) {
      return '<button class="rep-kpi' + on(x) + '" style="--c:' + x.color + '"' + repSelAttrs(D, 'kpi', 'kpi', x.key, x.sub) + '>' +
        '<span class="rk-l">' + esc(x.label) + '</span><b>' + fmtNum(x.n) + '</b><span class="rk-n">' + esc(x.note) + '</span></button>';
    }).join('') + '</div>' +
      '<div class="rep-sub"><span class="rs-l">' + esc(K.sub.title) + ' <small>(' + esc(K.sub.note) + ': ' + fmtNum(K.sub.total) + ')</small></span>' +
      K.sub.items.map(function (x) {
        return '<button class="rep-subkpi' + on(x) + '" style="--c:' + x.color + '"' + repSelAttrs(D, 'kpi', 'kpi', x.key, x.sub) + '>' +
          '<span>' + esc(x.label) + '</span><b>' + fmtNum(x.n) + '</b></button>';
      }).join('') + '</div>';
  }

  /** Các ô báo cáo (giữa TỔNG QUAN và thanh tab); ô "Hồ sơ đệ trình theo chuyên viên" luôn đầu tiên. */
  function repSection(D) {
    var sel = repSelOf(D.view);
    var detail = sel ? repDetail(D) : '';
    var cells = [
      { key: 'owners', html: repOwnerCard(D), wide: true },
      { key: 'trend', html: repTrendCard(D) }, { key: 'result', html: repResultCard(D) },
      { key: 'pending', html: repPendingCard(D) }, { key: 'projects', html: repProjectCard(D) }
    ];
    // Lưới 3 / 2 / 1 cột theo bề rộng (container query); bảng chi tiết chiếm cả hàng ngay sau ô được bấm,
    // grid-auto-flow: dense lấp chỗ trống phía trước.
    return '<div class="rep-wrap"><div class="rep-grid">' + (sel && sel.card === 'kpi' ? detail : '') + cells.map(function (c) {
      return '<div class="rep-cell' + (c.wide ? ' rep-wide' : '') + '">' + c.html + '</div>' + (sel && sel.card === c.key ? detail : '');
    }).join('') + '</div></div>';
  }

  /** Trang "Báo cáo tổng hợp" cho chuyên viên: cùng bố cục với Dashboard Trưởng phòng (toàn bộ hồ sơ của team). */
  function viewReport() {
    var f = getFilter('report');
    var D = repData('report');
    return paramsCard('report', { owners: true, period: true, tools: syncButton() }) + mgrOverview('report', D) + repSection(D) +
      detailCard('report', applyFilter(S.subs, f), { title: 'Danh sách hồ sơ', showOwner: true });
  }

  /* =====================================================================
   * Xuất báo cáo Excel (.xlsx) dạng Dashboard: ô số liệu, biểu đồ (ảnh vẽ bằng Chart.js như trên web) + bảng dữ liệu
   * đầy đủ dưới mỗi biểu đồ; các trang danh sách hồ sơ (lọc/sắp xếp được). Thư viện ExcelJS chỉ tải khi bấm xuất.
   * Không tải được thư viện → xuất CSV như trước.
   * ===================================================================== */
  var EXCELJS_SRC = [
    'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
    'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
    'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
  ];
  function loadExcelJs() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (S.excelJsP) return S.excelJsP;
    S.excelJsP = new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= EXCELJS_SRC.length) { S.excelJsP = null; reject(new Error('Không tải được thư viện Excel.')); return; }
        var sc = document.createElement('script');
        sc.src = EXCELJS_SRC[i++]; sc.async = true;
        sc.onload = function () { if (window.ExcelJS) resolve(window.ExcelJS); else next(); };
        sc.onerror = function () { sc.remove(); next(); };
        document.head.appendChild(sc);
      })();
    });
    return S.excelJsP;
  }

  function exportReportXlsx(view, btn) {
    var D = repData(view);
    if (btn) btn.disabled = true;
    setLoading(1);
    toast('Đang tạo file Excel…');
    loadExcelJs().then(function (ExcelJS) { return buildReportWorkbook(ExcelJS, D).xlsx.writeBuffer(); })
      .then(function (buf) {
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
          'bao-cao-ho-so-' + (D.f.period ? D.k : S.today) + '.xlsx');
        toast('Đã xuất file Excel báo cáo.');
      })
      .catch(function (err) {
        toast((err && err.message ? err.message : 'Lỗi tạo file Excel.') + ' Đã xuất dạng CSV thay thế.', 'err');
        exportReport(view);
      })
      .then(function () { setLoading(-1); if (btn) btn.disabled = false; });
  }

  /** Vẽ biểu đồ ra ảnh PNG (nền trắng, độ phân giải x2) để chèn vào Excel. */
  function chartImage(spec, width, height) {
    if (!spec || spec.empty || typeof Chart === 'undefined') return null;
    var holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + width + 'px;height:' + height + 'px';
    var cv = document.createElement('canvas');
    cv.width = width; cv.height = height;
    holder.appendChild(cv); document.body.appendChild(holder);
    var cfg = spec.cfg;
    cfg.options = cfg.options || {};
    cfg.options.responsive = false; cfg.options.animation = false; cfg.options.devicePixelRatio = 2;
    cfg.plugins = (cfg.plugins || []).concat([{ id: 'white-bg', beforeDraw: function (c) {
      var x = c.ctx; x.save(); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); x.restore();
    } }]);
    var chart = new Chart(cv, cfg);
    var url = chart.toBase64Image('image/png', 1);
    chart.destroy(); holder.remove();
    return { base64: url, w: width, h: height };
  }

  function filterSummary(f) {
    var parts = [];
    if (f.owners.length) parts.push('Chuyên viên: ' + f.owners.map(userName).join(', '));
    if (f.types && f.types.length) parts.push('Loại: ' + f.types.map(function (t) { return typeOf(t).label; }).join(', '));
    if (f.projects && f.projects.length) parts.push('Dự án: ' + f.projects.map(projectLabel).join(', '));
    if (f.q) parts.push('Tìm: "' + f.q + '"');
    return parts.length ? parts.join(' · ') : 'Không (toàn bộ hồ sơ)';
  }

  function buildReportWorkbook(ExcelJS, D) {
    var NAVY = '1E2B59', ACC = 'F16314', LINE = 'DAE1EC', SOFT = 'F5F8FC', MUTED = '76829B', INK = '101A33';
    var argb = function (hex) { return 'FF' + String(hex).replace('#', '').toUpperCase(); };
    var tint = function (hex, t) { // pha màu với trắng (t = tỉ lệ màu gốc)
      var h = String(hex).replace('#', ''), out = '';
      for (var i = 0; i < 3; i++) { var v = parseInt(h.substr(i * 2, 2), 16); out += ('0' + Math.round(v * t + 255 * (1 - t)).toString(16)).slice(-2); }
      return out.toUpperCase();
    };
    var fill = function (hex) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(hex) } }; };
    var thin = { style: 'thin', color: { argb: argb(LINE) } };
    var box = { top: thin, left: thin, bottom: thin, right: thin };
    var types = S.cfg.docTypes || [];
    var sts = S.cfg.statuses;
    var rangeText = D.f.period ? fmtDate(D.range[0]) + ' – ' + fmtDate(D.range[1])
      : (D.f.from ? fmtDate(D.f.from) : 'Từ đầu') + ' – ' + (D.f.to ? fmtDate(D.f.to) : fmtDate(S.today));
    var toDate = function (iso) { if (!iso) return null; var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); };

    var wb = new ExcelJS.Workbook();
    wb.creator = S.me.displayName; wb.created = new Date();
    wb.title = 'Báo cáo tổng hợp hồ sơ – ' + D.label;

    /* ---------- Trang Dashboard ---------- */
    var ws = wb.addWorksheet('Dashboard', {
      views: [{ showGridLines: false }],
      pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                   margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } }
    });
    var NC = 12; // cột B..M
    ws.columns = [{ width: 2 }, { width: 24 }].concat(Array.apply(null, Array(NC - 1)).map(function () { return { width: 11 }; }), [{ width: 2 }]);
    var C0 = 2, CL = C0 + NC - 1;
    var band = function (r, text, font, bg, h) {
      ws.mergeCells(r, C0, r, CL);
      var c = ws.getCell(r, C0);
      c.value = text; c.font = font; if (bg) c.fill = fill(bg);
      c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      if (h) ws.getRow(r).height = h;
    };
    band(1, 'BÁO CÁO TỔNG HỢP HỒ SƠ', { name: 'Calibri', size: 18, bold: true, color: { argb: 'FFFFFFFF' } }, NAVY, 36);
    band(2, (S.cfg.appName || '') + '  ·  Kỳ: ' + D.label + (D.f.period ? ' (' + rangeText + ')' : ''),
      { name: 'Calibri', size: 11, color: { argb: 'FFCFE0FF' } }, NAVY, 22);
    band(3, '', {}, ACC, 4);
    band(4, 'Bộ lọc: ' + filterSummary(D.f) + '   ·   Xuất ngày ' + fmtDate(S.today) + ' bởi ' + S.me.displayName,
      { name: 'Calibri', size: 9.5, italic: true, color: { argb: argb(MUTED) } }, null, 18);

    // Ô số liệu: 4 ô tổng quát (B–C, D–F, G–I, J–L) + 1 hàng số liệu con "Trong đó đang ở TP.MH".
    var K = repKpiData(D);
    var slots = [[2, 3], [4, 6], [7, 9], [10, 12]];
    var R = 6;
    K.main.forEach(function (k, i) {
      var c1 = slots[i][0], c2 = slots[i][1];
      [[R, k.label.toUpperCase(), { size: 9, bold: true, color: { argb: argb(MUTED) } }, 18],
       [R + 1, k.n, { size: 22, bold: true, color: { argb: argb(NAVY) } }, 32],
       [R + 2, k.note, { size: 9, color: { argb: 'FF44506A' } }, 18]].forEach(function (x, j) {
        if (c2 > c1) ws.mergeCells(x[0], c1, x[0], c2);
        var c = ws.getCell(x[0], c1);
        c.value = x[1]; c.font = Object.assign({ name: 'Calibri' }, x[2]);
        c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
        for (var cc = c1; cc <= c2; cc++) {
          var cell = ws.getCell(x[0], cc);
          cell.fill = fill('F9FBFF');
          cell.border = { left: cc === c1 ? thin : undefined, right: cc === c2 ? thin : undefined,
                          top: j === 0 ? { style: 'thick', color: { argb: argb(k.color) } } : undefined, bottom: j === 2 ? thin : undefined };
        }
        ws.getRow(x[0]).height = x[3];
      });
    });
    R += 3;
    ws.getRow(R).height = 8; // dòng đệm: số liệu con tách khỏi 4 ô tổng quát
    R += 1;
    var sl = ws.getCell(R, C0);
    sl.value = K.sub.title.toUpperCase() + ' (' + K.sub.note + ': ' + K.sub.total + ')';
    sl.font = { name: 'Calibri', size: 8.5, bold: true, color: { argb: argb(MUTED) } };
    sl.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
    K.sub.items.forEach(function (k, i) {
      var c1 = 3 + i * 3, c2 = c1 + 2;
      ws.mergeCells(R, c1, R, c2);
      var c = ws.getCell(R, c1);
      c.value = k.label + ':  ' + k.n;
      c.font = { name: 'Calibri', size: 11, bold: true, color: { argb: argb(NAVY) } };
      c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      for (var cc = c1; cc <= c2; cc++) {
        var cell = ws.getCell(R, cc);
        cell.fill = fill('F5F8FC');
        cell.border = { left: cc === c1 ? { style: 'thick', color: { argb: argb(k.color) } } : undefined, right: cc === c2 ? thin : undefined, top: thin, bottom: thin };
      }
    });
    ws.getRow(R).height = 24;
    R += 2;

    /** Bảng dữ liệu: cols = [{ h, span, color, num, pct, fmt }], rows = mảng giá trị; total = dòng tổng (tùy chọn). */
    var table = function (r, cols, rows, total) {
      var write = function (rr, vals, kind) {
        var c = C0;
        cols.forEach(function (col, i) {
          var span = col.span || 1;
          if (span > 1) ws.mergeCells(rr, c, rr, c + span - 1);
          var cell = ws.getCell(rr, c), v = vals[i];
          cell.value = v == null ? '' : v;
          var isNum = typeof v === 'number';
          cell.alignment = { vertical: 'middle', horizontal: kind === 'head' ? 'center' : (isNum ? 'center' : 'left'), wrapText: true, indent: isNum || kind === 'head' ? 0 : 1 };
          if (col.pct && isNum) cell.numFmt = '0%';
          else if (col.fmt && isNum) cell.numFmt = col.fmt;
          if (kind === 'head') {
            cell.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
          } else {
            cell.font = { name: 'Calibri', size: 10.5, bold: kind === 'total' || (isNum && col.bold),
                          color: { argb: isNum && v === 0 ? 'FFB8BCC6' : argb(INK) } };
          }
          for (var k = 0; k < span; k++) {
            var x = ws.getCell(rr, c + k);
            x.border = kind === 'total' ? { top: { style: 'medium', color: { argb: argb(NAVY) } }, left: thin, bottom: thin, right: thin } : box;
            x.fill = kind === 'head' ? fill(col.color || NAVY) : kind === 'total' ? fill('EAF0FB') : (rr % 2 ? fill('FFFFFF') : fill(SOFT));
          }
          c += span;
        });
        ws.getRow(rr).height = kind === 'head' ? 30 : 20;
      };
      write(r, cols.map(function (c) { return c.h; }), 'head');
      rows.forEach(function (vals, i) { write(r + 1 + i, vals, 'body'); });
      if (total) write(r + 1 + rows.length, total, 'total');
      return r + 1 + rows.length + (total ? 1 : 0);
    };
    var section = function (title, note, spec, imgW, imgH) {
      ws.mergeCells(R, C0, R, CL);
      var t = ws.getCell(R, C0);
      t.value = title.toUpperCase();
      t.font = { name: 'Calibri', size: 13, bold: true, color: { argb: argb(NAVY) } };
      t.alignment = { vertical: 'middle', indent: 1 };
      t.border = { left: { style: 'thick', color: { argb: argb(ACC) } }, bottom: { style: 'thin', color: { argb: argb(LINE) } } };
      for (var c = C0 + 1; c <= CL; c++) ws.getCell(R, c).border = { bottom: { style: 'thin', color: { argb: argb(LINE) } } };
      ws.getRow(R).height = 26;
      ws.mergeCells(R + 1, C0, R + 1, CL);
      var n = ws.getCell(R + 1, C0);
      n.value = note; n.font = { name: 'Calibri', size: 9.5, italic: true, color: { argb: argb(MUTED) } }; n.alignment = { indent: 1 };
      R += 2;
      var img = chartImage(spec, imgW, imgH);
      if (img) {
        var id = wb.addImage({ base64: img.base64, extension: 'png' });
        ws.addImage(id, { tl: { col: C0 - 1 + 0.1, row: R - 1 + 0.3 }, ext: { width: img.w, height: img.h } });
        R += Math.ceil(img.h / 20) + 2;
      } else if (spec && spec.empty) {
        ws.mergeCells(R, C0, R, CL);
        var e = ws.getCell(R, C0); e.value = spec.empty; e.font = { name: 'Calibri', size: 10, italic: true, color: { argb: argb(MUTED) } }; e.alignment = { indent: 1 };
        R += 2;
      }
    };
    var cnt = function (list, fn) { return list.filter(fn).length; };
    var byType = function (list) { return types.map(function (t) { return cnt(list, function (s) { return s._type === t.code; }); }); };
    var typeCols = types.map(function (t) { return { h: t.label, color: t.color }; });
    var stCols = sts.map(function (st) { return { h: st.short, color: st.color }; });

    // 1. Theo chuyên viên
    var owners = repOwners(D);
    var oRow = function (label, l) {
      return [label, l.length].concat(byType(l), sts.map(function (st) { return cnt(l, function (s) { return s.status === st.code; }); }));
    };
    section('Hồ sơ đệ trình theo chuyên viên', 'Số hồ sơ đệ trình trong kỳ theo loại và tình trạng hiện tại', ownerChartSpec(D), 900, Math.max(240, owners.length * 40 + 90));
    R = table(R, [{ h: 'Chuyên viên' }, { h: 'Đệ trình', bold: true }].concat(typeCols, stCols),
      owners.map(function (o) { return oRow(userName(o), D.sub.filter(function (s) { return s.owner === o; })); }), oRow('Tổng cộng', D.sub)) + 2;

    // 2. Các kỳ gần nhất
    var T = repTrendData(D);
    section('Hồ sơ đệ trình ' + T.n + ' kỳ gần nhất', 'Số hồ sơ đệ trình mỗi kỳ theo loại hồ sơ', trendChartSpec(D), 900, 300);
    R = table(R, [{ h: 'Kỳ' }, { h: 'Từ ngày' }, { h: 'Đến ngày' }].concat(typeCols, [{ h: 'Đang trình' }, { h: 'Đã duyệt' }, { h: 'Tổng', bold: true }]),
      T.periods.map(function (p, i) {
        var l = T.lists[i], r = periodRange(p, D.g);
        return [periodName(p, D.g), fmtDate(r[0]), fmtDate(r[1])].concat(byType(l),
          [cnt(l, isSubmitting), cnt(l, function (s) { return s.status === S.cfg.approvedStatus; }), l.length]);
      }).reverse()) + 2;

    // 3. Kết quả trong kỳ
    var RD = repResultData(D);
    section('Kết quả hồ sơ đệ trình trong kỳ', 'Tình trạng hiện tại của các hồ sơ đệ trình trong kỳ', resultChartSpec(D), 640, 300);
    R = table(R, [{ h: 'Tình trạng hiện tại', span: 2 }].concat(typeCols, [{ h: 'Số hồ sơ', bold: true }, { h: 'Tỉ lệ', pct: true }]),
      RD.sts.map(function (st, i) {
        var l = D.sub.filter(function (s) { return s.status === st.code; });
        return [st.label].concat(byType(l), [RD.counts[i], D.sub.length ? RD.counts[i] / D.sub.length : 0]);
      }), ['Tổng cộng'].concat(byType(D.sub), [D.sub.length, D.sub.length ? 1 : 0])) + 2;

    // 4. Đang chờ duyệt
    var codes = S.cfg.submittingStatuses;
    var pRow = function (label, who, l) {
      var avg = l.length ? Math.round(l.reduce(function (a, s) { return a + s._days; }, 0) / l.length * 10) / 10 : 0;
      return [label, who].concat(byType(l), [l.length, avg, l.reduce(function (m, s) { return Math.max(m, s._days); }, 0)]);
    };
    section('Đang chờ ai duyệt', 'Toàn bộ hồ sơ đang trình hiện nay (không phụ thuộc kỳ); số ngày tính từ lúc chuyển đến', pendingChartSpec(D), 900, 260);
    R = table(R, [{ h: 'Đang chờ' }, { h: 'Người duyệt', span: 3 }].concat(typeCols, [{ h: 'Tổng', bold: true }, { h: 'TB ngày chờ', fmt: '0.0' }, { h: 'Chờ lâu nhất (ngày)' }]),
      codes.map(function (c) { return pRow(statusOf(c).label, approverNames(c) || '—', D.pending.filter(function (s) { return s.status === c; })); }),
      pRow('Tổng cộng', '', D.pending)) + 2;

    // 5. Theo dự án
    var P = repProjectData(D);
    section('Hồ sơ đệ trình theo dự án', 'Dự án lấy theo số/mã đầu tên hồ sơ; biểu đồ: 15 dự án nhiều hồ sơ nhất, bảng: tất cả', projectChartSpec(D, true), 900,
      Math.max(240, Math.min(P.keys.length, 15) * 30 + 90));
    R = table(R, [{ h: 'Dự án', span: 3 }].concat(typeCols, [{ h: 'Đang trình' }, { h: 'Đã duyệt' }, { h: 'Tổng', bold: true }]),
      P.keys.map(function (k) {
        var l = P.groups[k];
        return [k === '-' ? 'Chưa gắn dự án' : projectLabel(k)].concat(byType(l), [cnt(l, isSubmitting), cnt(l, function (s) { return s.status === S.cfg.approvedStatus; }), l.length]);
      })) + 1;
    ws.pageSetup.printArea = 'A1:N' + R;

    /* ---------- Trang danh sách hồ sơ ---------- */
    var listSheet = function (name, title, rows) {
      var sh = wb.addWorksheet(name, { views: [{ state: 'frozen', ySplit: 4, showGridLines: false }],
        pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
      var heads = [['Mã HS', 14], ['Tên hồ sơ', 58], ['Loại', 13], ['Dự án', 28], ['Chuyên viên', 20], ['Tình trạng hiện tại', 24],
                   ['Ngày tạo', 12], ['Ngày trình', 12], ['Ngày duyệt', 12], ['Số ngày ở TT hiện tại', 13]];
      sh.columns = heads.map(function (h) { return { width: h[1] }; });
      sh.mergeCells(1, 1, 1, heads.length);
      var t = sh.getCell(1, 1);
      t.value = title.toUpperCase() + ' – ' + D.label + (D.f.period ? ' (' + rangeText + ')' : '');
      t.font = { name: 'Calibri', size: 14, bold: true, color: { argb: 'FFFFFFFF' } }; t.fill = fill(NAVY);
      t.alignment = { vertical: 'middle', indent: 1 }; sh.getRow(1).height = 30;
      sh.mergeCells(2, 1, 2, heads.length);
      var n = sh.getCell(2, 1);
      n.value = rows.length + ' hồ sơ · Bộ lọc: ' + filterSummary(D.f) + ' · Xuất ngày ' + fmtDate(S.today);
      n.font = { name: 'Calibri', size: 9.5, italic: true, color: { argb: argb(MUTED) } }; n.alignment = { indent: 1 };
      var hr = sh.getRow(4);
      heads.forEach(function (h, i) {
        var c = hr.getCell(i + 1);
        c.value = h[0]; c.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = fill(NAVY);
        c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; c.border = box;
      });
      hr.height = 30;
      rows.forEach(function (s, i) {
        var st = statusOf(s.status), ty = typeOf(s._type);
        var row = sh.getRow(5 + i);
        row.values = [s.id, s.title, ty.label, s._projects.map(projectLabel).join('; '), userName(s.owner), st.label,
          toDate(s.createdAt), toDate(s._subAt), toDate(s.approvedAt), s.status === S.cfg.approvedStatus ? null : s._days];
        heads.forEach(function (h, k) {
          var col = k + 1, c = row.getCell(col);
          c.border = box;
          c.font = { name: 'Calibri', size: 10.5, color: { argb: argb(INK) } };
          c.alignment = { vertical: 'middle', wrapText: col === 2 || col === 4, horizontal: col >= 7 ? 'center' : 'left' };
          if (col >= 7 && col <= 9) c.numFmt = 'dd/mm/yyyy';
          if (i % 2) c.fill = fill(SOFT);
        });
        row.getCell(1).font = { name: 'Calibri', size: 10.5, color: { argb: argb('3550A8') } };
        row.getCell(3).font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: argb(ty.color) } };
        row.getCell(6).fill = fill(tint(st.color, 0.22));
        row.getCell(6).font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: argb(INK) } };
        if (s.status !== S.cfg.approvedStatus && s._days >= 7) row.getCell(10).font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: s._days >= 14 ? 'FFD9493B' : 'FFB26A00' } };
      });
      if (rows.length) sh.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4 + rows.length, column: heads.length } };
      else { sh.mergeCells(5, 1, 5, heads.length); sh.getCell(5, 1).value = 'Không có hồ sơ nào.'; sh.getCell(5, 1).font = { italic: true, color: { argb: argb(MUTED) } }; }
    };
    var bySub = function (a, b) { return a._subAt < b._subAt ? -1 : a._subAt > b._subAt ? 1 : 0; };
    listSheet('DS đệ trình trong kỳ', 'Hồ sơ đệ trình trong kỳ', D.sub.slice().sort(bySub));
    listSheet('Đang chờ duyệt', 'Hồ sơ đang chờ duyệt', D.pending.slice().sort(function (a, b) { return b._days - a._days; }));
    listSheet('Duyệt trong kỳ', 'Hồ sơ duyệt hoàn tất trong kỳ', D.approved.slice().sort(function (a, b) { return a.approvedAt < b.approvedAt ? -1 : 1; }));
    listSheet('Trả lại trong kỳ', 'Hồ sơ bị trả lại trong kỳ', D.returned.slice().sort(bySub));
    return wb;
  }

  /** Xuất CSV (mở bằng Excel): tổng quan kỳ + bảng theo chuyên viên + danh sách hồ sơ đệ trình trong kỳ. */
  function exportReport(view) {
    var D = repData(view);
    var types = S.cfg.docTypes || [];
    var sts = S.cfg.statuses;
    var lines = [['BÁO CÁO TỔNG HỢP HỒ SƠ – ' + D.label + (D.f.period ? ' (' + fmtDate(D.range[0]) + ' – ' + fmtDate(D.range[1]) + ')' : '')],
      ['Ngày xuất', fmtDate(S.today), 'Người xuất', S.me.displayName], [],
      ['Hồ sơ đệ trình trong kỳ', D.sub.length]];
    var KS = repKpiData(D).sub;
    lines.push(['Duyệt hoàn tất trong kỳ', D.approved.length], ['Trả lại trong kỳ', D.returned.length], ['Đang chờ duyệt (hiện nay)', D.pending.length],
      ['  ' + KS.title + ' (' + KS.note + ')', KS.total]);
    KS.items.forEach(function (x) { lines.push(['    ' + x.label, x.n]); });
    lines.push([]);
    lines.push(['HỒ SƠ ĐỆ TRÌNH THEO CHUYÊN VIÊN']);
    lines.push(['Chuyên viên', 'Đệ trình'].concat(types.map(function (t) { return t.label; }), sts.map(function (st) { return st.short; })));
    var ownerRow = function (label, l) {
      return [label, l.length].concat(types.map(function (t) { return l.filter(function (s) { return s._type === t.code; }).length; }),
        sts.map(function (st) { return l.filter(function (s) { return s.status === st.code; }).length; }));
    };
    repOwners(D).forEach(function (o) { lines.push(ownerRow(userName(o), D.sub.filter(function (s) { return s.owner === o; }))); });
    lines.push(ownerRow('Tổng cộng', D.sub), []);
    lines.push(['DANH SÁCH HỒ SƠ ĐỆ TRÌNH TRONG KỲ']);
    lines.push(['Mã HS', 'Tên hồ sơ', 'Loại', 'Dự án', 'Chuyên viên', 'Tình trạng hiện tại', 'Ngày trình', 'Ngày duyệt', 'Số ngày ở tình trạng hiện tại']);
    D.sub.slice().sort(function (a, b) { return a._subAt < b._subAt ? -1 : a._subAt > b._subAt ? 1 : 0; }).forEach(function (s) {
      lines.push([s.id, s.title, typeOf(s._type).label, s._projects.map(projectLabel).join('; '), userName(s.owner), statusOf(s.status).label,
        fmtDate(s._subAt), fmtDate(s.approvedAt), s.status === S.cfg.approvedStatus ? '' : s._days]);
    });
    downloadCsv(lines, 'bao-cao-' + (D.f.period ? D.k : S.today) + '.csv');
  }

  function activityCard(mine) {
    var ids = {};
    mine.forEach(function (s) { ids[s.id] = s; });
    var items = S.hist.filter(function (h) { return ids[h.submissionId]; }).slice(-8).reverse();
    var body = items.length ? '<ul class="timeline">' + items.map(function (h) {
      return '<li><span class="tl-dot" style="background:' + statusOf(h.toStatus).color + '"></span>' +
        '<div class="tl-date">' + fmtDate(h.date) + '</div><div class="tl-text">' + historyText(h, ids[h.submissionId]) + '</div>' +
        (h.note ? '<div class="tl-note">' + esc(h.note) + '</div>' : '') + '</li>';
    }).join('') + '</ul>' : '<div class="empty">Chưa có hoạt động nào.</div>';
    return card('home-activity', 'Hoạt động gần đây', body, { collapsible: true });
  }

  function historyText(h, sub) {
    var who = '<b>' + esc(userName(h.actor)) + '</b>';
    var what = sub ? ' hồ sơ <b>' + esc(sub.title) + '</b>' : '';
    if (!h.fromStatus) return who + ' tạo' + what + ' với tình trạng ' + statusBadge(h.toStatus);
    if (h.fromStatus === h.toStatus) return who + ' cập nhật thông tin' + what;
    return who + ' chuyển' + what + ' từ ' + statusBadge(h.fromStatus) + ' sang ' + statusBadge(h.toStatus);
  }

  function viewAdmin() {
    if (!S.adminUsers) {
      if (!S.adminLoading) {
        S.adminLoading = true;
        call('listUsers')
          .then(function (list) { S.adminUsers = list; S.adminLoading = false; render(); })
          .catch(function (err) { S.adminLoading = false; handleErr(err); });

    var list = S.adminUsers.slice().sort(function (a, b) { return a.username.localeCompare(b.username); });
    var rows = list.map(function (u) {
      var state = !u.active ? '<span class="status-badge"><span class="dot" style="background:#9AA0AE"></span>Đã khóa</span>'
        : u.locked ? '<span class="status-badge"><span class="dot" style="background:#DD5A4C"></span>Tạm khóa (sai mật khẩu)</span>'
        : u.mustChangePassword ? '<span class="status-badge"><span class="dot" style="background:#E9A23B"></span>Chờ đổi mật khẩu</span>'
        : '<span class="status-badge"><span class="dot" style="background:#7CB342"></span>Hoạt động</span>';
      return '<tr><td class="code">' + esc(u.username) + '</td><td><b>' + esc(u.displayName) + '</b></td>' +
        '<td>' + (u.initials ? '<span class="proj-code">' + esc(u.initials) + '</span>' : '<span class="muted">—</span>') + '</td><td>' + esc(posLabel(u.position)) + '</td>' +
        '<td>' + (u.isAdmin ? 'Có' : '—') + '</td><td>' + state + '</td><td class="nowrap">' + fmtDate(u.createdAt) + '</td>' +
        '<td><div class="row-actions"><button data-act="edit-user" data-u="' + esc(u.username) + '">' + ic('edit') + 'Sửa</button>' +
        '<button data-act="reset-user" data-u="' + esc(u.username) + '">' + ic('key') + 'Đặt lại MK</button></div></td></tr>';
    }).join('');
    var tools = '<button class="primary-btn" style="min-height:40px;font-size:16px;padding:0 18px" data-act="new-user">' + ic('plus') + 'Thêm tài khoản</button>';
    var body = '<div class="table-wrap"><table class="grid"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Ký hiệu</th><th>Chức danh</th><th>Admin</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table></div>' +
      '<p class="muted" style="margin:12px 0 0">Chỉ quản trị viên tạo được tài khoản. Người dùng mới phải đổi mật khẩu tạm ở lần đăng nhập đầu tiên. ' +
      'Chuyên viên chỉ sửa được hồ sơ của mình; TP.MH, TP.C&amp;C, GĐTM và quản trị viên sửa được mọi hồ sơ.</p>';
    return card('admin-users', 'Danh sách tài khoản', body, { tools: tools }) + adminProjectsCard();
  }

  function adminProjectsCard() {
    var counts = {};
    S.subs.forEach(function (s) { s._projects.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; }); });
    var q = norm(S.projQ || '').trim();
    var list = (S.projects || []).filter(function (p) { return !q || norm(p.code + ' ' + p.name).indexOf(q) >= 0; });
    var rows = list.map(function (p) {
      return '<tr' + (p.active ? '' : ' class="inactive"') + '><td class="code">' + esc(p.code) + '</td><td><b>' + esc(p.name) + '</b></td>' +
        '<td class="num">' + (counts[p.code] || 0) + '</td>' +
        '<td>' + (p.active ? '<span class="status-badge"><span class="dot" style="background:#7CB342"></span>Đang dùng</span>'
                           : '<span class="status-badge"><span class="dot" style="background:#9AA0AE"></span>Ngừng dùng</span>') + '</td>' +
        '<td><div class="row-actions"><button data-act="edit-project" data-code="' + esc(p.code) + '">' + ic('edit') + 'Sửa</button></div></td></tr>';
    }).join('') || '<tr><td colspan="5" class="empty">Không có dự án nào phù hợp.</td></tr>';
    var tools = '<button class="secondary-btn" data-act="import-projects">' + ic('clipboard') + 'Dán danh sách</button>' +
      '<button class="primary-btn" style="min-height:40px;font-size:16px;padding:0 18px" data-act="new-project">' + ic('plus') + 'Thêm dự án</button>';
    var body = '<div class="table-tools"><div class="field" style="flex:0 1 360px;min-height:52px"><div class="fbody"><label for="proj-q">Tìm dự án</label>' +
      '<input type="text" id="proj-q" data-input="proj-q" placeholder="Số hoặc tên dự án…" value="' + esc(S.projQ || '') + '"></div></div>' +
      '<div class="grow"></div><span class="muted"><b>' + (S.projects || []).length + '</b> dự án</span></div>' +
      '<div class="table-wrap table-scroll"><table class="grid"><thead><tr><th>STT</th><th>Tên dự án</th><th class="num">Số hồ sơ</th><th>Trạng thái</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table></div>' +
      '<p class="muted" style="margin:12px 0 0">Hồ sơ được gắn dự án theo <b>số đầu tên hồ sơ</b> (vd "231_TDTower_…" → dự án 231). ' +
      'Có dự án mới: bấm <b>Thêm dự án</b>, hoặc <b>Dán danh sách</b> tên các thư mục dự án dạng "STT_TÊN DỰ ÁN" (mỗi dòng 1 dự án; dự án đã có sẽ được cập nhật tên).</p>';
    return card('admin-projects', 'Danh mục dự án', body, { tools: tools });
  }

  /* =====================================================================
   * Modal
   * ===================================================================== */
  /** wide: true = rộng (760px), 'xl' = rất rộng (bảng nhiều cột, vd cửa sổ thông báo). */
  function openModal(html, wide) {
    modalRoot.innerHTML = '<div class="modal-bg" data-act="modal-bg"><div class="modal' + (wide ? ' wide' : '') + (wide === 'xl' ? ' xl' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
    var first = modalRoot.querySelector('input:not([type=hidden]):not([readonly]), textarea, select');
    if (first) first.focus();
  }
  function closeModal() { modalRoot.innerHTML = ''; S.histBack = false; }
  /** Vẽ lại hộp thoại nhưng giữ vị trí cuộn (bảng xem trước dài). */
  function keepModalScroll(fn) {
    var body = modalRoot.querySelector('.modal-body');
    var top = body ? body.scrollTop : 0;
    var inner = Array.prototype.map.call(modalRoot.querySelectorAll('.table-wrap'), function (e) { return e.scrollTop; });
    fn();
    body = modalRoot.querySelector('.modal-body');
    if (body) body.scrollTop = top;
    Array.prototype.forEach.call(modalRoot.querySelectorAll('.table-wrap'), function (e, i) { e.scrollTop = inner[i] || 0; });
  }
  function modalHead(title) {
    return '<div class="modal-head"><h2>' + title + '</h2><button class="ghost-btn" data-act="close-modal" aria-label="Đóng">' + ic('x') + '</button></div>';
  }
  function modalError(text) {
    var box = document.getElementById('m-err');
    if (box) box.innerHTML = text ? '<div class="form-err" role="alert">' + esc(text) + '</div>' : '';
  }
  function statusPicker(current) {
    return '<div class="status-pick">' + S.cfg.statuses.map(function (st) {
      return '<label><input type="radio" name="m-status" value="' + st.code + '"' + (st.code === current ? ' checked' : '') + '>' +
        '<span class="dot" style="background:' + st.color + '"></span>' + esc(st.label) + '</label>';
    }).join('') + '</div>';
  }
  function pickedStatus() {
    var el = modalRoot.querySelector('input[name=m-status]:checked');
    return el ? el.value : '';
  }
  function findSub(id) { return S.subs.filter(function (s) { return s.id === id; })[0]; }
  function metaGrid(s) {
    return '<div class="meta-grid"><div><small>Mã hồ sơ</small>' + esc(s.id) + '</div><div><small>Chuyên viên</small>' + esc(userName(s.owner)) + '</div>' +
      '<div><small>Ngày tạo</small>' + fmtDate(s.createdAt) + '</div><div><small>Ngày trình</small>' + fmtDate(s.submittedAt) + '</div>' +
      '<div><small>Ngày duyệt</small>' + fmtDate(s.approvedAt) + '</div><div><small>Ở tình trạng hiện tại</small>' +
      (s.status === S.cfg.approvedStatus ? '—' : s._days + ' ngày') + '</div>' +
      EXT.subInfo.map(function (fn) { return fn(s) || ''; }).join('') + '</div>';
  }

  function openCreate() {
    openModal(modalHead('Tạo hồ sơ mới') + '<div class="modal-body"><div id="m-err"></div>' +
      '<div class="form-row"><label for="m-title">Tên hồ sơ</label><input type="text" id="m-title" maxlength="' + S.cfg.maxTitleLength + '" placeholder="Đặt tên theo quy ước chung của team">' +

      '<div class="info-box">Ngày tạo và ngày cập nhật được ghi nhận tự động: <b>' + fmtDate(S.today) + '</b></div></div>' +

  function openUpdate(id) {
    var s = findSub(id);
