<style>
:root {
  /* Màu thương hiệu CENTRAL: navy #1E2B59 + cam #F16314. Giao diện "công nghệ" sáng: nền xanh-xám rất nhạt,
     lưới chấm mờ, thẻ trắng bo tròn, điểm nhấn gradient navy → xanh và cam → hổ phách. */
  --navy-950: #141D40;
  --navy-900: #1E2B59;
  --navy-800: #26376E;
  --navy-700: #2F4385;
  --navy-600: #3550A8;
  --navy-btn: #1E2B59;
  --accent: #F16314;
  --accent-dark: #D4520C;
  --accent-soft: #FFEDE2;
  --cyan: #1FB6E8;
  --page: #F2F5FA;
  --card: #FFFFFF;
  --line: #DAE1EC;
  --line-soft: #EAEFF6;
  --ink: #101A33;
  --ink-2: #44506A;
  --muted: #76829B;
  --chip: #E6ECFA;
  --danger: #D9493B;
  --success: #3E9B5C;
  --radius: 16px;
  --grad-navy: linear-gradient(135deg, #1E2B59 0%, #3550A8 100%);
  --grad-accent: linear-gradient(135deg, #F16314 0%, #FF9B45 100%);
  --grad-line: linear-gradient(90deg, #1E2B59 0%, #3550A8 45%, #1FB6E8 70%, #F16314 100%);
  --ring: 0 0 0 4px rgba(53, 80, 168, .14);
  --shadow: 0 1px 2px rgba(16, 26, 51, .04), 0 10px 28px -10px rgba(30, 43, 89, .16);
  --shadow-hover: 0 2px 4px rgba(16, 26, 51, .05), 0 16px 36px -12px rgba(30, 43, 89, .26);
  --font: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --num: 'Space Grotesk', 'Be Vietnam Pro', 'Segoe UI', sans-serif; /* chữ số, mã hồ sơ */
  --sidebar-w: 280px;
  --topbar-h: 66px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1100px 560px at 105% -8%, rgba(53, 80, 168, .11), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(241, 99, 20, .08), transparent 60%),
    var(--page);
  background-attachment: fixed;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
/* Lưới chấm mờ phía sau nội dung (cảm giác "bảng điều khiển công nghệ"). */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(rgba(30, 43, 89, .085) 1px, transparent 1.2px);
  background-size: 22px 22px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .35) 60%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .35) 60%, transparent 100%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.ic { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--navy-600); outline-offset: 2px; }

/* ---------- Đăng nhập ---------- */
.login {
  min-height: 100vh; position: relative; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(700px 420px at 85% 10%, rgba(31, 182, 232, .22), transparent 60%),
    radial-gradient(640px 420px at 8% 92%, rgba(241, 99, 20, .26), transparent 60%),
    linear-gradient(160deg, #1E2B59 0%, #141D40 100%);
  color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 16px 48px;
}
.login::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 0%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 35%, #000 0%, transparent 75%);
  animation: grid-drift 24s linear infinite;
}
@keyframes grid-drift { to { background-position: 44px 44px, 44px 44px; } }
.logo-tab {
  width: 384px; max-width: 100%;
  height: 112px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E4EAF8 100%);
  border-radius: 0 0 30px 30px;
  clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
  box-shadow: inset 0 -6px 0 #C9D2EC;
  display: flex; align-items: center; justify-content: center;
  padding: 0 26px 8px;
}
.logo-tab img { max-height: 76px; max-width: 100%; }
.logo-tab .brand-logo { height: 72px; max-width: 100%; }
.login h1 { font-size: 64px; font-weight: 800; margin: 92px 0 18px; letter-spacing: -1.5px;
  background: linear-gradient(90deg, #FFFFFF 0%, #CFE0FF 60%, #FFC9A6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login h1::after { content: ''; display: block; width: 72px; height: 4px; border-radius: 4px; background: var(--grad-accent); margin: 14px auto 0; box-shadow: 0 0 18px rgba(241, 99, 20, .7); }
.login .welcome { font-size: 19px; letter-spacing: 1.2px; text-transform: uppercase; text-align: center; margin: 0 0 16px; color: rgba(255, 255, 255, .85); font-weight: 500; }
.login .welcome b { color: #FF9B45; font-weight: 800; }
.login .hint { font-size: 16px; margin: 0 0 30px; text-align: center; color: rgba(255, 255, 255, .78); }
.login form {
  width: 465px; max-width: 100%;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); border-radius: 22px;
  padding: 26px 24px 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .45);
}
.login-field {
  display: flex; align-items: center; gap: 12px;
  background: #fff; color: var(--ink);
  height: 56px; border-radius: 14px; padding: 0 16px; margin-bottom: 16px;
  border: 2px solid transparent; transition: border-color .15s, box-shadow .15s;
}
.login-field svg.ic { color: var(--navy-600); }
.login-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 5px rgba(241, 99, 20, .22); }
.login-field input { flex: 1; border: 0; outline: 0; font-size: 18px; background: transparent; min-width: 0; }
.login-field input::placeholder { color: #8A93A8; }
.login-field .eye { border: 0; background: none; color: #8A93A8; padding: 4px; display: flex; }
.login-row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 20px; }
.remember { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; cursor: pointer; user-select: none; }
.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
.btn-login {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  background: var(--grad-accent); color: #fff; font-weight: 700;
  border: 0; border-radius: 14px; padding: 13px 20px; font-size: 18px;
  box-shadow: 0 12px 28px -10px rgba(241, 99, 20, .8); transition: transform .15s, box-shadow .15s, filter .15s;
}
.btn-login:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 16px 32px -10px rgba(241, 99, 20, .9); }
.btn-login svg.ic { width: 24px; height: 24px; stroke-width: 2.6; }
.btn-login[disabled] { opacity: .7; cursor: wait; transform: none; }
.login-actions { display: flex; justify-content: flex-end; }
.login-divider { height: 1px; background: rgba(255, 255, 255, .16); margin: 22px 0 14px; }
.login-links { display: flex; justify-content: space-between; font-size: 15px; }
.login-links a { color: rgba(255, 255, 255, .85); text-decoration: none; cursor: pointer; }
.login-links a:hover { color: #fff; text-decoration: underline; }
.login-msg { border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 15px; }
.login-msg.err { background: #FDE8E6; color: #9B1C12; }
.login-msg.info { background: var(--chip); color: var(--navy-900); }

/* ---------- Khung ứng dụng ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar-h);
  background: rgba(255, 255, 255, .78); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%);
  z-index: 30;
  display: flex; align-items: center; gap: 10px; padding: 0 22px 0 14px;
  box-shadow: 0 1px 0 rgba(218, 225, 236, .9), 0 8px 24px -16px rgba(30, 43, 89, .25);
}
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--grad-line); opacity: .85; }
.icon-btn {
  border: 0; background: none; width: 44px; height: 44px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; color: #26314F; position: relative;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: #EBF0FA; color: var(--navy-600); }
.icon-btn svg.ic { width: 25px; height: 25px; }
.topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar .brand-mark { width: 38px; height: 38px; flex: none; }
.topbar .brand-name { font-weight: 800; color: var(--navy-900); font-size: 16.5px; letter-spacing: .6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.pill-btn {
  background: var(--grad-accent); color: #fff; border: 0; border-radius: 999px;
  padding: 10px 24px; font-size: 16px; font-weight: 700; letter-spacing: .2px;
  box-shadow: 0 10px 22px -10px rgba(241, 99, 20, .85); transition: transform .15s, filter .15s;
}
.pill-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
.badge {
  position: absolute; top: 3px; right: 1px;
  min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: linear-gradient(135deg, #F0443A, #FF7A45); color: #fff; font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #fff; box-shadow: 0 4px 10px -2px rgba(240, 68, 58, .6);
}
.user-btn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 999px; font-size: 16px; font-weight: 600; transition: background .15s; }
.user-btn:hover { background: #EBF0FA; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--grad-navy); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(53, 80, 168, .25);
}
.dropdown {
  position: absolute; top: calc(100% + 10px); right: 0; z-index: 40;
  background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 14px; min-width: 240px; padding: 6px;
  box-shadow: 0 18px 40px -12px rgba(16, 26, 51, .3); border: 1px solid var(--line-soft);
}
.dropdown .dd-head { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
.dropdown .dd-head b { display: block; }
.dropdown .dd-head small { color: var(--muted); }
.dropdown .dd-item {
  color: inherit; text-decoration: none;
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: none; padding: 10px 12px; border-radius: 10px; font-size: 15px;
}
.dropdown .dd-item:hover { background: #EEF2FB; color: var(--navy-700); }
.dropdown .dd-empty { padding: 14px 12px; color: var(--muted); }
/* ---------- Thông báo (chuông) ---------- */
.notif-dd { width: 420px; max-width: calc(100vw - 24px); max-height: 72vh; overflow: auto; padding: 0; }
.notif-dd .dd-head { position: sticky; top: 0; z-index: 1; background: rgba(255, 255, 255, .97); padding: 12px 14px; margin: 0; }
.nd-body { padding: 4px 6px 8px; }
.nd-sec { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.nd-count { background: var(--grad-accent); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; text-transform: none; }
.nd-item {
  display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 12px; padding: 9px 10px; margin: 1px 0;
  transition: background .15s;
}
.nd-item:hover { background: #EEF2FB; }
.nd-item.new { background: #FFF6EF; }
.nd-item.new:hover { background: #FFEDE0; }
.nd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 7px; background: #CBD3E3; }
.nd-item.new .nd-dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(241, 99, 20, .18), 0 0 10px rgba(241, 99, 20, .7); }
.nd-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nd-title { font-weight: 600; font-size: 14px; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
.nd-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.nd-line .status-badge { font-size: 12px; padding: 2px 9px 2px 7px; }
.nd-arrow { color: var(--muted); font-weight: 700; }
.nd-tag { font-size: 11.5px; font-weight: 700; color: var(--success); background: #E8F5EC; border-radius: 999px; padding: 2px 8px; }
.nd-main small { color: var(--muted); font-size: 12px; }
.notif-dd .dd-empty { display: flex; align-items: center; gap: 8px; padding: 18px 12px; }
.notif-dd .dd-empty svg.ic { width: 18px; height: 18px; color: var(--success); }
.icon-btn.ringing svg.ic { color: var(--accent); animation: bell-ring 2.4s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes bell-ring { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(14deg); } 82% { transform: rotate(-12deg); } 89% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
@media (max-width: 640px) {
  .notif-dd { position: fixed; top: calc(var(--topbar-h) + 6px); left: 10px; right: 10px; width: auto; max-width: none; }
}
.anchor { position: relative; }

.sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background:
    linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px) 0 0 / 28px 28px,
    radial-gradient(420px 300px at 0% 100%, rgba(241, 99, 20, .16), transparent 70%),
    linear-gradient(180deg, #1E2B59 0%, #172150 100%);
  color: #fff; z-index: 25;
  overflow-y: auto; padding: 14px 12px 24px;
  transition: transform .2s ease;
}
.app.collapsed .sidebar { transform: translateX(-100%); }
.side-search {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); border-radius: 14px; padding: 0 14px; height: 44px; margin-bottom: 16px;
  transition: border-color .15s, background .15s;
}
.side-search:focus-within { border-color: rgba(31, 182, 232, .7); background: rgba(255, 255, 255, .12); }
.side-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-size: 15px; }
.side-search input::placeholder { color: rgba(255, 255, 255, .6); }
.side-search svg.ic { width: 22px; height: 22px; stroke-width: 2.2; opacity: .85; }
.nav-item {
  display: flex; align-items: center; gap: 14px; width: 100%; position: relative;
  background: none; border: 0; color: rgba(255, 255, 255, .88); text-align: left;
  padding: 13px 14px; border-radius: 12px; font-size: 15.5px; font-weight: 600; margin-bottom: 2px;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-item.active {
  color: #fff;
  background: linear-gradient(90deg, rgba(241, 99, 20, .26) 0%, rgba(255, 255, 255, .07) 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
}
.nav-item.active::before {
  content: ''; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0;
  background: var(--grad-accent); box-shadow: 0 0 12px rgba(241, 99, 20, .9);
}
.nav-item.active > svg.ic:first-child { color: #FF9B45; }
.nav-item .lbl { flex: 1; }
.nav-item .chev { opacity: .55; width: 18px; height: 18px; }
.nav-count { background: var(--grad-accent); border-radius: 11px; padding: 1px 8px; font-size: 12px; font-weight: 700; box-shadow: 0 0 10px rgba(241, 99, 20, .5); }
.nav-sep { height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .18), transparent); margin: 12px 8px; }

.main {
  margin-left: var(--sidebar-w); padding: calc(var(--topbar-h) + 24px) 24px 40px;
  min-height: 100vh; transition: margin-left .2s ease;
}
.app.collapsed .main { margin-left: 0; }
.scrim { display: none; }

/* ---------- Card ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px 22px 22px;
  margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid rgba(218, 225, 236, .75);
}
.card.fullscreen { position: fixed; inset: 12px; z-index: 60; overflow: auto; margin: 0; }
.card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.card-title {
  position: relative; padding-left: 14px;
  font-size: 18px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: .7px; color: var(--navy-900); line-height: 1.25;
}
/* Thanh nhấn gradient bên trái tiêu đề (đứng yên ở dòng đầu khi tiêu đề xuống dòng). */
.card-title::before {
  content: ''; position: absolute; left: 0; top: .1em; width: 4px; height: 1.05em; border-radius: 4px;
  background: var(--grad-accent); box-shadow: 0 0 10px rgba(241, 99, 20, .55);
}
.card-head .grow { flex: 1; }
.collapse-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid #D8E1F3; background: #F1F5FD; color: var(--navy-700);
  display: inline-flex; align-items: center; justify-content: center; transition: background .15s;
}
.collapse-btn:hover { background: #E4ECFC; }
.collapse-btn svg.ic { width: 18px; height: 18px; stroke-width: 2.2; }
.card.collapsed .card-body { display: none; }
.card.collapsed .card-head { margin-bottom: 0; }
.ghost-btn { border: 0; background: none; color: var(--ink-2); width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
.ghost-btn:hover { background: #EDF1FA; color: var(--navy-600); }
.sub-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; color: var(--navy-900); }
.muted { color: var(--muted); }

/* ---------- Tham số (filter) ---------- */
.params { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.field {
  display: flex; border: 1px solid var(--line); border-radius: 12px; background: #FBFCFE;
  min-height: 64px; position: relative; flex: 1 1 200px; min-width: 0;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.field:hover { border-color: #C3CEE2; background: #fff; }
.field.sm { flex: 0 1 230px; }
.field .fbody { flex: 1; padding: 10px 12px 8px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.field label, .field .flabel { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; display: block; text-transform: uppercase; letter-spacing: .6px; }
.field input, .field .fvalue {
  border: 0; outline: 0; font-size: 16px; font-weight: 500; padding: 0; background: transparent; width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 36; width: 292px; padding: 10px;
  background: #fff; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 18px 40px -12px rgba(16, 26, 51, .28);
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-head b { font-size: 15px; color: var(--navy-900); }
.cal-nav { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--navy-800); }
.cal-nav:hover { background: #F0F2F7; }
.cal-nav svg.ic { width: 20px; height: 20px; stroke-width: 2.2; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow span { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cal-day { border: 0; background: none; height: 36px; border-radius: 8px; font-size: 14.5px; color: var(--ink); }
.cal-day:hover { background: #F0F2F7; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 800; }
.cal-day.sel { background: var(--grad-navy); color: #fff; font-weight: 800; box-shadow: 0 6px 14px -6px rgba(30, 43, 89, .7); }
.cal-foot { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.cal-foot button { border: 0; background: none; color: var(--navy-700); font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
.cal-foot button:hover { background: #F0F2F7; }
.field.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(217, 73, 59, .15); }
.field.invalid label { color: var(--danger); }
.field .faddon {
  width: 40px; border: 0; border-left: 1px solid var(--line-soft); background: none;
  display: flex; align-items: center; justify-content: center; color: var(--navy-700); border-radius: 0 11px 11px 0;
}
.field .faddon:hover { background: #EEF2FB; }
.field:focus-within { border-color: var(--navy-600); background: #fff; box-shadow: var(--ring); }
.field .ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 240px; z-index: 35;
  background: #fff; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 18px 40px -12px rgba(16, 26, 51, .28);
  max-height: 320px; overflow: auto; padding: 6px;
}
.ms-panel label.opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 15px; font-weight: 500; color: var(--ink); margin: 0; cursor: pointer; }
.ms-panel label.opt:hover { background: #F2F4F9; }
.ms-panel input { width: 16px; height: 16px; accent-color: var(--navy-700); }
.ms-panel .ms-actions { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
.ms-panel .ms-actions a { color: var(--navy-700); font-size: 13.5px; font-weight: 700; cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

.primary-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--grad-navy); color: #fff; border: 0; border-radius: 12px;
  padding: 0 24px; min-height: 48px; font-size: 16px; font-weight: 700; align-self: center; letter-spacing: .2px;
  box-shadow: 0 12px 24px -12px rgba(30, 43, 89, .85); transition: transform .15s, box-shadow .15s, filter .15s;
}
.primary-btn:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 16px 28px -12px rgba(53, 80, 168, .9); }
.primary-btn svg.ic { width: 22px; height: 22px; }
.secondary-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: var(--navy-800); border: 1px solid var(--line); border-radius: 11px;
  padding: 8px 15px; font-size: 14.5px; font-weight: 600; transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
}
.secondary-btn svg.ic { width: 19px; height: 19px; color: var(--navy-600); }
.secondary-btn:hover { background: #F4F7FE; border-color: #B9C7E6; color: var(--navy-600); box-shadow: 0 6px 14px -10px rgba(30, 43, 89, .6); }
.danger-btn { background: #fff; color: var(--danger); border: 1px solid #EDB7B1; border-radius: 11px; padding: 8px 16px; font-weight: 700; }
.danger-btn:hover { background: #FDF0EE; }

/* ---------- Tổng quan ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile {
  border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #FFFFFF 0%, #F9FBFF 100%);
  padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  transition: box-shadow .15s, transform .15s, border-color .15s; text-align: left;
}
button.tile:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.tile.selected { border-color: var(--navy-600); background: #F4F7FF; box-shadow: 0 0 0 1px var(--navy-600) inset, var(--shadow-hover); }
.tile .circle {
  width: 52px; height: 52px; border-radius: 14px; color: #fff; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; font-family: var(--num);
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .28), 0 8px 18px -8px rgba(16, 26, 51, .55);
}
.tile .tlabel { font-size: 14.5px; font-weight: 600; color: #262B38; line-height: 1.3; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
.kpi { background: #F5F8FD; border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px 16px; }
.kpi .kv { font-size: 24px; font-weight: 700; color: var(--navy-900); font-family: var(--num); }
.kpi .kl { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.range-bar { background: #EEF2F8; border-radius: 10px; color: var(--ink-2); padding: 9px 16px; text-align: right; font-size: 14px; margin-top: 14px; }

/* ---------- Biểu đồ ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 22px; }
.chart-box { border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px; min-width: 0; background: linear-gradient(180deg, #FFFFFF 0%, #FAFCFF 100%); }
.chart-box .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-box h3 { margin: 0; font-size: 16.5px; font-weight: 800; }
.chart-wrap { position: relative; height: 300px; }
.chart-empty { height: 300px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.seg { display: inline-flex; background: #EEF2F8; border: 1px solid var(--line-soft); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); transition: background .15s, color .15s; }
.seg button:hover { color: var(--navy-600); }
.seg button.on { background: #fff; color: var(--navy-700); box-shadow: 0 2px 6px -2px rgba(30, 43, 89, .3); font-weight: 700; }

/* ---------- Bảng ---------- */
.table-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.table-tools .grow { flex: 1; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 12px; background: #fff; }
.table-scroll { max-height: min(68vh, 640px); overflow: auto; }
.table-scroll table.grid thead th { position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 var(--line); }
.card.fullscreen .table-scroll { max-height: calc(100vh - 210px); }
table.grid { width: 100%; border-collapse: collapse; font-size: 15px; }
table.grid th {
  background: #F5F8FC; text-align: left; font-weight: 700; color: #5B6782; font-size: 11.5px; text-transform: uppercase; letter-spacing: .55px;
  padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none;
}
table.grid th.sortable { cursor: pointer; }
table.grid th.sortable:hover { color: var(--navy-800); }
table.grid th .arrow { font-size: 11px; margin-left: 4px; color: var(--navy-700); }
table.grid td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr { transition: background .12s; }
table.grid tbody tr:hover { background: #F5F8FF; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.center, table.grid th.center { text-align: center; }
td.title-cell { min-width: 220px; font-weight: 600; }
td.nowrap { white-space: nowrap; }
.code { font-family: var(--num); font-size: 13px; font-weight: 500; color: var(--navy-600); white-space: nowrap; }
.status-badge {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 4px 11px 4px 9px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: #F2F5FA; color: var(--ink); border: 1px solid var(--line-soft);
}
.wait { font-weight: 800; }
.wait.warn { color: #B26A00; }
.wait.bad { color: var(--danger); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; }
.row-actions button {
  border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--navy-800);
  transition: background .15s, border-color .15s, color .15s;
}
.row-actions button:hover { background: #F1F5FF; border-color: #B9C7E6; color: var(--navy-600); }
.row-actions svg.ic { width: 17px; height: 17px; }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; background: #EEF2F8; color: var(--ink-2); padding: 8px 14px; border-radius: 0 0 12px 12px; font-size: 14px; flex-wrap: wrap; border: 1px solid var(--line-soft); border-top: 0; }
.pager button { border: 0; background: #fff; border-radius: 6px; width: 34px; height: 30px; }
.pager button[disabled] { opacity: .4; cursor: default; }
.pager select { border: 1px solid #C9CDD6; border-radius: 6px; padding: 3px 6px; background: #fff; }
.empty { padding: 34px 12px; text-align: center; color: var(--muted); }
.empty svg.ic { width: 40px; height: 40px; color: #B8BCC6; margin-bottom: 6px; }
.matrix td.cell { text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; }
.matrix td.cell.zero { color: #B8BCC6; cursor: default; }
.matrix td.cell:not(.zero):hover { outline: 2px solid var(--navy-600); outline-offset: -2px; background: #F1F5FF; }
.matrix tfoot td { font-weight: 800; background: #F5F8FC; }

/* ---------- Trình duyệt / Báo cáo ---------- */
.type-badge { display: inline-block; white-space: nowrap; border-radius: 12px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; }
.type-badge.type-TD { background: #E3EAFB; color: #22357A; }
.type-badge.type-BC { background: var(--accent-soft); color: #B4440A; }
.card-head .type-badge { margin-left: 6px; }
.type-tiles { grid-template-columns: repeat(auto-fill, minmax(170px, 210px)); margin-bottom: 18px; }
.tile .tlabel small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.type-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
.type-grid > div { min-width: 0; }
.matrix td.cell b { font-weight: 800; }
th.muted-th { color: var(--muted); font-weight: 700; }
@media (max-width: 640px) { .type-tiles { grid-template-columns: repeat(3, 1fr); } }

/* ---------- Dự án ---------- */
.proj-code { display: inline-block; min-width: 34px; margin-right: 6px; padding: 1px 6px; border-radius: 7px; background: #EAF0FC; color: var(--navy-700); font-weight: 700; font-size: 12px; text-align: center; font-family: var(--num); }
td.proj-cell { font-size: 13.5px; min-width: 170px; line-height: 1.6; }
td.proj-name { min-width: 260px; }
tr.inactive td { color: var(--muted); }

/* ---------- Hồ sơ đệ trình theo chuyên viên ---------- */
.subrep th small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.subrep td.cell { min-width: 64px; padding: 8px 10px; }
.subrep td.cell b { display: block; font-size: 15px; }
.subrep td.cell.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.subrep td.total { background: #F5F8FC; }
.subrep .clickable { cursor: pointer; }
.subrep .clickable:hover { color: var(--accent-dark); }
.subrep .sticky-col { position: sticky; left: 0; background: #fff; z-index: 1; }
.subrep thead .sticky-col, .subrep tfoot .sticky-col { background: #F5F8FC; }
.sbar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin: 4px auto 0; max-width: 56px; background: #EAEFF6; gap: 1px; }
.sbar i { display: block; height: 100%; }
.sub-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.sub-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sub-detail { margin-top: 18px; border: 1px solid var(--line-soft); border-top: 3px solid var(--accent); border-radius: 14px; padding: 14px; }
.sub-detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sub-detail-head .grow { flex: 1; }
.sub-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sub-chip.none { opacity: .45; }
tr.group-row td { background: #F5F8FC; padding: 8px 12px; }

/* ---------- Dashboard Trưởng phòng gọn: TỔNG QUAN + tab ---------- */
.kfoot { margin-top: 10px; font-size: 13.5px; }
.mgr-tabs {
  position: sticky; top: var(--topbar-h); z-index: 15; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin;
  background: rgba(242, 245, 250, .85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 10px 2px 12px; margin: -8px 0 10px;
}
.mgr-tabs button {
  flex: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  border: 1px solid var(--line); background: #fff; color: var(--navy-900); border-radius: 999px; padding: 8px 16px; font-size: 14.5px; font-weight: 600;
  transition: border-color .15s, color .15s, box-shadow .15s;
}
.mgr-tabs button:hover { border-color: #B9C7E6; color: var(--navy-600); }
.mgr-tabs button.on { background: var(--grad-navy); border-color: transparent; color: #fff; box-shadow: 0 10px 20px -10px rgba(30, 43, 89, .85); }
.card-title .filter-count { font-size: 13px; vertical-align: middle; margin-left: 8px; text-transform: none; letter-spacing: 0; }
.tab-count { background: var(--accent-soft); color: var(--accent-dark); border-radius: 11px; padding: 0 8px; font-size: 12px; font-weight: 700; font-family: var(--num); }
.mgr-tabs button.on .tab-count { background: var(--grad-accent); color: #fff; }
@media (max-width: 640px) {
  .kfoot { margin-top: 6px; font-size: 12px; }
  .mgr-tabs button { padding: 8px 13px; font-size: 14px; }
}

/* ---------- Báo cáo tổng hợp theo kỳ ---------- */
.period-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 0 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft, #EEF0F4); }
.period-bar .seg button { padding: 7px 16px; font-size: 14.5px; }
.period-bar .seg button.on { background: var(--grad-navy); color: #fff; box-shadow: 0 6px 14px -8px rgba(30, 43, 89, .9); }
.period-bar .grow { flex: 1; }
.per-nav { display: inline-flex; align-items: center; gap: 4px; background: #F5F8FD; border: 1px solid var(--line-soft); border-radius: 12px; padding: 2px 4px; }
.per-nav .ghost-btn { width: 34px; height: 34px; }
.per-nav .ghost-btn:disabled { opacity: .3; cursor: default; background: none; }
.per-name { font-size: 14.5px; white-space: nowrap; padding: 0 4px; color: var(--ink-2); }
.per-name b { color: var(--navy-900); }
.ov-period { display: inline-block; vertical-align: 2px; margin-left: 8px; font-size: 12.5px; text-transform: none; letter-spacing: .2px; color: var(--accent-dark); font-weight: 700; background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.rep-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.rep-kpi {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; cursor: pointer;
  background: linear-gradient(180deg, #FFFFFF 0%, #F9FBFF 100%); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px 12px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
/* Vạch sáng màu ở cạnh trên + quầng màu mờ ở góc. */
.rep-kpi::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--c), transparent 95%); }
.rep-kpi::after {
  content: ''; position: absolute; right: -28px; top: -28px; width: 84px; height: 84px; border-radius: 50%;
  background: var(--c); opacity: .08; pointer-events: none;
}
.rep-kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #C6D2E8; }
.rep-kpi.on { background: #F4F7FF; border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset, var(--shadow-hover); }
.rep-kpi .rk-l { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.rep-kpi b { font-size: 30px; line-height: 1.1; font-weight: 700; color: var(--navy-900); font-family: var(--num); letter-spacing: -.5px; }
.rep-kpi .rk-n { font-size: 12.5px; color: var(--ink-2); }
/* Số liệu con "Trong đó đang ở TP.MH": nhỏ hơn, thụt vào, không ngang hàng 4 ô tổng quát. */
.rep-sub {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; padding: 8px 12px;
  border-radius: 12px; background: #F7F9FD; border: 1px dashed var(--line);
}
.rep-sub .rs-l { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
.rep-sub .rs-l small { font-size: 11.5px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.rep-subkpi {
  display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); border-left: 4px solid var(--c); background: #fff; border-radius: 10px;
  padding: 5px 12px 5px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); transition: box-shadow .15s, border-color .15s;
}
.rep-subkpi b { font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--navy-900); }
.rep-subkpi:hover { box-shadow: 0 6px 14px -10px rgba(30, 43, 89, .6); border-color: #C6D2E8; border-left-color: var(--c); }
.rep-subkpi.on { background: #F4F7FF; box-shadow: 0 0 0 1px var(--c) inset; }
/* Lưới ô báo cáo: 3 cột (rộng) / 2 cột / 1 cột theo bề rộng vùng nội dung; ô "theo chuyên viên" rộng gấp đôi. */
.rep-wrap { container-type: inline-size; }
.rep-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-flow: row dense; gap: 0 16px; }
@container (min-width: 700px) { .rep-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rep-grid > .rep-wide { grid-column: span 2; } }
@container (min-width: 1040px) { .rep-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.rep-grid > .rep-full { grid-column: 1 / -1; }
.rep-grid > div > .card { height: calc(100% - 16px); margin-bottom: 16px; }
.rep-cell > .card { padding: 14px 16px 16px; }
.rep-cell .card-head { gap: 8px; margin-bottom: 8px; }
.rep-cell { container-type: inline-size; }
.rep-cell .card-title { font-size: 14px; letter-spacing: .5px; padding-left: 12px; }
/* Ô hẹp: nút Biểu đồ/Bảng chỉ còn biểu tượng (di chuột để xem tên) để tiêu đề nằm trên 1 dòng. */
@container (max-width: 460px) {
  .rep-mode .lbl { display: none; }
  .rep-mode .ic { margin-right: 0; }
  .rep-cell .seg button { padding: 5px 9px; }
}
.rep-cell .card-head .ghost-btn { width: 30px; height: 30px; }
.rep-cell .seg button { padding: 4px 8px; font-size: 12.5px; }
.rep-cell table.grid th { padding: 7px 8px; font-size: 12.5px; }
.rep-cell table.grid td { padding: 6px 8px; font-size: 13.5px; }
.rep-cell .subrep td.cell { min-width: 50px; padding: 6px 8px; }
.rep-cell .type-badge, .rep-cell .status-badge { font-size: 12px; }
.rep-cell .who { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.rep-cell .chart-empty { height: 200px; }
.rep-note { margin: -4px 0 10px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.rep-full .card-title { font-size: 16px; }
.rep-mode button { white-space: nowrap; display: inline-flex; align-items: center; }
.rep-mode .ic { width: 15px; height: 15px; margin-right: 5px; vertical-align: -3px; }
.matrix td.cell.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.matrix tr.cur td { background: #F1F5FF; }
.link-btn { border: 0; background: none; padding: 0; color: var(--navy-600); font-weight: 700; cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.rep-grid > div { min-width: 0; }
@media (max-width: 640px) {
  .period-bar { gap: 8px; }
  .period-bar .seg button { padding: 6px 11px; font-size: 13.5px; }
  .per-name { font-size: 13.5px; white-space: normal; }
  .rep-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .rep-sub { padding: 6px 8px; gap: 6px; }
  .rep-subkpi { font-size: 12.5px; padding: 4px 10px 4px 8px; }
  .rep-subkpi b { font-size: 16px; }
  .rep-kpi { padding: 8px 10px; }
  .rep-kpi .rk-l { font-size: 12px; }
  .rep-kpi b { font-size: 21px; }
  .rep-kpi .rk-l { letter-spacing: .3px; }
  .rep-kpi .rk-n { font-size: 11px; line-height: 1.25; }
  .ov-period { font-size: 12px; }
  .rep-full .card-title { font-size: 16px; }
}

/* ---------- Đồng bộ thư mục ---------- */
.sync-sec { border: 1px solid var(--line-soft); border-radius: 12px; margin-top: 12px; background: #fff; }
.sync-sec > summary { cursor: pointer; padding: 12px 14px; font-weight: 800; list-style-position: inside; }
.sync-sec[open] > summary { border-bottom: 1px solid var(--line-soft); }
.sync-sec .table-wrap { border: 0; border-radius: 0 0 12px 12px; max-height: 360px; overflow: auto; }
.sync-sec .empty { padding: 18px 12px; }
.sync-sec td.title-cell { min-width: 160px; overflow-wrap: anywhere; }
.sync-sec .status-badge, .sync-sec .code { white-space: normal; }
.sync-sec td { padding-left: 10px; padding-right: 10px; }
