<style>
:root {
  /* Màu thương hiệu CENTRAL: navy #1E2B59 + cam #F16314 */
  --navy-950: #161F44;
  --navy-900: #1E2B59;
  --navy-800: #26376E;
  --navy-700: #2F4385;
  --navy-600: #3E539C;
  --navy-btn: #1E2B59;
  --accent: #F16314;
  --accent-dark: #D4520C;
  --accent-soft: #FDECE1;
  --page: #E7E8EC;
  --card: #FFFFFF;
  --line: #D7DAE1;
  --line-soft: #E8EAEF;
  --ink: #1D2232;
  --ink-2: #4A5164;
  --muted: #7A8194;
  --chip: #E3EAFB;
  --danger: #D9493B;
  --success: #3E9B5C;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 28, 60, .06), 0 4px 14px rgba(20, 28, 60, .06);
  --sidebar-w: 290px;
  --topbar-h: 68px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  color: var(--ink);
  background: var(--page);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.ic { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Đăng nhập ---------- */
.login {
  min-height: 100vh;
  background: var(--navy-900);
  color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 16px 48px;
}
.logo-tab {
  width: 384px; max-width: 100%;
  height: 112px;
  background: linear-gradient(180deg, #FFFFFF 0%, #DFE5F5 100%);
  border-radius: 0 0 30px 30px;
  clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
  box-shadow: inset 0 -8px 0 #C9D2EC;
  display: flex; align-items: center; justify-content: center;
  padding: 0 26px 8px;
}
.logo-tab img { max-height: 76px; max-width: 100%; }
.logo-tab .brand-logo { height: 72px; max-width: 100%; }
.login h1 { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; margin: 104px 0 22px; letter-spacing: -.5px; }
.login h1::after { content: ''; display: block; width: 72px; height: 5px; border-radius: 3px; background: var(--accent); margin: 14px auto 0; }
.login .welcome { font-size: 23px; text-transform: uppercase; text-align: center; margin: 0 0 18px; }
.login .welcome b { color: var(--accent); }
.login .hint { font-size: 17px; margin: 0 0 38px; text-align: center; }
.login form { width: 465px; max-width: 100%; }
.login-field {
  display: flex; align-items: center; gap: 12px;
  background: #fff; color: var(--ink);
  height: 60px; border-radius: 9px; padding: 0 18px; margin-bottom: 24px;
  border: 2px solid transparent;
}
.login-field:focus-within { border-color: var(--accent); }
.login-field input { flex: 1; border: 0; outline: 0; font-size: 21px; background: transparent; min-width: 0; }
.login-field input::placeholder { color: #8A8F99; }
.login-field .eye { border: 0; background: none; color: #8A8F99; padding: 4px; display: flex; }
.login-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 28px; }
.remember { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; cursor: pointer; user-select: none; }
.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
.btn-login {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff; font-weight: 700;
  border: 0; border-radius: 9px; padding: 10px 20px; font-size: 22px;
}
.btn-login:hover { background: var(--accent-dark); }
.btn-login svg.ic { width: 28px; height: 28px; stroke-width: 2.6; }
.btn-login[disabled] { opacity: .7; cursor: wait; }
.login-actions { display: flex; justify-content: flex-end; }
.login-divider { height: 3px; background: #D9DDEA; border-radius: 2px; margin: 30px 0 18px; }
.login-links { display: flex; justify-content: space-between; font-size: 17px; }
.login-links a { color: #fff; text-decoration: none; cursor: pointer; }
.login-links a:hover { text-decoration: underline; }
.login-msg { border-radius: 8px; padding: 12px 16px; margin-bottom: 22px; font-size: 16px; }
.login-msg.err { background: #FDE8E6; color: #9B1C12; }
.login-msg.info { background: var(--chip); color: var(--navy-900); }

/* ---------- Khung ứng dụng ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar-h);
  background: #fff; z-index: 30;
  display: flex; align-items: center; gap: 10px; padding: 0 22px 0 14px;
  box-shadow: 0 1px 0 var(--line-soft);
}
.icon-btn {
  border: 0; background: none; width: 46px; height: 46px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; color: #2B2F3A; position: relative;
}
.icon-btn:hover { background: #F0F2F7; }
.icon-btn svg.ic { width: 28px; height: 28px; }
.topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar .brand-mark { width: 40px; height: 40px; flex: none; }
.topbar .brand-name { font-weight: 900; color: var(--navy-900); font-size: 18px; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.pill-btn {
  background: var(--accent); color: #fff; border: 0; border-radius: 26px;
  padding: 11px 28px; font-size: 20px; font-weight: 600;
}
.pill-btn:hover { background: var(--accent-dark); }
.badge {
  position: absolute; top: 2px; right: 0;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: #E2312A; color: #fff; font-size: 12.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #fff;
}
.user-btn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 6px; border-radius: 26px; font-size: 19px; }
.user-btn:hover { background: #F0F2F7; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy-600), var(--navy-900)); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
}
.dropdown {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
  background: #fff; border-radius: 10px; min-width: 240px; padding: 6px;
  box-shadow: 0 10px 30px rgba(20, 28, 60, .18); border: 1px solid var(--line-soft);
}
.dropdown .dd-head { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
.dropdown .dd-head b { display: block; }
.dropdown .dd-head small { color: var(--muted); }
.dropdown .dd-item {
  color: inherit; text-decoration: none;
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 15px;
}
.dropdown .dd-item:hover { background: #F2F4F9; }
.dropdown .dd-empty { padding: 14px 12px; color: var(--muted); }
.notif-dd { width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; overflow: auto; }
.notif-item small { display: block; color: var(--muted); }
.anchor { position: relative; }

.sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--navy-900); color: #fff; z-index: 25;
  overflow-y: auto; padding: 8px 8px 24px;
  transition: transform .2s ease;
}
.app.collapsed .sidebar { transform: translateX(-100%); }
.side-search {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, .1); border-radius: 22px; padding: 0 16px; height: 46px; margin-bottom: 18px;
}
.side-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-size: 16px; }
.side-search input::placeholder { color: rgba(255, 255, 255, .65); }
.side-search svg.ic { width: 26px; height: 26px; stroke-width: 2.4; }
.nav-item {
  display: flex; align-items: center; gap: 18px; width: 100%;
  background: none; border: 0; color: #fff; text-align: left;
  padding: 18px 20px; border-radius: 8px; font-size: 17px; font-weight: 600;
}
.nav-item:hover { background: rgba(255, 255, 255, .08); }
.nav-item.active { background: rgba(255, 255, 255, .12); box-shadow: inset 4px 0 0 var(--accent); }
.nav-item.active > svg.ic:first-child { color: var(--accent); }
.nav-item .lbl { flex: 1; }
.nav-item .chev { opacity: .9; width: 20px; height: 20px; }
.nav-count { background: var(--accent); border-radius: 11px; padding: 1px 8px; font-size: 12.5px; font-weight: 800; }
.nav-sep { height: 1px; background: rgba(255, 255, 255, .14); margin: 10px 12px; }

.main {
  margin-left: var(--sidebar-w); padding: calc(var(--topbar-h) + 22px) 22px 40px;
  min-height: 100vh; transition: margin-left .2s ease;
}
.app.collapsed .main { margin-left: 0; }
.scrim { display: none; }

/* ---------- Card ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px 22px 22px;
  margin-bottom: 22px; box-shadow: var(--shadow);
}
.card.fullscreen { position: fixed; inset: 12px; z-index: 60; overflow: auto; margin: 0; }
.card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.card-title { font-size: 23px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: .1px; color: var(--navy-900); border-left: 5px solid var(--accent); padding-left: 12px; line-height: 1.15; }
.card-head .grow { flex: 1; }
.collapse-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 0; background: var(--chip); color: var(--navy-700);
  display: inline-flex; align-items: center; justify-content: center;
}
.collapse-btn svg.ic { width: 20px; height: 20px; stroke-width: 2.2; }
.card.collapsed .card-body { display: none; }
.card.collapsed .card-head { margin-bottom: 0; }
.ghost-btn { border: 0; background: none; color: var(--ink-2); width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
.ghost-btn:hover { background: #F0F2F7; }
.sub-title { font-size: 17px; font-weight: 800; margin: 0 0 12px; }
.muted { color: var(--muted); }

/* ---------- Tham số (filter) ---------- */
.params { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.field {
  display: flex; border: 1px solid #C9CDD6; border-radius: 7px; background: #fff;
  min-height: 72px; position: relative; flex: 1 1 200px; min-width: 0;
}
.field.sm { flex: 0 1 230px; }
.field .fbody { flex: 1; padding: 10px 12px 8px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.field label, .field .flabel { font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; display: block; }
.field input, .field .fvalue {
  border: 0; outline: 0; font-size: 17px; padding: 0; background: transparent; width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 36; width: 292px; padding: 10px;
  background: #fff; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(20, 28, 60, .18);
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-head b { font-size: 15px; color: var(--navy-900); }
.cal-nav { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--navy-800); }
.cal-nav:hover { background: #F0F2F7; }
.cal-nav svg.ic { width: 20px; height: 20px; stroke-width: 2.2; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow span { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cal-day { border: 0; background: none; height: 36px; border-radius: 8px; font-size: 14.5px; color: var(--ink); }
.cal-day:hover { background: #F0F2F7; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 800; }
.cal-day.sel { background: var(--navy-900); color: #fff; font-weight: 800; }
.cal-foot { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.cal-foot button { border: 0; background: none; color: var(--navy-700); font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
.cal-foot button:hover { background: #F0F2F7; }
.field.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(217, 73, 59, .15); }
.field.invalid label { color: var(--danger); }
.field .faddon {
  width: 38px; border: 0; border-left: 1px solid #C9CDD6; background: none;
  display: flex; align-items: center; justify-content: center; color: #333; border-radius: 0 7px 7px 0;
}
.field .faddon:hover { background: #F3F5FA; }
.field:focus-within { border-color: var(--navy-600); }
.field .ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 240px; z-index: 35;
  background: #fff; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(20, 28, 60, .16);
  max-height: 320px; overflow: auto; padding: 6px;
}
.ms-panel label.opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 15px; font-weight: 500; color: var(--ink); margin: 0; cursor: pointer; }
.ms-panel label.opt:hover { background: #F2F4F9; }
.ms-panel input { width: 16px; height: 16px; accent-color: var(--navy-700); }
.ms-panel .ms-actions { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
.ms-panel .ms-actions a { color: var(--navy-700); font-size: 13.5px; font-weight: 700; cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

.primary-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--navy-btn); color: #fff; border: 0; border-radius: 8px;
  padding: 0 26px; min-height: 48px; font-size: 18px; font-weight: 600; align-self: center;
}
.primary-btn:hover { background: var(--navy-700); }
.primary-btn svg.ic { width: 26px; height: 26px; }
.secondary-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: var(--navy-800); border: 1px solid #BFC7DD; border-radius: 8px;
  padding: 8px 16px; font-size: 15px; font-weight: 700;
}
.secondary-btn:hover { background: #F3F5FA; }
.danger-btn { background: #fff; color: var(--danger); border: 1px solid #EDB7B1; border-radius: 8px; padding: 8px 16px; font-weight: 700; }
.danger-btn:hover { background: #FDF0EE; }

/* ---------- Tổng quan ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; padding: 0 8px; }
.tile {
  border: 1px solid var(--line); border-radius: 6px; background: #fff;
  padding: 22px 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 16px;
  transition: box-shadow .15s, transform .15s; text-align: center;
}
button.tile:hover { box-shadow: 0 6px 18px rgba(20, 28, 60, .12); transform: translateY(-1px); }
.tile.selected { border-color: var(--navy-700); box-shadow: 0 0 0 2px var(--navy-700) inset; }
.tile .circle {
  width: 96px; height: 96px; border-radius: 50%; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
}
.tile .tlabel { font-size: 19px; color: #262B38; line-height: 1.25; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 22px; padding: 0 8px; }
.kpi { background: #F4F5F8; border-radius: 8px; padding: 14px 16px; }
.kpi .kv { font-size: 26px; font-weight: 800; color: var(--navy-900); }
.kpi .kl { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.range-bar { background: #DDDEE2; border-radius: 2px; padding: 10px 18px; text-align: right; font-size: 17px; margin-top: 24px; }

/* ---------- Biểu đồ ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 22px; }
.chart-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.chart-box .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-box h3 { margin: 0; font-size: 16.5px; font-weight: 800; }
.chart-wrap { position: relative; height: 300px; }
.chart-empty { height: 300px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.seg { display: inline-flex; background: #F0F2F7; border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--navy-800); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

/* ---------- Bảng ---------- */
.table-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.table-tools .grow { flex: 1; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.grid { width: 100%; border-collapse: collapse; font-size: 15px; }
table.grid th {
  background: #F1F3F8; text-align: left; font-weight: 800; color: var(--ink-2); font-size: 13.5px;
  padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none;
}
table.grid th.sortable { cursor: pointer; }
table.grid th.sortable:hover { color: var(--navy-800); }
table.grid th .arrow { font-size: 11px; margin-left: 4px; color: var(--navy-700); }
table.grid td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover { background: #FAFBFD; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.center, table.grid th.center { text-align: center; }
td.title-cell { min-width: 220px; font-weight: 600; }
td.nowrap { white-space: nowrap; }
.code { font-family: Consolas, 'Courier New', monospace; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.status-badge {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 4px 11px 4px 9px; border-radius: 14px; font-size: 13.5px; font-weight: 700;
  background: #F2F3F6; color: var(--ink);
}
.wait { font-weight: 800; }
.wait.warn { color: #B26A00; }
.wait.bad { color: var(--danger); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; }
.row-actions button {
  border: 1px solid var(--line); background: #fff; border-radius: 7px; height: 34px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: var(--navy-800);
}
.row-actions button:hover { background: #F3F5FA; }
.row-actions svg.ic { width: 17px; height: 17px; }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; background: #DDDEE2; padding: 8px 14px; border-radius: 0 0 8px 8px; font-size: 15px; flex-wrap: wrap; }
.pager button { border: 0; background: #fff; border-radius: 6px; width: 34px; height: 30px; }
.pager button[disabled] { opacity: .4; cursor: default; }
.pager select { border: 1px solid #C9CDD6; border-radius: 6px; padding: 3px 6px; background: #fff; }
.empty { padding: 34px 12px; text-align: center; color: var(--muted); }
.empty svg.ic { width: 40px; height: 40px; color: #B8BCC6; margin-bottom: 6px; }
.matrix td.cell { text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; }
.matrix td.cell.zero { color: #B8BCC6; cursor: default; }
.matrix td.cell:not(.zero):hover { outline: 2px solid var(--navy-600); outline-offset: -2px; }
.matrix tfoot td { font-weight: 800; background: #F7F8FA; }

/* ---------- Trình duyệt / Báo cáo ---------- */
.type-badge { display: inline-block; white-space: nowrap; border-radius: 12px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; }
.type-badge.type-TD { background: #E3EAFB; color: #22357A; }
.type-badge.type-BC { background: var(--accent-soft); color: #B4440A; }
.card-head .type-badge { margin-left: 6px; }
.type-tiles { grid-template-columns: repeat(auto-fill, minmax(170px, 210px)); margin-bottom: 18px; }
.tile .tlabel small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.type-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
.type-grid > div { min-width: 0; }
.matrix td.cell b { font-weight: 800; }
th.muted-th { color: var(--muted); font-weight: 700; }
@media (max-width: 640px) { .type-tiles { grid-template-columns: repeat(3, 1fr); } }

/* ---------- Hồ sơ đệ trình theo chuyên viên ---------- */
.subrep th small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.subrep td.cell { min-width: 64px; padding: 8px 10px; }
.subrep td.cell b { display: block; font-size: 15px; }
.subrep td.cell.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.subrep td.total { background: #F7F8FA; }
.subrep .clickable { cursor: pointer; }
