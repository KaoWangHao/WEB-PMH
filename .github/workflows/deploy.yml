name: Deploy Apps Script

# Mỗi lần push lên main (có thay đổi trong src/), tự đẩy code lên Apps Script
# và cập nhật đúng deployment đang dùng nên link web app không đổi.
# Chạy tay (tab Actions → Run workflow) với "Chỉ đẩy bản thử" = true: chỉ đẩy code của nhánh đã chọn lên
# bản nháp (HEAD) để thử ở link Test deployment (/dev, chỉ chủ sở hữu mở được); link chính giữ nguyên.
# Chức năng mở rộng ở thư mục riêng — Kế hoạch mua sắm (khms/), đồng bộ thư mục tự động (autosync/) — được chép vào src/
# trước khi đẩy (cả bản chính và /dev). Xóa thư mục là gỡ chức năng; thư mục không có thì bỏ qua.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - 'khms/**'
      - 'autosync/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Chỉ đẩy bản thử (link /dev), không cập nhật link chính'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

env:
  DEPLOYMENT_ID: AKfycbzvKv467-ZX34kCYKkMZPRqIgeP1jVzEJB7qK2FWqB7eIznVwrSxnVLKwn3djB_JBSW8Q

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài clasp
        run: npm install -g @google/clasp@3

      - name: Ghi thông tin đăng nhập clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Thiếu secret CLASPRC_JSON (xem CLAUDE.md, mục Deploy)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Chép chức năng mở rộng (khms/, autosync/) vào src/
        run: |
          for d in khms autosync; do
            if [ -d "$d/src" ]; then cp "$d"/src/* src/; echo "Đã chép $d/src"; fi
          done

      - name: Đẩy code lên Apps Script
        run: clasp push --force

      - name: Cập nhật deployment web app
        if: ${{ !inputs.test_only }}
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: In link bản thử (/dev)
        if: ${{ inputs.test_only }}
        run: |
          clasp list-deployments | tee /tmp/deployments.txt
          HEAD_ID=$(grep '@HEAD' /tmp/deployments.txt | grep -o 'AKfy[A-Za-z0-9_-]*' | head -1)
          if [ -n "$HEAD_ID" ]; then
            echo "Link bản thử: https://script.google.com/macros/s/$HEAD_ID/dev"
            echo "Link bản thử (chỉ chủ sở hữu mở được): https://script.google.com/macros/s/$HEAD_ID/dev" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Xóa thông tin đăng nhập
        if: always()
        run: rm -f "$HOME/.clasprc.json"
