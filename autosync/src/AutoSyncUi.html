<script>
/*
 * Đồng bộ thư mục tự động — phần giao diện (CHỨC NĂNG MỞ RỘNG ở thư mục autosync/, xem autosync/README.md).
 * Gắn vào App.html qua window.APP: tên tài khoản hệ thống "auto-sync", câu chú thích cho nút "Đồng bộ thư mục",
 * thẻ "Đồng bộ thư mục tự động" ở trang Quản trị, action tạo khóa. Xóa thư mục autosync/ là gỡ hẳn.
 */
(function (A) {
  'use strict';
  if (!A) return;
  var S = A.S, EXT = A.EXT;
  var ic = A.ic, esc = A.esc, call = A.call, handleErr = A.handleErr, render = A.render, busy = A.busy, fmtNum = A.fmtNum, card = A.card;
  var openModal = A.openModal, modalHead = A.modalHead;

  S.autoSync = null;
  EXT.names['auto-sync'] = 'Đồng bộ tự động';
  EXT.data.push(function (d) { S.autoSync = d.autoSync || null; });

  // Chú thích của nút "Đồng bộ thư mục": lịch và kết quả lần chạy tự động gần nhất.
  EXT.syncNotes.push(function () {
    var a = S.autoSync;
    if (!a || !a.configured) return '';
    var l = a.last;
    return ' Đồng bộ tự động: mỗi giờ 7:30–17:30' + (l ? ' (lần chạy gần nhất ' + l.at +
      (l.ok ? ': ' + (l.changed || 0) + ' đổi tình trạng, ' + (l.created || 0) + ' tạo mới)' : ': lỗi — ' + l.error + ')') : '') + '.';
  });

  // Thẻ ở trang Quản trị: trạng thái lần chạy gần nhất + tạo khóa cho máy chạy script autosync/tools.
  EXT.adminCards.push(function () {
    var a = S.autoSync || {}, l = a.last;
    var state = !a.configured ? '<span class="status-badge"><span class="dot" style="background:#9AA0AE"></span>Chưa cài đặt</span>'
      : !l ? '<span class="status-badge"><span class="dot" style="background:#E9A23B"></span>Đã tạo khóa, chưa chạy lần nào</span>'
      : l.ok ? '<span class="status-badge"><span class="dot" style="background:#7CB342"></span>Hoạt động</span>'
      : '<span class="status-badge"><span class="dot" style="background:#DD5A4C"></span>Lần gần nhất bị lỗi</span>';
    var body = '<div class="meta-grid">' +
      '<div><small>Trạng thái</small>' + state + '</div>' +
      '<div><small>Lịch chạy</small>Mỗi giờ 7:30 – 17:30 (Task Scheduler trên máy trong mạng công ty)</div>' +
      '<div><small>Lần chạy gần nhất</small>' + (l ? esc(l.at) + (l.machine ? ' · máy ' + esc(l.machine) : '') : '—') + '</div>' +
      '<div><small>Kết quả</small>' + (!l ? '—' : l.ok ? fmtNum(l.files || 0) + ' file · ' + (l.changed || 0) + ' đổi tình trạng · ' + (l.created || 0) + ' tạo mới' +
        (l.skipped ? ' · ' + l.skipped + ' bỏ qua' : '') : '<span style="color:var(--danger)">' + esc(l.error || 'Lỗi') + '</span>') + '</div></div>' +
      '<p class="muted" style="margin:12px 0 0">Máy chủ Google không vào được ổ chia sẻ nội bộ, nên đồng bộ tự động chạy bằng script trên một máy tính luôn mở trong giờ làm việc ' +
        '(có VPN / mạng công ty). Cài đặt: xem <b>autosync/tools/README.md</b> trên GitHub, bấm <b>Tạo khóa</b> và dán khóa vào file cấu hình của script. ' +
        'Đồng bộ thủ công (nút "Đồng bộ thư mục") vẫn dùng bình thường; tự động chỉ áp dụng lựa chọn mặc định (đổi tình trạng, tạo hồ sơ có ký hiệu), không đổi chuyên viên phụ trách.</p>';
    var tools = '<button class="secondary-btn" data-act="auto-sync-key">' + ic('key') + '<span>' + (a.configured ? 'Tạo khóa mới' : 'Tạo khóa') + '</span></button>';
    return card('admin-autosync', 'Đồng bộ thư mục tự động', body, { tools: tools, collapsible: true });
  });

  A.ACTIONS['auto-sync-key'] = function (el) {
    if (S.autoSync && S.autoSync.configured && !el.dataset.confirm) {
      el.dataset.confirm = '1'; el.lastChild.textContent = 'Bấm lần nữa: khóa cũ sẽ hết hiệu lực'; return;
    }
    busy(el, true);
    call('autoSyncKey').then(function (r) {
      S.autoSync = r.status; render();
      openModal(modalHead('Khóa đồng bộ tự động') + '<div class="modal-body">' +
        '<p style="margin-top:0">Dán khóa này vào ô <b>"key"</b> trong file <b>auto-sync.config.json</b> trên máy chạy đồng bộ (xem autosync/tools/README.md). ' +
        'Khóa chỉ hiện <b>1 lần</b>; tạo khóa mới thì khóa cũ hết hiệu lực.</p>' +
        '<div class="form-row"><label for="m-ask">Khóa</label><input type="text" id="m-ask" readonly value="' + esc(r.key) + '" onclick="this.select()"></div>' +
        '<div class="form-row"><label for="m-asu">Địa chỉ web app (ô "webAppUrl")</label><input type="text" id="m-asu" readonly value="' + esc(r.url || '') + '" onclick="this.select()"></div>' +
        '</div><div class="modal-foot"><button class="primary-btn" data-act="close-modal">Đã lưu khóa</button></div>');
      var k = document.getElementById('m-ask'); if (k) k.select();
    }).catch(function (err) { busy(el, false); handleErr(err); });
  };
})(window.APP);
</script>
